                let startOfMonthRecord = sorted.filter(r => {

                    estSatVal = (valSat1 + valSat2 + valIbit) * (1 + bearDropPct);

                let estUpsideTotal = 0;
                let projectedQQQ = 0;
                
                const targetRatio = (getNum(i.rebalance_core_target) + getNum(i.rebalance_core_tolerance)) / 100;
                const valTQQQ_now = (p.TQQQ || 0) * getNum(i.qty_tqqq);

                    const currentEquity = r.total_equity || 0;
                    let currentQQQ = getHistPrice(r, 'QQQ') || getHistPrice(r, 'QQQM');
                    if (!currentQQQ && r.inputs?.ticker_core_1) {
                         currentQQQ = getHistPrice(r, r.inputs.ticker_core_1);
                    }
                    
                    if (currentEquity > runningMaxEquity) runningMaxEquity = currentEquity;
                    const drawdown = runningMaxEquity > 0 ? ((currentEquity - runningMaxEquity) / runningMaxEquity) * 100 : 0;
                    if (drawdown < globalMaxDrawdown) globalMaxDrawdown = drawdown;

                    const qqqReturn = (baseQQQ > 0 && currentQQQ > 0) ? ((currentQQQ - baseQQQ) / baseQQQ) * 100 : null;

                    return {
                        date: r.date,
                        equity: currentEquity,
                        portfolioReturn: ((currentEquity - baseEquity) / baseEquity) * 100,
                        qqqReturn: qqqReturn,
                        drawdown: drawdown
                    };
                });
                return { chartData, maxDrawdown: globalMaxDrawdown };
            }, [records, filterMode, inputs.ticker_core_1]);

            return (
                <div className="pb-40 min-h-screen transition-colors duration-300 font-black text-left select-none overflow-x-hidden">

                    {/* EDIT MODAL BOTTOM SHEET */}
                    {editingId && editForm && (
                        <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center">

                                </div>

                                                <span className="font-bold text-indigo-500 text-xs">{editForm.inputs.ticker_core_1 || "QQQ"}</span>
                                                <span className="text-[10px] text-slate-400">當時: ${editForm.prices?.[editForm.inputs.ticker_core_1] || editForm.prices?.QQQ || '-'}</span>
                                            </div>
                                            <input type="number" value={editForm.inputs.qty_qqq} onChange={e => handleEditFormChange('qty_qqq', e.target.value)} className="w-24 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-right font-mono font-black" placeholder="股數" />
                                        </div>
                                        <div className="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                                            <div className="flex flex-col">
                                                <span className="font-bold text-purple-500 text-xs">TQQQ</span>
                                                <span className="text-[10px] text-slate-400">當時: ${editForm.prices?.TQQQ || '-'}</span>
                                            </div>
                                            <input type="number" value={editForm.inputs.qty_tqqq} onChange={e => handleEditFormChange('qty_tqqq', e.target.value)} className="w-24 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-right font-mono font-black" placeholder="股數" />
                                        </div>
                                        <div className="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                                            <div className="flex flex-col">
                                                <span className="font-bold text-emerald-500 text-xs">{editForm.inputs.custom_ticker_1 || "自選1"}</span>
                                                <span className="text-[10px] text-slate-400">當時: ${editForm.prices?.[editForm.inputs.custom_ticker_1] || '-'}</span>
                                            </div>
                                            <input type="number" value={editForm.inputs.qty_custom_1} onChange={e => handleEditFormChange('qty_custom_1', e.target.value)} className="w-24 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-right font-mono font-black" placeholder="股數" />
                                        </div>
                                        <div className="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                                            <div className="flex flex-col">
                                                <span className="font-bold text-amber-500 text-xs">{editForm.inputs.custom_ticker_2 || "自選2"}</span>
                                                <span className="text-[10px] text-slate-400">當時: ${editForm.prices?.[editForm.inputs.custom_ticker_2] || '-'}</span>
                                            </div>
                                            <input type="number" value={editForm.inputs.qty_custom_2} onChange={e => handleEditFormChange('qty_custom_2', e.target.value)} className="w-24 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-right font-mono font-black" placeholder="股數" />
                                        </div>
                                        <div className="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                                            <div className="flex flex-col">
                                                <span className="font-bold text-orange-500 text-xs">IBIT</span>
                                                <span className="text-[10px] text-slate-400">當時: ${editForm.prices?.IBIT || '-'}</span>
                                            </div>
                                            <input type="number" value={editForm.inputs.qty_ibit} onChange={e => handleEditFormChange('qty_ibit', e.target.value)} className="w-24 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-right font-mono font-black" placeholder="股數" />
                                        </div>

                                            <span className="font-bold text-slate-500 text-xs">現金 (USD)</span>
                                            <input type="number" value={editForm.inputs.cash_balance} onChange={e => handleEditFormChange('cash_balance', e.target.value)} className="w-28 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-right font-mono font-black" />
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">投資筆記</label>

                                        </div>
                                    ) : (
                                        <textarea value={inputs.motto} readOnly={isMottoLocked} onChange={e => handleInputChange('motto', e.target.value)} onBlur={e => syncToCloud('motto', e.target.value)} className={`w-full bg-transparent text-lg font-black text-center placeholder-white/50 outline-none resize-none animate-in fade-in slide-in-from-left-4 ${isMottoLocked ? 'cursor-default opacity-90' : 'cursor-text bg-white/10 rounded-xl'}`} rows="5" placeholder="在此輸入您的投資心法..." />
                                    )}
                                </Card>
                                
                                {/* BEAR MARKET DEFENSE CARD */}
                                {bearDefense.isActive && (

                                        <div className="absolute top-0 right-0 p-4 opacity-20"><Icon name="Shield" size={80} /></div>
                                        <div className="flex items-center gap-2 mb-2 bg-red-700/50 px-4 py-1 rounded-full"><Icon name="ShieldAlert" size={18} /><span className="text-xs font-black uppercase tracking-widest">進入熊市防禦狀態</span></div>
                                        <div className="text-3xl font-black mb-1">${bearDefense.monthlyBuy.toLocaleString(undefined, {maximumFractionDigits:0})}</div>
                                        <div className="text-xs opacity-90 font-bold mb-4">本月應定投買入 QQQ 金額 (1/12)</div>
                                        <div className="w-full bg-black/20 rounded-xl p-3 text-left">
                                            <div className="flex justify-between text-xs mb-1"><span className="opacity-70">防禦總資金 (現金+SGOV)</span><span className="font-mono font-bold">${bearDefense.totalDefensive.toLocaleString(undefined, {maximumFractionDigits:0})}</span></div>
                                            <div className="border-t border-white/20 my-2"></div>
                                            <div className="text-[10px] uppercase font-bold opacity-60 mb-1">衛星部位 (Satellite) 操作守則</div>
                                            <ul className="text-xs space-y-1 list-disc list-inside opacity-90">
                                                <li><span className="font-bold text-red-200">強制減碼</span>：若衛星資產仍站在週線上，衛星部位強制減倉 50%。</li>
                                                <li><span className="font-bold text-red-200">清空條件</span>：若衛星跌破配合週線 (40w/20w) 則清空。</li>
                                                <li><span className="font-bold text-green-200">試探買入</span>：等 QQQ 站上 20 SMA 則買入 30% 衛星試探部位。</li>
                                            </ul>
                                        </div>
                                    </div>
                                )}

                                <div className="bg-white dark:bg-slate-900 rounded-3xl p-4 border-2 border-slate-200 dark:border-slate-700 shadow-lg transition-all">

                                    {dashboardSections.rebalance && (
                                        <div className="space-y-3 animate-in fade-in slide-in-from-top-2">

                                                    <span className={`${rebalanceStatus.isCoreImbalanced ? 'text-red-500 animate-pulse' : 'text-emerald-500'} text-xs`}>{rebalanceStatus.tqqqRatio.toFixed(1)}%</span>

                                                </div>
                                            </div>

                                            {/* Sat 1 Bar */}
                                            <div className="space-y-1">
                                                <div className="flex justify-between items-center text-sm font-bold">
                                                    <span className="text-slate-600 dark:text-slate-300 text-xs">{rebalanceStatus.t1} (目標 {rebalanceStatus.tSat1}%)</span>
                                                    <span className={`${rebalanceStatus.isCustom1Overweight || parseFloat(rebalanceStatus.custom1Weight) < rebalanceStatus.tSat1 * 0.75 ? 'text-red-500' : 'text-emerald-500'} text-xs`}>{rebalanceStatus.custom1Weight}%</span>

                                                    <div className="absolute top-0 h-full w-0.5 bg-black/20 dark:bg-white/30" style={{ left: '20%' }}></div> {/* Visual center for 10% on a 0-50 scale if we scaled it, simplified here */}

                                                </div>
                                                <div className="h-2 w-full bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden relative">
                                                    <div className={`h-full ${rebalanceStatus.isCustom2Overweight || parseFloat(rebalanceStatus.custom2Weight) < rebalanceStatus.tSat2 * 0.75 ? 'bg-red-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(parseFloat(rebalanceStatus.custom2Weight) * 2, 100)}%` }}></div>
                                                </div>
                                            </div>

                                             {/* IBIT Bar */}
                                             <div className="space-y-1">
                                                <div className="flex justify-between items-center text-sm font-bold">
                                                    <span className="text-slate-600 dark:text-slate-300 text-xs">IBIT (目標 {rebalanceStatus.tSatIbit}%)</span>
                                                    <span className={`${rebalanceStatus.isIbitOverweight || parseFloat(rebalanceStatus.ibitWeight) < rebalanceStatus.tSatIbit * 0.75 ? 'text-red-500' : 'text-emerald-500'} text-xs`}>{rebalanceStatus.ibitWeight}%</span>

                                                <div className="h-2 w-full bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden relative">

                                            <Icon name="Calendar" size={16} className="text-slate-400" />
                                            <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">紀錄日期</span>
                                        </div>
                                        <input 
                                            type="date" 
                                            value={inputs.record_date} 
                                            onChange={e => handleInputChange('record_date', e.target.value)} 
                                            className="font-bold dark:text-white text-xs bg-transparent outline-none text-right w-auto min-w-[120px]"

                                            <button onClick={() => toggleDashboardSection('pie')}><Icon name={dashboardSections.pie ? "ChevronUp" : "ChevronDown"} size={16} className="text-slate-400" /></button>

                                                <PieChart>

                                                </PieChart>
                                            </ResponsiveContainer>
                                        </div>
                                    )}
                                </Card>
                                
                                {/* SCENARIO SIMULATOR CARD */}

                                                <div className="space-y-1"><label className="text-[10px] text-purple-500 uppercase block font-bold text-center">核心 TQQQ 目標 (%)</label><input type="number" value={inputs.rebalance_core_target} onChange={e => handleInputChange('rebalance_core_target', e.target.value)} onBlur={e => syncToCloud('rebalance_core_target', e.target.value)} className="w-full bg-purple-50 dark:bg-slate-800 border border-purple-100 dark:border-purple-900/50 rounded-xl p-2 font-black text-center" /></div>
                                            </div>
                                            <div className="space-y-1"><label className="text-[10px] text-slate-500 uppercase block font-bold text-center">核心寬容度 Tolerance (±%)</label><input type="number" value={inputs.rebalance_core_tolerance} onChange={e => handleInputChange('rebalance_core_tolerance', e.target.value)} onBlur={e => syncToCloud('rebalance_core_tolerance', e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2 font-black text-center" /></div>
                                            
                                            <div className="space-y-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                                                <label className="text-xs font-black text-indigo-500 uppercase tracking-widest block mb-1">衛星目標權重設定 (%)</label>
                                                <div className="grid grid-cols-3 gap-2">
                                                    <div><label className="text-[9px] text-emerald-500 block text-center mb-0.5 truncate">{inputs.custom_ticker_1 || '自選1'}</label><input type="number" value={inputs.target_sat_1} onChange={e => handleInputChange('target_sat_1', e.target.value)} onBlur={e => syncToCloud('target_sat_1', e.target.value)} className="w-full bg-emerald-50 dark:bg-slate-800 border border-emerald-100 dark:border-emerald-900/50 rounded-xl p-2 font-black text-center" /></div>
                                                    <div><label className="text-[9px] text-amber-500 block text-center mb-0.5 truncate">{inputs.custom_ticker_2 || '自選2'}</label><input type="number" value={inputs.target_sat_2} onChange={e => handleInputChange('target_sat_2', e.target.value)} onBlur={e => syncToCloud('target_sat_2', e.target.value)} className="w-full bg-amber-50 dark:bg-slate-800 border border-amber-100 dark:border-amber-900/50 rounded-xl p-2 font-black text-center" /></div>
                                                    <div><label className="text-[9px] text-orange-500 block text-center mb-0.5">IBIT</label><input type="number" value={inputs.target_sat_ibit} onChange={e => handleInputChange('target_sat_ibit', e.target.value)} onBlur={e => syncToCloud('target_sat_ibit', e.target.value)} className="w-full bg-orange-50 dark:bg-slate-800 border border-orange-100 dark:border-orange-900/50 rounded-xl p-2 font-black text-center" /></div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* 3. Strategy Whitepaper */}
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                                    <button onClick={() => toggleSection('strategy')} className="w-full p-5 flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
                                        <div className="flex items-center gap-3 font-black text-slate-700 dark:text-slate-200"><div className="p-2 bg-white dark:bg-slate-700 rounded-xl shadow-sm text-amber-500"><Icon name="BookOpen" size={20} /></div><span>策略執行手冊 (NRA V7)</span></div>
                                        <Icon name={openSections.strategy ? "ChevronUp" : "ChevronDown"} size={20} className="text-slate-400" />
                                    </button>
                                    {openSections.strategy && (
                                        <div className="p-5 pt-0 animate-in fade-in slide-in-from-top-2">
                                            <div className="flex justify-end mb-2 pt-2"><button onClick={() => setIsStrategyEditing(!isStrategyEditing)} className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-[10px] font-black transition-all ${isStrategyEditing ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500 dark:bg-slate-800'}`}><Icon name={isStrategyEditing ? "Unlock" : "Lock"} size={12} /><span>{isStrategyEditing ? "編輯中" : "唯讀模式"}</span></button></div>
                                            <div className="space-y-4">
                                                <div className="space-y-1"><input type="text" value={inputs.title_core} readOnly={!isStrategyEditing} onChange={e => handleInputChange('title_core', e.target.value)} onBlur={e => syncToCloud('title_core', e.target.value)} className="title-input text-indigo-600 text-sm" /><textarea value={inputs.strat_core} readOnly={!isStrategyEditing} onChange={e => handleInputChange('strat_core', e.target.value)} onBlur={e => syncToCloud('strat_core', e.target.value)} className={`w-full strategy-textarea ${!isStrategyEditing ? 'strategy-read-only' : ''}`} /></div>
                                                <div className="space-y-1"><input type="text" value={inputs.title_custom} readOnly={!isStrategyEditing} onChange={e => handleInputChange('title_custom', e.target.value)} onBlur={e => syncToCloud('title_custom', e.target.value)} className="title-input text-emerald-600 text-sm" /><textarea value={inputs.strat_custom} readOnly={!isStrategyEditing} onChange={e => handleInputChange('strat_custom', e.target.value)} onBlur={e => syncToCloud('strat_custom', e.target.value)} className={`w-full strategy-textarea ${!isStrategyEditing ? 'strategy-read-only' : ''}`} /></div>
                                                <div className="space-y-1"><input type="text" value={inputs.title_ibit} readOnly={!isStrategyEditing} onChange={e => handleInputChange('title_ibit', e.target.value)} onBlur={e => syncToCloud('title_ibit', e.target.value)} className="title-input text-amber-600 text-sm" /><textarea value={inputs.strat_ibit} readOnly={!isStrategyEditing} onChange={e => handleInputChange('strat_ibit', e.target.value)} onBlur={e => syncToCloud('strat_ibit', e.target.value)} className={`w-full strategy-textarea ${!isStrategyEditing ? 'strategy-read-only' : ''}`} /></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 z-50 px-2 py-4 pb-10 flex justify-around items-center shadow-[0_-10px_30px_rgba(0,0,0,0.08)] safe-pb font-black text-left font-black font-black">
                        <button onClick={() => { setView('dashboard'); setVisibleCount(20); }} className={`flex flex-col items-center gap-2 flex-1 transition-all active:scale-90 ${view === 'dashboard' ? 'tab-active' : 'text-slate-400 font-black font-black'}`}><Icon name="LayoutDashboard" size={28} /><span className="text-[10px] font-black uppercase tracking-widest text-center">儀表板</span></button>
                        <button onClick={() => setView('history')} className={`flex flex-col items-center gap-2 flex-1 transition-all active:scale-90 ${view === 'history' ? 'tab-active' : 'text-slate-400'}`}><Icon name="History" size={28} /><span className="text-[10px] font-black uppercase tracking-widest text-center">績效</span></button>
                        <button onClick={() => setView('loan')} className={`flex flex-col items-center gap-2 flex-1 transition-all active:scale-90 ${view === 'loan' ? 'text-amber-600' : 'text-slate-400 font-black'}`}><Icon name="Landmark" size={28} /><span className="text-[10px] font-black uppercase tracking-widest text-center">貸款</span></button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
