xt-slate-800 border border-slate-300"/></div><input type="number" placeholder="Delta" value={local.newDelta} onChange={e=>setLocal({...local,newDelta:e.target.value})} className="w-full bg-f1f5f9 p-2 rounded-xl text-center font-bold text-slate-800 border border-slate-300"/></div>)}

        const EditOptionHistoryModal = ({ trade, onClose, onSave, onDelete }) => {

                        <div className="flex justify-between items-center mb-4"><h3 className="text-lg font-black flex gap-2 text-slate-800"><Icon name="Edit2"/> 編輯交易</h3><button onClick={onClose}><Icon name="X"/></button></div>
                        <div className="space-y-3">
                            <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-500 block">日期</label><input type="date" value={localTrade.date?.split('T')[0]} onChange={e=>setLocalTrade({...localTrade, date: e.target.value})} className="w-full bg-f1f5f9 p-2 rounded-lg text-xs font-bold text-slate-800 border border-slate-300"/></div><div><label className="text-xs text-slate-500 block">標的</label><input value={localTrade.ticker} onChange={e=>setLocalTrade({...localTrade, ticker: e.target.value.toUpperCase()})} className="w-full bg-f1f5f9 p-2 rounded-lg text-xs font-bold text-slate-800 border border-slate-300"/></div></div>
                            <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-500 block">動作</label><select value={localTrade.type} onChange={e=>setLocalTrade({...localTrade, type: e.target.value})} className="w-full bg-f1f5f9 p-2 rounded-lg text-xs font-bold text-slate-800 border border-slate-300"><option value="OPEN">建倉</option><option value="CLOSE">平倉</option><option value="ROLL_CLOSE">轉倉(平)</option><option value="ROLL_OPEN">轉倉(開)</option><option value="MANUAL">補登</option></select></div><div><label className="text-xs text-slate-500 block">金額 ($)</label><input type="number" step="any" value={localTrade.pnl} onChange={e=>setLocalTrade({...localTrade, pnl: e.target.value})} className="w-full bg-f1f5f9 p-2 rounded-lg text-xs font-bold text-center text-slate-800 border border-slate-300" /></div></div>

        const EditRecordModal = ({ editingId, editForm, setEditingId, setEditForm, saveEdit }) => {
            if (!editingId || !editForm) return null;
            const toggleCashSign = () => {
                setEditForm(prev => {
                    const currentVal = parseFloat(prev.inputs.cash_balance);
                    if (!isNaN(currentVal)) {
                         return { ...prev, inputs: { ...prev.inputs, cash_balance: currentVal * -1 } };
                    }
                    return prev;
                });
            };

            return (
                <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center">
                    <div className="w-full max-w-md bg-white rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl overflow-y-auto max-h-[90vh] z-[110]">
                        <div className="flex justify-between items-center mb-6 border-b pb-4 border-slate-100"><h3 className="text-xl font-black flex items-center gap-2 text-slate-800"><Icon name="Edit2" size={20} className="text-brand-600" /> 編輯紀錄</h3><button onClick={() => setEditingId(null)} className="p-2 bg-slate-100 rounded-full hover:bg-slate-200"><Icon name="X" size={20} /></button></div>
                        <div className="space-y-2">
                            {FIXED_HOLDINGS.map(c => { const t=c.type==='fixed'?c.ticker:(editForm.inputs[c.tickerKey]||c.defaultTicker); return <div key={c.id} className="flex justify-between items-center bg-f1f5f9 p-2 px-3 rounded-xl border border-slate-300"><span className={`font-bold text-xs ${c.color}`}>{t}</span><input type="number" value={editForm.inputs[c.qtyKey]} onChange={e => setEditForm(p => ({...p, inputs: {...p.inputs, [c.qtyKey]: e.target.value}}))} className="w-24 bg-white border border-slate-300 rounded-lg px-2 py-1 text-right font-mono font-bold text-slate-800 shadow-inner-strong" /></div>; })}
                            
                            {(editForm.inputs.satellites || []).map(s => (
                                <div key={s.id} className="flex justify-between items-center bg-f1f5f9 p-2 px-3 rounded-xl border border-slate-300">
                                    <span className="font-bold text-xs text-emerald-600">{s.ticker}</span>
                                    <input type="number" value={s.qty} onChange={e => {
                                        const newSats = editForm.inputs.satellites.map(si => si.id === s.id ? {...si, qty: e.target.value} : si);
                                        setEditForm(p => ({...p, inputs: {...p.inputs, satellites: newSats}}));
                                    }} className="w-24 bg-white border border-slate-300 rounded-lg px-2 py-1 text-right font-mono font-bold text-slate-800 shadow-inner-strong" />
                                </div>
                            ))}

                            <div className="flex justify-between items-center bg-f1f5f9 p-2 px-3 rounded-xl border border-slate-300">

                                <div className="relative w-32">
                                    <input type="text" inputMode="decimal" value={editForm.inputs.cash_balance} onChange={e => setEditForm(p => ({...p, inputs: {...p.inputs, cash_balance: e.target.value}}))} className={`w-full bg-white border border-slate-300 rounded-lg px-2 py-1 text-right font-mono font-bold shadow-inner-strong ${parseFloat(editForm.inputs.cash_balance) < 0 ? 'text-red-600' : 'text-slate-800'}`} />
                                    <button onClick={toggleCashSign} className="absolute left-1 top-1/2 -translate-y-1/2 text-[10px] text-slate-500 font-bold bg-slate-200 px-1 rounded active:scale-95 border border-slate-300">+/-</button>
                                </div>
                            </div>
                            
                            <textarea value={editForm.memo || ''} onChange={e => setEditForm(p => ({...p, memo: e.target.value}))} className="w-full bg-f1f5f9 border border-slate-300 rounded-2xl p-4 text-sm h-20 mt-2 text-slate-700 shadow-inner-strong" placeholder="備註..." />
                            <button onClick={()=>saveEdit({...editForm, inputs: {...editForm.inputs, total_realized_premium: parseFloat(editForm.inputs.total_realized_premium) || 0}})} className="w-full bg-brand-600 text-white py-4 rounded-2xl font-black flex justify-center gap-2 mt-2 hover:bg-brand-700 transition-colors shadow-lg shadow-brand-500/30"><Icon name="Save" size={20} /> 保存修正</button>
                        </div>
                    </div>
                </div>
            );
        };

        const calculatePortfolioMetrics = (prices, inputs, records, simulatedTotal, filterMode, stressSimPct, simLeverage) => {
            const getP = (t) => prices[(t || "").toUpperCase()] || 0;
            const getV = (k) => getNum(inputs[k]);
            
            let total = getV('cash_balance');
            
            FIXED_HOLDINGS.forEach(c => total += (c.type === 'fixed' ? getP(c.ticker) : getP(inputs[c.tickerKey])) * getV(c.qtyKey));
            
            const satellites = inputs.satellites || [];
            satellites.forEach(s => total += getP(s.ticker) * getNum(s.qty));

            let ytd = 0, mtd = 0, tot = 0, gData = [];
            if (records.length) {
                const sorted = [...records].sort((a,b) => new Date(a.date) - new Date(b.date));
                const now = new Date();
                const getRet = (rec) => rec.total_equity > 0 ? ((total - rec.total_equity) / rec.total_equity) * 100 : 0;
                tot = getRet(sorted[0]);
                const startY = sorted.find(r => new Date(r.date).getFullYear() === now.getFullYear()) || sorted[0];
                ytd = getRet(startY);
                const startM = sorted.find(r => new Date(r.date).getMonth() === now.getMonth() && new Date(r.date).getFullYear() === now.getFullYear()) || sorted[0];
                mtd = getRet(startM);
                
                const baseQQQ = sorted[0].prices?.['QQQ'] || 1;
                const baseEquity = sorted[0].total_equity || 1;
                
                let maxEq = 0;
                gData = sorted.filter(r => { const d=new Date(r.date), n=new Date(); return filterMode==='all' || (filterMode==='year' && d.getFullYear()===n.getFullYear()) || (filterMode==='month' && d.getMonth()===n.getMonth()); }).map(r => { 
                    if(r.total_equity > maxEq) maxEq = r.total_equity;
                    const qPrice = r.prices?.['QQQ'] || 0;
                    const qqqEquity = baseQQQ > 0 ? (qPrice / baseQQQ) * baseEquity : 0;
                    
                    const ret = baseEquity > 0 ? ((r.total_equity - baseEquity) / baseEquity) * 100 : 0;
                    const qRet = baseQQQ > 0 ? ((qPrice - baseQQQ) / baseQQQ) * 100 : 0;

                    return { 
                        date: r.date, equity: r.total_equity, qqqEquity: qqqEquity,
                        dd: maxEq>0 ? ((r.total_equity-maxEq)/maxEq)*100 : 0, 
                        ret: ret, qRet: qRet
                    }; 
                });
            }

            const tCore = (inputs.ticker_core_1 || "QQQ").toUpperCase();
            const valQQQ = getP(tCore) * getV('qty_qqq');
            const valTQQQ = getP('TQQQ') * getV('qty_tqqq');
            const valCore = valQQQ + valTQQQ;
            const tqqqRatio = valCore > 0 ? (valTQQQ / valCore) * 100 : 0;
            const qqqRatio = valCore > 0 ? (valQQQ / valCore) * 100 : 0;
            const valIbit = getP('IBIT') * getV('qty_ibit');
            const ibitW = (valIbit / (total||1)) * 100;

            let totalSatPctTarget = 0;
            const satStatus = satellites.map(s => {
                const val = getP(s.ticker) * getNum(s.qty);
                const weight = (total > 0) ? (val / total) * 100 : 0;
                const target = getNum(s.target_pct);
                totalSatPctTarget += target;
                const up = getNum(s.tol_up) || 20; 
                const down = getNum(s.tol_down) || 10;
                let status = 'ok';
                if (weight > target * (1 + up/100)) status = 'high';
                if (weight < target * (1 - down/100)) status = 'low';
                
                const trackTicker = (s.trackingTicker || s.ticker).toUpperCase();
                const trackPrice = getP(trackTicker);
                const sma = getNum(s.sma_track);
                const distToSma = (sma > 0 && trackPrice > 0) ? ((trackPrice - sma) / sma) * 100 : null;
                
                const rsiVal = parseFloat(s.current_rsi) || 0;
                let rsiSuggestion = { cover: 0, delta: '-', contracts: 0 };
                if (rsiVal > 0 && inputs.options_matrix) {
                    const rule = inputs.options_matrix.find(r => rsiVal >= r.min && rsiVal < r.max);
                    if (rule) {
                        const contracts = Math.floor((getNum(s.qty) / 100) * (rule.cover / 100));
                        rsiSuggestion = { cover: rule.cover, delta: rule.delta, contracts };
                    }
                }

                return { ...s, val, weight, status, trackTicker, trackPrice, distToSma, rsiSuggestion };
            });

            const ibitTarget = getV('target_sat_ibit');
            const coreTargetAlloc = Math.max(0, 100 - totalSatPctTarget - ibitTarget);
            
            const tqqqInCoreTarget = getV('rebalance_core_target');
            const coreTolUp = getV('core_tol_up') || 15;
            const coreTolDown = getV('core_tol_down') || 15;
            
            let coreStatus = 'ok';
            if (tqqqRatio > tqqqInCoreTarget + coreTolUp) coreStatus = 'high';
            if (tqqqRatio < tqqqInCoreTarget - coreTolDown) coreStatus = 'low';

            const checkSat = (w, target, up, down) => {
                const u = getNum(up) || 20; const d = getNum(down) || 10;
                if (w > target * (1 + u/100)) return 'high';
                if (w < target * (1 - d/100)) return 'low';
                return 'ok';
            };
            const statIbit = checkSat(ibitW, ibitTarget, inputs.tol_up_ibit, inputs.tol_down_ibit);

            const coreTrackTicker = (inputs.core_track_ticker || 'QQQ').toUpperCase();
            const benchmarkPrice = getP(coreTrackTicker); 
            const sma200 = getV('qqq_sma200'); 
            const isBear = sma200 > 0 && benchmarkPrice > 0 && benchmarkPrice < (sma200 * 0.97); 
            const bearData = { isActive: isBear, totalDefensive: getV('cash_balance') + (getP('SGOV') * getV('qty_sgov')), monthlyBuy: (getV('cash_balance') + (getP('SGOV') * getV('qty_sgov'))) / 12 };

            const rsi = getNum(inputs.current_rsi);
            let sug = { cover: 0, delta: 'N/A' };
            if (rsi > 0 && inputs.options_matrix) {
                const rule = inputs.options_matrix.find(r => rsi >= r.min && rsi < r.max);
                if (rule) sug = { cover: rule.cover, delta: rule.delta };
            }
            const suggestContracts = Math.floor((getV('qty_tqqq') / 100) * (sug.cover / 100));

            const simDrop = stressSimPct / 100;
            const safeBenchmarkPrice = benchmarkPrice > 0 ? benchmarkPrice : 0;
            const simPrice = safeBenchmarkPrice * (1 + simDrop);
            const simulatedPnL = total * simDrop * simLeverage;
            const simulatedTotalAsset = total + simulatedPnL;

            let calcResults = [];
            if (simulatedTotal) {
                const inj = parseFloat(simulatedTotal);
                if (!isNaN(inj)) {
                    const nTot = total + inj;
                    const tIbitVal = nTot * (ibitTarget / 100);
                    const tCoreVal = nTot * (coreTargetAlloc / 100);
                    const tTQQQVal = tCoreVal * (tqqqInCoreTarget / 100);
                    const tQQQVal = tCoreVal * (1 - tqqqInCoreTarget / 100);
                    
                    const calcDiff = (targetVal, currentVal, ticker) => { 
                        const p = getP(ticker); return { ticker, diff: targetVal - currentVal, qty: p>0 ? (targetVal - currentVal)/p : 0, action: (targetVal - currentVal) > 0 ? 'Buy' : 'Sell' }; 
                    };
                    calcResults = [
                        calcDiff(tTQQQVal, valTQQQ, 'TQQQ'),
                        calcDiff(tQQQVal, valQQQ, tCore),
                        calcDiff(tIbitVal, valIbit, 'IBIT'),
                        ...satellites.map(s => {
                            const tVal = nTot * (getNum(s.target_pct) / 100);
                            const cVal = getP(s.ticker) * getNum(s.qty);
                            return calcDiff(tVal, cVal, s.ticker);
                        })
                    ];
                }
            }

            return {
                totalCapital: total,
                performanceStats: { ytd, mtd, total: tot },
                rebalanceStatus: { tqqqRatio, qqqRatio, valCore, valQQQ, valTQQQ, valIbit, coreStatus, tqqqInCoreTarget, coreTolUp, coreTolDown, ibitW: ibitW, statIbit, satellites: satStatus, coreTargetAlloc }, // ibitW passed as number
                bearDefense: bearData,
                currentLeverage: (total>0 ? ((valTQQQ*3) + valQQQ + satellites.reduce((a,b)=>a+b.val,0) + valIbit)/total : 0).toFixed(2),
                calcResults, rsiSuggestion: { ...sug, contracts: suggestContracts },
                qqqAthMetrics: { toMA200: (sma200>0&&benchmarkPrice>0)?((sma200-benchmarkPrice)/benchmarkPrice)*100:null, toATH: (getV('qqq_ath')>0&&benchmarkPrice>0)?((getV('qqq_ath')-benchmarkPrice)/benchmarkPrice)*100:null, ath: getV('qqq_ath'), currentPrice: benchmarkPrice, sma200 },
                graphData: gData, simulatedMetrics: { simPrice, simulatedPnL, simulatedTotalAsset }
            };
        };

        const processHistoryData = (records, optionHistory) => {
            if (!records || records.length === 0) return [];
            const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
            const groups = {};
            sorted.forEach(rec => {
                const d = new Date(rec.date); const y = d.getFullYear(); const m = d.getMonth() + 1;
                if (!groups[y]) groups[y] = { records: [], months: {} };
                groups[y].records.push(rec); if (!groups[y].months[m]) groups[y].months[m] = []; groups[y].months[m].push(rec);
            });
            return Object.keys(groups).sort((a,b) => b-a).map(year => { 
                const yData = groups[year]; 
                const yPnl = yData.records[yData.records.length - 1].total_equity - yData.records[0].total_equity; 
                const yOptPnl = optionHistory.filter(t => new Date(t.date).getFullYear() === parseInt(year)).reduce((s, t) => s + (parseFloat(t.pnl)||0), 0);
                const months = Object.keys(yData.months).sort((a,b) => b-a).map(month => { 
                    const mRecs = yData.months[month]; 
                    const mPnl = mRecs[mRecs.length - 1].total_equity - mRecs[0].total_equity; 
                    const mOptPnl = optionHistory.filter(t => { const d=new Date(t.date); return d.getFullYear()===parseInt(year) && d.getMonth()+1===parseInt(month); }).reduce((s, t) => s + (parseFloat(t.pnl)||0), 0); 
                    return { month, return: mRecs[0].total_equity > 0 ? (mPnl/mRecs[0].total_equity)*100 : 0, pnl: mPnl, optPnl: mOptPnl }; 
                });
                return { year, return: yData.records[0].total_equity>0?(yPnl/yData.records[0].total_equity)*100:0, pnl: yPnl, optPnl: yOptPnl, optCont: yPnl!==0?(yOptPnl/Math.abs(yPnl))*100:0, months };
            });
        };

        const generateSystemAlerts = (status, bear, total, prices, inputs) => {
            const alertsMap = {}; 
            const addAlert = (ticker, type, msg) => {
                if (!alertsMap[ticker]) alertsMap[ticker] = { ticker, type, msgs: [] };
                alertsMap[ticker].msgs.push(msg);
                if (type === 'danger') alertsMap[ticker].type = 'danger';
                else if (type === 'warning' && alertsMap[ticker].type !== 'danger') alertsMap[ticker].type = 'warning';
                else if (type === 'opportunity' && alertsMap[ticker].type === undefined) alertsMap[ticker].type = 'opportunity';
            };
            
            const getP = (t) => prices[(t || "").toUpperCase()] || 0;
            const getNum = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
            const getQty = (val, price) => (price > 0 ? Math.abs(val / price) : 0);

            // 1. Core Rebalance
            if (status.coreStatus !== 'ok') {
                const targetTQQQVal = status.valCore * (status.tqqqInCoreTarget / 100);
                const diffVal = targetTQQQVal - status.valTQQQ;
                const isHigh = status.coreStatus === 'high';
                const action = isHigh ? '賣出' : '買入';
                const type = isHigh ? 'opportunity' : 'warning';
                const upLimit = status.tqqqInCoreTarget + status.coreTolUp;
                const downLimit = status.tqqqInCoreTarget - status.coreTolDown;
                addAlert('TQQQ', type, `核心配置${isHigh ? '過高' : '過低'} (目標 ${status.tqqqInCoreTarget}%)：目前 ${status.tqqqRatio.toFixed(1)}% ${isHigh ? '>' : '<'} ${isHigh ? upLimit : downLimit}%。建議${action} ${getQty(diffVal, getP('TQQQ')).toFixed(0)} 股。`);
            }

            // 2. Whipsaw Protection
            const buyBuffer = getNum(inputs.global_sma_buffer_buy) || 0;
            const sellBuffer = getNum(inputs.global_sma_buffer_sell) || 0;

            const checkSma = (ticker, sma) => {
                const price = getP(ticker);
                const smaVal = getNum(sma);
                if (price > 0 && smaVal > 0) {
                    const dist = ((price - smaVal) / smaVal) * 100;
                    const triggerSell = smaVal * (1 - sellBuffer/100);
                    const triggerBuy = smaVal * (1 + buyBuffer/100);

                    if (price < triggerSell) {
                        addAlert(ticker, 'danger', `跌破均線 (SMA ${smaVal})：現價 $${price} < 觸發價 $${triggerSell.toFixed(2)} (緩衝 -${sellBuffer}%)。建議清倉/減碼。`);
                    }
                    else if (price > triggerBuy) {
                        addAlert(ticker, 'opportunity', `站上均線 (SMA ${smaVal})：現價 $${price} > 觸發價 $${triggerBuy.toFixed(2)} (緩衝 +${buyBuffer}%)。建議進場。`);
                    }
                }
            };

            // 3. Dynamic Satellites
            if (status.satellites) {
                status.satellites.forEach(s => {
                    if (s.sma_track) checkSma(s.trackTicker, s.sma_track);
                    
                    const targetVal = total * (getNum(s.target_pct) / 100);
                    const diffVal = targetVal - s.val;
                    const upperLimit = s.target_pct * (1 + (s.tol_up / 100));
                    const lowerLimit = s.target_pct * (1 - (s.tol_down / 100));

                    if (s.weight > upperLimit) {
                         addAlert(s.ticker, 'opportunity', `獲利了結：佔比 ${s.weight.toFixed(1)}% > 上限 ${upperLimit.toFixed(1)}%。建議賣出 ${getQty(Math.abs(diffVal), getP(s.ticker)).toFixed(0)} 股。`);
                    }
                    else if (s.weight < lowerLimit) {
                         addAlert(s.ticker, 'warning', `逢低加碼：佔比 ${s.weight.toFixed(1)}% < 下限 ${lowerLimit.toFixed(1)}%。建議買入 ${getQty(Math.abs(diffVal), getP(s.ticker)).toFixed(0)} 股。`);
                    }
                });
            }

            // 4. IBIT Check
            if (inputs.ibit_sma20) checkSma('IBIT', inputs.ibit_sma20);
            const ibitTarget = getNum(inputs.target_sat_ibit);
            const ibitUp = ibitTarget * (1 + (inputs.tol_up_ibit / 100));
            const ibitDown = ibitTarget * (1 - (inputs.tol_down_ibit / 100));
            const targetIbitVal = total * (ibitTarget / 100);
            const diffIbitVal = targetIbitVal - status.valIbit;
            
            const currentIbitW = typeof status.ibitW === 'number' ? status.ibitW : parseFloat(status.ibitW);

            if (currentIbitW > ibitUp) {
                addAlert('IBIT', 'opportunity', `獲利了結：佔比 ${currentIbitW.toFixed(1)}% > 上限 ${ibitUp.toFixed(1)}%。建議賣出 ${getQty(Math.abs(diffIbitVal), getP('IBIT')).toFixed(0)} 股。`);
            }
            if (currentIbitW < ibitDown) {
                 addAlert('IBIT', 'warning', `逢低加碼：佔比 ${currentIbitW.toFixed(1)}% < 下限 ${ibitDown.toFixed(1)}%。建議買入 ${getQty(Math.abs(diffIbitVal), getP('IBIT')).toFixed(0)} 股。`);
            }

            // Core SMA Check
            const coreTrackTicker = (inputs.core_track_ticker || 'QQQ').toUpperCase();
            if (inputs.qqq_sma200) checkSma(coreTrackTicker, inputs.qqq_sma200);

            return Object.values(alertsMap); // Return array of grouped alerts
        };

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [records, setRecords] = useState([]);
            const [prices, setPrices] = useState({});
            const [loadingPrices, setLoadingPrices] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [isSwitching, setIsSwitching] = useState(false);
            const [message, setMessage] = useState(null);
            const [historyTab, setHistoryTab] = useState('nav'); 
            const [chartMode, setChartMode] = useState('NAV_DD');
            const [filterMode, setFilterMode] = useState('all');
            const [expandedYears, setExpandedYears] = useState({});
            const [historyExpanded, setHistoryExpanded] = useState(false);
            const [optionHistoryExpanded, setOptionHistoryExpanded] = useState(false);
            const [customSyncId, setCustomSyncId] = useState(() => localStorage.getItem('qqq_sync_id') || '');
            const [tempSyncId, setTempSyncId] = useState(customSyncId);
            const [showBenchmark, setShowBenchmark] = useState(false);
            
            // --- STATE VARIABLES ---
            const [openSettings, setSettings] = useState({ account: true, system: false, strategy: false, rsi_matrix: false });
            const [isAlertsView, setIsAlertsView] = useState(false);
            const [isMottoLocked, setIsMottoLocked] = useState(true);
            const [isStrategyEditing, setIsStrategyEditing] = useState(false);
            const [isCalcOpen, setIsCalcOpen] = useState(false); 
            // Layout with Safe Persistence
            const [dashboardSections, setSections] = useState(() => {
                try {
                    const saved = localStorage.getItem('qqq_dashboard_sections');
                    return saved ? JSON.parse(saved) : { simulator: true, rebalance: true, holdings: true, pie: true, rsiHelper: true };
                } catch(e) {
                    return { simulator: true, rebalance: true, holdings: true, pie: true, rsiHelper: true };
                }
            });

            // Save layout preference
            useEffect(() => {
                localStorage.setItem('qqq_dashboard_sections', JSON.stringify(dashboardSections));
            }, [dashboardSections]);

            const [simulatedTotal, setSimulatedTotal] = useState('');
            const [stressSimPct, setStressSimPct] = useState(0); 
            const [simLeverage, setSimLeverage] = useState(3); 

            // --- MODAL STATE ---
            const [openModalType, setOpenModalType] = useState(null);
            const [targetOptionId, setTargetOptionId] = useState(null);
            const [editingTrade, setEditingTrade] = useState(null);
            const [editingInventoryItem, setEditingInventoryItem] = useState(null);
            const [editingId, setEditingId] = useState(null); 
            const [editForm, setEditForm] = useState(null); 

            const [inputs, setInputs] = useState({
                motto: '', // Initialize motto to empty string
                current_rsi: '', qqq_ath: 0, option_history: [], qqq_sma200: 0, qqq_sma20: 0, ibit_sma20: 0,
                global_sma_buffer_buy: 3, global_sma_buffer_sell: 3, // Global Buffers
                exchange_rate: 32.5, rebalance_core_target: 50,
                core_tol_up: 15, core_tol_down: 15, // New Core Tolerances
                tol_up_ibit: 20, tol_down_ibit: 10, target_sat_ibit: 10,
                ticker_core_1: 'QQQ', qty_qqq: 0, qty_tqqq: 0, qty_ibit: 0, qty_sgov: 0,
                core_track_ticker: 'QQQ', // Default core tracking ticker
                cash_balance: 0, record_date: new Date().toISOString().split('T')[0],
                loan_amount: 0, loan_rate: 2.0, loan_years: 7, loan_repay_target: 20, loan_entry_valuation: 0,
                satellites: [], 
                title_core: "核心策略 (Core) - QQQ/TQQQ", strat_core: "目標：40% TQQQ + 40% QQQ\n監測：QQQ > 200 SMA 持有正股，< 200 SMA 轉防禦。", 
                title_custom: "衛星策略 (Satellite)", strat_custom: "原則：Buy & Hold。\n跌破均線 (SMA) 建議出場。\n佔比超過目標上限建議再平衡。", 
                title_options: "選擇權策略 (Options)", strat_options: "標的：TQQQ Weekly Options\nRSI < 40：禁止開倉\nRSI 40-60：Delta 0.10-0.12\nRSI > 75：Delta 0.20-0.25",
                options_matrix: [ { min: 0, max: 40, cover: 0, delta: '< 0.05 (禁止)' }, { min: 40, max: 60, cover: 30, delta: '0.10 - 0.12' }, { min: 60, max: 75, cover: 50, delta: '0.12 - 0.15' }, { min: 75, max: 100, cover: 70, delta: '0.20 - 0.25' } ],
                options_inventory: [] 
            });

            const effectiveUserId = customSyncId || (user ? user.uid : null);
            useEffect(() => { const init = async () => { await auth.signInAnonymously(); }; init().catch(console.error); return auth.onAuthStateChanged(setUser); }, []);
            
            useEffect(() => { 
                if (!user) return;
                
                // Clear state when switching users to prevent lag/stale data
                setRecords([]);
                setInputs(prev => ({ ...prev, satellites: [], option_history: [] }));
                setIsSwitching(true);

                const uid = customSyncId || user.uid;
                
                // Fix: Add error handling to prevent infinite loading
                const uRecs = db.collection('artifacts').doc(APP_ID).collection('users').doc(uid).collection('trading_records').onSnapshot(
                    s => setRecords(s.docs.map(d => ({id:d.id,...d.data()}))),
                    e => {
                        console.error("Records sync error:", e);
                        setIsSwitching(false);
                    }
                ); 
                
                const uConf = db.collection('artifacts').doc(APP_ID).collection('users').doc(uid).collection('config').doc('current').onSnapshot(
                    s => { 
                        if (s.exists) { 
                            const d = s.data(); 
                            d.record_date = new Date().toISOString().split('T')[0]; 
                            if(!d.option_history) d.option_history=[]; 
                            if (!d.satellites) d.satellites = [];
                            if (d.motto === undefined) d.motto = ''; 
                            setInputs(p => ({...p, ...d})); 
                        }
                        setIsSwitching(false); // Done loading
                    },
                    e => {
                        console.error("Config sync error:", e);
                        setIsSwitching(false); // Fail safe: Stop loading spinner
                        showToast("連線逾時，請檢查網路");
                    }
                ); 
                fetchPrices(); 
                return () => { uRecs(); uConf(); };
            }, [user, customSyncId]);

            // AUTO-FETCH FIX: Trigger fetchPrices when satellites or core ticker change
            useEffect(() => {
                if (inputs.satellites && inputs.satellites.length > 0) {
                    fetchPrices();
                }
            }, [inputs.satellites, inputs.core_track_ticker]);

            const metrics = useMemo(() => calculatePortfolioMetrics(prices, inputs, records, simulatedTotal, filterMode, stressSimPct, simLeverage), [prices, inputs, records, filterMode, simulatedTotal, stressSimPct, simLeverage]);
            const historyGroups = useMemo(() => processHistoryData(records, inputs.option_history || []), [records, inputs.option_history]);
            const alerts = useMemo(() => generateSystemAlerts(metrics.rebalanceStatus, metrics.bearDefense, metrics.totalCapital, prices, inputs), [metrics, prices, inputs]);
            const totalRealizedPremium = useMemo(() => (inputs.option_history || []).reduce((acc, curr) => acc + (parseFloat(curr.pnl) || 0), 0), [inputs.option_history]);
            const ltv = inputs.loan_amount > 0 && metrics.totalCapital > 0 ? (inputs.loan_amount / metrics.totalCapital) * 100 : 0;

            const showToast = (txt) => { setMessage(txt); setTimeout(() => setMessage(null), 3000); };
            const handleInputChange = (f, v) => setInputs(p => ({ ...p, [f]: v }));
            const handleMatrixChange = (idx, field, val) => { const newM = [...inputs.options_matrix]; newM[idx][field] = val; setInputs(p => ({...p, options_matrix: newM})); syncToCloud('options_matrix', newM); };
            const syncToCloud = async (f, v) => { if (user) { const safeV = sanitizeForFirestore(v); await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set({ [f]: safeV }, { merge: true }); } };
            
            // Satellites
            const addSatellite = () => { const newSat = { id: Date.now().toString(), ticker: '', trackingTicker: '', qty: 0, targetPrice: '', target_pct: 5, tol_up: 20, tol_down: 10, sma_track: '' }; const newSats = [...(inputs.satellites || []), newSat]; setInputs(p => ({ ...p, satellites: newSats })); syncToCloud('satellites', newSats); };
            const updateSatellite = (id, field, value) => { 
                const safeValue = value === undefined ? '' : value; 
                const newSats = inputs.satellites.map(s => s.id === id ? { ...s, [field]: safeValue } : s); 
                setInputs(p => ({ ...p, satellites: newSats }));
                if (field === 'current_rsi') syncToCloud('satellites', newSats); // Explicitly sync RSI changes immediately
            };
            const saveSatellites = () => syncToCloud('satellites', inputs.satellites);
            const deleteSatellite = (id) => { const newSats = inputs.satellites.filter(s => s.id !== id); setInputs(p => ({ ...p, satellites: newSats })); syncToCloud('satellites', newSats); };

            const toggleYear = (y) => setExpandedYears(prev => ({...prev, [y]: !prev[y]}));
            
            const removeOption = (id) => {
                const newInv = inputs.options_inventory.filter(o => o.id !== id);
                setInputs(p => ({...p, options_inventory: newInv}));
                syncToCloud('options_inventory', newInv);
            };

            const toggleCashSign = () => {
                setInputs(prev => {
                    const currentVal = prev.cash_balance;
                    const numVal = parseFloat(currentVal);
                    if (!isNaN(numVal)) {
                        const newVal = numVal * -1;
                        syncToCloud('cash_balance', newVal);
                        return { ...prev, cash_balance: newVal };
                    }
                    return prev;
                });
            };

            const fetchPrices = useCallback(async (force = false) => { 
                if (loadingPrices) return; 
                const CACHE_KEY = 'qqq_price_cache_v17'; 
                const satTickers = (inputs.satellites || []).flatMap(s => [s.ticker, s.trackingTicker]).filter(Boolean);
                // Ensure Core Track Ticker is fetched
                const coreTrackTicker = inputs.core_track_ticker || 'QQQ';
                const syms = [...new Set(['QQQ', 'QQQM', 'TQQQ', 'IBIT', 'SGOV', coreTrackTicker, ...satTickers].filter(Boolean).map(s=>s.trim().toUpperCase()))]; 
                
                if (!force) { const c = localStorage.getItem(CACHE_KEY); if (c) { const { timestamp, data } = JSON.parse(c); if (Date.now() - timestamp < 300000 && syms.every(s => data[s] !== undefined)) { setPrices(data); return; } } } 
                setLoadingPrices(true); 
                try { const res = await Promise.allSettled(syms.map(s => fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${FINNHUB_KEY}`).then(r => r.json()).then(d => ({s, p: d.c})))); setPrices(p => { const upd = {...p, ...res.reduce((acc, curr) => (curr.status === 'fulfilled' && curr.value.p > 0 ? {...acc, [curr.value.s]: curr.value.p} : acc), {})}; localStorage.setItem(CACHE_KEY, JSON.stringify({timestamp: Date.now(), data: upd})); return upd; }); } catch(e) { console.error(e); } finally { setLoadingPrices(false); } 
            }, [inputs.ticker_core_1, inputs.satellites, inputs.core_track_ticker, loadingPrices]);

            const handleExecuteTrade = (type, data) => { 
                let newInv = [...(inputs.options_inventory||[])], newHist = [...(inputs.option_history||[])]; 
                const now = new Date().toISOString(); 
                const p = parseFloat(data.newPremium)||0, c = parseFloat(data.contracts)||1, ep = parseFloat(data.exitPrice)||0; 
                if (type === 'OPEN') { 
                    newHist.unshift({ id: Date.now(), date: now, ticker: data.ticker, type: 'OPEN', pnl: p*c*100 }); 
                    newInv.push({ id: Date.now(), type: data.type, ticker: data.ticker, strike: data.newStrike, expiry: data.newExpiry, contracts: c, premium: p, delta: data.newDelta }); 
                    showToast(`建倉成功！收入: +$${(p*c*100).toFixed(0)}`); 
                } else if (type === 'CLOSE') { 
                    const opt = newInv.find(o => o.id === targetOptionId); if(!opt) return; 
                    newHist.unshift({ id: Date.now(), date: now, ticker: opt.ticker, type: 'CLOSE', pnl: -(ep*opt.contracts*100) }); 
                    newInv = newInv.filter(o => o.id !== targetOptionId); 
                    showToast(`平倉成功！支出: $${(ep*opt.contracts*100).toFixed(0)}`); 
                } else if (type === 'ROLL') { 
                    const opt = newInv.find(o => o.id === targetOptionId); if(!opt) return; 
                    newHist.unshift({ id: Date.now()+1, date: now, ticker: opt.ticker, type: 'ROLL_OPEN', pnl: p*opt.contracts*100 }); 
                    newHist.unshift({ id: Date.now(), date: now, ticker: opt.ticker, type: 'ROLL_CLOSE', pnl: -(ep*opt.contracts*100) }); 
                    newInv = newInv.map(o => o.id === targetOptionId ? { ...o, strike: data.newStrike, expiry: data.newExpiry, premium: p, delta: data.newDelta } : o); 
                    showToast(`轉倉成功！`); 
                } 
                setInputs(prev => ({...prev, options_inventory: newInv, option_history: newHist})); 
                if (user) {
                    const safeInv = sanitizeForFirestore(newInv);
                    const safeHist = sanitizeForFirestore(newHist);
                    db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set({ options_inventory: safeInv, option_history: safeHist }, { merge: true }); 
                }
                setOpenModalType(null);

                                <div className="bg-white rounded-[2rem] p-6 border border-slate-200 shadow-heavy">
                                    <div className="flex justify-between items-center mb-4"><div className="text-xs font-black uppercase text-slate-500 flex items-center gap-2"><Icon name="Activity" size={16} /> LTV 貸款價值比</div><div className={`text-2xl font-black font-mono ${ltv > 50 ? 'text-red-500' : (ltv > 30 ? 'text-amber-500' : 'text-emerald-500')}`}>{ltv.toFixed(1)}%</div></div>
                                    <div className="h-6 w-full bg-slate-100 rounded-full relative overflow-hidden mb-2 shadow-inner"><div className="absolute top-0 bottom-0 left-0 bg-emerald-400" style={{width: '30%'}}></div><div className="absolute top-0 bottom-0 left-[30%] bg-amber-400" style={{width: '20%'}}></div><div className="absolute top-0 bottom-0 left-[50%] bg-red-400" style={{width: '50%'}}></div><div className="absolute top-0 bottom-0 w-1 bg-white shadow-xl transition-all duration-500 z-10" style={{left: `${Math.min(ltv, 100)}%`}}></div></div>
                                </div>
                                <Card className="border-2 border-amber-100 shadow-heavy"><div className="grid gap-4">{[{l:"貸款總額",k:"loan_amount"},{l:"還款目標%",k:"loan_repay_target"},{l:"基準市值(可選)",k:"loan_entry_valuation"}].map(f => (<div key={f.k} className="space-y-1"><label className="text-[10px] uppercase text-amber-600">{f.l}</label><input type="number" value={inputs[f.k]} onChange={e=>handleInputChange(f.k,e.target.value)} onBlur={e=>syncToCloud(f.k,e.target.value)} className="bg-amber-50 rounded-xl p-3 text-center text-lg w-full font-bold shadow-inner-strong border border-amber-100" /></div>))}</div></Card>
                            </div>
                        )}

                        {view === 'sync_settings' && (
                            <div className="space-y-6 animate-in fade-in">
                                <div className="bg-white rounded-[2rem] border border-slate-200 overflow-hidden shadow-heavy"><button onClick={()=>setSettings(p=>({...p,account:!p.account}))} className="w-full p-4 flex justify-between bg-white hover:bg-slate-50 transition-colors"><div className="flex items-center gap-3 font-black"><Icon name="Fingerprint" className="text-brand-600"/> 帳號同步</div><Icon name={openSettings.account?"ChevronUp":"ChevronDown"} size={14}/></button>{openSettings.account && <div className="p-6 pt-2 space-y-4 bg-white border-t border-slate-100"><div className="text-center font-mono text-lg text-slate-800">{effectiveUserId}</div><div className="flex gap-2"><input value={tempSyncId} onChange={e=>setTempSyncId(e.target.value)} className="flex-1 bg-f1f5f9 p-3 rounded-xl shadow-inner border border-slate-300" placeholder="ID" /><button onClick={()=>{setCustomSyncId(tempSyncId);localStorage.setItem('qqq_sync_id',tempSyncId);showToast("已切換")}} className="bg-brand-600 text-white px-4 rounded-xl hover:bg-brand-700 transition-colors shadow-lg shadow-brand-500/30">OK</button></div></div>}</div>
                                <div className="bg-white rounded-[2rem] border border-slate-200 overflow-hidden shadow-heavy">
                                    <button onClick={()=>setSettings(p=>({...p,strategy:!p.strategy}))} className="w-full p-4 flex justify-between bg-white hover:bg-slate-50 transition-colors"><div className="flex items-center gap-3 font-black"><Icon name="BookOpen" className="text-amber-500"/> 策略手冊</div><Icon name={openSettings.strategy?"ChevronUp":"ChevronDown"} size={14}/></button>
                                    {openSettings.strategy && <div className="p-5 pt-0 bg-white border-t border-slate-100"><button onClick={()=>setIsStrategyEditing(!isStrategyEditing)} className="mb-2 text-[10px] bg-f1f5f9 px-2 py-0.5 rounded ml-auto block hover:bg-slate-200 transition-colors border border-slate-200">{isStrategyEditing?"鎖定":"編輯"}</button>{['core','custom','options'].map(k=><div key={k} className="mb-2"><input value={inputs[`title_${k}`]} readOnly={!isStrategyEditing} onChange={e=>handleInputChange(`title_${k}`,e.target.value)} className="text-brand-600 font-bold mb-1 w-full text-left bg-transparent" /><textarea value={inputs[`strat_${k}`]} readOnly={!isStrategyEditing} onChange={e=>handleInputChange(`strat_${k}`,e.target.value)} className="strategy-textarea w-full text-xs p-2 shadow-inner border border-slate-300" /></div>)}</div>}
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-50 py-4 pb-10 flex justify-around shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                        {[{id:'dashboard',icon:'LayoutDashboard',l:'儀表板'},{id:'parameters',icon:'Sliders',l:'參數'},{id:'history',icon:'TrendingUp',l:'績效'},{id:'loan',icon:'Landmark',l:'貸款'}].map(t => <button key={t.id} onClick={()=>{setView(t.id);}} className={`flex flex-col items-center gap-1 flex-1 transition-all active:scale-90 ${view===t.id?'text-brand-600 border-t-2 border-brand-600 -mt-4 pt-2':'text-slate-400'}`}><Icon name={t.icon} size={24}/><span className="text-[10px] uppercase font-black">{t.l}</span></button>)}
                    </nav>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
