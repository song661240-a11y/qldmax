        // --- GLOBAL COMPONENTS ---
        const Card = ({ children, className = "", onClick }) => <div onClick={onClick} className={`rounded-[2rem] shadow-xl border p-5 transition-all bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 ${className} ${onClick ? 'cursor-pointer hover:scale-[1.01]' : ''}`}>{children}</div>;

        const HoldingRow = memo(({ conf, inputs, prices, onChange, onBlur }) => {
            const ticker = conf.type === 'fixed' ? conf.ticker : (inputs[conf.tickerKey] || conf.defaultTicker).toUpperCase();

            const diff = getDiff(price, inputs[conf.targetKey]);
            return (

                <div className="col-span-3"><input type="number" value={inputs[downKey]} onChange={e=>onChange(downKey,e.target.value)} onBlur={e=>onBlur(downKey,e.target.value)} className="bg-white dark:bg-slate-700 p-1.5 rounded-lg text-center w-full text-blue-500"/></div>

        // --- PURE LOGIC FUNCTIONS ---
        const calculatePortfolioMetrics = (prices, inputs, records, simulatedTotal, filterMode, stressSimPct, simLeverage) => {
            const getP = (t) => prices[(t || "").toUpperCase()] || 0;
            const getV = (k) => getNum(inputs[k]);
            
            let total = getV('cash_balance');
            HOLDINGS_CONFIG.forEach(c => total += (c.type === 'fixed' ? getP(c.ticker) : getP(inputs[c.tickerKey])) * getV(c.qtyKey));

            const rsi = getNum(inputs.current_rsi);
            let sug = { cover: 0, delta: 'N/A' };
            if (rsi > 0 && inputs.options_matrix) {
                const rule = inputs.options_matrix.find(r => rsi >= r.min && rsi < r.max);
                if (rule) sug = { cover: rule.cover, delta: rule.delta };
            }
            const suggestContracts = Math.floor((getV('qty_tqqq') / 100) * (sug.cover / 100));

            let ytd = 0, mtd = 0, tot = 0, gData = [];
            if (records.length) {
                const sorted = [...records].sort((a,b) => new Date(a.date) - new Date(b.date));
                const now = new Date();
                const getRet = (rec) => rec.total_equity > 0 ? ((total - rec.total_equity) / rec.total_equity) * 100 : 0;
                tot = getRet(sorted[0]);
                const startY = sorted.find(r => new Date(r.date).getFullYear() === now.getFullYear()) || sorted[0];
                ytd = getRet(startY);
                const startM = sorted.find(r => new Date(r.date).getMonth() === now.getMonth() && new Date(r.date).getFullYear() === now.getFullYear()) || sorted[0];
                mtd = getRet(startM);

                const baseEq = sorted[0].total_equity || 1;
                let maxEq = 0;
                gData = sorted.filter(r => { 
                    const d=new Date(r.date), n=new Date(); 
                    return filterMode==='all' || (filterMode==='year' && d.getFullYear()===n.getFullYear()) || (filterMode==='month' && d.getMonth()===n.getMonth()); 
                }).map(r => {
                    if(r.total_equity > maxEq) maxEq = r.total_equity;
                    return { date: r.date, equity: r.total_equity, dd: maxEq>0 ? ((r.total_equity-maxEq)/maxEq)*100 : 0, ret: ((r.total_equity-baseEq)/baseEq)*100 };
                });
            }

            const tCore = (inputs.ticker_core_1 || "QQQ").toUpperCase();
            const valQQQ = getP(tCore) * getV('qty_qqq');
            const valTQQQ = getP('TQQQ') * getV('qty_tqqq');
            const valCore = valQQQ + valTQQQ;
            const tqqqRatio = valCore > 0 ? (valTQQQ / valCore) * 100 : 0;
            const qqqRatio = valCore > 0 ? (valQQQ / valCore) * 100 : 0;
            const valSat1 = getP(inputs.custom_ticker_1) * getV('qty_custom_1');
            const valSat2 = getP(inputs.custom_ticker_2) * getV('qty_custom_2');
            const valIbit = getP('IBIT') * getV('qty_ibit');
            const satVal = valSat1 + valSat2 + valIbit;
            
            const coreTarget = getV('rebalance_core_target');
            const c1W = (valSat1 / (total||1)) * 100;
            const c2W = (valSat2 / (total||1)) * 100;
            const ibitW = (valIbit / (total||1)) * 100;

            const checkSat = (w, target, up, down) => {
                const u = getNum(up) || 20; const d = getNum(down) || 10;
                if (w > target * (1 + u/100)) return 'high';
                if (w < target * (1 - d/100)) return 'low';
                return 'ok';
            };
            const stat1 = checkSat(c1W, getV('target_sat_1'), inputs.tol_up_sat_1, inputs.tol_down_sat_1);
            const stat2 = checkSat(c2W, getV('target_sat_2'), inputs.tol_up_sat_2, inputs.tol_down_sat_2);
            const statIbit = checkSat(ibitW, getV('target_sat_ibit'), inputs.tol_up_ibit, inputs.tol_down_ibit);

            const sma200 = getV('qqq_sma200');
            const benchmarkPrice = getP('QQQ'); 
            const isBear = sma200 > 0 && benchmarkPrice > 0 && benchmarkPrice < (sma200 * 0.97); 
            const bearData = { isActive: isBear, totalDefensive: getV('cash_balance') + (getP('SGOV') * getV('qty_sgov')), monthlyBuy: (getV('cash_balance') + (getP('SGOV') * getV('qty_sgov'))) / 12 };

            const simDrop = stressSimPct / 100;
            const safeBenchmarkPrice = benchmarkPrice > 0 ? benchmarkPrice : 0;
            const simPrice = safeBenchmarkPrice * (1 + simDrop);
            const simulatedPnL = total * simDrop * simLeverage;
            const simulatedTotalAsset = total + simulatedPnL;

            let calcResults = [];
            if (simulatedTotal) {
                const inj = parseFloat(simulatedTotal);
                if (!isNaN(inj)) {
                    const nTot = total + inj;
                    const tSat1 = nTot * (getV('target_sat_1') / 100);
                    const tSat2 = nTot * (getV('target_sat_2') / 100);
                    const tIbit = nTot * (getV('target_sat_ibit') / 100);
                    const remCore = nTot - tSat1 - tSat2 - tIbit;
                    const tTQQQ = remCore * (coreTarget / 100);
                    const tQQQ = remCore * (1 - coreTarget / 100);
                    const calcDiff = (targetVal, currentVal, ticker) => { 
                        const p = getP(ticker); return { ticker, diff: targetVal - currentVal, qty: p>0 ? (targetVal - currentVal)/p : 0, action: (targetVal - currentVal) > 0 ? 'Buy' : 'Sell' }; 
                    };
                    calcResults = [
                        calcDiff(tTQQQ, valTQQQ, 'TQQQ'),
                        calcDiff(tQQQ, valQQQ, tCore),
                        calcDiff(tSat1, valSat1, inputs.custom_ticker_1),
                        calcDiff(tSat2, valSat2, inputs.custom_ticker_2),
                        calcDiff(tIbit, valIbit, 'IBIT')
                    ];
                }
            }

            const toMA200 = (sma200 > 0 && benchmarkPrice > 0) ? ((sma200 - benchmarkPrice) / benchmarkPrice) * 100 : null;
            const toATH = (getV('qqq_ath') > 0 && benchmarkPrice > 0) ? ((getV('qqq_ath') - benchmarkPrice) / benchmarkPrice) * 100 : null;

            return {
                totalCapital: total,
                performanceStats: { ytd, mtd, total: tot },
                rebalanceStatus: { 
                    tqqqRatio, qqqRatio, valCore, valQQQ, valTQQQ, valSat1, valSat2, valIbit,
                    isCoreImbalanced: Math.abs(tqqqRatio - coreTarget) > getV('rebalance_core_tolerance'), 
                    coreTarget, c1W: c1W.toFixed(1), c2W: c2W.toFixed(1), ibitW: ibitW.toFixed(1), 
                    stat1, stat2, statIbit, t1: inputs.custom_ticker_1, t2: inputs.custom_ticker_2,
                    valSat1, valSat2, valIbit, valTQQQ, valQQQ
                },
                bearDefense: bearData,
                qqqDistance: (sma200>0 && benchmarkPrice>0) ? ((benchmarkPrice - sma200)/sma200)*100 : null,
                currentLeverage: (total>0 ? ((valTQQQ*3) + valQQQ + satVal)/total : 0).toFixed(2),
                pieData: HOLDINGS_CONFIG.map(c => ({ name: c.type==='fixed'?c.ticker:inputs[c.tickerKey]||c.defaultTicker, value: (c.type==='fixed'?getP(c.ticker):getP(inputs[c.tickerKey])) * getV(c.qtyKey), color: c.hex })).concat({name:'現金', value: getV('cash_balance'), color:'#94a3b8'}).filter(x=>x.value>0).map((p,_,arr) => ({...p, percentage: ((p.value/arr.reduce((a,b)=>a+b.value,0))*100).toFixed(1)})),
                calcResults,
                rsiSuggestion: { ...sug, contracts: suggestContracts },
                qqqAthMetrics: { toMA200, toATH, ath: getV('qqq_ath'), currentPrice: benchmarkPrice, sma200 },
                graphData: gData,
                simulatedMetrics: { 
                    simPrice, 
                    simulatedPnL,
                    simulatedTotalAsset
                }
            };
        };

        const processHistoryData = (records, optionHistory) => {
            if (!records || records.length === 0) return [];
            const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
            const groups = {};
            sorted.forEach(rec => {
                const d = new Date(rec.date);
                const y = d.getFullYear();
                const m = d.getMonth() + 1;
                if (!groups[y]) groups[y] = { records: [], months: {} };
                groups[y].records.push(rec);
                if (!groups[y].months[m]) groups[y].months[m] = [];
                groups[y].months[m].push(rec);
            });
            return Object.keys(groups).sort((a,b) => b-a).map(year => { 
                const yData = groups[year];
                const yPnl = yData.records[yData.records.length - 1].total_equity - yData.records[0].total_equity;
                const yOptPnl = optionHistory.filter(t => new Date(t.date).getFullYear() === parseInt(year)).reduce((s, t) => s + (parseFloat(t.pnl)||0), 0);
                const months = Object.keys(yData.months).sort((a,b) => b-a).map(month => {
                    const mRecs = yData.months[month];
                    const mPnl = mRecs[mRecs.length - 1].total_equity - mRecs[0].total_equity;
                    const mOptPnl = optionHistory.filter(t => { const d=new Date(t.date); return d.getFullYear()===parseInt(year) && d.getMonth()+1===parseInt(month); }).reduce((s, t) => s + (parseFloat(t.pnl)||0), 0);
                    return { month, return: mRecs[0].total_equity > 0 ? (mPnl/mRecs[0].total_equity)*100 : 0, pnl: mPnl, optPnl: mOptPnl };
                });
                return { year, return: yData.records[0].total_equity>0?(yPnl/yData.records[0].total_equity)*100:0, pnl: yPnl, optPnl: yOptPnl, optCont: yPnl!==0?(yOptPnl/Math.abs(yPnl))*100:0, months };
            });
        };

        const generateSystemAlerts = (status, bear, total, prices, inputs) => {
            const a = [];
            const getP = (t) => prices[(t || "").toUpperCase()] || 0;
            const getNum = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
            const getQty = (val, price) => (price > 0 ? Math.abs(val / price) : 0);

            if (status.isCoreImbalanced) {
                const targetTQQQVal = status.valCore * (status.coreTarget / 100);
                const diffVal = targetTQQQVal - status.valTQQQ;
                a.push({ type: 'warning', title: '【TQQQ】 核心再平衡', msg: `目前 ${status.tqqqRatio.toFixed(1)}% (目標 ${status.coreTarget}%)。建議${diffVal>0?'買入':'賣出'} ${getQty(diffVal, getP('TQQQ')).toFixed(0)} 股 (約 $${Math.abs(diffVal).toFixed(0)})`});
            }

            const checkSma = (ticker, sma, label) => {
                const price = getP(ticker);
                const smaVal = getNum(sma);
                if (price > 0 && smaVal > 0 && price < smaVal) {
                    a.push({ type: 'danger', title: `【${ticker}】 跌破關鍵週線`, msg: `現價 $${price} 已跌破 ${label} ($${smaVal})，策略建議：出場觀望。` });
                }
            };
            if(inputs.custom_ticker_1 && inputs.custom_1_sma40) checkSma(inputs.custom_ticker_1, inputs.custom_1_sma40, '40 SMA');
            if(inputs.custom_ticker_2 && inputs.custom_2_sma20) checkSma(inputs.custom_ticker_2, inputs.custom_2_sma20, '20 SMA');
            if(inputs.ibit_sma20) checkSma('IBIT', inputs.ibit_sma20, '20 SMA');

            const checkSatAction = (stat, name, currentW, targetWKey, currentVal, ticker) => {
                if (stat !== 'ok') {
                    const targetVal = total * (getNum(inputs[targetWKey]) / 100);
                    const diffVal = targetVal - currentVal;
                    const action = diffVal > 0 ? '買入' : '賣出';
                    a.push({ type: stat==='high'?'opportunity':'warning', title: `【${name}】 ${stat==='high'?'高於上限':'低於下限'}`, msg: `目前 ${currentW}% (目標${inputs[targetWKey]}%)。建議${action} ${getQty(diffVal, getP(ticker)).toFixed(0)} 股 (約 $${Math.abs(diffVal).toFixed(0)})`});
                }
            };
            checkSatAction(status.stat1, status.t1||'自選1', status.c1W, 'target_sat_1', status.valSat1, status.t1);
            checkSatAction(status.stat2, status.t2||'自選2', status.c2W, 'target_sat_2', status.valSat2, status.t2);
            checkSatAction(status.statIbit, 'IBIT', status.ibitW, 'target_sat_ibit', status.valIbit, 'IBIT');

            if (bear.isActive) a.push({ type: 'danger', title: '【QQQ】 熊市防禦', msg: `QQQ < 200 SMA (3% 緩衝)，請轉入防禦資產。本月 DCA 建議投入：$${bear.monthlyBuy.toLocaleString(undefined,{maximumFractionDigits:0})} (總防禦/12)`});
            
            if (inputs.options_inventory) {
                inputs.options_inventory.forEach(o => {
                    const d = Math.abs(parseFloat(o.delta));
                    if (d >= 0.40) a.push({ type: 'danger', title: `【${o.ticker}】 棄守警示`, msg: `Delta ${o.delta} ≥ 0.40！觸發棄守點：接受被履約。` });
                    else if (d >= 0.25) a.push({ type: 'warning', title: `【${o.ticker}】 轉倉警示`, msg: `Delta ${o.delta} ≥ 0.25！觸發防禦：請準備轉倉。` });
                });
            }
            return a;
        };

        const TradeActionModal = ({ type, targetId, inputs, prices, onClose, onExecute }) => {
            const [local, setLocal] = useState({ ticker:'TQQQ', type:'SC', contracts:1, newPremium:0, exitPrice:0, newStrike:'', newExpiry:'', newDelta:'' });
            useEffect(() => { if(type==='ROLL' || type==='CLOSE') { const t = inputs.options_inventory.find(o=>o.id===targetId); if(t) setLocal(p=>({...p, ticker:t.ticker, contracts:t.contracts, newStrike:t.strike})); } }, [targetId]);
            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center">
                    <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl animate-in slide-in-from-bottom-full">
                        <h3 className="text-xl font-black mb-4 flex items-center gap-2"><Icon name={type==='OPEN'?'Plus':type==='ROLL'?'RefreshCcw':'CheckCircle'} className="text-indigo-500"/> {type==='OPEN'?'新建倉位':type==='ROLL'?'選擇權轉倉':'選擇權平倉'}</h3>
                        {type === 'OPEN' && (
                            <div className="space-y-3"><div className="grid grid-cols-2 gap-2"><div><label className="text-xs font-bold text-slate-500">標的</label><input value={local.ticker} onChange={e=>setLocal({...local,ticker:e.target.value.toUpperCase()})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-black"/></div><div><label className="text-xs font-bold text-slate-500">類型</label><select value={local.type} onChange={e=>setLocal({...local,type:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"><option value="SC">Sell Call</option><option value="SP">Sell Put</option></select></div></div>{local.type === 'SP' && <div className={`p-2 rounded-lg text-center text-xs font-bold ${prices['QQQ']>inputs.qqq_sma20?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}`}>{prices['QQQ']>inputs.qqq_sma20?'🔥 強勢盤：Delta -0.30':'🌊 震盪盤：Delta -0.20'}</div>}<div className="grid grid-cols-2 gap-2"><input type="number" placeholder="Strike" value={local.newStrike} onChange={e=>setLocal({...local,newStrike:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"/><input type="date" value={local.newExpiry} onChange={e=>setLocal({...local,newExpiry:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold text-xs"/></div><div className="grid grid-cols-2 gap-2"><input type="number" placeholder="張數" value={local.contracts} onChange={e=>setLocal({...local,contracts:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"/><input type="number" placeholder="權利金" value={local.newPremium} onChange={e=>setLocal({...local,newPremium:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"/></div><input type="number" placeholder="Delta" value={local.newDelta} onChange={e=>setLocal({...local,newDelta:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"/></div>
                        )}
                        {type === 'CLOSE' && <div><label className="text-xs font-bold text-slate-500">買回價格</label><input type="number" autoFocus value={local.exitPrice} onChange={e=>setLocal({...local,exitPrice:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-center font-black text-xl" /></div>}
                        {type === 'ROLL' && <div className="space-y-3"><div className="bg-slate-50 dark:bg-slate-800/50 p-2 rounded-lg mb-2"><label className="text-[10px] font-bold text-slate-400 uppercase">Step 1: 平倉舊合約</label><div className="flex justify-between items-center mt-1"><span className="text-xs font-bold">買回價格</span><input type="number" autoFocus value={local.exitPrice} onChange={e=>setLocal({...local,exitPrice:e.target.value})} className="w-24 bg-white dark:bg-slate-700 p-1 rounded text-center font-bold" /></div></div><div className="bg-slate-50 dark:bg-slate-800/50 p-2 rounded-lg"><label className="text-[10px] font-bold text-slate-400 uppercase">Step 2: 建立新合約</label><div className="grid grid-cols-2 gap-2 mt-1"><input type="number" placeholder="新權利金" value={local.newPremium} onChange={e=>setLocal({...local,newPremium:e.target.value})} className="bg-white dark:bg-slate-700 p-1 rounded text-center text-xs font-bold"/><input type="number" placeholder="新 Strike" value={local.newStrike} onChange={e=>setLocal({...local,newStrike:e.target.value})} className="bg-white dark:bg-slate-700 p-1 rounded text-center text-xs font-bold"/><input type="date" value={local.newExpiry} onChange={e=>setLocal({...local,newExpiry:e.target.value})} className="bg-white dark:bg-slate-700 p-1 rounded text-center text-xs font-bold"/><input type="number" placeholder="新 Delta" value={local.newDelta} onChange={e=>setLocal({...local,newDelta:e.target.value})} className="bg-white dark:bg-slate-700 p-1 rounded text-center text-xs font-bold"/></div></div></div>}
                        <div className="flex gap-2 mt-4"><button onClick={onClose} className="flex-1 bg-slate-200 dark:bg-slate-800 text-slate-500 py-3 rounded-xl font-bold">取消</button><button onClick={()=>onExecute(type, local)} className="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold">確認執行</button></div>
                    </div>
                </div>
            );
        };

        const EditInventoryModal = ({ item, onClose, onSave, onDelete }) => {
            const [l, setL] = useState({...item});
            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-2xl">
                        <div className="flex justify-between items-center mb-4"><h3 className="text-lg font-black flex gap-2"><Icon name="Edit2"/> 編輯持倉</h3><button onClick={onClose}><Icon name="X"/></button></div>
                        <div className="space-y-3">
                            <div className="grid grid-cols-2 gap-2"><input value={l.ticker} onChange={e=>setL({...l,ticker:e.target.value.toUpperCase()})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold"/><select value={l.type} onChange={e=>setL({...l,type:e.target.value})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold"><option value="SC">Sell Call</option><option value="SP">Sell Put</option></select></div>
                            <div className="grid grid-cols-2 gap-2"><input type="number" value={l.strike} onChange={e=>setL({...l,strike:e.target.value})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold"/><input type="date" value={l.expiry} onChange={e=>setL({...l,expiry:e.target.value})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold"/></div>
                            <div className="grid grid-cols-3 gap-2"><input type="number" value={l.contracts} onChange={e=>setL({...l,contracts:e.target.value})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold text-center"/><input type="number" value={l.premium} onChange={e=>setL({...l,premium:e.target.value})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold text-center"/><input type="number" value={l.delta} onChange={e=>setL({...l,delta:e.target.value})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold text-center"/></div>
                            <div className="flex gap-2 mt-4"><button onClick={()=>onDelete(l.id)} className="p-3 bg-red-100 text-red-500 rounded-xl"><Icon name="Trash2"/></button><button onClick={()=>onSave(l)} className="flex-1 bg-indigo-600 text-white rounded-xl font-bold">儲存</button></div>
                        </div>
                    </div>
                </div>
            );
        };

        const EditOptionHistoryModal = ({ trade, onClose, onSave, onDelete }) => {
            const [localTrade, setLocalTrade] = useState({...trade});
            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-2xl animate-in fade-in">
                        <div className="flex justify-between items-center mb-4"><h3 className="text-lg font-black flex gap-2"><Icon name="Edit2"/> 編輯交易</h3><button onClick={onClose}><Icon name="X"/></button></div>
                        <div className="space-y-3">
                            <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-500 block">日期</label><input type="date" value={localTrade.date?.split('T')[0]} onChange={e=>setLocalTrade({...localTrade, date: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold"/></div><div><label className="text-xs text-slate-500 block">標的</label><input value={localTrade.ticker} onChange={e=>setLocalTrade({...localTrade, ticker: e.target.value.toUpperCase()})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold"/></div></div>
                            <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-500 block">動作</label><select value={localTrade.type} onChange={e=>setLocalTrade({...localTrade, type: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold"><option value="OPEN">建倉</option><option value="CLOSE">平倉</option><option value="ROLL_CLOSE">轉倉(平)</option><option value="ROLL_OPEN">轉倉(開)</option><option value="MANUAL">補登</option></select></div><div><label className="text-xs text-slate-500 block">金額 ($)</label><input type="number" step="any" value={localTrade.pnl} onChange={e=>setLocalTrade({...localTrade, pnl: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold text-center" /></div></div>
                            <div className="text-[10px] text-center text-slate-400 mt-1">正數 (+) = 收入, 負數 (-) = 支出</div>
                            <div className="flex gap-2 mt-4"><button onClick={()=>onDelete(localTrade.id)} className="p-3 bg-red-100 text-red-500 rounded-xl"><Icon name="Trash2"/></button><button onClick={()=>onSave({...localTrade, pnl: parseFloat(localTrade.pnl) || 0})} className="flex-1 bg-indigo-600 text-white rounded-xl font-bold">儲存</button></div>
                        </div>
                    </div>
                </div>
            );
        };

        const EditRecordModal = ({ editingId, editForm, setEditingId, setEditForm, saveEdit }) => {
            if (!editingId || !editForm) return null;
            
            // Helper for cash toggle
            const toggleCashSign = () => {
                setEditForm(prev => {
                    const currentVal = parseFloat(prev.inputs.cash_balance);
                    if (!isNaN(currentVal)) {
                         return { ...prev, inputs: { ...prev.inputs, cash_balance: currentVal * -1 } };
                    }
                    return prev;
                });
            };

            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center">
                    <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
                        <div className="flex justify-between items-center mb-6 border-b pb-4 dark:border-slate-800"><h3 className="text-xl font-black flex items-center gap-2"><Icon name="Edit2" size={20} className="text-indigo-500" /> 編輯紀錄</h3><button onClick={() => setEditingId(null)} className="p-2 bg-slate-100 dark:bg-slate-800 rounded-full"><Icon name="X" size={20} /></button></div>
                        <div className="space-y-2">
                            {HOLDINGS_CONFIG.map(c => { const t=c.type==='fixed'?c.ticker:(editForm.inputs[c.tickerKey]||c.defaultTicker); return <div key={c.id} className="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-2 px-3 rounded-xl border border-slate-100 dark:border-slate-700"><span className={`font-bold text-xs ${c.color}`}>{t}</span><input type="number" value={editForm.inputs[c.qtyKey]} onChange={e => setEditForm(p => ({...p, inputs: {...p.inputs, [c.qtyKey]: e.target.value}}))} className="w-24 bg-white dark:bg-slate-900 border rounded-lg px-2 py-1 text-right font-mono font-bold" /></div>; })}
                            
                            <div className="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-2 px-3 rounded-xl">
                                <span className="font-bold text-xs text-slate-500">現金</span>
                                <div className="relative w-32">
                                    <input 
                                        type="text" 
                                        inputMode="decimal"
                                        value={editForm.inputs.cash_balance} 
                                        onChange={e => setEditForm(p => ({...p, inputs: {...p.inputs, cash_balance: e.target.value}}))} 
                                        className={`w-full bg-white dark:bg-slate-900 border rounded-lg px-2 py-1 text-right font-mono font-bold ${parseFloat(editForm.inputs.cash_balance) < 0 ? 'text-red-500' : ''}`} 
                                    />
                                    <button onClick={toggleCashSign} className="absolute left-1 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 font-bold bg-slate-200 dark:bg-slate-700 px-1 rounded active:scale-95">+/-</button>
                                </div>

                                                        <div className={`font-mono font-black flex items-center gap-2 ${g.return >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{g.return > 0 ? '+' : ''}{g.return.toFixed(2)}% <Icon name={expandedYears[g.year] ? "ChevronUp" : "ChevronDown"} size={16} className="text-slate-400"/></div>
                                                    </div>
                                                    {expandedYears[g.year] && <div className="border-t border-slate-100 dark:border-slate-700/50">{g.months.map(m => <div key={m.month} className="flex justify-between p-3 px-5 text-xs font-bold border-b border-slate-50 dark:border-slate-800/50 last:border-0 hover:bg-slate-50 dark:hover:bg-slate-800/30"><div className="flex flex-col"><span className="text-slate-500">{m.month} 月</span><span className="text-[9px] text-slate-400 font-normal">權利金: ${Math.round(m.optPnl).toLocaleString()}</span></div><div className="text-right"><div className={`font-mono ${m.return >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{m.return > 0 ? '+' : ''}{m.return.toFixed(2)}%</div><div className="text-[9px] text-slate-400 font-normal">${Math.round(m.pnl).toLocaleString()}</div></div></div>)}</div>}
                                                </div>
                                            ))}
                                        </div>
                                        <div className="space-y-4 pt-4 border-t border-slate-200 dark:border-slate-800"><div className="flex items-center gap-2 text-xs font-black text-slate-500 px-1 uppercase tracking-widest"><Icon name="History" size={14}/> 詳細紀錄</div>{(historyExpanded ? metrics.graphData.slice().reverse() : metrics.graphData.slice().reverse().slice(0, 5)).map(r => { const rec = records.find(x=>x.date===r.date); return (<Card key={r.date} className="border-none shadow-md p-5 flex justify-between items-center cursor-pointer hover:scale-[1.01]" onClick={()=>{setEditingId(rec.id);setEditForm(JSON.parse(JSON.stringify(rec)));}}><div><div className="text-[10px] text-slate-400 font-bold">{new Date(r.date).toLocaleDateString()}</div><div className="text-xl font-mono">${r.equity.toLocaleString()}</div></div><div className="flex gap-2"><button className="p-2 bg-blue-50 dark:bg-slate-800 text-blue-500 rounded-lg"><Icon name="Edit2" size={14}/></button><button onClick={(e)=>{e.stopPropagation();confirmDelete(rec.id)}} className="p-2 bg-red-50 dark:bg-slate-800 text-red-500 rounded-lg"><Icon name="Trash2" size={14}/></button></div></Card>);})}<button onClick={() => setHistoryExpanded(!historyExpanded)} className="w-full py-3 text-xs font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors">{historyExpanded ? "收起" : `顯示全部`}</button></div>
                                    </>
                                ) : (
                                    <div className="space-y-4">
                                        <Card className="bg-gradient-to-br from-amber-50 to-orange-50 dark:from-slate-800 dark:to-slate-900 border-2 border-amber-200 dark:border-slate-700"><div className="text-xs font-black text-amber-600 dark:text-amber-500 uppercase tracking-widest mb-1">歷史已實現總權利金</div><div className="text-3xl font-black font-mono text-slate-800 dark:text-slate-100">${totalRealizedPremium.toLocaleString()}</div></Card>
                                        <div className="flex justify-between items-center px-1 mb-2"><div className="flex items-center gap-2 text-xs font-black text-slate-500 uppercase tracking-widest"><Icon name="List" size={14}/> 交易明細</div></div>
                                        {/* OPTION HISTORY LOGIC */}
                                        {inputs.option_history && inputs.option_history.length > 0 ? (
                                            <>
                                                {(optionHistoryExpanded ? inputs.option_history : inputs.option_history.slice(0, 5)).map(t => (
                                                    <Card key={t.id} className="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50" onClick={()=>setEditingTrade(t)}>
                                                        <div>
                                                            <div className="text-[10px] text-slate-400 font-bold">{new Date(t.date).toLocaleDateString()}</div>
                                                            <div className="font-bold flex items-center gap-2">
                                                                <span className="text-indigo-600 dark:text-indigo-400">{t.ticker}</span>
                                                                <span className="text-[10px] bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded">{t.type}</span>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-4">
                                                            <div className={`text-lg font-mono font-black ${t.pnl >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                                                                {t.pnl > 0 ? '+' : ''}{t.pnl.toLocaleString(undefined,{maximumFractionDigits:0})}
                                                            </div>
                                                            <div className="flex gap-1">
                                                                <button onClick={(e)=>{e.stopPropagation();setEditingTrade(t)}} className="p-1.5 text-blue-400 hover:bg-blue-50 rounded"><Icon name="Edit2" size={14}/></button>
                                                                <button onClick={(e)=>{e.stopPropagation();handleTradeDelete(t.id)}} className="p-1.5 text-red-400 hover:bg-red-50 rounded"><Icon name="Trash2" size={14}/></button>
                                                            </div>
                                                        </div>
                                                    </Card>
                                                ))}
                                                {inputs.option_history.length > 5 && (
                                                    <button onClick={() => setOptionHistoryExpanded(!optionHistoryExpanded)} className="w-full py-3 text-xs font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors">
                                                        {optionHistoryExpanded ? "收起 (只看 5 筆)" : `顯示全部 (共 ${inputs.option_history.length} 筆)`}
                                                    </button>
                                                )}
                                            </>
                                        ) : (
                                            <div className="text-center text-slate-400 text-sm py-10">尚無紀錄</div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'sync_settings' && (
                            <div className="space-y-6 animate-in fade-in">
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-200 dark:border-slate-800 overflow-hidden"><button onClick={()=>setSettings(p=>({...p,account:!p.account}))} className="w-full p-4 flex justify-between bg-slate-50 dark:bg-slate-800/50"><div className="flex items-center gap-3 font-black"><Icon name="Fingerprint" className="text-indigo-500"/> 帳號同步</div><Icon name={openSettings.account?"ChevronUp":"ChevronDown"} size={14}/></button>{openSettings.account && <div className="p-6 pt-2 space-y-4"><div className="text-center font-mono text-lg">{effectiveUserId}</div><div className="flex gap-2"><input value={tempSyncId} onChange={e=>setTempSyncId(e.target.value)} className="flex-1 bg-slate-100 p-3 rounded-xl" placeholder="ID" /><button onClick={()=>{setCustomSyncId(tempSyncId);localStorage.setItem('qqq_sync_id',tempSyncId);showToast("已切換")}} className="bg-indigo-600 text-white px-4 rounded-xl">OK</button></div><div className="flex gap-2"><button onClick={()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({records,inputs})],{type:"application/json"}));a.download=`Backup.json`;a.click();}} className="flex-1 bg-slate-200 p-3 rounded-xl flex justify-center gap-2"><Icon name="Download"/> 備份</button><label className="flex-1 bg-slate-200 p-3 rounded-xl flex justify-center gap-2"><Icon name="Upload"/> 匯入<input type="file" className="hidden" onChange={(e)=>{const r=new FileReader();r.onload=(ev)=>{const d=JSON.parse(ev.target.result);if(d.inputs)setInputs(p=>({...p,...d.inputs}));if(d.records)setRecords(d.records);alert("匯入成功");};if(e.target.files[0])r.readAsText(e.target.files[0]);}}/></label></div></div>}</div>
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-200 dark:border-slate-800 overflow-hidden">
                                    <button onClick={()=>setSettings(p=>({...p,system:!p.system}))} className="w-full p-4 flex justify-between bg-slate-50 dark:bg-slate-800/50"><div className="flex items-center gap-3 font-black"><Icon name="Settings" className="text-emerald-500"/> 系統與工具</div><Icon name={openSettings.system?"ChevronUp":"ChevronDown"} size={14}/></button>
                                    {openSettings.system && <div className="p-6 pt-2 space-y-4">
                                        <div className="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl"><div className="text-xs font-black text-slate-500 mb-3 uppercase tracking-widest flex items-center gap-2"><Icon name="Scale" size={14}/> 再平衡規則設定</div><div className="space-y-4">
                                            <div className="grid grid-cols-12 gap-2 items-end"><div className="col-span-12 text-[10px] text-indigo-500 font-bold mb-1">核心部位 (TQQQ)</div><div className="col-span-6"><label className="text-[9px] block text-center mb-1">目標 %</label><input type="number" value={inputs.rebalance_core_target} onChange={e=>handleInputChange('rebalance_core_target',e.target.value)} onBlur={e=>syncToCloud('rebalance_core_target',e.target.value)} className="bg-white dark:bg-slate-700 p-2 rounded-lg text-center font-bold w-full"/></div><div className="col-span-6"><label className="text-[9px] block text-center mb-1">寬容度 (±%)</label><input type="number" value={inputs.rebalance_core_tolerance} onChange={e=>handleInputChange('rebalance_core_tolerance',e.target.value)} onBlur={e=>syncToCloud('rebalance_core_tolerance',e.target.value)} className="bg-white dark:bg-slate-700 p-2 rounded-lg text-center font-bold w-full"/></div></div>
                                            <div className="border-t border-slate-200 dark:border-slate-700 my-2"></div>
                                            <div className="grid grid-cols-12 gap-2 text-center"><div className="col-span-3"></div><div className="col-span-3 text-[9px]">目標%</div><div className="col-span-3 text-[9px] text-red-500">上限(+%)</div><div className="col-span-3 text-[9px] text-blue-500">下限(-%)</div>
                                                <SatSettingsRow label="自選1" tickerKey="custom_ticker_1" targetKey="target_sat_1" upKey="tol_up_sat_1" downKey="tol_down_sat_1" inputs={inputs} onChange={handleInputChange} onBlur={syncToCloud} />
                                                <SatSettingsRow label="自選2" tickerKey="custom_ticker_2" targetKey="target_sat_2" upKey="tol_up_sat_2" downKey="tol_down_sat_2" inputs={inputs} onChange={handleInputChange} onBlur={syncToCloud} />
                                                <SatSettingsRow label="IBIT" targetKey="target_sat_ibit" upKey="tol_up_ibit" downKey="tol_down_ibit" inputs={inputs} onChange={handleInputChange} onBlur={syncToCloud} />
                                            </div></div>
                                        </div>
                                        <div className="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl mt-4"><div className="flex justify-between items-center mb-3"><div className="text-xs font-black text-slate-500 uppercase tracking-widest flex items-center gap-2"><Icon name="Activity" size={14}/> RSI 收益矩陣設定</div><button onClick={()=>setSettings(p=>({...p,rsi_matrix:!p.rsi_matrix}))}><Icon name={openSettings.rsi_matrix?"ChevronUp":"ChevronDown"} size={14} className="text-slate-400"/></button></div>
                                            {openSettings.rsi_matrix && <div className="space-y-2"><div className="grid grid-cols-12 gap-1 text-[9px] text-center text-slate-400 mb-1"><div className="col-span-3">Min</div><div className="col-span-3">Max</div><div className="col-span-3">Cover%</div><div className="col-span-3">Delta</div></div>{inputs.options_matrix && inputs.options_matrix.map((row, i) => (<div key={i} className="grid grid-cols-12 gap-1 mb-1"><div className="col-span-3"><input type="number" value={row.min} onChange={e=>handleMatrixChange(i,'min',e.target.value)} className="bg-white dark:bg-slate-700 w-full p-1 rounded text-center text-xs"/></div><div className="col-span-3"><input type="number" value={row.max} onChange={e=>handleMatrixChange(i,'max',e.target.value)} className="bg-white dark:bg-slate-700 w-full p-1 rounded text-center text-xs"/></div><div className="col-span-3"><input type="number" value={row.cover} onChange={e=>handleMatrixChange(i,'cover',e.target.value)} className="bg-white dark:bg-slate-700 w-full p-1 rounded text-center text-xs"/></div><div className="col-span-3"><input type="text" value={row.delta} onChange={e=>handleMatrixChange(i,'delta',e.target.value)} className="bg-white dark:bg-slate-700 w-full p-1 rounded text-center text-xs"/></div></div>))}</div>}
                                        </div>
                                        <div className="flex gap-3"><button onClick={()=>setDarkMode(!darkMode)} className="flex-1 p-3 bg-slate-100 rounded-xl flex justify-center gap-2"><Icon name={darkMode?"Sun":"Moon"}/> {darkMode?"亮色":"深色"}</button><button onClick={()=>setIsCalcOpen(!isCalcOpen)} className="flex-1 p-3 bg-slate-100 rounded-xl flex justify-center gap-2"><Icon name="Calculator"/> 計算機</button></div>
                                        {isCalcOpen && <div className="bg-indigo-50 dark:bg-slate-900 border border-indigo-100 dark:border-slate-700 p-4 rounded-xl space-y-3 shadow-inner">
                                            <div className="text-xs font-black text-indigo-500 uppercase tracking-widest mb-1 flex items-center gap-1"><Icon name="Calculator" size={14}/> 智慧資金分配 (Rebalance)</div>
                                            <div className="flex items-center gap-2"><span className="text-xl font-bold text-slate-400">$</span><input type="number" placeholder="輸入新投入金額" value={simulatedTotal} onChange={e=>setSimulatedTotal(e.target.value)} className="bg-white dark:bg-slate-800 p-3 rounded-xl text-xl w-full font-black shadow-sm" /></div>
                                            {simulatedTotal > 0 && <div className="space-y-1.5 pt-2">
                                                {metrics.calcResults.map(r => (
                                                    <div key={r.ticker} className="flex justify-between items-center bg-white dark:bg-slate-800 p-2 px-3 rounded-lg border border-slate-100 dark:border-slate-700">
                                                        <div className="flex flex-col"><span className="font-bold text-xs text-slate-600 dark:text-slate-300">{r.ticker}</span><span className={`text-[9px] font-bold ${r.action==='Buy'?'text-emerald-500':'text-red-400'}`}>{r.action === 'Buy' ? '買入' : '賣出'} {Math.abs(r.qty).toFixed(2)} 股</span></div>
                                                        <span className={`font-mono font-black text-sm ${r.action==='Buy'?'text-emerald-500':'text-red-400'}`}>${Math.abs(r.diff).toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                                                    </div>
                                                ))}
                                            </div>}
                                        </div>}
                                    </div>}
                                </div>
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-200 dark:border-slate-800 overflow-hidden">
                                    <button onClick={()=>setSettings(p=>({...p,strategy:!p.strategy}))} className="w-full p-3 flex justify-between bg-slate-50 dark:bg-slate-800/50"><div className="flex items-center gap-3 font-black"><Icon name="BookOpen" className="text-amber-500"/> 策略手冊</div><Icon name={openSettings.strategy?"ChevronUp":"ChevronDown"} size={14}/></button>
                                    {openSettings.strategy && <div className="p-5 pt-0"><button onClick={()=>setIsStrategyEditing(!isStrategyEditing)} className="mb-2 text-[10px] bg-slate-100 px-2 py-0.5 rounded ml-auto block">{isStrategyEditing?"鎖定":"編輯"}</button>{['core','custom','ibit','options'].map(k=><div key={k} className="mb-2"><input value={inputs[`title_${k}`]} readOnly={!isStrategyEditing} onChange={e=>handleInputChange(`title_${k}`,e.target.value)} className="text-indigo-600 font-bold mb-1 w-full text-left" /><textarea value={inputs[`strat_${k}`]} readOnly={!isStrategyEditing} onChange={e=>handleInputChange(`strat_${k}`,e.target.value)} className="strategy-textarea w-full text-xs p-2" /></div>)}</div>}
                                </div>
                            </div>
                        )}
                        {view === 'loan' && (
                            <div className="space-y-6 animate-in fade-in">
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] p-6 border border-slate-200 dark:border-slate-700 shadow-lg">
                                    <div className="flex justify-between items-center mb-4">
                                        <div className="text-xs font-black uppercase text-slate-500 flex items-center gap-2"><Icon name="Activity" size={16} /> LTV 貸款價值比</div>
                                        <div className={`text-2xl font-black font-mono ${ltv > 50 ? 'text-red-500' : (ltv > 30 ? 'text-amber-500' : 'text-emerald-500')}`}>{ltv.toFixed(1)}%</div>
                                    </div>
                                    <div className="h-6 w-full bg-slate-100 dark:bg-slate-800 rounded-full relative overflow-hidden mb-2">
                                        {/* Color Zones */}
                                        <div className="absolute top-0 bottom-0 left-0 bg-emerald-400/30" style={{width: '30%'}}></div>
                                        <div className="absolute top-0 bottom-0 left-[30%] bg-amber-400/30" style={{width: '20%'}}></div>
                                        <div className="absolute top-0 bottom-0 left-[50%] bg-red-400/30" style={{width: '50%'}}></div>
                                        {/* Current Indicator */}
                                        <div className="absolute top-0 bottom-0 w-1 bg-slate-800 dark:bg-white transition-all duration-500 z-10" style={{left: `${Math.min(ltv, 100)}%`}}></div>
                                    </div>
                                    <div className="flex justify-between text-[10px] text-slate-400 font-bold">
                                        <span className="text-emerald-500">0% 安全</span>
                                        <span className="text-amber-500">30% 警戒</span>
                                        <span className="text-red-500">50% 危險</span>
                                    </div>
                                </div>
                                <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl text-xs text-slate-500 leading-relaxed border border-slate-200 dark:border-slate-700">
                                    <p className="mb-2"><span className="font-bold text-indigo-500">LTV = 總貸款金額 ÷ 總資產市值</span></p>
                                    <ul className="list-disc pl-4 space-y-1 opacity-80">
                                        <li><span className="text-emerald-500 font-bold">小於 30% (安全區)</span>：資產安全，可承受較大跌幅。</li>
                                        <li><span className="text-amber-500 font-bold">30% ~ 50% (警戒區)</span>：需密切關注，若股市大跌可能需補錢。</li>
                                        <li><span className="text-red-500 font-bold">大於 50% (危險區)</span>：極高風險，隨時可能面臨斷頭清算 (Margin Call)，建議立即還款或賣出資產。</li>
                                    </ul>
                                </div>
                                <Card className="border-2 border-amber-100 dark:border-amber-900/30">
                                    <div className="grid gap-4">
                                        {[{l:"貸款總額",k:"loan_amount"},{l:"還款目標%",k:"loan_repay_target"},{l:"基準市值(可選)",k:"loan_entry_valuation"}].map(f => (
                                            <div key={f.k} className="space-y-1">
                                                <label className="text-[10px] uppercase text-amber-600">{f.l}</label>
                                                <input type="number" value={inputs[f.k]} onChange={e=>handleInputChange(f.k,e.target.value)} onBlur={e=>syncToCloud(f.k,e.target.value)} className="bg-amber-50 dark:bg-slate-800 rounded-xl p-3 text-center text-lg w-full font-bold" />
                                            </div>
                                        ))}
                                    </div>
                                    <div className={`mt-4 p-4 rounded-xl text-center text-white ${metrics.totalCapital >= (inputs.loan_entry_valuation*(1+inputs.loan_repay_target/100)) ? 'bg-emerald-500 animate-pulse' : 'bg-amber-900'}`}>
                                        <div className="text-xs opacity-60 uppercase">自動還款門檻市值</div>
                                        <div className="text-xl font-mono">${(inputs.loan_entry_valuation*(1+inputs.loan_repay_target/100)).toLocaleString(undefined,{maximumFractionDigits:0})}</div>
                                    </div>
                                </Card>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 inset-x-0 bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 z-50 py-4 pb-10 flex justify-around shadow-2xl">
                        {[{id:'dashboard',icon:'LayoutDashboard',l:'儀表板'},{id:'history',icon:'History',l:'績效'},{id:'loan',icon:'Landmark',l:'貸款'}].map(t => <button key={t.id} onClick={()=>{setView(t.id);}} className={`flex flex-col items-center gap-1 flex-1 transition-all active:scale-90 ${view===t.id?'text-indigo-600 border-t-2 border-indigo-600 -mt-4 pt-2':'text-slate-400'}`}><Icon name={t.icon} size={24}/><span className="text-[10px] uppercase font-black">{t.l}</span></button>)}
                    </nav>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
