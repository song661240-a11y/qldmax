            Sun: <circle cx="12" cy="12" r="5" />,
            Moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>,
            Scale: <g><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></g>,
            Download: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></g>,
            Upload: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></g>,
            DollarSign: <g><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></g>,
            ArrowRight: <g><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></g>,
            Calendar: <><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></>
        };

        // --- HELPER FUNCTIONS (LOGIC EXTRACTION) ---
        const getNum = (val) => val === '' ? 0 : (isNaN(val) ? 0 : parseFloat(val));

        const calculateTotalCapital = (prices, inputs) => {
            const p = prices; 
            const tCore = (inputs.ticker_core_1 || "QQQ").toUpperCase();
            const t1 = (inputs.custom_ticker_1 || "").toUpperCase(); 
            const t2 = (inputs.custom_ticker_2 || "").toUpperCase();
            return ( (p[tCore] || 0) * (getNum(inputs.qty_qqq)) ) + 
                   ( (p.TQQQ || 0) * (getNum(inputs.qty_tqqq)) ) + 
                   ( (p.IBIT || 0) * (getNum(inputs.qty_ibit)) ) + 
                   ( (p.SGOV || 0) * (getNum(inputs.qty_sgov)) ) + 
                   ( (p[t1] || 0) * (getNum(inputs.qty_custom_1)) ) + 
                   ( (p[t2] || 0) * (getNum(inputs.qty_custom_2)) ) + 
                   ( getNum(inputs.cash_balance) );
        };

        const calculateTotalCost = (inputs) => {
            return (getNum(inputs.qty_qqq) * getNum(inputs.avg_cost_qqq)) + 
                   (getNum(inputs.qty_tqqq) * getNum(inputs.avg_cost_tqqq)) + 
                   (getNum(inputs.qty_ibit) * getNum(inputs.avg_cost_ibit)) + 
                   (getNum(inputs.qty_sgov) * getNum(inputs.avg_cost_sgov)) + 
                   (getNum(inputs.qty_custom_1) * getNum(inputs.avg_cost_custom_1)) + 
                   (getNum(inputs.qty_custom_2) * getNum(inputs.avg_cost_custom_2)) + 
                   getNum(inputs.cash_balance);
        };

        const calculateRebalanceStatus = (prices, inputs, totalCapital) => {
            const p = prices; const i = inputs; 
            const tCore = (i.ticker_core_1 || "QQQ").toUpperCase();
            const t1 = (i.custom_ticker_1 || "").toUpperCase();
            const t2 = (i.custom_ticker_2 || "").toUpperCase();
            
            const valQQQ = (p[tCore] || 0) * getNum(i.qty_qqq);
            const valTQQQ = (p.TQQQ || 0) * getNum(i.qty_tqqq);
            const valCustom1 = (p[t1] || 0) * getNum(i.qty_custom_1);
            const valCustom2 = (p[t2] || 0) * getNum(i.qty_custom_2);
            const valIBIT = (p.IBIT || 0) * getNum(i.qty_ibit);
            
            const coreTotal = valQQQ + valTQQQ;
            const total = totalCapital || 1; 

            const tqqqRatio = coreTotal > 0 ? (valTQQQ / coreTotal) * 100 : 0;
            const custom1Weight = (valCustom1 / total) * 100;
            const custom2Weight = (valCustom2 / total) * 100;
            const ibitWeight = (valIBIT / total) * 100;

            const coreTargetHalf = coreTotal / 2;
            const tqqqDiffVal = coreTargetHalf - valTQQQ;
            const qqqDiffVal = coreTargetHalf - valQQQ;
            const targetCustom1Val = total * (getNum(i.alloc_custom_1) / 100);
            const sellCustom1Val = valCustom1 - targetCustom1Val;
            const targetCustom2Val = total * (getNum(i.alloc_custom_2) / 100);
            const sellCustom2Val = valCustom2 - targetCustom2Val;
            const targetIbitVal = total * (getNum(i.alloc_sat) / 100);
            const sellIbitVal = valIBIT - targetIbitVal;

            return { tqqqRatio, isCoreImbalanced: tqqqRatio > 65 || tqqqRatio < 35, tqqqDiffVal, qqqDiffVal, custom1Weight: custom1Weight.toFixed(1), isCustom1Overweight: custom1Weight > 15, sellCustom1Val, custom2Weight: custom2Weight.toFixed(1), isCustom2Overweight: custom2Weight > 15, sellCustom2Val, ibitWeight: ibitWeight.toFixed(1), isIbitOverweight: ibitWeight > 15, sellIbitVal, t1, t2, tCore };
        };

        const generateStrategyAlerts = (prices, inputs, rebalanceStatus) => {
            const alerts = []; const p = prices; const i = inputs; 
            const { tCore, t1, t2, tqqqRatio, isCoreImbalanced, isCustom1Overweight, isCustom2Overweight, isIbitOverweight, custom1Weight, custom2Weight, ibitWeight, tqqqDiffVal, qqqDiffVal, sellCustom1Val, sellCustom2Val, sellIbitVal } = rebalanceStatus;
            
            const ema125 = getNum(i.qqq_ema125); 
            const customEma1 = getNum(i.custom_1_ema50);
            const customEma2 = getNum(i.custom_2_ema50);
            const ibitEma = getNum(i.ibit_ema50);

            if (ema125 > 0) {
                const sellTrigger = ema125 * 0.97;
                const buyTrigger = ema125 * 1.05;
                const priceCheck = p.QQQ || p[tCore]; 
                if (priceCheck < sellTrigger) {
                    alerts.push({ type: 'danger', title: '🛑 熊市訊號 (Risk-Off)', msg: `動作：清倉所有資產 ➔ 全數轉入 SGOV。\n原因：${tCore}/QQQ 跌破 125 EMA (日) 下方 3% ($${sellTrigger.toFixed(2)})。` });
                } else if (priceCheck > buyTrigger) {
                    alerts.push({ type: 'opportunity', title: '🚀 牛市訊號 (Risk-On)', msg: `動作：賣出 SGOV ➔ 建倉進攻部位 (40% TQQQ, 40% QQQ, 20% 衛星)。\n原因：${tCore}/QQQ 突破 125 EMA (日) 上方 5% ($${buyTrigger.toFixed(2)})。` });
                }
            }

            if (isCoreImbalanced) {
                let msg = "";
                if (tqqqRatio > 65) {
                    const sellAmt = Math.abs(tqqqDiffVal);
                    const shares = p.TQQQ > 0 ? Math.floor(sellAmt / p.TQQQ) : 0;
                    msg = `動作：賣出 TQQQ $${sellAmt.toFixed(0)} (約 ${shares} 股)，買入 QQQ。`;
                } else {
                    const sellAmt = Math.abs(qqqDiffVal);
                    const shares = (p.QQQ || p[tCore]) > 0 ? Math.floor(sellAmt / (p.QQQ || p[tCore])) : 0;
                    msg = `動作：賣出 QQQ $${sellAmt.toFixed(0)} (約 ${shares} 股)，買入 TQQQ。`;
                }
                alerts.push({ type: 'warning', title: '⚖️ 核心再平衡觸發', msg: `${msg}\n原因：TQQQ 佔比 ${tqqqRatio.toFixed(1)}% 已偏離安全區間 (35%-65%)。` });
            }
            
            if (isCustom1Overweight) {
                const shares = (p[t1] || 0) > 0 ? Math.floor(sellCustom1Val / p[t1]) : 0;
                alerts.push({ type: 'opportunity', title: `💰 ${t1} 獲利收割`, msg: `動作：賣出 ${t1} $${sellCustom1Val.toFixed(0)} (約 ${shares} 股)，獲利轉入核心。\n原因：${t1} 權重 ${custom1Weight}% 已超過 15% 上限。` });
            }
            if (isCustom2Overweight) {
                const shares = (p[t2] || 0) > 0 ? Math.floor(sellCustom2Val / p[t2]) : 0;
                alerts.push({ type: 'opportunity', title: `💰 ${t2} 獲利收割`, msg: `動作：賣出 ${t2} $${sellCustom2Val.toFixed(0)} (約 ${shares} 股)，獲利轉入核心。\n原因：${t2} 權重 ${custom2Weight}% 已超過 15% 上限。` });
            }
            if (isIbitOverweight) {
                const shares = p.IBIT > 0 ? Math.floor(sellIbitVal / p.IBIT) : 0;
                alerts.push({ type: 'opportunity', title: `💰 IBIT 獲利收割`, msg: `動作：賣出 IBIT $${sellIbitVal.toFixed(0)} (約 ${shares} 股)，獲利轉入核心。\n原因：IBIT 權重 ${ibitWeight}% 已超過 15% 上限。` });
            }

            if (ema125 > 0 && (p.QQQ || 0) >= ema125 * 0.97) {
                if (customEma1 > 0 && (p[t1] || 0) < customEma1 * 0.97) alerts.push({ type: 'risk', title: `⚠️ 止損警示：${t1}`, msg: `動作：賣出 ${t1} ➔ 資金轉入 QQQ。\n原因：跌破 50 EMA (週) 下方 3% ($${(customEma1*0.97).toFixed(2)})。` });
                if (customEma2 > 0 && (p[t2] || 0) < customEma2 * 0.97) alerts.push({ type: 'risk', title: `⚠️ 止損警示：${t2}`, msg: `動作：賣出 ${t2} ➔ 資金轉入 QQQ。\n原因：跌破 50 EMA (週) 下方 3% ($${(customEma2*0.97).toFixed(2)})。` });
                if (ibitEma > 0 && p.IBIT < ibitEma * 0.97) alerts.push({ type: 'risk', title: `⚠️ 止損警示：IBIT`, msg: `動作：賣出 IBIT ➔ 資金轉入 QQQ。\n原因：跌破 50 EMA (週) 下方 3% ($${(ibitEma*0.97).toFixed(2)})。` });
            }
            return alerts;
        };

        const calculatePeriodicStats = (records) => {
            if (records.length < 2) return { years: [], months: [] };
            const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
            const yearsMap = {}; const monthsMap = {};
            sorted.forEach(r => {
                const d = new Date(r.date); const y = d.getFullYear(); const m = `${y}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                if (!yearsMap[y]) yearsMap[y] = { first: r, last: r }; else yearsMap[y].last = r;
                if (!monthsMap[m]) monthsMap[m] = { first: r, last: r }; else monthsMap[m].last = r;
            });
            const calc = (map) => Object.entries(map).map(([key, val]) => {
                const start = val.first.total_equity || 0; const end = val.last.total_equity || 0; const diff = end - start; const pct = start > 0 ? (diff / start) * 100 : 0;
                return { label: key, start, end, diff, pct };
            }).sort((a, b) => b.label.localeCompare(a.label));
            return { years: calc(yearsMap), months: calc(monthsMap) };
        };

        const calculateMDD = (records) => {
            if (records.length < 2) return { mdd: 0, peak: 0, dropDate: '' };
            const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
            let peak = 0; let maxDrawdown = 0; let mddDate = '';
            sorted.forEach(r => {
                if (r.total_equity > peak) peak = r.total_equity;
                const drawdown = peak > 0 ? (peak - r.total_equity) / peak : 0;
                if (drawdown > maxDrawdown) { maxDrawdown = drawdown; mddDate = r.date; }
            });
            return { mdd: (maxDrawdown * 100).toFixed(2), peak, dropDate: mddDate };
        };

        // --- COMMON COMPONENTS ---
        const Icon = ({ name, size = 20, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>{ICON_MAP[name] || <circle cx="12" cy="12" r="10" />}</svg>;
        const Card = ({ children, className = "" }) => <div className={`rounded-[2rem] shadow-xl border p-5 transition-all bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 ${className}`}>{children}</div>;
        const SectionTitle = ({ title, iconName }) => <h2 className="text-[11px] font-black mb-3 flex items-center gap-2 uppercase tracking-widest text-slate-500 dark:text-slate-400 font-black font-black"><Icon name={iconName} size={14} /> {title}</h2>;
        
        const CollapsibleSection = ({ title, iconName, children, defaultOpen = false }) => {
            const [isOpen, setIsOpen] = useState(defaultOpen);
            return (
                <div className="border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden bg-white dark:bg-slate-900 shadow-sm">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800/50">
                        <div className="flex items-center gap-2 text-sm font-black text-slate-700 dark:text-slate-200"><Icon name={iconName} size={18} /> {title}</div>
                        <Icon name="ChevronDown" className={`transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`} size={16} />
                    </button>
                    <div className={`accordion-content ${isOpen ? 'open' : ''}`}><div className="p-4 border-t border-slate-100 dark:border-slate-700">{children}</div></div>
                </div>
            );
        };

        // --- SUB-COMPONENTS (VIEWS) ---
        
        const DashboardView = ({ inputs, setInputs, prices, totalCapital, totalPL, totalROI, syncToCloud, saveRecord, isSaving, handleInputChange }) => {
            const [isAlertsView, setIsAlertsView] = useState(true);
            const rebalanceStatus = useMemo(() => calculateRebalanceStatus(prices, inputs, totalCapital), [prices, inputs, totalCapital]);
            const strategyAlerts = useMemo(() => generateStrategyAlerts(prices, inputs, rebalanceStatus), [prices, inputs, rebalanceStatus]);
            
            const pieData = useMemo(() => {
                const p = prices; const { tCore, t1, t2 } = rebalanceStatus;
                const d = [ 
                    { name: tCore, value: (p[tCore]||0)*getNum(inputs.qty_qqq), color: '#4f46e5' },
                    { name: 'TQQQ', value: (p.TQQQ||0)*getNum(inputs.qty_tqqq), color: '#c084fc' },
                    { name: 'SGOV', value: (p.SGOV||0)*getNum(inputs.qty_sgov), color: '#64748b' },
                    { name: 'IBIT', value: (p.IBIT||0)*getNum(inputs.qty_ibit), color: '#f59e0b' },
                    { name: t1, value: (p[t1]||0)*getNum(inputs.qty_custom_1), color: '#10b981' },
                    { name: t2, value: (p[t2]||0)*getNum(inputs.qty_custom_2), color: '#06b6d4' },
                    { name: '現金', value: getNum(inputs.cash_balance), color: '#94a3b8' } 
                ];
                const filtered = d.filter(x => x.value > 0); const sum = filtered.reduce((a, b) => a + b.value, 0);
                return filtered.map(x => ({ ...x, percentage: sum > 0 ? ((x.value / sum) * 100).toFixed(1) : 0 }));
            }, [prices, inputs, rebalanceStatus]);

            const currentLeverage = useMemo(() => {
                if (totalCapital <= 0) return 0;
                const p = prices; const { tCore, t1, t2 } = rebalanceStatus;
                const exposure = ((p.TQQQ||0)*getNum(inputs.qty_tqqq)*3) + ((p[tCore]||0)*getNum(inputs.qty_qqq)) + ((p.IBIT||0)*getNum(inputs.qty_ibit)) + ((p[t1]||0)*getNum(inputs.qty_custom_1)) + ((p[t2]||0)*getNum(inputs.qty_custom_2));
                return (exposure / totalCapital).toFixed(2);
            }, [totalCapital, prices, inputs, rebalanceStatus]);

            const copyToMemo = (msg) => { const newMemo = (inputs.record_memo || '') + '\n' + `[${new Date().toLocaleDateString()}] ${msg}`; setInputs(prev => ({ ...prev, record_memo: newMemo })); };

            return (
                <div className="space-y-6 animate-in fade-in font-black">
                     <Card className="p-4 bg-gradient-to-r from-slate-800 to-indigo-900 text-white shadow-lg border-none relative overflow-hidden transition-all duration-300">
                        <div className="flex justify-between items-start mb-2">
                            <div className="flex items-center gap-2 opacity-80"><Icon name={isAlertsView ? "ShieldAlert" : "Quote"} size={16} /><span className="text-[10px] uppercase tracking-widest font-bold">{isAlertsView ? "策略警示 (Alerts)" : "投資座右銘 (Motto)"}</span></div>
                            <button onClick={() => setIsAlertsView(!isAlertsView)} className={`p-1.5 rounded-full bg-white/20 hover:bg-white/30 transition-all ${strategyAlerts.length > 0 ? 'alert-btn-pulse bg-red-500/80 hover:bg-red-500' : ''}`}><Icon name="AlertCircle" size={18} className="text-white" /></button>
                        </div>
                        {isAlertsView ? (
                            <div className="space-y-2 min-h-[60px] animate-in fade-in slide-in-from-right-4">
                                {strategyAlerts.length > 0 ? (strategyAlerts.map((alert, idx) => (<div key={idx} className="bg-white/10 p-2 rounded-lg border border-white/20 backdrop-blur-sm"><div className="font-bold text-sm mb-1 flex items-center gap-1">{alert.type === 'danger' && '🔴'}{alert.type === 'risk' && '🟠'}{alert.type === 'opportunity' && '🔵'}{alert.type === 'warning' && '🟡'}{alert.title}</div><div className="text-xs opacity-90 leading-snug mb-2 whitespace-pre-line">{alert.msg}</div><button onClick={() => copyToMemo(alert.msg)} className="flex items-center gap-1 bg-white/20 hover:bg-white/30 px-2 py-0.5 rounded text-[9px] transition-colors ml-auto w-fit"><Icon name="Save" size={10} /> 存入備註</button></div>))) : (<div className="flex flex-col items-center justify-center h-full py-4 opacity-70"><Icon name="CheckCircle" size={32} className="mb-1" /><span className="text-xs">目前無觸發警示，策略運行正常。</span></div>)}
                            </div>
                        ) : (
                            <textarea value={inputs.motto} onChange={e => handleInputChange('motto', e.target.value)} onBlur={e => syncToCloud('motto', e.target.value)} className="w-full bg-transparent text-lg font-black text-center placeholder-white/50 outline-none resize-none animate-in fade-in slide-in-from-left-4" rows="2" placeholder="在此輸入您的投資心法..." />
                        )}
                    </Card>

                    <div className="bg-white dark:bg-slate-900 rounded-3xl p-4 border-2 border-slate-200 dark:border-slate-700 shadow-lg">
                        <div className="flex items-center gap-2 mb-3 text-xs font-black text-slate-400 uppercase tracking-widest"><Icon name="Scale" size={14} /> 再平衡健康度檢測</div>
                        <div className="space-y-3">
                            <div className="space-y-1">
                                <div className="flex justify-between items-center text-sm font-bold"><span className="text-slate-600 dark:text-slate-300">核心 TQQQ 佔比 (目標 50%)</span><span className={rebalanceStatus.isCoreImbalanced ? 'text-red-500 animate-pulse' : 'text-emerald-500'}>{rebalanceStatus.tqqqRatio.toFixed(1)}% {rebalanceStatus.isCoreImbalanced && '⚠️'}</span></div>
                                <div className="h-2.5 w-full bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden"><div className={`h-full ${rebalanceStatus.isCoreImbalanced ? 'bg-red-500' : 'bg-indigo-500'}`} style={{ width: `${Math.min(rebalanceStatus.tqqqRatio, 100)}%` }}></div></div>
                                <div className="flex justify-between text-[10px] text-slate-400 font-mono"><span>35% (買進)</span><span>65% (賣出)</span></div>
                            </div>
                            <div className="pt-3 border-t dark:border-slate-800 grid grid-cols-2 gap-4">
                                {[{l: `${rebalanceStatus.t1} 權重`, v: rebalanceStatus.custom1Weight, w: rebalanceStatus.isCustom1Overweight}, {l: `${rebalanceStatus.t2} 權重`, v: rebalanceStatus.custom2Weight, w: rebalanceStatus.isCustom2Overweight}, {l: "IBIT 權重", v: rebalanceStatus.ibitWeight, w: rebalanceStatus.isIbitOverweight}].map((item, idx) => (
                                    <div key={idx}><div className="flex justify-between text-[10px] text-slate-500 mb-1"><span>{item.l}</span><span className={item.w ? 'text-red-500' : 'text-slate-400'}>{item.v}%</span></div>{item.w && <div className="text-[9px] text-red-500 font-bold">⚠️ 超過 15%</div>}</div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="w-full"><Card className="py-4 px-1 flex flex-col items-center justify-center min-h-[85px] font-black"><span className="text-[10px] text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1">紀錄日期</span><input type="date" value={inputs.record_date} onChange={e => handleInputChange('record_date', e.target.value)} className="font-black dark:text-white py-1 text-[13px] h-auto font-black" /></Card></div>

                    <Card className="bg-gradient-to-br from-slate-900 via-indigo-950 to-indigo-900 text-white border-none shadow-2xl p-7 relative overflow-hidden text-left font-black">
                        <div className="absolute -right-4 -bottom-4 opacity-10 rotate-12 font-black font-black"><Icon name="TrendingUp" size={160} /></div>
                        <label className="text-[10px] opacity-50 uppercase tracking-widest block mb-1">Portfolio Valuation</label>
                        <div className="flex items-baseline gap-3 flex-wrap font-black"><div className="text-4xl font-black">${totalCapital.toLocaleString(undefined, { minimumFractionDigits: 2 })}</div>{inputs.loan_amount > 0 && <div className="text-xs font-black text-amber-400 bg-amber-400/20 px-3 py-1 rounded-full border border-amber-400/30">L: ${inputs.loan_amount.toLocaleString()}</div>}</div>
                        <div className="text-sm font-bold opacity-60 mt-1">≈ NT$ {(totalCapital * (inputs.usdtwd_rate || 32.5)).toLocaleString(undefined, { maximumFractionDigits: 0 })}</div>
                        <div className="mt-4 pt-3 border-t border-white/10 flex gap-4 text-xs font-bold">
                            <div className="flex flex-col"><span className="opacity-40 uppercase text-[9px]">總損益</span><span className={totalPL >= 0 ? 'text-emerald-400' : 'text-red-400'}>{totalPL >= 0 ? '+' : ''}${totalPL.toLocaleString(undefined, {maximumFractionDigits:0})}</span></div>
                            <div className="flex flex-col"><span className="opacity-40 uppercase text-[9px]">總報酬率</span><span className={totalROI >= 0 ? 'text-emerald-400' : 'text-red-400'}>{totalROI >= 0 ? '+' : ''}{totalROI.toFixed(2)}%</span></div>
                            <div className="flex flex-col ml-auto text-right"><span className="opacity-40 uppercase text-[9px]">淨資產</span><span>${(totalCapital - inputs.loan_amount).toLocaleString()}</span></div>
                        </div>
                    </Card>

                    <Card className="p-4 overflow-hidden text-center relative font-black font-black">
                        <div className="flex justify-between items-center mb-2"><SectionTitle title="資產分配圓餅圖" iconName="PieChartIcon" /><span className="text-xs bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-200 px-2 py-1 rounded-lg font-bold">槓桿: {currentLeverage}x</span></div>
                        <div className="h-64 w-full mt-2 font-black"><ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={pieData} cx="50%" cy="50%" innerRadius={50} outerRadius={75} paddingAngle={4} dataKey="value" label={({ percentage }) => `${percentage}%`}>{pieData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} stroke="none" />)}</Pie><Tooltip /><Legend verticalAlign="bottom" align="center" iconType="circle" /></PieChart></ResponsiveContainer></div>
                    </Card>

                    <Card className="space-y-4 text-left font-black font-black border-2 border-indigo-500 dark:border-indigo-600 shadow-[0_0_20px_rgba(79,70,229,0.2)]">
                        <SectionTitle title="持倉數量與成本 (Holdings)" iconName="Edit2" />
                        <div className="space-y-3">
                            <div className="grid grid-cols-12 gap-2 text-[10px] text-slate-400 uppercase tracking-widest text-center px-1"><div className="col-span-3 text-left">標的</div><div className="col-span-4">股數</div><div className="col-span-5">平均成本</div></div>
                            {[
                                { t: inputs.ticker_core_1, tk: 'ticker_core_1', q: 'qty_qqq', c: 'avg_cost_qqq', ph: 'QQQ', editable: true },
                                { t: 'TQQQ', q: 'qty_tqqq', c: 'avg_cost_tqqq', ph: 'TQQQ' },
                                { t: 'IBIT', q: 'qty_ibit', c: 'avg_cost_ibit', ph: 'IBIT' },
                                { t: 'SGOV', q: 'qty_sgov', c: 'avg_cost_sgov', ph: 'SGOV' },
                                { t: inputs.custom_ticker_1, tk: 'custom_ticker_1', q: 'qty_custom_1', c: 'avg_cost_custom_1', ph: '自選1', editable: true },
                                { t: inputs.custom_ticker_2, tk: 'custom_ticker_2', q: 'qty_custom_2', c: 'avg_cost_custom_2', ph: '自選2', editable: true }
                            ].map((row, i) => (
                                <div key={i} className="holding-input-group grid grid-cols-12 gap-0">
                                    <div className="col-span-3 flex flex-col justify-center px-2 bg-slate-100 dark:bg-slate-800/50">
                                        {row.editable ? <input type="text" value={row.t} onChange={e => handleInputChange(row.tk, e.target.value.toUpperCase())} onBlur={(e) => syncToCloud(row.tk, e.target.value.toUpperCase())} className="w-full text-xs font-black bg-transparent p-0 outline-none text-left" placeholder={row.ph} /> : <span className="text-xs font-black">{row.t}</span>}
                                        <span className="text-[9px] text-indigo-500 font-mono">${prices[(row.t||"").trim().toUpperCase()]?.toFixed(1) || '-'}</span>
                                    </div>
                                    <input type="number" placeholder="股數" value={inputs[row.q]} onChange={e => handleInputChange(row.q, e.target.value)} onBlur={(e) => syncToCloud(row.q, e.target.value)} className="col-span-4 bg-transparent border-r border-slate-200 dark:border-slate-700 font-black text-sm text-center focus:bg-white dark:focus:bg-slate-800 transition-colors" />
                                    <input type="number" placeholder="成本" value={inputs[row.c]} onChange={e => handleInputChange(row.c, e.target.value)} onBlur={(e) => syncToCloud(row.c, e.target.value)} className="col-span-5 bg-transparent font-medium text-sm text-center text-slate-500 focus:bg-white dark:focus:bg-slate-800 transition-colors" />
                                </div>
                            ))}
                            <div className="pt-2"><label className="text-[11px] font-black text-slate-500 px-1 uppercase block text-center w-full mb-1">現金餘額 (USD)</label><input type="number" value={inputs.cash_balance} onChange={e => handleInputChange('cash_balance', e.target.value)} onBlur={(e) => syncToCloud('cash_balance', e.target.value)} className="w-full bg-slate-50 dark:bg-slate-800 border-2 border-indigo-100/50 dark:border-indigo-900/50 rounded-2xl p-4 font-black text-xl text-indigo-600" /></div>
                        </div>
                    </Card>
                    
                    <Card className="space-y-4">
                        <SectionTitle title="技術指標參數 (MA Settings)" iconName="Settings" />
                        <div className="grid grid-cols-2 gap-3">
                            <div className="space-y-1"><label className="text-[10px] text-indigo-500 uppercase block text-center">QQQ 125 EMA (日)</label><input type="number" value={inputs.qqq_ema125} onChange={e => handleInputChange('qqq_ema125', e.target.value)} onBlur={e => syncToCloud('qqq_ema125', e.target.value)} className="w-full bg-indigo-50 dark:bg-slate-800 border border-indigo-200 dark:border-indigo-900 rounded-xl p-2.5 font-black text-center" /></div>
                            <div className="space-y-1"><label className="text-[10px] text-amber-500 uppercase block text-center">IBIT 50 EMA (週)</label><input type="number" value={inputs.ibit_ema50} onChange={e => handleInputChange('ibit_ema50', e.target.value)} onBlur={e => syncToCloud('ibit_ema50', e.target.value)} className="w-full bg-amber-50 dark:bg-slate-800 border border-amber-100 dark:border-amber-900 rounded-xl p-2.5 font-black text-center" /></div>
                        </div>
                        <div className="grid grid-cols-2 gap-3 pt-2 border-t border-slate-100 dark:border-slate-800">
                            <div className="space-y-1"><label className="text-[10px] text-sky-500 uppercase block text-center truncate">{inputs.custom_ticker_1 || '自選1'} 50 EMA (週)</label><input type="number" value={inputs.custom_1_ema125} onChange={e => handleInputChange('custom_1_ema125', e.target.value)} onBlur={e => syncToCloud('custom_1_ema125', e.target.value)} className="w-full bg-sky-50 dark:bg-slate-800 border border-sky-100 dark:border-sky-900/50 rounded-xl p-2.5 font-black text-center" /></div>
                            <div className="space-y-1"><label className="text-[10px] text-sky-500 uppercase block text-center truncate">{inputs.custom_ticker_2 || '自選2'} 50 EMA (週)</label><input type="number" value={inputs.custom_2_ema50} onChange={e => handleInputChange('custom_2_ema50', e.target.value)} onBlur={e => syncToCloud('custom_2_ema50', e.target.value)} className="w-full bg-sky-50 dark:bg-slate-800 border border-sky-100 dark:border-sky-900/50 rounded-xl p-2.5 font-black text-center" /></div>
                        </div>
                    </Card>

                    <Card className="p-4 space-y-2 border-dashed border-2 border-slate-300 text-left font-black"><SectionTitle title="決策紀錄備註" iconName="MessageSquare" /><textarea rows="3" placeholder="在此輸入本次決策心得..." value={inputs.record_memo} onChange={e => setInputs(p => ({ ...p, record_memo: e.target.value }))} className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-4 text-[14px] font-medium resize-none text-left" /></Card>

                    <button onClick={saveRecord} disabled={isSaving} className={`w-full ${isSaving ? 'bg-slate-400' : 'bg-slate-900 dark:bg-indigo-600'} text-white py-6 rounded-[2rem] font-black text-xl shadow-2xl active:scale-95 mb-12 flex items-center justify-center gap-3 font-black font-black`}><Icon name={isSaving ? "RefreshCcw" : "Save"} size={24} className={isSaving ? "animate-spin" : ""} /> {isSaving ? "正在同步..." : "儲存目前紀錄"}</button>
                </div>
            );
        };

        const HistoryView = ({ records, darkMode, updateRecord, deleteRecord }) => {
            const [filterMode, setFilterMode] = useState('all');
            const [historyTab, setHistoryTab] = useState('list');
            const [visibleCount, setVisibleCount] = useState(5);
            const [visibleYears, setVisibleYears] = useState(5);
            const [visibleMonths, setVisibleMonths] = useState(5);
            const [editingId, setEditingId] = useState(null);
            const [editForm, setEditForm] = useState(null);
            const [deletingId, setDeletingId] = useState(null);

            const filteredRecords = useMemo(() => records.filter(r => { const d = new Date(r.date); const now = new Date(); if (filterMode === 'year') return d.getFullYear() === now.getFullYear(); if (filterMode === 'month') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); return true; }), [records, filterMode]);
            const stats = useMemo(() => { if (filteredRecords.length < 1) return { chartData: [] }; const sorted = [...filteredRecords].sort((a,b) => new Date(a.date) - new Date(b.date)); return { chartData: sorted }; }, [filteredRecords]);
            const mddStats = useMemo(() => calculateMDD(records), [records]);
            const periodicStats = useMemo(() => calculatePeriodicStats(records), [records]);

            return (
                <div className="space-y-6 animate-in fade-in text-left">
                    <div className="flex gap-2 p-1.5 bg-slate-200 dark:bg-slate-800 rounded-3xl shadow-inner text-left font-black font-black font-black">
                        {['all', 'year', 'month'].map(m => <button key={m} onClick={() => { setFilterMode(m); setVisibleCount(5); }} className={`flex-1 py-4 rounded-2xl text-xs font-black uppercase transition-all ${filterMode === m ? 'bg-white shadow text-indigo-600 scale-[1.02]' : 'text-slate-500 font-black font-black'}`}>{m === 'all' ? '全部' : m === 'year' ? '年度' : '本月'}</button>)}
                    </div>
                    <Card className="h-72 p-2 shadow-xl border-none overflow-hidden bg-white dark:bg-slate-900 font-black font-black">
                        <div className="flex justify-between items-center mb-2"><SectionTitle title="資產成長趨勢" iconName="TrendingUp" /><span className="text-[10px] bg-red-100 text-red-600 px-2 py-1 rounded-lg font-bold">Max Drawdown: -{mddStats.mdd}%</span></div>
                        <ResponsiveContainer width="100%" height="100%" key={filterMode + stats.chartData.length}><AreaChart data={stats.chartData} margin={{ top: 10, right: 10, left: -20, bottom: 20 }}><defs><linearGradient id="colorEq" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#6366f1" stopOpacity={0.3}/><stop offset="95%" stopColor="#6366f1" stopOpacity={0}/></linearGradient></defs><CartesianGrid strokeDasharray="3 3" vertical={false} stroke={darkMode ? "#1e293b" : "#e2e8f0"} /><XAxis dataKey="date" tickFormatter={v => new Date(v).toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' })} tick={{ fontSize: 10, fontWeight: '900', fill: darkMode ? '#64748b' : '#94a3b8' }} /><YAxis tickFormatter={v => `$${(v/1000).toFixed(0)}k`} tick={{ fontSize: 10, fontWeight: '900', fill: darkMode ? '#64748b' : '#94a3b8' }} /><Tooltip labelFormatter={v => new Date(v).toLocaleDateString()} /><Area type="monotone" dataKey="total_equity" stroke="#6366f1" strokeWidth={4} fillOpacity={1} fill="url(#colorEq)" dot={{ r: 3, fill: '#6366f1' }} /></AreaChart></ResponsiveContainer>
                    </Card>

                    <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl">
                        <button onClick={() => setHistoryTab('list')} className={`flex-1 py-3 rounded-xl text-xs font-black transition-all ${historyTab === 'list' ? 'bg-white dark:bg-slate-700 shadow text-indigo-600' : 'text-slate-400'}`}>📜 交易明細</button>
                        <button onClick={() => setHistoryTab('report')} className={`flex-1 py-3 rounded-xl text-xs font-black transition-all ${historyTab === 'report' ? 'bg-white dark:bg-slate-700 shadow text-indigo-600' : 'text-slate-400'}`}>📊 週期報表 (年/月)</button>
                    </div>

                    {historyTab === 'list' ? (
                        <div className="space-y-4 pb-28 font-black text-left font-black">
                            {filteredRecords.slice(0, visibleCount).map(rec => (
                                <Card key={rec.id} className="border-none shadow-md p-5 bg-white dark:bg-slate-800/50 text-left font-black font-black font-black animate-in fade-in slide-in-from-bottom-2">
                                    {editingId === rec.id ? (
                                        <div className="space-y-5 animate-in slide-in-from-top-1 text-left">
                                            <div className="flex justify-between items-center border-b dark:border-slate-700 pb-3 text-indigo-600"><span className="text-sm uppercase tracking-widest font-black">修改歷史數據</span><button onClick={() => setEditingId(null)} className="p-1"><Icon name="X" size={24} /></button></div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="col-span-2 space-y-1"><label className="text-[11px] text-slate-400 uppercase font-black">日期</label><input type="date" value={editForm.date} onChange={e => setEditForm({...editForm, date: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-2xl p-3 font-black outline-none" /></div>

                                    {stat.data.length > 5 && <button onClick={() => stat.setLimit(stat.limit > 5 ? 5 : stat.data.length)} className="w-full py-3 bg-slate-50 dark:bg-slate-800/50 border-t dark:border-slate-800 text-slate-400 text-[10px] font-black hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors flex justify-center gap-1">{stat.limit > 5 ? <><Icon name="ChevronUp" size={12} /> 收起</> : <><Icon name="ChevronDown" size={12} /> 顯示全部 ({stat.data.length})</>}</button>}

        const LoanView = ({ inputs, handleInputChange, syncToCloud, totalCapital }) => {

            const isTargetReached = totalCapital >= loanSellThreshold && inputs.loan_entry_valuation > 0;
            return (
                <div className="space-y-6 animate-in fade-in text-left font-black">
                    <Card className="space-y-6 border-2 border-amber-100 dark:border-amber-900/30 shadow-xl p-6 text-left font-black font-black font-black">
                        <div className="p-5 bg-amber-50 dark:bg-amber-900/20 rounded-3xl flex items-start gap-4 border border-amber-100 font-medium font-black font-black font-black"><Icon name="Landmark" size={28} className="text-amber-600 flex-shrink-0" /><p className="text-[14px] text-amber-800 dark:text-amber-300 leading-relaxed font-black">還款邏輯：以「買入市值」為固定基準，獲利達標建議撤退。</p></div>
                        <div className="grid grid-cols-1 gap-6 font-black font-black font-black">{[{ l: "貸款買入時市值 (USD基準)", f: "loan_entry_valuation" }, { l: "貸款總額 (USD)", f: "loan_amount" }, { l: "每月還款金額 (USD)", f: "loan_monthly_repay" }, { l: "年化利率 (%)", f: "loan_rate" }, { l: "還款獲利目標 (%)", f: "loan_repay_target" }].map(it => (<div key={it.f} className="space-y-2 text-left text-amber-900 dark:text-amber-500 font-black font-black"><label className="text-[11px] uppercase tracking-widest px-1 text-amber-600">{it.l}</label><input type="number" value={inputs[it.f]} onChange={e => handleInputChange(it.f, e.target.value)} onBlur={(e) => syncToCloud(it.f, e.target.value)} className="w-full bg-amber-50 dark:bg-slate-800 border-2 border-amber-100 dark:border-amber-900 rounded-[1.5rem] p-5 font-black text-xl text-center" /></div>))}</div>
                        <Card className={`${isTargetReached ? 'repay-alert' : 'bg-amber-900 dark:bg-amber-950'} text-white border-none p-6 text-center shadow-lg transition-colors duration-500 font-black`}><h4 className="text-xs opacity-60 uppercase mb-1 tracking-widest text-center font-black">賣出還款門檻 (依基準市值)</h4><p className="text-xl font-mono tracking-tight text-center font-black font-black font-black">${ loanSellThreshold.toLocaleString(undefined, { maximumFractionDigits: 0 }) }</p></Card>
                    </Card>

        const SettingsView = ({ effectiveUserId, tempSyncId, setTempSyncId, setCustomSyncId, setView, handleExport, handleImport, inputs, handleInputChange, syncToCloud }) => (
            <div className="space-y-6 animate-in fade-in text-left">

                    <div className="space-y-4 font-black">
                        <div className="bg-slate-800 text-white p-6 shadow-xl relative overflow-hidden font-black font-black font-black rounded-xl mb-4"><div className="absolute right-0 top-0 p-4 opacity-10 font-black"><Icon name="Fingerprint" size={80} /></div><SectionTitle title="目前 ID" iconName="Fingerprint" /><span className="text-lg font-black font-mono uppercase font-black">{effectiveUserId || '正在連結...'}</span></div>
                        <input type="text" value={tempSyncId} onChange={e => setTempSyncId(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-800 rounded-2xl p-5 font-black text-lg focus:border-indigo-500" placeholder="輸入 ID" />
                        <button onClick={() => { setCustomSyncId(tempSyncId.trim()); localStorage.setItem('qqq_sync_id', tempSyncId.trim()); setView('dashboard'); }} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg shadow-xl btn-active uppercase tracking-widest font-black">套用同步</button>
                    </div>
                </CollapsibleSection>
                <CollapsibleSection title="資料備份與還原" iconName="Save"><div className="grid grid-cols-2 gap-3"><button onClick={handleExport} className="flex items-center justify-center gap-2 bg-slate-200 dark:bg-slate-800 py-4 rounded-xl font-bold text-sm btn-active"><Icon name="Download" size={18} /> 匯出 JSON</button><label className="flex items-center justify-center gap-2 bg-slate-200 dark:bg-slate-800 py-4 rounded-xl font-bold text-sm btn-active cursor-pointer"><Icon name="Upload" size={18} /> 匯入 JSON<input type="file" accept=".json" onChange={handleImport} className="hidden" /></label></div></CollapsibleSection>
                <CollapsibleSection title="匯率設定" iconName="DollarSign"><div className="space-y-1"><label className="text-[10px] text-slate-400 uppercase block text-center">USD/TWD 匯率</label><input type="number" value={inputs.usdtwd_rate} onChange={e => handleInputChange('usdtwd_rate', e.target.value)} onBlur={e => syncToCloud('usdtwd_rate', e.target.value)} className="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl p-3 font-black text-center text-lg" /></div></CollapsibleSection>
                <CollapsibleSection title="策略執行協議設定" iconName="BookOpen" defaultOpen={true}>
                    <div className="space-y-4">
                        <div className="space-y-2"><div className="flex items-center gap-2 text-indigo-600 dark:text-indigo-400 font-black"><Icon name="TrendingUp" size={16}/> <input type="text" value={inputs.title_core} onChange={e => handleInputChange('title_core', e.target.value)} onBlur={e => syncToCloud('title_core', e.target.value)} className="title-input title-input-edit" /></div><textarea value={inputs.strat_core} onChange={e => handleInputChange('strat_core', e.target.value)} onBlur={e => syncToCloud('strat_core', e.target.value)} className="w-full strategy-textarea resize-none" placeholder="輸入核心 QQQ 策略..." /></div>

        const AllocationToolModal = ({ isOpen, onClose, totalCapital, inputs, prices, getNum }) => {
            const [mode, setMode] = useState('deposit'); 
            const [inputValue, setInputValue] = useState(''); 
            const [localAlloc, setLocalAlloc] = useState({ core: 0, sat1: 0, sat2: 0, ibit: 0 });

            useEffect(() => { if (isOpen) { setLocalAlloc({ core: getNum(inputs.alloc_core), sat1: getNum(inputs.alloc_custom_1), sat2: getNum(inputs.alloc_custom_2), ibit: getNum(inputs.alloc_sat) }); setInputValue(''); setMode('deposit'); } }, [isOpen, inputs, totalCapital]);
            if (!isOpen) return null;
            const val = parseFloat(inputValue) || 0; const tCore = (inputs.ticker_core_1 || "QQQ").toUpperCase();
            const valTQQQ = (prices.TQQQ || 0) * getNum(inputs.qty_tqqq); const valCore1 = (prices[tCore] || 0) * getNum(inputs.qty_qqq);
            const valSat1 = (prices[(inputs.custom_ticker_1||"").toUpperCase()] || 0) * getNum(inputs.qty_custom_1); const valSat2 = (prices[(inputs.custom_ticker_2||"").toUpperCase()] || 0) * getNum(inputs.qty_custom_2); const valIBIT = (prices.IBIT || 0) * getNum(inputs.qty_ibit);
            let targetTotal = mode === 'deposit' ? totalCapital + val : val;
            const targetValues = { TQQQ: (targetTotal * (localAlloc.core / 100)) / 2, [tCore]: (targetTotal * (localAlloc.core / 100)) / 2, [inputs.custom_ticker_1 || 'T1']: targetTotal * (localAlloc.sat1 / 100), [inputs.custom_ticker_2 || 'T2']: targetTotal * (localAlloc.sat2 / 100), IBIT: targetTotal * (localAlloc.ibit / 100) };
            const currentValues = { TQQQ: valTQQQ, [tCore]: valCore1, [inputs.custom_ticker_1 || 'T1']: valSat1, [inputs.custom_ticker_2 || 'T2']: valSat2, IBIT: valIBIT };
            let displayData = [];
            if (mode === 'deposit') {
                const buyTQQQ = Math.max(0, targetValues.TQQQ - valTQQQ); const buyCore1 = Math.max(0, targetValues[tCore] - valCore1); const buySat1 = Math.max(0, targetValues[inputs.custom_ticker_1 || 'T1'] - valSat1); const buySat2 = Math.max(0, targetValues[inputs.custom_ticker_2 || 'T2'] - valSat2); const buyIBIT = Math.max(0, targetValues.IBIT - valIBIT);
                const totalNeed = buyTQQQ + buyCore1 + buySat1 + buySat2 + buyIBIT; const ratio = totalNeed > 0 ? Math.min(1, val / totalNeed) : 0;
                displayData = [ { k: 'TQQQ', v: buyTQQQ * ratio, type: 'buy' }, { k: tCore, v: buyCore1 * ratio, type: 'buy' }, { k: inputs.custom_ticker_1 || 'T1', v: buySat1 * ratio, type: 'buy' }, { k: inputs.custom_ticker_2 || 'T2', v: buySat2 * ratio, type: 'buy' }, { k: 'IBIT', v: buyIBIT * ratio, type: 'buy' } ];
            } else {
                displayData = [ { k: 'TQQQ', v: targetValues.TQQQ, diff: targetValues.TQQQ - valTQQQ, type: 'diff' }, { k: tCore, v: targetValues[tCore], diff: targetValues[tCore] - valCore1, type: 'diff' }, { k: inputs.custom_ticker_1 || 'T1', v: targetValues[inputs.custom_ticker_1 || 'T1'], diff: targetValues[inputs.custom_ticker_1 || 'T1'] - valSat1, type: 'diff' }, { k: inputs.custom_ticker_2 || 'T2', v: targetValues[inputs.custom_ticker_2 || 'T2'], diff: targetValues[inputs.custom_ticker_2 || 'T2'] - valSat2, type: 'diff' }, { k: 'IBIT', v: targetValues.IBIT, diff: targetValues.IBIT - valIBIT, type: 'diff' } ];
            }
            const totalAllocPercent = localAlloc.core + localAlloc.sat1 + localAlloc.sat2 + localAlloc.ibit; const isAllocValid = Math.abs(totalAllocPercent - 100) < 0.1;

            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-in fade-in">
                    <Card className="w-full max-w-sm border-2 border-indigo-400 bg-white dark:bg-slate-900 shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar">
                        <div className="flex justify-between items-center mb-4 sticky top-0 bg-white dark:bg-slate-900 z-10 pb-2 border-b dark:border-slate-800"><h3 className="font-black text-indigo-600 flex items-center gap-2"><Icon name="Calculator" /> 計算機</h3><button onClick={onClose}><Icon name="X" /></button></div>
                        <div className="flex gap-2 mb-4 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl"><button onClick={() => { setMode('deposit'); setInputValue(''); }} className={`flex-1 py-2 rounded-lg text-xs font-black transition-all ${mode === 'deposit' ? 'bg-orange-100 text-orange-600 shadow-sm' : 'text-slate-400'}`}>💰 資金注入</button><button onClick={() => { setMode('simulate'); setInputValue(totalCapital.toFixed(0)); }} className={`flex-1 py-2 rounded-lg text-xs font-black transition-all ${mode === 'simulate' ? 'bg-white dark:bg-slate-700 shadow text-indigo-600' : 'text-slate-400'}`}>🎯 目標試算</button></div>
                        <div className="mb-4"><label className={`text-[10px] font-bold block text-center mb-1 ${mode === 'deposit' ? 'text-orange-500' : 'text-indigo-500'}`}>{mode === 'deposit' ? '➕ 注入金額 (USD)' : '🎯 預期總資產 (USD)'}</label><input type="number" value={inputValue} onChange={e => setInputValue(e.target.value)} className={`w-full p-4 rounded-xl text-xl font-black mb-1 text-center outline-none border-2 ${mode === 'deposit' ? 'bg-orange-50 dark:bg-orange-900/20 border-orange-200 dark:border-orange-800 text-orange-600 focus:ring-2 focus:ring-orange-400' : 'bg-indigo-50 dark:bg-indigo-900/20 border-indigo-200 dark:border-indigo-800 text-indigo-600 focus:ring-2 focus:ring-indigo-400'}`} autoFocus />{mode === 'deposit' && <p className="text-[10px] text-center text-slate-400">注入後總值: ${(totalCapital + val).toLocaleString(undefined, {maximumFractionDigits:0})}</p>}</div>
                        <div className="mb-4 bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-100 dark:border-slate-800"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-slate-500">目標配比設定 (%)</span><span className={`text-xs font-black ${isAllocValid ? 'text-emerald-500' : 'text-red-500'}`}>合計: {totalAllocPercent.toFixed(0)}%</span></div><div className="grid grid-cols-4 gap-2 text-center"><div><label className="text-[9px] block text-slate-400">Core</label><input type="number" value={localAlloc.core} onChange={e => setLocalAlloc({...localAlloc, core: parseFloat(e.target.value)||0})} className="w-full bg-white dark:bg-slate-700 rounded p-1 text-center font-bold text-sm" /></div><div><label className="text-[9px] block text-slate-400">IBIT</label><input type="number" value={localAlloc.ibit} onChange={e => setLocalAlloc({...localAlloc, ibit: parseFloat(e.target.value)||0})} className="w-full bg-white dark:bg-slate-700 rounded p-1 text-center font-bold text-sm" /></div><div><label className="text-[9px] block text-slate-400 truncate">{inputs.custom_ticker_1 || 'T1'}</label><input type="number" value={localAlloc.sat1} onChange={e => setLocalAlloc({...localAlloc, sat1: parseFloat(e.target.value)||0})} className="w-full bg-white dark:bg-slate-700 rounded p-1 text-center font-bold text-sm" /></div><div><label className="text-[9px] block text-slate-400 truncate">{inputs.custom_ticker_2 || 'T2'}</label><input type="number" value={localAlloc.sat2} onChange={e => setLocalAlloc({...localAlloc, sat2: parseFloat(e.target.value)||0})} className="w-full bg-white dark:bg-slate-700 rounded p-1 text-center font-bold text-sm" /></div></div></div>
                        <div className="space-y-1.5 text-sm"><div className="grid grid-cols-12 gap-1 text-[10px] text-slate-400 text-center border-b pb-1 dark:border-slate-800 font-bold uppercase tracking-wider"><div className="col-span-3 text-left pl-1">標的</div><div className="col-span-3">現值</div><div className="col-span-3">{mode === 'deposit' ? '分配' : '目標'}</div><div className="col-span-3">建議操作</div></div>
                        {displayData.map((d) => { if (!d.k) return null; const currentVal = currentValues[d.k] || 0; let actionVal = 0; let displayTarget = 0; if (d.type === 'buy') { actionVal = d.v; displayTarget = d.v; } else { actionVal = d.diff; displayTarget = d.v; } const price = prices[d.k.toUpperCase()] || 0; const shares = price > 0 ? actionVal / price : 0;
                            return (<div key={d.k} className="grid grid-cols-12 gap-1 items-center p-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors"><div className="col-span-3 text-left font-bold text-slate-700 dark:text-slate-200 truncate text-[11px]">{d.k}</div><div className="col-span-3 text-center text-slate-400 text-[10px]">${currentVal.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div className="col-span-3 text-center font-bold text-[10px] text-slate-500">${displayTarget.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div className={`col-span-3 text-right font-black text-xs`}>{mode === 'deposit' ? (<span className="text-orange-500">+{actionVal.toLocaleString(undefined,{maximumFractionDigits:0})}<div className="text-[9px] opacity-70">+{shares.toFixed(0)}股</div></span>) : (<span className={actionVal > 0 ? 'text-emerald-500' : 'text-red-500'}>{actionVal > 0 ? '+' : ''}{actionVal.toLocaleString(undefined,{maximumFractionDigits:0})}<div className="text-[9px] opacity-70">{shares > 0 ? '+' : ''}{shares.toFixed(0)}股</div></span>)}</div></div>);
                        })}
                        {!isAllocValid && <p className="text-center text-red-500 text-xs py-2">⚠️ 配比總和非 100%，請修正</p>}</div>
                    </Card>
                </div>
            );
        };

        // --- MAIN APP COMPONENT (ORCHESTRATOR) ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [records, setRecords] = useState([]);
            const [prices, setPrices] = useState({ QQQ: 0, TQQQ: 0, IBIT: 0, SGOV: 0 }); 
            const [loadingPrices, setLoadingPrices] = useState(false);
            const [priceError, setPriceError] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('qqq_theme') === 'dark');
            const [message, setMessage] = useState(null);
            const [isAllocationToolOpen, setIsAllocationToolOpen] = useState(false);

            const [customSyncId, setCustomSyncId] = useState(() => localStorage.getItem('qqq_sync_id') || '');
            const [tempSyncId, setTempSyncId] = useState(customSyncId);
            const effectiveUserId = customSyncId || (user ? user.uid : null);

            const [inputs, setInputs] = useState({
                qqq_ema125: 0, ibit_ema50: 0, custom_1_ema50: 0, custom_2_ema50: 0, 
                ticker_core_1: 'QQQ', qty_qqq: 0, avg_cost_qqq: 0, qty_tqqq: 0, avg_cost_tqqq: 0,
                qty_ibit: 0, avg_cost_ibit: 0, qty_sgov: 0, avg_cost_sgov: 0, 
                custom_ticker_1: 'TSLA', qty_custom_1: 0, avg_cost_custom_1: 0,
                custom_ticker_2: 'NVDA', qty_custom_2: 0, avg_cost_custom_2: 0, 
                cash_balance: 0, record_date: new Date().toISOString().split('T')[0],
                alloc_core: 80, alloc_sat: 10, alloc_custom_1: 10, alloc_custom_2: 0,
                loan_amount: 0, loan_rate: 2.0, loan_years: 7, loan_repay_target: 20, 
                loan_entry_valuation: 0, loan_monthly_repay: 0, motto: '', record_memo: '',
                usdtwd_rate: 32.5,
                title_core: "核心策略 (80%) - QQQ/TQQQ", strat_core: "進攻模式：40% QQQ + 40% TQQQ。\n防禦模式 (SGOV)：當 QQQ < 125 EMA (日線 -3%) 時全數轉入 SGOV。\n\n★ 核心再平衡機制：\n1. 季度檢查 (1/4/7/10月首日)：\n   若 TQQQ 佔核心比例超出 45%~55% 區間，調整回 50%/50%。\n\n2. 強制閾值 (隨時監控)：\n   若 TQQQ 佔核心比例 > 65% 或 < 35%，無視日期立即強制調整回 50%/50%。", 
                title_custom: "自選衛星 (10%) - TSLA", strat_custom: "止損：價格 < 50 EMA (週線 -3%) 轉入 QQQ。\n歸隊：價格 > 50 EMA (週線 +5%) 買回。\n\n★ 衛星再平衡 (獲利收割)：\n若單一衛星資產價值 > 總資產 15%，賣出超額部分，獲利按 50/50 轉入核心 (QQQ+TQQQ)。", 
                title_ibit: "衛星配置 (10%) - IBIT", strat_ibit: "止損：價格 < 50 EMA (週線 -3%) 轉入 QQQ。\n特殊：週一開盤前比特幣崩盤，直接市價賣出。\n\n★ 衛星再平衡 (獲利收割)：\n若 IBIT 價值 > 總資產 15%，賣出超額部分，獲利按 50/50 轉入核心。"
            });

            const showToast = (txt) => { setMessage(txt); setTimeout(() => setMessage(null), 3000); };
            const handleInputChange = (f, v) => setInputs(p => ({ ...p, [f]: v === '' ? '' : (isNaN(v) ? v : parseFloat(v)) }));
            const syncToCloud = async (f, v) => { if (!effectiveUserId) return; await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set({ [f]: v }, { merge: true }); };

            const fetchPrices = useCallback(async (force = false) => {
                if (loadingPrices) return; 
                const CACHE_KEY = 'qqq_price_cache_v5'; const CACHE_DURATION = 5 * 60 * 1000; 
                const tCore = (inputs.ticker_core_1 || "QQQ").trim().toUpperCase(); const t1 = (inputs.custom_ticker_1 || "").trim().toUpperCase(); const t2 = (inputs.custom_ticker_2 || "").trim().toUpperCase();
                const syms = [...new Set([tCore, 'TQQQ', 'IBIT', 'SGOV', t1, t2].filter(Boolean))];
                if (!force) { const cached = localStorage.getItem(CACHE_KEY); if (cached) { const { timestamp, data } = JSON.parse(cached); const allFound = syms.every(s => data[s] !== undefined); if (Date.now() - timestamp < CACHE_DURATION && allFound) { setPrices(data); setPriceError(false); return; } } }
                setLoadingPrices(true);
                try {
                    const results = await Promise.allSettled(syms.map(async (s) => { const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${FINNHUB_API_KEY}`); if (!res.ok) throw new Error('Network'); const d = await res.json(); return { symbol: s, price: d.c || 0 }; }));
                    const newMap = {}; results.forEach(res => { if (res.status === 'fulfilled' && res.value.price > 0) newMap[res.value.symbol] = res.value.price; });
                    setPrices(prev => { const updated = { ...prev, ...newMap }; localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: updated })); return updated; });
                    setPriceError(false);
                } catch (e) { console.error("Fetch error", e); setPriceError(true); } finally { setLoadingPrices(false); }
            }, [inputs.custom_ticker_1, inputs.custom_ticker_2, inputs.ticker_core_1, loadingPrices]);

            useEffect(() => { auth.signInAnonymously().catch(console.error); const unsub = auth.onAuthStateChanged(setUser); return () => unsub(); }, []);
            useEffect(() => { if (!effectiveUserId) return; const userPath = db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId); userPath.collection('trading_records').onSnapshot(snap => setRecords(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => new Date(b.date) - new Date(a.date)))); userPath.collection('config').doc('current').onSnapshot(snap => { if (snap.exists) setInputs(prev => ({ ...prev, ...snap.data(), record_date: new Date().toISOString().split('T')[0] })); }); fetchPrices(); }, [effectiveUserId]);
            useEffect(() => { const root = window.document.documentElement; if (darkMode) root.classList.add('dark'); else root.classList.remove('dark'); }, [darkMode]);

            // Calculation Props
            const totalCapital = useMemo(() => calculateTotalCapital(prices, inputs), [prices, inputs]);
            const totalCost = useMemo(() => calculateTotalCost(inputs), [inputs]);
            const totalPL = totalCapital - totalCost;
            const totalROI = totalCost > 0 ? (totalPL / totalCost) * 100 : 0;

            // Database Actions
            const saveRecord = async () => { if (!effectiveUserId || isSaving) return; setIsSaving(true); const d = new Date(inputs.record_date); d.setHours(12, 0, 0, 0); try { await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').add({ date: d.toISOString(), total_equity: totalCapital, core_pos: inputs.current_positions || 'Mix', prices: { ...prices }, inputs: { ...inputs }, memo: inputs.record_memo || '' }); await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set(inputs, { merge: true }); showToast("同步成功！"); setInputs(p => ({ ...p, record_memo: '' })); } catch (e) { showToast("儲存失敗"); } finally { setIsSaving(false); } };
            const deleteRecord = async (id) => { try { await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').doc(id).delete(); showToast("已刪除"); } catch (e) {} };
            const updateRecord = async (id, editForm) => { 
                const d = new Date(editForm.date); d.setHours(12, 0, 0, 0); 
                const hP = editForm.prices || prices; const hI = editForm.inputs; 
                const nT = calculateTotalCapital(hP, hI);
                await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').doc(id).update({ date: d.toISOString(), inputs: hI, total_equity: nT, memo: editForm.memo || '' }); 
                showToast("修改完成"); 
            };
            const handleExport = () => { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records)); const a = document.createElement('a'); a.href = dataStr; a.download = "qqq_backup_" + new Date().toISOString().split('T')[0] + ".json"; document.body.appendChild(a); a.click(); a.remove(); };
            const handleImport = async (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = async (event) => { try { const imported = JSON.parse(event.target.result); if (Array.isArray(imported)) { await Promise.all(imported.map(r => db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').add(r))); showToast("匯入成功"); } } catch (err) { showToast("格式錯誤"); } }; reader.readAsText(file); };

            return (
                <div className="pb-40 min-h-screen transition-colors duration-300 font-black text-left select-none overflow-x-hidden">
                    {message && <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[60] animate-in fade-in slide-in-from-top-4 font-black"><div className="bg-indigo-600 text-white px-6 py-3 rounded-full shadow-2xl text-sm flex items-center gap-2"><Icon name="CheckCircle" size={16} /> {message}</div></div>}
                    <AllocationToolModal isOpen={isAllocationToolOpen} onClose={() => setIsAllocationToolOpen(false)} totalCapital={totalCapital} inputs={inputs} prices={prices} getNum={getNum} />
                    
                    <header className="fixed top-0 left-0 right-0 bg-indigo-900 dark:bg-slate-950 z-50 px-5 py-4 flex justify-between items-center shadow-lg text-white">
                        <div className="flex items-center gap-2 font-black"><div className="bg-white p-2 rounded-2xl shadow-sm"><Icon name="TrendingUp" className="text-indigo-900" size={18} /></div><h1 className="font-black text-lg">Alpha Horizon</h1></div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setIsAllocationToolOpen(true)} className="p-2.5 rounded-xl bg-indigo-600 border border-indigo-500 text-white shadow-sm active:scale-90"><Icon name="Calculator" size={20} /></button>
                            <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 rounded-xl bg-white/10 active:scale-90 font-black font-black"><Icon name={darkMode ? "Sun" : "Moon"} size={20} /></button>
                            <button onClick={() => setView('sync_settings')} className="p-2.5 rounded-xl bg-white border-2 border-slate-100 text-slate-700 active:scale-90 shadow-sm"><Icon name="Settings" size={20} /></button>
                            <div className="flex items-center gap-1.5 ml-1"><button onClick={() => fetchPrices(true)} className={`p-2 text-white/80 active:rotate-180 transition-transform font-black font-black ${priceError ? 'text-red-400' : ''}`}><Icon name="RefreshCcw" size={22} className={loadingPrices ? 'animate-spin' : ''} /></button><div className={`w-3.5 h-3.5 rounded-full border-2 ${priceError ? 'bg-red-500 border-white' : loadingPrices ? 'bg-yellow-400 border-yellow-200 sync-loading' : 'bg-emerald-500 border-emerald-300 shadow-emerald-500/50'}`}></div></div>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto p-4 pt-24 space-y-6">
                        {view === 'dashboard' && <DashboardView inputs={inputs} setInputs={setInputs} prices={prices} totalCapital={totalCapital} totalPL={totalPL} totalROI={totalROI} syncToCloud={syncToCloud} saveRecord={saveRecord} isSaving={isSaving} handleInputChange={handleInputChange} />}
                        {view === 'history' && <HistoryView records={records} darkMode={darkMode} updateRecord={updateRecord} deleteRecord={deleteRecord} />}
                        {view === 'loan' && <LoanView inputs={inputs} handleInputChange={handleInputChange} syncToCloud={syncToCloud} totalCapital={totalCapital} />}
                        {view === 'sync_settings' && <SettingsView effectiveUserId={effectiveUserId} tempSyncId={tempSyncId} setTempSyncId={setTempSyncId} setCustomSyncId={setCustomSyncId} setView={setView} handleExport={handleExport} handleImport={handleImport} inputs={inputs} handleInputChange={handleInputChange} syncToCloud={syncToCloud} />}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 z-50 px-2 py-4 pb-10 flex justify-around items-center shadow-[0_-10px_30px_rgba(0,0,0,0.08)] safe-pb font-black text-left font-black font-black">
                        <button onClick={() => setView('dashboard')} className={`flex flex-col items-center gap-2 flex-1 transition-all active:scale-90 ${view === 'dashboard' ? 'tab-active' : 'text-slate-400 font-black font-black'}`}><Icon name="LayoutDashboard" size={28} /><span className="text-[10px] font-black uppercase tracking-widest text-center">儀表板</span></button>
                        <button onClick={() => setView('history')} className={`flex flex-col items-center gap-2 flex-1 transition-all active:scale-90 ${view === 'history' ? 'tab-active' : 'text-slate-400'}`}><Icon name="History" size={28} /><span className="text-[10px] font-black uppercase tracking-widest text-center">績效</span></button>
                        <button onClick={() => setView('loan')} className={`flex flex-col items-center gap-2 flex-1 transition-all active:scale-90 ${view === 'loan' ? 'text-amber-600' : 'text-slate-400 font-black'}`}><Icon name="Landmark" size={28} /><span className="text-[10px] font-black uppercase tracking-widest text-amber-600 text-center font-black font-black">貸款</span></button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
