<body class="text-left font-bold text-slate-800">

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, memo } = React;

        const FINNHUB_KEY = "d4q36b9r01qha6q0jclgd4q36b9r01qha6q0jcm0";
        const firebaseConfig = { apiKey: "AIzaSyBpax3wlTwHTe6G3niZajtTxpoUWbgvX80", authDomain: "qldmax.firebaseapp.com", projectId: "qldmax", storageBucket: "qldmax.firebasestorage.app", messagingSenderId: "752199866954", appId: "1:752199866954:web:50d17ae522095c363d64b3" };
        const APP_ID = "qqq-strategic-production-v1";
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); const auth = firebase.auth();

        // --- Utility Functions ---
        const sanitizeForFirestore = (data) => JSON.parse(JSON.stringify(data, (k, v) => v === undefined ? null : v));
        const getNum = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
        const getQty = (val, price) => (price > 0 ? Math.abs(val / price) : 0);

        // --- UI Components ---
        const Icon = memo(({ name, size = 20, className = "" }) => {
            const icons = { 
                TrendingUp: <path d="m22 7-8.5 8.5-5-5L2 17M22 7h-6M22 7v6"/>, Settings: <path d="M12.22 2h-.44a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 1 2-2a2 2 0 0 1 2-2a2 2 0 0 0-2-2zM9 12a3 3 0 1 1 6 0a3 3 0 0 1-6 0z"/>, 
                RefreshCcw: <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0 4a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16m-18-8h5V3m13 18h-5v5"/>, LayoutDashboard: <g><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></g>,

                ShieldAlert: <g><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></g>, CheckCircle: <g><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></g>, 
                Edit2: <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>, Trash2: <g><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></g>, 
                X: <g><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></g>, BookOpen: <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>, 
                PieChartIcon: <g><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></g>,
                Lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>, Unlock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 9.9-1" /></g>, 
                ChevronDown: <path d="m6 9 6 6 6-6"/>, ChevronUp: <path d="m18 15-6-6-6 6"/>, 
                Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>, Plus: <path d="M12 5v14M5 12h14"/>, Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>, 
                List: <g><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></g>,
                Sliders: <g><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="1" x2="7" y1="14" y2="14"/><line x1="9" x2="15" y1="8" y2="8"/><line x1="17" x2="23" y1="16" y2="16"/></g>,
                Fingerprint: <g><path d="M2 12C2 6.48 6.48 2 12 2s10 4.48 10 10"/><path d="M12 12v3"/><path d="M16 17.5c-2.5 1.5-5.5 1.5-8 0"/></g>,
                History: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0 0V3m0 5h5M12 7v5l4 2"/>,
                Calculator: <g><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></g>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || <circle cx="12" cy="12" r="10" />}</svg>;
        });

        // --- Collapsible Card Component ---
        const CollapsibleCard = ({ title, icon, isOpen, onToggle, children, rightElement, className = "" }) => (
            <div className={`bg-white rounded-[1.5rem] shadow-heavy border border-slate-300 transition-all overflow-hidden ${className}`}>
                <div className="p-4 flex justify-between items-center cursor-pointer bg-slate-50 border-b border-slate-100" onClick={onToggle}>
                    <div className="flex gap-2 items-center text-xs font-black text-slate-600 uppercase tracking-widest">
                        <Icon name={icon} size={16} /> {title}
                    </div>
                    <div className="flex items-center gap-2">
                        {rightElement}
                        <Icon name={isOpen ? "ChevronUp" : "ChevronDown"} size={16} className="text-slate-400" />
                    </div>
                </div>
                {isOpen && <div className="p-5 animate-in fade-in slide-in-from-top-2 duration-200">{children}</div>}
            </div>
        );

        const SectionHeader = ({ title, iconName, onClick, isOpen, rightElement }) => (
            <div className={`section-header ${onClick ? 'cursor-pointer' : ''}`} onClick={onClick}>
                 <div className="flex gap-2 text-xs font-black text-slate-600 items-center uppercase tracking-widest"><Icon name={iconName} size={16} /> {title}</div>
                 <div className="flex items-center gap-2">{rightElement}{onClick && <Icon name={isOpen ? "ChevronUp" : "ChevronDown"} size={16} className="text-slate-500" />}</div>
            </div>
        );

        const Card = ({ children, className = "", onClick, noPadding = false }) => (
            <div onClick={onClick} className={`rounded-[1.5rem] shadow-heavy border border-slate-300 transition-all bg-white ${noPadding ? '' : 'p-5'} ${className} ${onClick ? 'cursor-pointer hover:scale-[1.01]' : ''}`}>
                {children}
            </div>
        );

        const Modal = ({ isOpen, onClose, title, icon, children, footer }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center animate-in fade-in duration-200">
                    <div className="w-full max-w-sm bg-white rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl animate-in slide-in-from-bottom-full duration-300 z-[110] max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-xl font-black flex items-center gap-2 text-slate-800"><Icon name={icon} className="text-brand-600"/> {title}</h3>
                            <button onClick={onClose} className="p-2 bg-slate-100 rounded-full hover:bg-slate-200"><Icon name="X" size={20}/></button>
                        </div>
                        <div className="space-y-4">{children}</div>
                        {footer && <div className="mt-6 flex gap-2">{footer}</div>}
                    </div>
                </div>
            );
        };

        const SectionTitle = ({ title, iconName }) => (
            <h2 className="text-[11px] font-black mb-3 flex items-center gap-2 uppercase tracking-widest text-slate-500">
                <Icon name={iconName} size={14} /> {title}
            </h2>
        );

        const CustomPieTooltip = ({ active, payload }) => {
            if (active && payload && payload.length) {
                return (
                    <div className="bg-white border border-slate-300 p-3 rounded-xl shadow-xl text-xs font-black z-50">
                        <p className="mb-1 text-slate-500">{payload[0].name}</p>
                        <p className="text-lg text-slate-800">${payload[0].value.toLocaleString(undefined, {maximumFractionDigits: 0})}</p>
                        <p className="text-brand-600">{(payload[0].payload.percent * 100).toFixed(1)}%</p>
                    </div>
                );
            }
            return null;
        };
        
        const CustomGraphTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                return (
                    <div className="bg-white border border-slate-300 p-3 rounded-xl shadow-xl text-xs font-black z-50">
                        <p className="mb-1 text-slate-500">{new Date(label).toLocaleDateString()}</p>
                        {payload.map((p, i) => (
                            <p key={i} style={{ color: p.color || p.fill }}>
                                {p.name}: {p.name.includes('%') ? '' : '$'}{p.value.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0})}{p.name.includes('%') ? '%' : ''}
                                {p.dataKey === 'dd' && p.payload.ddAmt ? ` (-$${Math.abs(Math.round(p.payload.ddAmt)).toLocaleString()})` : ''}
                            </p>
                        ))}
                    </div>
                );
            }
            return null;
        };

        const HoldingRow = memo(({ conf, inputs, prices, onChange, onBlur, isDynamic = false }) => {
            let rawTicker = isDynamic ? conf.ticker : (conf.tickerKey ? inputs[conf.tickerKey] : conf.ticker);
            const ticker = (rawTicker || conf.defaultTicker || '').toUpperCase();
            const price = prices[ticker] || 0;
            const currentQty = isDynamic ? conf.qty : inputs[conf.qtyKey];
            
            // Target Price Logic
            const targetPrice = isDynamic ? (conf.target_price || '') : (inputs[conf.targetPriceKey] || '');
            const diffPct = (targetPrice && price) ? ((targetPrice - price) / price * 100) : 0;
            
            const handleTickerChange = (v) => isDynamic ? onChange(conf.id, 'ticker', v.toUpperCase()) : onChange(conf.tickerKey, v.toUpperCase());
            const handleQtyChange = (v) => isDynamic ? onChange(conf.id, 'qty', v) : onChange(conf.qtyKey, v);
            const handleTargetChange = (v) => isDynamic ? onChange(conf.id, 'target_price', v) : onChange(conf.targetPriceKey, v);
            const handleBlur = () => isDynamic ? onBlur() : onBlur(conf.tickerKey, null); 

            return (
                <div className="bg-white border border-slate-200 rounded-2xl p-3 mb-2 shadow-sm">
                    <div className="flex justify-between items-center mb-2">
                        <div className="flex items-center gap-2">
                            <span className={`text-sm font-black font-mono ${conf.color}`}>{ticker}</span>
                            <span className="text-xs text-slate-400 font-mono">${price.toFixed(2)}</span>
                        </div>
                        <div className="flex items-center gap-1 bg-slate-50 px-2 py-1 rounded-lg">
                            <input type="number" placeholder="0" value={currentQty || ''} onChange={e => handleQtyChange(e.target.value)} onBlur={handleBlur} className="w-16 bg-transparent text-right font-bold text-slate-700 text-sm" />
                            <span className="text-[10px] text-slate-400">股</span>
                        </div>
                    </div>
                    <div className="flex gap-2 items-center text-xs border-t border-slate-100 pt-2">
                        <div className="flex-1 flex items-center gap-2 bg-slate-50 px-2 py-1 rounded-lg">
                            <span className="text-[10px] text-slate-400">目標價</span>
                            <input type="number" placeholder="Target" value={targetPrice} onChange={e => handleTargetChange(e.target.value)} onBlur={handleBlur} className="w-full bg-transparent font-bold text-slate-600" />
                        </div>
                        {targetPrice && (
                            <div className={`font-black font-mono px-2 ${diffPct > 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                                {diffPct > 0 ? '+' : ''}{diffPct.toFixed(1)}%
                            </div>
                        )}
                    </div>
                </div>
            );
        });
        
        const SatSettingsRow = ({ item, onChange, onDelete, onBlur, showAdvanced }) => (
             <div className="bg-f1f5f9 p-3 rounded-xl border border-slate-300 mb-2 relative transition-all">
                <div className="flex justify-between items-center mb-2">
                    <div className="flex gap-2 items-center">
                        <label className="text-[9px] text-slate-500 font-bold">持倉</label>
                        <input value={item.ticker} onChange={e=>onChange(item.id, 'ticker', e.target.value.toUpperCase())} onBlur={onBlur} className="font-black text-xs w-16 bg-transparent outline-none uppercase text-teal-600" placeholder="TSLL"/>
                    </div>
                    <button onClick={() => onDelete(item.id)} className="w-6 h-6 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center hover:bg-rose-200 border border-rose-200"><Icon name="X" size={12}/></button>
                </div>
                
                <div className="mb-2 flex items-center gap-2">
                    <label className="text-[9px] text-slate-500 font-bold">目標 %</label>
                    <input type="number" value={item.target_pct} onChange={e=>onChange(item.id, 'target_pct', e.target.value)} onBlur={onBlur} className="bg-white p-1.5 rounded-lg text-center w-20 text-xs font-bold text-slate-800 shadow-sm border border-slate-300"/>
                </div>

                {showAdvanced && (
                    <div className="animate-in fade-in slide-in-from-top-1 duration-200 mt-2 pt-2 border-t border-slate-200">
                        <div className="grid grid-cols-2 gap-2 text-[10px] font-bold text-slate-400 mb-1">
                            <div className="col-span-1 text-center bg-slate-200 rounded">平時監控</div>
                            <div className="col-span-1 text-center bg-blue-100 text-blue-600 rounded">季度再平衡</div>
                        </div>
                        <div className="grid grid-cols-4 gap-2">
                            <div className="col-span-1"><input type="number" value={item.tol_up_d} onChange={e=>onChange(item.id, 'tol_up_d', e.target.value)} onBlur={onBlur} className="bg-white p-1 rounded-lg text-center w-full text-[10px] font-bold text-red-600 border border-slate-300" placeholder="漲%賣"/></div>
                            <div className="col-span-1"><input type="number" value={item.tol_down_d} onChange={e=>onChange(item.id, 'tol_down_d', e.target.value)} onBlur={onBlur} className="bg-white p-1 rounded-lg text-center w-full text-[10px] font-bold text-emerald-600 border border-slate-300" placeholder="跌%買"/></div>
                            <div className="col-span-1"><input type="number" value={item.tol_up_q} onChange={e=>onChange(item.id, 'tol_up_q', e.target.value)} onBlur={onBlur} className="bg-blue-50 p-1 rounded-lg text-center w-full text-[10px] font-bold text-blue-600 border border-blue-200" placeholder="季漲%"/></div>
                            <div className="col-span-1"><input type="number" value={item.tol_down_q} onChange={e=>onChange(item.id, 'tol_down_q', e.target.value)} onBlur={onBlur} className="bg-blue-50 p-1 rounded-lg text-center w-full text-[10px] font-bold text-blue-600 border border-blue-200" placeholder="季跌%"/></div>
                        </div>
                    </div>
                )}
            </div>
        );

        // --- Main App Logic ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [prices, setPrices] = useState({});
            const [loadingPrices, setLoadingPrices] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [isSwitching, setIsSwitching] = useState(false);
            const [message, setMessage] = useState(null);
            const [customSyncId, setCustomSyncId] = useState(() => localStorage.getItem('qqq_sync_id') || '');
            const [tempSyncId, setTempSyncId] = useState(customSyncId);
            
            const [isMottoLocked, setIsMottoLocked] = useState(true);
            const [showAdvancedParams, setShowAdvancedParams] = useState(false);
            const [sections, setSections] = useState(() => {
                const defaults = { motto: true, defense: true, asset: true, rebalance: true, holdings: true, options: true };
                try { return { ...defaults, ...JSON.parse(localStorage.getItem('qqq_dashboard_sections')) }; } catch(e) { return defaults; }
            });
            const toggleSection = (key) => setSections(p => { const n = {...p, [key]: !p[key]}; localStorage.setItem('qqq_dashboard_sections', JSON.stringify(n)); return n; });

            const [expandedYears, setExpandedYears] = useState({});
            const toggleYear = (y) => setExpandedYears(prev => ({...prev, [y]: !prev[y]}));
            const [historyTab, setHistoryTab] = useState('nav'); 
            const [chartMode, setChartMode] = useState('DD'); 
            const [benchmarkTicker, setBenchmarkTicker] = useState('QQQ');

            const [modal, setModal] = useState({ type: null, data: null }); 
            const [records, setRecords] = useState([]);
            const [simulatedTotal, setSimulatedTotal] = useState(''); 

            const [inputs, setInputs] = useState({
                motto: '', current_rsi: '', qqq_ath: 0, option_history: [], qqq_sma200: 0, voo_sma200: 0,
                // Core 1 & 2
                ticker_core_1: 'VOO', qty_core_1: 0, target_core_1: 35, target_price_core_1: '',
                ticker_core_2: 'TQQQ', qty_core_2: 0, target_core_2: 35, target_price_core_2: '',
                // Params
                tol_up_core_2_d: 15, tol_down_core_2_d: 15,
                tol_up_core_2_q: 10, tol_down_core_2_q: 5,
                def_buy_pct: 5, def_sell_pct: 3, 
                cash_balance: 0, satellites: [], options_inventory: [],
            });

            const effectiveUserId = customSyncId || (user ? user.uid : null);
            
            useEffect(() => { const init = async () => { await auth.signInAnonymously(); }; init().catch(console.error); return auth.onAuthStateChanged(setUser); }, []);
            
            useEffect(() => { 
                if (!user) return;
                setRecords([]); setInputs(prev => ({ ...prev, satellites: [], option_history: [], options_inventory: [] })); setIsSwitching(true);
                const uid = customSyncId || user.uid;
                const uRecs = db.collection('artifacts').doc(APP_ID).collection('users').doc(uid).collection('trading_records').onSnapshot(s => setRecords(s.docs.map(d => ({id:d.id,...d.data()})))); 
                const uConf = db.collection('artifacts').doc(APP_ID).collection('users').doc(uid).collection('config').doc('current').onSnapshot(s => { 
                    if (s.exists) { 
                        const d = s.data(); 
                        if(!d.satellites) d.satellites = [];
                        if(!d.options_inventory) d.options_inventory = [];
                        if(!d.ticker_core_1) d.ticker_core_1 = 'VOO';
                        if(!d.ticker_core_2) d.ticker_core_2 = 'TQQQ';
                        
                        // Default maps
                        if (d.qty_qqq !== undefined && d.qty_core_2 === undefined) d.qty_core_2 = d.qty_qqq; 
                        if (d.qty_voo !== undefined && d.qty_core_1 === undefined) d.qty_core_1 = d.qty_voo; 
                        
                        setInputs(p => ({...p, ...d})); 
                    }
                    setIsSwitching(false); 
                }); 
                fetchPrices(true);
                return () => { uRecs(); uConf(); };
            }, [user, customSyncId]);

            useEffect(() => {
                if (inputs.ticker_core_1 && inputs.ticker_core_2) fetchPrices();
            }, [inputs.ticker_core_1, inputs.ticker_core_2, inputs.satellites]);

            const fetchPrices = useCallback(async (force = false) => { 
                if (loadingPrices && !force) return; 
                const syms = [...new Set([inputs.ticker_core_1, inputs.ticker_core_2, 'QQQ', 'VOO', 'SGOV', ...inputs.satellites.map(s=>s.ticker), ...inputs.satellites.map(s=>s.trackingTicker)].filter(Boolean).map(s=>s.trim().toUpperCase()))]; 
                setLoadingPrices(true); 
                try { const res = await Promise.allSettled(syms.map(s => fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${FINNHUB_KEY}`).then(r => r.json()).then(d => ({s, p: d.c})))); setPrices(p => ({...p, ...res.reduce((acc, curr) => (curr.status === 'fulfilled' && curr.value.p > 0 ? {...acc, [curr.value.s]: curr.value.p} : acc), {})})); } catch(e) { console.error(e); } finally { setLoadingPrices(false); } 
            }, [inputs.ticker_core_1, inputs.ticker_core_2, inputs.satellites, loadingPrices]);

            const showToast = (txt) => { setMessage(txt); setTimeout(() => setMessage(null), 3000); };
            const handleInputChange = (f, v) => setInputs(p => ({ ...p, [f]: v }));
            const syncToCloud = async (f, v) => { if (user) { const safeV = sanitizeForFirestore(v); await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set({ [f]: safeV }, { merge: true }); } };
            
            const addSatellite = () => { const newSat = { id: Date.now().toString(), ticker: '', qty: 0, target_pct: 5, tol_up_d: 15, tol_down_d: 10, tol_up_q: 10, tol_down_q: 5, target_price: '' }; const newSats = [...(inputs.satellites || []), newSat]; setInputs(p => ({ ...p, satellites: newSats })); syncToCloud('satellites', newSats); };
            const updateSatellite = (id, field, value) => { const newSats = inputs.satellites.map(s => s.id === id ? { ...s, [field]: value } : s); setInputs(p => ({ ...p, satellites: newSats })); if (field === 'ticker') syncToCloud('satellites', newSats); };
            const saveSatellites = () => syncToCloud('satellites', inputs.satellites);
            const deleteSatellite = (id) => { const newSats = inputs.satellites.filter(s => s.id !== id); setInputs(p => ({ ...p, satellites: newSats })); syncToCloud('satellites', newSats); };
            const toggleCashSign = () => { setInputs(prev => { const currentVal = prev.cash_balance; const numVal = parseFloat(currentVal); if (!isNaN(numVal)) { const newVal = numVal * -1; syncToCloud('cash_balance', newVal); return { ...prev, cash_balance: newVal }; } return prev; }); };

            const save = async () => { if (!user || isSaving) return; setIsSaving(true); try { const cleanInputs = sanitizeForFirestore(inputs); if (!cleanInputs.record_date) cleanInputs.record_date = new Date().toISOString().split('T')[0]; const payload = { date: new Date(cleanInputs.record_date).toISOString(), total_equity: metrics.totalCapital || 0, prices: sanitizeForFirestore(prices), inputs: cleanInputs, memo: cleanInputs.record_memo || '' }; await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').add(payload); await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set(cleanInputs, { merge: true }); showToast("儲存成功"); } catch(e) { showToast(`失敗: ${e.message}`); } setIsSaving(false); };
            
            // Delete confirmation wrapper
            const requestDeleteRecord = (id) => {
                setModal({ type: 'DELETE_CONFIRM', data: { id, type: 'RECORD' } });
            };
            const confirmDelete = async () => {
                if (modal.data.type === 'RECORD') {
                    await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').doc(modal.data.id).delete();
                    showToast("紀錄已刪除");
                } else if (modal.data.type === 'OPTION_HISTORY') {
                     const newHist = inputs.option_history.filter(h => h.id !== modal.data.id);
                     setInputs(p => ({...p, option_history: newHist}));
                     await syncToCloud('option_history', newHist);
                     showToast("交易紀錄已刪除");
                }
                setModal({ type: null });
            };

            const updateRecord = async () => { 
                if(!modal.data?.id) return; 
                const updatedInputs = { ...modal.data.inputs, ...modal.temp?.inputs };
                await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').doc(modal.data.id).update({ 
                    total_equity: parseFloat(modal.temp?.equity) || modal.data.total_equity, 
                    date: modal.temp?.date || modal.data.date,
                    inputs: updatedInputs 
                }); 
                setModal({type:null}); showToast("更新成功"); 
            };

            const handleOptionTrade = (type, data) => {
                let newInv = [...(inputs.options_inventory||[])];
                let newHist = [...(inputs.option_history||[])]; 
                const now = new Date().toISOString(); 
                const p = parseFloat(data.newPremium)||0, c = parseFloat(data.contracts)||1;
                
                if (type === 'OPEN') {
                    newInv.push({ id: Date.now(), ticker: data.ticker, type: data.type, strike: data.newStrike, expiry: data.newExpiry, contracts: c, premium: p, delta: data.newDelta });
                    newHist.unshift({ id: Date.now(), date: now, ticker: data.ticker, type: 'OPEN', pnl: p*c*100 });
                } else if (type === 'CLOSE') {
                    const opt = modal.data;
                    const ep = parseFloat(data.exitPrice)||0;
                    newHist.unshift({ id: Date.now(), date: now, ticker: opt.ticker, type: 'CLOSE', pnl: -(ep*opt.contracts*100) });
                    newInv = newInv.filter(o => o.id !== opt.id);
                } else if (type === 'ROLL') {
                    const opt = modal.data;
                    const ep = parseFloat(data.exitPrice)||0;
                    newHist.unshift({ id: Date.now(), date: now, ticker: opt.ticker, type: 'ROLL_CLOSE', pnl: -(ep*opt.contracts*100) });
                    newHist.unshift({ id: Date.now()+1, date: now, ticker: opt.ticker, type: 'ROLL_OPEN', pnl: p*c*100 }); 
                    newInv = newInv.map(o => o.id === opt.id ? { ...o, strike: data.newStrike, expiry: data.newExpiry, premium: p, delta: data.newDelta } : o);
                } else if (type === 'EDIT_INVENTORY') {
                    newInv = newInv.map(o => o.id === modal.data.id ? { ...o, ...data } : o);
                } else if (type === 'EDIT_HISTORY') {
                    newHist = newHist.map(h => h.id === modal.data.id ? { ...h, ...data } : h);
                } else if (type === 'DELETE_HISTORY') {
                    newHist = newHist.filter(h => h.id !== modal.data.id);
                }
                
                setInputs(p => ({...p, options_inventory: newInv, option_history: newHist}));
                syncToCloud('options_inventory', newInv);
                syncToCloud('option_history', newHist);
                setModal({type:null});
                showToast(type === 'DELETE_HISTORY' ? "紀錄已刪除" : "交易已儲存");
            };

            const processHistoryData = (records, optionHistory) => {
                if (!records || records.length === 0) return [];
                const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
                const groups = {};
                sorted.forEach(rec => {
                    const d = new Date(rec.date); const y = d.getFullYear(); const m = d.getMonth() + 1;
                    if (!groups[y]) groups[y] = { records: [], months: {} };
                    groups[y].records.push(rec); if (!groups[y].months[m]) groups[y].months[m] = []; groups[y].months[m].push(rec);
                });
                return Object.keys(groups).sort((a,b) => b-a).map(year => { 
                    const yData = groups[year];
                    const months = Object.keys(yData.months).sort((a,b) => b-a).map(month => { 
                        const mRecs = yData.months[month]; 
                        const mPnl = mRecs[mRecs.length - 1].total_equity - mRecs[0].total_equity;
                        const mOptPnl = optionHistory.filter(t => { const d=new Date(t.date); return d.getFullYear()===parseInt(year) && d.getMonth()+1===parseInt(month); }).reduce((s, t) => s + (parseFloat(t.pnl)||0), 0);
                        return { month, optPnl: mOptPnl }; 
                    });
                    const yOptPnl = optionHistory.filter(t => new Date(t.date).getFullYear() === parseInt(year)).reduce((s, t) => s + (parseFloat(t.pnl)||0), 0);
                    return { year, optPnl: yOptPnl, months };
                });
            };

            const historyGroups = useMemo(() => processHistoryData(records, inputs.option_history || []), [records, inputs.option_history]);

            const metrics = useMemo(() => {
                const getP = (t) => prices[(t || "").toUpperCase()] || 0;
                const getV = (k) => getNum(inputs[k]);
                
                const tickerCore1 = (inputs.ticker_core_1 || 'VOO').toUpperCase(); // Fund Pool
                const tickerCore2 = (inputs.ticker_core_2 || 'TQQQ').toUpperCase(); // Aggressive
                
                let total = getV('cash_balance');
                const valCore1 = getP(tickerCore1) * getV('qty_core_1'); 
                const valCore2 = getP(tickerCore2) * getV('qty_core_2'); 
                const satellites = inputs.satellites || [];
                satellites.forEach(s => total += getP(s.ticker) * getNum(s.qty));
                total += valCore1 + valCore2;
                
                const safeTotal = total > 0 ? total : 1;
                const rebalanceList = [];
                const today = new Date();
                const isQuarterEnd = (today.getMonth() + 1) % 3 === 0 && today.getDate() >= 20;

                const checkItem = (ticker, currentVal, targetPct, tolUpD, tolDownD, tolUpQ, tolDownQ, color) => {
                    const diff = (total * (targetPct / 100)) - currentVal;
                    const pct = (currentVal / safeTotal) * 100;
                    
                    let actionD = '平時無須變動'; let actionDColor = 'text-slate-400 font-medium';
                    let actionQ = isQuarterEnd ? '季末無須變動' : '季末無須變動(預)'; let actionQColor = 'text-slate-400 font-medium';
                    
                    // Daily
                    if (pct > targetPct * (1 + (tolUpD/100))) { actionD = '平時賣'; actionDColor = 'text-red-500 font-black'; } 
                    else if (pct < targetPct * (1 - (tolDownD/100))) { actionD = '平時買'; actionDColor = 'text-emerald-500 font-black'; }
                    
                    // Quarterly
                    if (pct > targetPct * (1 + (tolUpQ/100))) { actionQ = isQuarterEnd ? '季末賣' : '季末賣(預)'; actionQColor = isQuarterEnd ? 'text-amber-500 font-black' : 'text-slate-500 font-bold'; }
                    else if (pct < targetPct * (1 - (tolDownQ/100))) { actionQ = isQuarterEnd ? '季末買' : '季末買(預)'; actionQColor = isQuarterEnd ? 'text-blue-500 font-black' : 'text-slate-500 font-bold'; }

                    rebalanceList.push({ ticker, pct, targetPct, diff, actionD, actionDColor, actionQ, actionQColor, color, currentVal, shareCount: getQty(Math.abs(diff), getP(ticker)).toFixed(0) });
                };

                // Add Core 1 (Fund Pool) manually at end
                const pct1 = (valCore1 / safeTotal) * 100;
                const target1 = getV('target_core_1');
                rebalanceList.push({ ticker: tickerCore1, pct: pct1, targetPct: target1, diff: 0, actionD: '資金調節池', actionDColor: 'text-blue-500 font-bold', actionQ: '', actionQColor: '', color: '#3b82f6', isPool: true, currentVal: valCore1 });

                checkItem(tickerCore2, valCore2, getV('target_core_2'), getV('tol_up_core_2_d')||15, getV('tol_down_core_2_d')||15, getV('tol_up_core_2_q')||10, getV('tol_down_core_2_q')||5, '#8b5cf6');
                satellites.forEach((s, i) => checkItem(s.ticker, getP(s.ticker)*getNum(s.qty), getNum(s.target_pct), getNum(s.tol_up_d)||15, getNum(s.tol_down_d)||10, getNum(s.tol_up_q)||10, getNum(s.tol_down_q)||5, ['#f97316', '#10b981', '#ef4444', '#eab308'][i % 4]));
                rebalanceList.sort((a,b) => b.priority - a.priority);

                const defPrice = getP(tickerCore1); 
                const defSma = getV('voo_sma200'); 
                const buyBuff = getV('def_buy_pct'); 
                const sellBuff = getV('def_sell_pct');
                const buyPrice = defSma * (1 + buyBuff/100);
                const sellPrice = defSma * (1 - sellBuff/100);

                let defenseStatus = { type: 'warning', msg: `震盪觀察：價格位於區間內 (${sellPrice.toFixed(0)} - ${buyPrice.toFixed(0)})` };
                
                if (defSma > 0 && defPrice > 0) {
                    if (defPrice > buyPrice) {
                        defenseStatus = { type: 'opportunity', msg: `多頭確認：${tickerCore1} 站上年線 +${buyBuff}% ($${buyPrice.toFixed(0)})。趨勢向上，維持持有。` };
                    } else if (defPrice < sellPrice) {
                        defenseStatus = { type: 'danger', msg: `空頭確認：${tickerCore1} 跌破年線 -${sellBuff}% ($${sellPrice.toFixed(0)})。建議防禦，賣出攻擊部位，分 6 個月投入大盤。` };
                    }
                }

                // FIXED: Pie Data includes Fund Pool (Core 1) and Cash
                const pieData = [
                    { name: tickerCore1, value: valCore1, fill: '#3b82f6', percent: valCore1/safeTotal }, 
                    { name: tickerCore2, value: valCore2, fill: '#8b5cf6', percent: valCore2/safeTotal },
                    ...satellites.map((s, i) => ({ name: s.ticker, value: getP(s.ticker) * getNum(s.qty), fill: ['#f97316', '#10b981', '#ef4444', '#eab308'][i % 4], percent: (getP(s.ticker)*getNum(s.qty))/safeTotal })),
                    { name: 'Cash', value: Math.max(0, getV('cash_balance')), fill: '#94a3b8', percent: Math.max(0, getV('cash_balance'))/safeTotal }
                ].filter(x => x.value > 1);
                
                let mtd = 0; let gData = [];
                if (records.length) {
                     const sorted = [...records].sort((a,b) => new Date(a.date) - new Date(b.date));
                     let peakEq = 0;
                     gData = sorted.map(r => { 
                        if(r.total_equity > peakEq) peakEq = r.total_equity;
                        const ddAmt = r.total_equity - peakEq;
                        const dd = peakEq > 0 ? (r.total_equity - peakEq) / peakEq * 100 : 0;
                        return { date: r.date, equity: r.total_equity, dd, ddAmt }; 
                    });
                    const startM = sorted.find(r => new Date(r.date).getMonth() === new Date().getMonth() && new Date(r.date).getFullYear() === new Date().getFullYear()) || sorted[sorted.length-1];
                    mtd = startM.total_equity > 0 ? ((total - startM.total_equity) / startM.total_equity) * 100 : 0;
                }

                return { totalCapital: total, pieData, rebalanceList, defenseStatus, performanceStats: { mtd }, graphData: gData, tickerCore1 };
            }, [prices, inputs, records]);
            
            // Calculator Logic
            const calcResults = useMemo(() => {
                if (!simulatedTotal) return [];
                const nTot = metrics.totalCapital + parseFloat(simulatedTotal);
                const res = [];
                const getP = (t) => prices[(t || "").toUpperCase()] || 0;
                const getV = (k) => getNum(inputs[k]);
                const c1Target = nTot * (getV('target_core_1')/100); const c1Curr = getP(inputs.ticker_core_1) * getV('qty_core_1'); res.push({ ticker: inputs.ticker_core_1, amount: c1Target - c1Curr });
                const c2Target = nTot * (getV('target_core_2')/100); const c2Curr = getP(inputs.ticker_core_2) * getV('qty_core_2'); res.push({ ticker: inputs.ticker_core_2, amount: c2Target - c2Curr });
                inputs.satellites.forEach(s => { const sTarget = nTot * (getNum(s.target_pct)/100); const sCurr = getP(s.ticker) * getNum(s.qty); res.push({ ticker: s.ticker, amount: sTarget - sCurr }); });
                return res;
            }, [simulatedTotal, metrics.totalCapital, inputs, prices]);


            return (
                <div className="pb-40 min-h-screen transition-colors duration-300 font-black text-left select-none overflow-x-hidden">
                    {message && <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[60] animate-in fade-in slide-in-from-top-4"><div className="bg-brand-600 text-white px-6 py-3 rounded-full shadow-2xl text-sm flex items-center gap-2"><Icon name="CheckCircle" size={16} /> {message}</div></div>}
                    {isSwitching && <div className="loading-overlay"><div className="w-12 h-12 border-4 border-brand-100 border-t-brand-600 rounded-full animate-spin"></div><div className="text-brand-600 font-black">載入數據中...</div></div>}

                    {modal.type === 'DELETE_CONFIRM' && (<Modal title="確認刪除" icon="Trash2" isOpen={true} onClose={()=>setModal({type:null})}><div className="text-center py-4"><p className="text-slate-600 font-bold mb-4">確定要刪除此筆資料嗎？此動作無法復原。</p><div className="flex gap-2"><button onClick={()=>setModal({type:null})} className="flex-1 bg-slate-200 text-slate-600 py-3 rounded-xl font-bold">取消</button><button onClick={confirmDelete} className="flex-1 bg-red-500 text-white py-3 rounded-xl font-bold hover:bg-red-600">確認刪除</button></div></div></Modal>)}
                    {/* Trade Modal */}
                    {modal.type === 'TRADE' && (
                        <Modal title={modal.subType === 'OPEN' ? "建立選擇權部位" : (modal.subType === 'ROLL' ? "選擇權轉倉" : "平倉")} icon="Zap" isOpen={true} onClose={()=>setModal({type:null})}>
                            <div className="space-y-3">
                                {modal.subType === 'OPEN' && (
                                    <>
                                        <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-500">標的代號</label><input className="w-full bg-f1f5f9 p-2 rounded-lg font-bold" defaultValue={inputs.ticker_core_2} onChange={e=>setModal({...modal, temp: {...modal.temp, ticker: e.target.value.toUpperCase()}})} /></div><div><label className="text-xs text-slate-500">交易類型</label><select className="w-full bg-f1f5f9 p-2 rounded-lg font-bold" onChange={e=>setModal({...modal, temp: {...modal.temp, type: e.target.value}})}><option value="SC">Sell Call</option><option value="SP">Sell Put</option></select></div></div>
                                        <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-500">到期日</label><input type="date" className="w-full bg-f1f5f9 p-2 rounded-lg font-bold text-xs" onChange={e=>setModal({...modal, temp: {...modal.temp, newExpiry: e.target.value}})} /></div><div><label className="text-xs text-slate-500">履約價</label><input type="number" className="w-full bg-f1f5f9 p-2 rounded-lg font-bold" placeholder="Strike" onChange={e=>setModal({...modal, temp: {...modal.temp, newStrike: e.target.value}})} /></div></div>
                                        <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-500">權利金(單股)</label><input type="number" className="w-full bg-f1f5f9 p-2 rounded-lg font-bold" placeholder="0.00" onChange={e=>setModal({...modal, temp: {...modal.temp, newPremium: e.target.value}})} /></div><div><label className="text-xs text-slate-500">張數</label><input type="number" className="w-full bg-f1f5f9 p-2 rounded-lg font-bold" defaultValue={1} onChange={e=>setModal({...modal, temp: {...modal.temp, contracts: e.target.value}})} /></div></div>
                                        <div className="bg-emerald-50 p-2 rounded-lg text-center text-emerald-600 font-bold text-sm">預估收入: ${((parseFloat(modal.temp?.newPremium)||0) * (parseFloat(modal.temp?.contracts)||1) * 100).toFixed(0)}</div>
                                        <button onClick={()=>handleOptionTrade('OPEN', modal.temp)} className="w-full bg-brand-600 text-white py-3 rounded-xl font-bold mt-2">確認建立</button>
                                    </>
                                )}
                                {modal.subType === 'CLOSE' && (
                                    <>
                                        <input className="bg-f1f5f9 p-3 w-full rounded-xl font-black text-center text-xl" type="number" placeholder="買回價格" autoFocus onChange={e=>setModal({...modal, temp: {...modal.temp, exitPrice: e.target.value}})} />
                                        <button onClick={()=>handleOptionTrade('CLOSE', modal.temp)} className="w-full bg-brand-600 text-white py-3 rounded-xl font-bold mt-2">確認平倉</button>
                                    </>
                                )}
                                {modal.subType === 'ROLL' && (
                                    <>
                                        <div className="bg-slate-50 p-2 rounded-lg mb-2 text-xs"><span className="font-bold">Step 1: 平倉舊合約</span><input className="mt-1 bg-white border border-slate-300 p-2 w-full rounded-lg font-bold text-center" type="number" placeholder="買回價格" autoFocus onChange={e=>setModal({...modal, temp: {...modal.temp, exitPrice: e.target.value}})} /></div>
                                        <div className="bg-slate-50 p-2 rounded-lg text-xs"><span className="font-bold block mb-1">Step 2: 建立新合約</span><div className="grid grid-cols-2 gap-2"><input className="bg-white p-2 rounded border border-slate-300" type="date" onChange={e=>setModal({...modal, temp: {...modal.temp, newExpiry: e.target.value}})} /><input className="bg-white p-2 rounded border border-slate-300" type="number" placeholder="新 Strike" onChange={e=>setModal({...modal, temp: {...modal.temp, newStrike: e.target.value}})} /><input className="bg-white p-2 rounded border border-slate-300" type="number" placeholder="新權利金" onChange={e=>setModal({...modal, temp: {...modal.temp, newPremium: e.target.value}})} /><div className="p-2 flex items-center justify-center text-slate-400 font-bold">{modal.data.contracts} 張</div></div></div>
                                        <button onClick={()=>handleOptionTrade('ROLL', modal.temp)} className="w-full bg-brand-600 text-white py-3 rounded-xl font-bold mt-2">確認轉倉</button>
                                    </>
                                )}
                            </div>
                        </Modal>
                    )}
                    
                    {modal.type === 'EDIT_INVENTORY' && (<Modal title="編輯部位" icon="Edit2" isOpen={true} onClose={()=>setModal({type:null})}><div className="space-y-3"><div className="grid grid-cols-2 gap-2"><input className="bg-f1f5f9 p-2 rounded-lg font-bold" defaultValue={modal.data.ticker} onChange={e=>setModal({...modal, temp: {...modal.temp, ticker: e.target.value.toUpperCase()}})} /><select className="bg-f1f5f9 p-2 rounded-lg font-bold" defaultValue={modal.data.type} onChange={e=>setModal({...modal, temp: {...modal.temp, type: e.target.value}})}><option value="SC">Sell Call</option><option value="SP">Sell Put</option></select></div><div className="grid grid-cols-2 gap-2"><input className="bg-f1f5f9 p-2 rounded-lg font-bold" type="number" defaultValue={modal.data.strike} onChange={e=>setModal({...modal, temp: {...modal.temp, strike: e.target.value}})} /><input className="bg-f1f5f9 p-2 rounded-lg font-bold" type="date" defaultValue={modal.data.expiry} onChange={e=>setModal({...modal, temp: {...modal.temp, expiry: e.target.value}})} /></div><button onClick={()=>handleOptionTrade('EDIT_INVENTORY', modal.temp)} className="w-full bg-brand-600 text-white py-3 rounded-xl font-bold">儲存修改</button></div></Modal>)}

                    {modal.type === 'EDIT_RECORD' && (

                                    <div className="space-y-2">

                                <button onClick={updateRecord} className="w-full bg-brand-600 text-white py-3 rounded-xl font-bold mt-2">儲存修正</button>
                            </div>
                        </Modal>

                    <header className="fixed top-0 inset-x-0 bg-f8fafc z-50 px-5 py-4 pt-6 flex justify-between items-center shadow-sm border-b border-e2e8f0">

                                    <div className="h-64 relative mb-4">
                                        <ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={metrics.pieData} innerRadius={60} outerRadius={80} paddingAngle={2} dataKey="value">{metrics.pieData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.fill} />)}</Pie><Tooltip content={<CustomPieTooltip />} /></PieChart></ResponsiveContainer>
                                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none"><div className="text-[10px] text-slate-400 font-bold uppercase">TOTAL</div><div className="text-sm font-black text-slate-700">${(metrics.totalCapital/1000).toFixed(1)}k</div></div>
                                    </div>
                                    <div className="bg-f8fafc rounded-xl border border-slate-200 overflow-hidden">

                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </CollapsibleCard>

                                        {(inputs.satellites || []).map(s => <HoldingRow key={s.id} conf={s} inputs={inputs} prices={prices} onChange={(id, f, v) => { const newSats = inputs.satellites.map(si => si.id === id ? { ...si, [f]: v } : si); setInputs(p => ({ ...p, satellites: newSats })); if(f==='ticker') syncToCloud('satellites', newSats); }} onBlur={()=>syncToCloud('satellites', inputs.satellites)} isDynamic={true} />)}

                                </CollapsibleCard>

                                <CollapsibleCard title="選擇權帳本" icon="Zap" isOpen={sections.options} onToggle={()=>toggleSection('options')} rightElement={<button onClick={(e)=>{e.stopPropagation(); setModal({type:'TRADE', subType:'OPEN', temp:{}});}} className="text-[10px] bg-brand-600 text-white px-3 py-1 rounded-lg font-bold shadow-sm">+ 新建</button>}>

                                        {(inputs.options_inventory || []).map(opt => (

                                                    <div className="font-black text-xs text-slate-700">{opt.ticker} {opt.strike} {opt.type}</div>

                                                    <button onClick={()=>setModal({type:'TRADE', subType:'CLOSE', data: opt, temp: {}})} className="bg-white border border-slate-200 text-xs px-3 py-1 rounded-lg font-bold text-slate-600 shadow-sm">平倉</button>
                                                </div>
                                            </div>

                                        <div className="bg-purple-50 p-3 rounded-xl border border-purple-100">

                                                        <div className="col-span-1"><input type="number" value={inputs.tol_down_core_2_d} onChange={e=>handleInputChange('tol_down_core_2_d',e.target.value)} onBlur={e=>syncToCloud('tol_down_core_2_d',e.target.value)} className="bg-white p-1 rounded-lg text-center w-full text-xs font-bold text-emerald-600 border border-slate-300" placeholder="跌%買"/></div>
                                                        <div className="col-span-1"><input type="number" value={inputs.tol_up_core_2_q} onChange={e=>handleInputChange('tol_up_core_2_q',e.target.value)} onBlur={e=>syncToCloud('tol_up_core_2_q',e.target.value)} className="bg-blue-50 p-1 rounded-lg text-center w-full text-xs font-bold text-blue-600 border border-blue-200" placeholder="季漲%"/></div>
                                                        <div className="col-span-1"><input type="number" value={inputs.tol_down_core_2_q} onChange={e=>handleInputChange('tol_down_core_2_q',e.target.value)} onBlur={e=>syncToCloud('tol_down_core_2_q',e.target.value)} className="bg-blue-50 p-1 rounded-lg text-center w-full text-xs font-bold text-blue-600 border border-blue-200" placeholder="季跌%"/></div>
                                                    </div>
                                                </div>

                                                <div><label className="text-[9px] text-red-500 block mb-1 text-center">跌破 -% 賣出</label><input type="number" value={inputs.def_sell_pct} onChange={e=>handleInputChange('def_sell_pct',e.target.value)} onBlur={e=>syncToCloud('def_sell_pct',e.target.value)} className="bg-white p-2 rounded-lg text-center w-full font-bold shadow-inner border border-slate-300 text-red-600"/></div>
                                            </div>
                                        </div>
                                    </div>
                                </Card>
                                <Card className="border-none shadow-heavy" noPadding={true}>
                                    <SectionHeader title="衛星策略參數" iconName="Activity" isOpen={true} rightElement={<button onClick={()=>setShowAdvancedParams(!showAdvancedParams)} className={`px-3 py-1 rounded-lg text-[10px] font-bold transition-all ${showAdvancedParams ? 'bg-brand-100 text-brand-600' : 'bg-slate-100 text-slate-500'}`}>{showAdvancedParams ? '隱藏進階' : '⚙️ 顯示進階設定'}</button>} />
                                    <div className="section-body bg-white space-y-3">

                                    </div>
                                </Card>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="space-y-6 animate-in fade-in">
                                <div className="flex bg-slate-200 rounded-2xl p-1"><button onClick={()=>setHistoryTab('nav')} className={`flex-1 py-2.5 rounded-xl text-xs font-black ${historyTab==='nav'?'bg-white shadow text-brand-600':'text-slate-500'}`}>資產走勢</button><button onClick={()=>setHistoryTab('income')} className={`flex-1 py-2.5 rounded-xl text-xs font-black ${historyTab==='income'?'bg-white shadow text-amber-500':'text-slate-500'}`}>選擇權收益</button></div>
                                
                                {historyTab === 'nav' && (
                                    <>
                                        <Card className="h-72 p-2 border-none shadow-heavy">
                                            <div className="flex justify-between items-center px-4 pt-2 mb-1">
                                                <div className="text-xs font-black text-slate-500">總資產趨勢</div>
                                            </div>
                                            <ResponsiveContainer>
                                                <ComposedChart data={metrics.graphData} margin={{top:10,right:0,left:0,bottom:0}}>
                                                    <defs>
                                                        <linearGradient id="colorEq" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3}/><stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/></linearGradient>
                                                        <linearGradient id="colorDD" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#ef4444" stopOpacity={0.1}/><stop offset="95%" stopColor="#ef4444" stopOpacity={0.3}/></linearGradient>
                                                    </defs>
                                                    <XAxis dataKey="date" tickFormatter={v=>new Date(v).toLocaleDateString(undefined,{month:'numeric',day:'numeric'})} tick={{fontSize:10, fill:'#94a3b8'}}/>
                                                    <YAxis yAxisId="left" tickFormatter={v=>`${(v/1000).toFixed(0)}k`} tick={{fontSize:10, fill:'#94a3b8'}}/>
                                                    <YAxis yAxisId="right" orientation="right" tickFormatter={v=>`${v.toFixed(0)}%`} tick={{fontSize:10, fill:'#ef4444'}} hide/>
                                                    <Tooltip content={<CustomGraphTooltip />} cursor={{ stroke: '#cbd5e1', strokeWidth: 1 }} />
                                                    <Area yAxisId="left" type="monotone" dataKey="equity" stroke="#3b82f6" strokeWidth={2} fill="url(#colorEq)" name="總資產"/>
                                                    <Area yAxisId="right" type="monotone" dataKey="dd" stroke="none" fill="url(#colorDD)" name="最大跌幅"/>
                                                </ComposedChart>
                                            </ResponsiveContainer>
                                        </Card>
                                        <div className="pt-4 border-t border-slate-200">
                                            <div className="flex justify-between items-center px-2 mb-2"><SectionTitle title="詳細績效紀錄" iconName="List" /></div>
                                            <div className="space-y-2">
                                                {records.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0, 10).map((r, idx, arr) => {
                                                    const prev = arr[idx+1];
                                                    const change = prev ? ((r.total_equity - prev.total_equity)/prev.total_equity)*100 : 0;
                                                    return (
                                                        <div key={r.id} className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                                            <div className="flex justify-between items-center mb-2">
                                                                <div>
                                                                    <div className="text-xs font-black text-slate-700">{new Date(r.date).toLocaleDateString()}</div>
                                                                    <div className="flex gap-2 items-end">
                                                                        <div className="text-[10px] text-slate-400 font-mono">${r.total_equity.toLocaleString()}</div>
                                                                        {idx < arr.length-1 && <div className={`text-[9px] font-bold ${change>=0?'text-emerald-500':'text-red-500'}`}>{change>0?'+':''}{change.toFixed(1)}%</div>}
                                                                    </div>
                                                                </div>
                                                                <div className="flex gap-2">
                                                                    <button onClick={()=>setModal({type:'EDIT_RECORD', data: r, temp: {}})} className="p-2 text-brand-400 hover:bg-brand-50 rounded-lg"><Icon name="Edit2" size={14}/></button>
                                                                    <button onClick={()=>requestDeleteRecord(r.id)} className="p-2 text-red-400 hover:bg-red-50 rounded-lg"><Icon name="Trash2" size={14}/></button>
                                                                </div>
                                                            </div>
                                                            {r.inputs && (
                                                                <div className="flex flex-wrap gap-2 text-[9px] text-slate-500 bg-slate-50 p-2 rounded-lg border border-slate-100">
                                                                    <span className="font-bold text-blue-600">{inputs.ticker_core_1}: {r.inputs.qty_core_1||r.inputs.qty_voo||0}</span>
                                                                    <span className="font-bold text-purple-600">{inputs.ticker_core_2}: {r.inputs.qty_core_2||r.inputs.qty_qqq||0}</span>
                                                                    <span className="font-bold text-slate-600">Cash: ${parseInt(r.inputs.cash_balance||0).toLocaleString()}</span>
                                                                    {(r.inputs.satellites||[]).map(s => <span key={s.id} className="text-slate-400">{s.ticker}: {s.qty}</span>)}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </>
                                )}

                                {historyTab === 'income' && (
                                    <>
                                        <Card className="bg-amber-50 border border-amber-100 shadow-sm p-5 text-center">
                                            <div className="text-xs font-black text-amber-600 uppercase mb-1">歷史已實現總權利金</div>
                                            <div className="text-3xl font-black font-mono text-slate-800">${(inputs.option_history||[]).reduce((a,b)=>a+(parseFloat(b.pnl)||0),0).toLocaleString()}</div>
                                        </Card>
                                        <div className="space-y-3">
                                            {historyGroups.map(g => (
                                                <div key={g.year} className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-heavy">
                                                    <div onClick={() => toggleYear(g.year)} className="p-4 flex justify-between items-center cursor-pointer bg-white hover:bg-slate-50 transition-colors">
                                                        <div className="font-bold text-slate-700 flex items-center gap-2"><span className="bg-brand-100 text-brand-700 px-2 py-0.5 rounded text-xs">{g.year}</span></div>
                                                        <div className="text-emerald-500 font-mono font-black">+${g.optPnl.toLocaleString()} <Icon name={expandedYears[g.year] ? "ChevronUp" : "ChevronDown"} size={16} className="text-slate-400"/></div>
                                                    </div>
                                                    {expandedYears[g.year] && <div className="border-t border-slate-100">
                                                        {g.months.map(m => (
                                                            <div key={m.month} className="p-3 px-5 border-b border-slate-50 last:border-0 hover:bg-f1f5f9">
                                                                <div className="flex justify-between items-center mb-2">
                                                                    <span className="text-xs font-bold text-slate-500">{m.month} 月</span>
                                                                    <span className="text-xs font-black text-emerald-500">+${m.optPnl.toLocaleString()}</span>
                                                                </div>
                                                                <div className="space-y-1 pl-2 border-l-2 border-slate-200">
                                                                    {(inputs.option_history||[]).filter(t => { const d=new Date(t.date); return d.getFullYear()===parseInt(g.year) && d.getMonth()+1===parseInt(m.month); }).map(t => (
                                                                        <div key={t.id} className="flex justify-between items-center text-[10px]">
                                                                            <span className="text-slate-600">{new Date(t.date).getDate()}日 {t.ticker} {t.type} <span className="text-slate-400 ml-1">@{t.strike}</span></span>
                                                                            <div className="flex items-center gap-2">
                                                                                <span className={t.pnl>=0?'text-emerald-500 font-bold':'text-red-500 font-bold'}>{t.pnl>0?'+':''}{t.pnl}</span>
                                                                                <button onClick={()=>setModal({type:'EDIT_HISTORY', data: t, temp: {}})} className="text-slate-300 hover:text-brand-500"><Icon name="Edit2" size={10}/></button>
                                                                            </div>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>}
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}
                            </div>
                        )}

                        {view === 'sync_settings' && (
                            <div className="space-y-6 animate-in fade-in">
                                {/* Calculator Card */}
                                <Card className="border-none shadow-heavy" noPadding={true}>
                                    <SectionHeader title="資金分配計算機" iconName="Calculator" isOpen={true} />
                                    <div className="section-body bg-white space-y-4">
                                        <div className="flex items-center gap-2 border-b border-slate-100 pb-4">
                                            <span className="text-lg font-black text-slate-300">$</span>
                                            <input type="number" placeholder="輸入新投入金額..." value={simulatedTotal} onChange={e=>setSimulatedTotal(e.target.value)} className="w-full text-xl font-black text-slate-800 outline-none placeholder-slate-200" />
                                        </div>
                                        {calcResults.length > 0 && (
                                            <div className="space-y-2">
                                                {calcResults.map(r => (
                                                    <div key={r.ticker} className="flex justify-between items-center p-3 bg-f8fafc rounded-xl border border-slate-100">
                                                        <span className="font-bold text-xs text-slate-600">{r.ticker}</span>
                                                        <div className="text-right">
                                                            <div className={`font-mono font-black text-sm ${r.amount > 0 ? 'text-emerald-500' : 'text-slate-400'}`}>
                                                                {r.amount > 0 ? '+' : ''}{Math.round(r.amount).toLocaleString()}
                                                            </div>
                                                            <div className="text-[9px] text-slate-400">
                                                                (目標: {inputs.satellites.find(s=>s.ticker===r.ticker)?.target_pct || (r.ticker===inputs.ticker_core_1?inputs.target_core_1:inputs.target_core_2)}%)
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </Card>

                                <div className="bg-white rounded-[2rem] border border-slate-200 overflow-hidden shadow-heavy"><div className="p-6 pt-6 space-y-4 bg-white"><div className="text-center font-mono text-lg text-slate-800">{effectiveUserId}</div><div className="flex gap-2"><input value={tempSyncId} onChange={e=>setTempSyncId(e.target.value)} className="flex-1 bg-f1f5f9 p-3 rounded-xl shadow-inner border border-slate-300" placeholder="ID" /><button onClick={()=>{setCustomSyncId(tempSyncId);localStorage.setItem('qqq_sync_id',tempSyncId);showToast("已切換")}} className="bg-brand-600 text-white px-4 rounded-xl hover:bg-brand-700 transition-colors shadow-lg shadow-brand-500/30">OK</button></div></div></div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-50 py-4 pb-10 flex justify-around shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                        {[{id:'dashboard',icon:'LayoutDashboard',l:'儀表板'},{id:'parameters',icon:'Sliders',l:'參數'},{id:'history',icon:'TrendingUp',l:'績效'},{id:'sync_settings',icon:'Fingerprint',l:'帳號'}].map(t => <button key={t.id} onClick={()=>{setView(t.id);}} className={`flex flex-col items-center gap-1 flex-1 transition-all active:scale-90 ${view===t.id?'text-brand-600 border-t-2 border-brand-600 -mt-4 pt-2':'text-slate-400'}`}><Icon name={t.icon} size={24}/><span className="text-[10px] uppercase font-black">{t.l}</span></button>)}
                    </nav>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
