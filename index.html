        const FIXED_HOLDINGS = [

        const getNum = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

        // --- BASE COMPONENTS ---

                Edit2: <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>, Trash2: <g><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></g>, 
                X: <g><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></g>, BookOpen: <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>, 
                PieChartIcon: <g><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></g>, MessageSquare: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>, 
                Fingerprint: <g><path d="M2 12C2 6.48 6.48 2 12 2s10 4.48 10 10"/><path d="M12 12v3"/><path d="M16 17.5c-2.5 1.5-5.5 1.5-8 0"/></g>, Calculator: <g><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></g>, 
                AlertCircle: <g><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></g>, Sun: <circle cx="12" cy="12" r="5" />, 
                Moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>, Scale: <g><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></g>, 
                ArrowLeftRight: <path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/>, Calendar: <g><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></g>, 
                Lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>, Unlock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 9.9-1" /></g>, 
                Repeat: <path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/>, 
                ChevronDown: <path d="m6 9 6 6 6-6"/>, ChevronUp: <path d="m18 15-6-6-6 6"/>, Shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,

                Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>, Plus: <path d="M12 5v14M5 12h14"/>, Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>, 
                Coins: <g><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></g>,
                List: <g><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></g>,
                Sliders: <g><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="1" x2="7" y1="14" y2="14"/><line x1="9" x2="15" y1="8" y2="8"/><line x1="17" x2="23" y1="16" y2="16"/></g>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || <circle cx="12" cy="12" r="10" />}</svg>;
        });

        // --- COMPONENTS ---
        const Card = ({ children, className = "", onClick }) => <div onClick={onClick} className={`rounded-[2rem] shadow-xl border p-5 transition-all bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 ${className} ${onClick ? 'cursor-pointer hover:scale-[1.01]' : ''}`}>{children}</div>;
        const SectionTitle = ({ title, iconName }) => <h2 className="text-[11px] font-black mb-3 flex items-center gap-2 uppercase tracking-widest text-slate-500 dark:text-slate-400"><Icon name={iconName} size={14} /> {title}</h2>;
        const CustomTooltip = ({ active, payload }) => active && payload && payload.length ? <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl shadow-xl text-xs font-black"><p className="mb-1 text-slate-500">{payload[0].payload.name}</p><p className="text-lg mb-2 text-slate-800 dark:text-slate-100 font-mono">${payload[0].payload.value.toLocaleString()}</p><p className="text-slate-400">{payload[0].payload.percentage}%</p></div> : null;

        const HoldingRow = memo(({ conf, inputs, prices, onChange, onBlur, isDynamic = false }) => {
            let ticker = '';
            if (isDynamic) {
                ticker = (conf.ticker || 'N/A').toUpperCase();
            } else if (conf.type === 'fixed') {
                ticker = conf.ticker;
            } else {
                ticker = (inputs[conf.tickerKey] || conf.defaultTicker).toUpperCase();
            }
            const price = prices[ticker] || 0;
            const targetPrice = isDynamic ? conf.targetPrice : inputs[conf.targetKey];
            const diff = getDiff(price, targetPrice);
            const handleTickerChange = (v) => isDynamic ? onChange(conf.id, 'ticker', v.toUpperCase()) : onChange(conf.tickerKey, v.toUpperCase());
            const handleQtyChange = (v) => isDynamic ? onChange(conf.id, 'qty', v) : onChange(conf.qtyKey, v);
            const handleTargetPriceChange = (v) => isDynamic ? onChange(conf.id, 'targetPrice', v) : onChange(conf.targetKey, v);
            const handleBlur = (field, v) => isDynamic ? onBlur() : onBlur(field, v);
            const colorClass = isDynamic ? 'text-emerald-500' : (conf.color || 'text-slate-500');

            return (
                <div className="holding-input-group grid grid-cols-12 gap-1 items-center p-1 relative group">
                    <div className="col-span-3 flex flex-col justify-center px-2 border-r border-slate-200 dark:border-slate-700">
                        {(!isDynamic && conf.type === 'fixed') ? <span className={`text-xs font-black font-mono tracking-tight text-slate-700 dark:text-slate-200`}>{ticker}</span> : <input type="text" value={isDynamic ? conf.ticker : inputs[conf.tickerKey]} onChange={e => handleTickerChange(e.target.value)} onBlur={() => handleBlur('ticker')} className={`w-full text-xs font-black bg-transparent p-0 outline-none text-left font-mono tracking-tight uppercase ${colorClass}`} placeholder={isDynamic ? "代號" : conf.defaultTicker} />}
                        <span className={`text-[9px] font-mono ${colorClass}`}>${price.toFixed(1)}</span>
                    </div>
                    <input type="number" placeholder="0" value={isDynamic ? conf.qty : inputs[conf.qtyKey]} onChange={e => handleQtyChange(e.target.value)} onBlur={() => handleBlur('qty')} className="col-span-3 bg-transparent font-black text-sm h-10 font-mono focus:bg-white dark:focus:bg-slate-800" />
                    <input type="number" placeholder="-" value={targetPrice} onChange={e => handleTargetPriceChange(e.target.value)} onBlur={() => handleBlur('target')} className={`col-span-3 bg-transparent font-bold text-xs h-10 font-mono ${colorClass} focus:bg-white dark:focus:bg-slate-800`} />
                    <div className={`col-span-3 text-center text-xs font-black font-mono ${diff && diff > 0 ? 'text-emerald-500' : 'text-red-400'}`}>{diff ? `${diff > 0 ? '+' : ''}${diff.toFixed(1)}%` : '-'}</div>
                </div>
            );
        });

        const SatSettingsRow = ({ item, onChange, onDelete, onBlur }) => (
             <div className="grid grid-cols-12 gap-2 text-center items-center mb-2 relative bg-slate-50 dark:bg-slate-800/50 p-2 rounded-xl border border-slate-200 dark:border-slate-700">
                <div className="col-span-12 flex justify-between items-center mb-1"><div className="flex gap-2 items-center"><div className="flex flex-col text-left"><label className="text-[9px] text-slate-400">持倉 (Held)</label><input value={item.ticker} onChange={e=>onChange(item.id, 'ticker', e.target.value.toUpperCase())} onBlur={onBlur} className="font-black text-xs w-16 bg-transparent outline-none uppercase text-emerald-600 dark:text-emerald-400" placeholder="TSLL"/></div><div className="text-slate-300">/</div><div className="flex flex-col text-left"><label className="text-[9px] text-slate-400">對標 (Track)</label><input value={item.trackingTicker || item.ticker} onChange={e=>onChange(item.id, 'trackingTicker', e.target.value.toUpperCase())} onBlur={onBlur} className="font-black text-xs w-16 bg-transparent outline-none uppercase text-indigo-600 dark:text-indigo-400" placeholder="TSLA"/></div></div><button onClick={() => onDelete(item.id)} className="w-6 h-6 bg-red-100 dark:bg-red-900/30 text-red-500 rounded-full flex items-center justify-center hover:bg-red-200"><Icon name="X" size={12}/></button></div>
                <div className="col-span-4 flex flex-col"><label className="text-[9px] text-slate-400">佔比%</label><input type="number" value={item.target_pct} onChange={e=>onChange(item.id, 'target_pct', e.target.value)} onBlur={onBlur} className="bg-white dark:bg-slate-700 p-1 rounded-lg text-center w-full text-xs font-bold"/></div>
                <div className="col-span-4 flex flex-col"><label className="text-[9px] text-slate-400">均線</label><input type="number" placeholder="SMA" value={item.sma_track} onChange={e=>onChange(item.id, 'sma_track', e.target.value)} onBlur={onBlur} className="bg-white dark:bg-slate-700 p-1 rounded-lg text-center w-full text-xs font-bold"/></div>
                <div className="col-span-4 flex flex-col"><label className="text-[9px] text-slate-400">容許%</label><div className="flex gap-1"><input type="number" value={item.tol_up} onChange={e=>onChange(item.id, 'tol_up', e.target.value)} onBlur={onBlur} className="bg-white dark:bg-slate-700 p-1 rounded-lg text-center w-full text-[10px] text-red-400"/><input type="number" value={item.tol_down} onChange={e=>onChange(item.id, 'tol_down', e.target.value)} onBlur={onBlur} className="bg-white dark:bg-slate-700 p-1 rounded-lg text-center w-full text-[10px] text-blue-400"/></div></div>
            </div>
        );

        // --- MODALS ---
        const TradeActionModal = ({ type, targetId, inputs, prices, onClose, onExecute }) => {
            const [local, setLocal] = useState({ ticker:'TQQQ', type:'SC', contracts:1, newPremium:0, exitPrice:0, newStrike:'', newExpiry:'', newDelta:'' });
            useEffect(() => { if(type==='ROLL' || type==='CLOSE') { const t = inputs.options_inventory.find(o=>o.id===targetId); if(t) setLocal(p=>({...p, ticker:t.ticker, contracts:t.contracts, newStrike:t.strike})); } }, [targetId]);
            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center">
                    <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl animate-in slide-in-from-bottom-full">
                        <h3 className="text-xl font-black mb-4 flex items-center gap-2"><Icon name={type==='OPEN'?'Plus':type==='ROLL'?'RefreshCcw':'CheckCircle'} className="text-indigo-500"/> {type==='OPEN'?'新建倉位':type==='ROLL'?'選擇權轉倉':'選擇權平倉'}</h3>
                        {type === 'OPEN' && (<div className="space-y-3"><div className="grid grid-cols-2 gap-2"><div><label className="text-xs font-bold text-slate-500">標的</label><input value={local.ticker} onChange={e=>setLocal({...local,ticker:e.target.value.toUpperCase()})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-black"/></div><div><label className="text-xs font-bold text-slate-500">類型</label><select value={local.type} onChange={e=>setLocal({...local,type:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"><option value="SC">Sell Call</option><option value="SP">Sell Put</option></select></div></div>{local.type === 'SP' && <div className={`p-2 rounded-lg text-center text-xs font-bold ${prices['QQQ']>inputs.qqq_sma20?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}`}>{prices['QQQ']>inputs.qqq_sma20?'🔥 強勢盤：Delta -0.30':'🌊 震盪盤：Delta -0.20'}</div>}<div className="grid grid-cols-2 gap-2"><input type="number" placeholder="Strike" value={local.newStrike} onChange={e=>setLocal({...local,newStrike:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"/><input type="date" value={local.newExpiry} onChange={e=>setLocal({...local,newExpiry:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold text-xs"/></div><div className="grid grid-cols-2 gap-2"><input type="number" placeholder="張數" value={local.contracts} onChange={e=>setLocal({...local,contracts:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"/><input type="number" placeholder="權利金" value={local.newPremium} onChange={e=>setLocal({...local,newPremium:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"/></div><input type="number" placeholder="Delta" value={local.newDelta} onChange={e=>setLocal({...local,newDelta:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"/></div>)}
                        {type === 'CLOSE' && <div><label className="text-xs font-bold text-slate-500">買回價格</label><input type="number" autoFocus value={local.exitPrice} onChange={e=>setLocal({...local,exitPrice:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-center font-black text-xl" /></div>}
                        {type === 'ROLL' && <div className="space-y-3"><div className="bg-slate-50 dark:bg-slate-800/50 p-2 rounded-lg mb-2"><label className="text-[10px] font-bold text-slate-400 uppercase">Step 1: 平倉舊合約</label><div className="flex justify-between items-center mt-1"><span className="text-xs font-bold">買回價格</span><input type="number" autoFocus value={local.exitPrice} onChange={e=>setLocal({...local,exitPrice:e.target.value})} className="w-24 bg-white dark:bg-slate-700 p-1 rounded text-center font-bold" /></div></div><div className="bg-slate-50 dark:bg-slate-800/50 p-2 rounded-lg"><label className="text-[10px] font-bold text-slate-400 uppercase">Step 2: 建立新合約</label><div className="grid grid-cols-2 gap-2 mt-1"><input type="number" placeholder="新權利金" value={local.newPremium} onChange={e=>setLocal({...local,newPremium:e.target.value})} className="bg-white dark:bg-slate-700 p-1 rounded text-center text-xs font-bold"/><input type="number" placeholder="新 Strike" value={local.newStrike} onChange={e=>setLocal({...local,newStrike:e.target.value})} className="bg-white dark:bg-slate-700 p-1 rounded text-center text-xs font-bold"/><input type="date" value={local.newExpiry} onChange={e=>setLocal({...local,newExpiry:e.target.value})} className="bg-white dark:bg-slate-700 p-1 rounded text-center text-xs font-bold"/><input type="number" placeholder="新 Delta" value={local.newDelta} onChange={e=>setLocal({...local,newDelta:e.target.value})} className="bg-white dark:bg-slate-700 p-1 rounded text-center text-xs font-bold"/></div></div></div>}
                        <div className="flex gap-2 mt-4"><button onClick={onClose} className="flex-1 bg-slate-200 dark:bg-slate-800 text-slate-500 py-3 rounded-xl font-bold">取消</button><button onClick={()=>onExecute(type, local)} className="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold">確認執行</button></div>
                    </div>
                </div>
            );
        };

        const EditInventoryModal = ({ item, onClose, onSave, onDelete }) => {
            const [l, setL] = useState({...item});
            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-2xl">
                        <div className="flex justify-between items-center mb-4"><h3 className="text-lg font-black flex gap-2"><Icon name="Edit2"/> 編輯持倉</h3><button onClick={onClose}><Icon name="X"/></button></div>
                        <div className="space-y-3">
                            <div className="grid grid-cols-2 gap-2"><input value={l.ticker} onChange={e=>setL({...l,ticker:e.target.value.toUpperCase()})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold"/><select value={l.type} onChange={e=>setL({...l,type:e.target.value})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold"><option value="SC">Sell Call</option><option value="SP">Sell Put</option></select></div>
                            <div className="grid grid-cols-2 gap-2"><input type="number" value={l.strike} onChange={e=>setL({...l,strike:e.target.value})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold"/><input type="date" value={l.expiry} onChange={e=>setL({...l,expiry:e.target.value})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold"/></div>
                            <div className="grid grid-cols-3 gap-2"><input type="number" value={l.contracts} onChange={e=>setL({...l,contracts:e.target.value})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold text-center"/><input type="number" value={l.premium} onChange={e=>setL({...l,premium:e.target.value})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold text-center"/><input type="number" value={l.delta} onChange={e=>setL({...l,delta:e.target.value})} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg font-bold text-center"/></div>
                            <div className="flex gap-2 mt-4"><button onClick={()=>onDelete(l.id)} className="p-3 bg-red-100 text-red-500 rounded-xl"><Icon name="Trash2"/></button><button onClick={()=>onSave(l)} className="flex-1 bg-indigo-600 text-white rounded-xl font-bold">儲存</button></div>
                        </div>
                    </div>
                </div>
            );
        };

        const EditOptionHistoryModal = ({ trade, onClose, onSave, onDelete }) => {
            const [localTrade, setLocalTrade] = useState({...trade});
            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-2xl animate-in fade-in">
                        <div className="flex justify-between items-center mb-4"><h3 className="text-lg font-black flex gap-2"><Icon name="Edit2"/> 編輯交易</h3><button onClick={onClose}><Icon name="X"/></button></div>
                        <div className="space-y-3">
                            <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-500 block">日期</label><input type="date" value={localTrade.date?.split('T')[0]} onChange={e=>setLocalTrade({...localTrade, date: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold"/></div><div><label className="text-xs text-slate-500 block">標的</label><input value={localTrade.ticker} onChange={e=>setLocalTrade({...localTrade, ticker: e.target.value.toUpperCase()})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold"/></div></div>
                            <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-500 block">動作</label><select value={localTrade.type} onChange={e=>setLocalTrade({...localTrade, type: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold"><option value="OPEN">建倉</option><option value="CLOSE">平倉</option><option value="ROLL_CLOSE">轉倉(平)</option><option value="ROLL_OPEN">轉倉(開)</option><option value="MANUAL">補登</option></select></div><div><label className="text-xs text-slate-500 block">金額 ($)</label><input type="number" step="any" value={localTrade.pnl} onChange={e=>setLocalTrade({...localTrade, pnl: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold text-center" /></div></div>
                            <div className="text-[10px] text-center text-slate-400 mt-1">正數 (+) = 收入, 負數 (-) = 支出</div>
                            <div className="flex gap-2 mt-4"><button onClick={()=>onDelete(localTrade.id)} className="p-3 bg-red-100 text-red-500 rounded-xl"><Icon name="Trash2"/></button><button onClick={()=>onSave({...localTrade, pnl: parseFloat(localTrade.pnl) || 0})} className="flex-1 bg-indigo-600 text-white rounded-xl font-bold">儲存</button></div>
                        </div>
                    </div>
                </div>
            );
        };

        const EditRecordModal = ({ editingId, editForm, setEditingId, setEditForm, saveEdit }) => {
            if (!editingId || !editForm) return null;
            const toggleCashSign = () => {
                setEditForm(prev => {
                    const currentVal = parseFloat(prev.inputs.cash_balance);
                    if (!isNaN(currentVal)) {
                         return { ...prev, inputs: { ...prev.inputs, cash_balance: currentVal * -1 } };
                    }
                    return prev;
                });
            };

            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center">
                    <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
                        <div className="flex justify-between items-center mb-6 border-b pb-4 dark:border-slate-800"><h3 className="text-xl font-black flex items-center gap-2"><Icon name="Edit2" size={20} className="text-indigo-500" /> 編輯紀錄</h3><button onClick={() => setEditingId(null)} className="p-2 bg-slate-100 dark:bg-slate-800 rounded-full"><Icon name="X" size={20} /></button></div>
                        <div className="space-y-2">
                            {FIXED_HOLDINGS.map(c => { const t=c.type==='fixed'?c.ticker:(editForm.inputs[c.tickerKey]||c.defaultTicker); return <div key={c.id} className="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-2 px-3 rounded-xl border border-slate-100 dark:border-slate-700"><span className={`font-bold text-xs ${c.color}`}>{t}</span><input type="number" value={editForm.inputs[c.qtyKey]} onChange={e => setEditForm(p => ({...p, inputs: {...p.inputs, [c.qtyKey]: e.target.value}}))} className="w-24 bg-white dark:bg-slate-900 border rounded-lg px-2 py-1 text-right font-mono font-bold" /></div>; })}
                            
                            {/* Migration Safety: Check if satellites exist */}
                            {(editForm.inputs.satellites || []).map(s => (
                                <div key={s.id} className="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-2 px-3 rounded-xl border border-slate-100 dark:border-slate-700">
                                    <span className="font-bold text-xs text-emerald-500">{s.ticker}</span>
                                    <input type="number" value={s.qty} onChange={e => {
                                        const newSats = editForm.inputs.satellites.map(si => si.id === s.id ? {...si, qty: e.target.value} : si);
                                        setEditForm(p => ({...p, inputs: {...p.inputs, satellites: newSats}}));
                                    }} className="w-24 bg-white dark:bg-slate-900 border rounded-lg px-2 py-1 text-right font-mono font-bold" />
                                </div>
                            ))}

                            <div className="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-2 px-3 rounded-xl">
                                <span className="font-bold text-xs text-slate-500">現金</span>
                                <div className="relative w-32">
                                    <input type="text" inputMode="decimal" value={editForm.inputs.cash_balance} onChange={e => setEditForm(p => ({...p, inputs: {...p.inputs, cash_balance: e.target.value}}))} className={`w-full bg-white dark:bg-slate-900 border rounded-lg px-2 py-1 text-right font-mono font-bold ${parseFloat(editForm.inputs.cash_balance) < 0 ? 'text-red-500' : ''}`} />
                                    <button onClick={toggleCashSign} className="absolute left-1 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 font-bold bg-slate-200 dark:bg-slate-700 px-1 rounded active:scale-95">+/-</button>
                                </div>
                            </div>
                            
                            <textarea value={editForm.memo || ''} onChange={e => setEditForm(p => ({...p, memo: e.target.value}))} className="w-full bg-slate-50 dark:bg-slate-800 border-2 rounded-2xl p-4 text-sm h-20 mt-2" placeholder="備註..." />
                            <button onClick={()=>saveEdit({...editForm, inputs: {...editForm.inputs, total_realized_premium: parseFloat(editForm.inputs.total_realized_premium) || 0}})} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black flex justify-center gap-2 mt-2"><Icon name="Save" size={20} /> 保存修正</button>
                        </div>
                    </div>
                </div>
            );
        };

        const calculatePortfolioMetrics = (prices, inputs, records, simulatedTotal, filterMode, stressSimPct, simLeverage) => {
            const getP = (t) => prices[(t || "").toUpperCase()] || 0;
            const getV = (k) => getNum(inputs[k]);
            
            let total = getV('cash_balance');
            
            FIXED_HOLDINGS.forEach(c => total += (c.type === 'fixed' ? getP(c.ticker) : getP(inputs[c.tickerKey])) * getV(c.qtyKey));
            
            const satellites = inputs.satellites || [];
            satellites.forEach(s => total += getP(s.ticker) * getNum(s.qty));

            let ytd = 0, mtd = 0, tot = 0, gData = [];
            if (records.length) {
                const sorted = [...records].sort((a,b) => new Date(a.date) - new Date(b.date));
                const now = new Date();
                const getRet = (rec) => rec.total_equity > 0 ? ((total - rec.total_equity) / rec.total_equity) * 100 : 0;
                tot = getRet(sorted[0]);
                const startY = sorted.find(r => new Date(r.date).getFullYear() === now.getFullYear()) || sorted[0];
                ytd = getRet(startY);
                const startM = sorted.find(r => new Date(r.date).getMonth() === now.getMonth() && new Date(r.date).getFullYear() === now.getFullYear()) || sorted[0];
                mtd = getRet(startM);
                const baseEq = sorted[0].total_equity || 1;
                let maxEq = 0;
                gData = sorted.filter(r => { const d=new Date(r.date), n=new Date(); return filterMode==='all' || (filterMode==='year' && d.getFullYear()===n.getFullYear()) || (filterMode==='month' && d.getMonth()===n.getMonth()); }).map(r => { if(r.total_equity > maxEq) maxEq = r.total_equity; return { date: r.date, equity: r.total_equity, dd: maxEq>0 ? ((r.total_equity-maxEq)/maxEq)*100 : 0, ret: ((r.total_equity-baseEq)/baseEq)*100 }; });
            }

            const tCore = (inputs.ticker_core_1 || "QQQ").toUpperCase();
            const valQQQ = getP(tCore) * getV('qty_qqq');
            const valTQQQ = getP('TQQQ') * getV('qty_tqqq');
            const valCore = valQQQ + valTQQQ;
            const tqqqRatio = valCore > 0 ? (valTQQQ / valCore) * 100 : 0;
            const qqqRatio = valCore > 0 ? (valQQQ / valCore) * 100 : 0;
            const valIbit = getP('IBIT') * getV('qty_ibit');
            const ibitW = (valIbit / (total||1)) * 100;

            let totalSatPctTarget = 0;
            const satStatus = satellites.map(s => {
                const val = getP(s.ticker) * getNum(s.qty);
                const weight = (val / (total||1)) * 100;
                const target = getNum(s.target_pct);
                totalSatPctTarget += target;
                const up = getNum(s.tol_up) || 20; 
                const down = getNum(s.tol_down) || 10;
                let status = 'ok';
                if (weight > target * (1 + up/100)) status = 'high';
                if (weight < target * (1 - down/100)) status = 'low';
                
                const trackTicker = (s.trackingTicker || s.ticker).toUpperCase();
                const trackPrice = getP(trackTicker);
                const sma = getNum(s.sma_track);
                const distToSma = (sma > 0 && trackPrice > 0) ? ((trackPrice - sma) / sma) * 100 : null;
                
                const rsiVal = parseFloat(s.current_rsi) || 0;
                let rsiSuggestion = { cover: 0, delta: '-', contracts: 0 };
                if (rsiVal > 0 && inputs.options_matrix) {
                    const rule = inputs.options_matrix.find(r => rsiVal >= r.min && rsiVal < r.max);
                    if (rule) {
                        const contracts = Math.floor((getNum(s.qty) / 100) * (rule.cover / 100));
                        rsiSuggestion = { cover: rule.cover, delta: rule.delta, contracts };
                    }
                }

                return { ...s, val, weight, status, trackTicker, trackPrice, distToSma, rsiSuggestion };
            });

            const ibitTarget = getV('target_sat_ibit');
            const coreTargetAlloc = Math.max(0, 100 - totalSatPctTarget - ibitTarget);
            const tqqqInCoreTarget = getV('rebalance_core_target');

            const checkSat = (w, target, up, down) => {
                const u = getNum(up) || 20; const d = getNum(down) || 10;
                if (w > target * (1 + u/100)) return 'high';
                if (w < target * (1 - d/100)) return 'low';
                return 'ok';
            };
            const statIbit = checkSat(ibitW, ibitTarget, inputs.tol_up_ibit, inputs.tol_down_ibit);

            const sma200 = getV('qqq_sma200');
            const benchmarkPrice = getP('QQQ'); 
            const isBear = sma200 > 0 && benchmarkPrice > 0 && benchmarkPrice < (sma200 * 0.97); 
            const bearData = { isActive: isBear, totalDefensive: getV('cash_balance') + (getP('SGOV') * getV('qty_sgov')), monthlyBuy: (getV('cash_balance') + (getP('SGOV') * getV('qty_sgov'))) / 12 };

            const rsi = getNum(inputs.current_rsi);
            let sug = { cover: 0, delta: 'N/A' };
            if (rsi > 0 && inputs.options_matrix) {
                const rule = inputs.options_matrix.find(r => rsi >= r.min && rsi < r.max);
                if (rule) sug = { cover: rule.cover, delta: rule.delta };
            }
            const suggestContracts = Math.floor((getV('qty_tqqq') / 100) * (sug.cover / 100));

            const simDrop = stressSimPct / 100;
            const safeBenchmarkPrice = benchmarkPrice > 0 ? benchmarkPrice : 0;
            const simPrice = safeBenchmarkPrice * (1 + simDrop);
            const simulatedPnL = total * simDrop * simLeverage;
            const simulatedTotalAsset = total + simulatedPnL;

            let calcResults = [];
            if (simulatedTotal) {
                const inj = parseFloat(simulatedTotal);
                if (!isNaN(inj)) {
                    const nTot = total + inj;
                    const tIbitVal = nTot * (ibitTarget / 100);
                    const tCoreVal = nTot * (coreTargetAlloc / 100);
                    const tTQQQVal = tCoreVal * (tqqqInCoreTarget / 100);
                    const tQQQVal = tCoreVal * (1 - tqqqInCoreTarget / 100);
                    
                    const calcDiff = (targetVal, currentVal, ticker) => { 
                        const p = getP(ticker); return { ticker, diff: targetVal - currentVal, qty: p>0 ? (targetVal - currentVal)/p : 0, action: (targetVal - currentVal) > 0 ? 'Buy' : 'Sell' }; 
                    };
                    calcResults = [
                        calcDiff(tTQQQVal, valTQQQ, 'TQQQ'),
                        calcDiff(tQQQVal, valQQQ, tCore),
                        calcDiff(tIbitVal, valIbit, 'IBIT'),
                        ...satellites.map(s => {
                            const tVal = nTot * (getNum(s.target_pct) / 100);
                            const cVal = getP(s.ticker) * getNum(s.qty);
                            return calcDiff(tVal, cVal, s.ticker);
                        })
                    ];
                }
            }

            const satPie = satellites.map(s => ({ name: s.ticker, value: getP(s.ticker) * getNum(s.qty), color: '#10b981' }));
            const fixedPie = FIXED_HOLDINGS.map(c => ({ name: c.type==='fixed'?c.ticker:inputs[c.tickerKey]||c.defaultTicker, value: (c.type==='fixed'?getP(c.ticker):getP(inputs[c.tickerKey])) * getV(c.qtyKey), color: c.hex }));
            const cashPie = {name:'現金', value: getV('cash_balance'), color:'#94a3b8'};
            const pieData = [...fixedPie, ...satPie, cashPie].filter(x=>x.value>0).map((p,_,arr) => ({...p, percentage: ((p.value/arr.reduce((a,b)=>a+b.value,0))*100).toFixed(1)}));

            return {
                totalCapital: total,
                performanceStats: { ytd, mtd, total: tot },
                rebalanceStatus: { tqqqRatio, qqqRatio, valCore, valQQQ, valTQQQ, valIbit, isCoreImbalanced: Math.abs(tqqqRatio - tqqqInCoreTarget) > getV('rebalance_core_tolerance'), tqqqInCoreTarget, ibitW: ibitW.toFixed(1), statIbit, satellites: satStatus, coreTargetAlloc },
                bearDefense: bearData,
                currentLeverage: (total>0 ? ((valTQQQ*3) + valQQQ + satellites.reduce((a,b)=>a+b.val,0) + valIbit)/total : 0).toFixed(2),
                pieData, calcResults, rsiSuggestion: { ...sug, contracts: suggestContracts },
                qqqAthMetrics: { toMA200: (sma200>0&&benchmarkPrice>0)?((sma200-benchmarkPrice)/benchmarkPrice)*100:null, toATH: (getV('qqq_ath')>0&&benchmarkPrice>0)?((getV('qqq_ath')-benchmarkPrice)/benchmarkPrice)*100:null, ath: getV('qqq_ath'), currentPrice: benchmarkPrice, sma200 },
                graphData: gData, simulatedMetrics: { simPrice, simulatedPnL, simulatedTotalAsset }
            };
        };

        const processHistoryData = (records, optionHistory) => {
            if (!records || records.length === 0) return [];
            const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
            const groups = {};
            sorted.forEach(rec => {
                const d = new Date(rec.date); const y = d.getFullYear(); const m = d.getMonth() + 1;
                if (!groups[y]) groups[y] = { records: [], months: {} };
                groups[y].records.push(rec); if (!groups[y].months[m]) groups[y].months[m] = []; groups[y].months[m].push(rec);
            });
            return Object.keys(groups).sort((a,b) => b-a).map(year => { 
                const yData = groups[year]; const yPnl = yData.records[yData.records.length - 1].total_equity - yData.records[0].total_equity; const yOptPnl = optionHistory.filter(t => new Date(t.date).getFullYear() === parseInt(year)).reduce((s, t) => s + (parseFloat(t.pnl)||0), 0);
                const months = Object.keys(yData.months).sort((a,b) => b-a).map(month => { const mRecs = yData.months[month]; const mPnl = mRecs[mRecs.length - 1].total_equity - mRecs[0].total_equity; const mOptPnl = optionHistory.filter(t => { const d=new Date(t.date); return d.getFullYear()===parseInt(year) && d.getMonth()+1===parseInt(month); }).reduce((s, t) => s + (parseFloat(t.pnl)||0), 0); return { month, return: mRecs[0].total_equity > 0 ? (mPnl/mRecs[0].total_equity)*100 : 0, pnl: mPnl, optPnl: mOptPnl }; });
                return { year, return: yData.records[0].total_equity>0?(yPnl/yData.records[0].total_equity)*100:0, pnl: yPnl, optPnl: yOptPnl, optCont: yPnl!==0?(yOptPnl/Math.abs(yPnl))*100:0, months };
            });
        };

        const generateSystemAlerts = (status, bear, total, prices, inputs) => {
            const a = [];
            const getP = (t) => prices[(t || "").toUpperCase()] || 0;
            const getQty = (val, price) => (price > 0 ? Math.abs(val / price) : 0);

            if (status.isCoreImbalanced) {
                const targetTQQQVal = status.valCore * (status.tqqqInCoreTarget / 100);
                const diffVal = targetTQQQVal - status.valTQQQ;
                a.push({ type: 'warning', title: '【TQQQ】 核心再平衡', msg: `目前 ${status.tqqqRatio.toFixed(1)}% (目標 ${status.tqqqInCoreTarget}%)。`});
            }

            const checkSma = (ticker, sma) => {
                const price = getP(ticker);
                const smaVal = getNum(sma);
                if (price > 0 && smaVal > 0 && price < smaVal) {
                    a.push({ type: 'danger', title: `【${ticker}】 跌破均線`, msg: `對標 ${ticker} 現價 $${price} 已跌破設定均線 ($${smaVal})。` });
                }
            };

            if (status.satellites) {
                status.satellites.forEach(s => {
                    if (s.sma_track) checkSma(s.trackTicker, s.sma_track);
                    if (s.status !== 'ok') {
                        a.push({ type: s.status==='high'?'opportunity':'warning', title: `【${s.ticker}】 ${s.status==='high'?'高於上限':'低於下限'}`, msg: `目前 ${s.weight.toFixed(1)}% (目標${s.target_pct}%)。`});
                    }
                });
            }

            if (inputs.ibit_sma20) checkSma('IBIT', inputs.ibit_sma20);
            if (bear.isActive) a.push({ type: 'danger', title: '【QQQ】 熊市防禦', msg: `QQQ < 200 SMA`});
            return a;
        };

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [records, setRecords] = useState([]);
            const [prices, setPrices] = useState({});
            const [loadingPrices, setLoadingPrices] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [message, setMessage] = useState(null);
            const [historyTab, setHistoryTab] = useState('nav'); 
            const [chartMode, setChartMode] = useState('NAV_DD');
            const [filterMode, setFilterMode] = useState('all');
            const [expandedYears, setExpandedYears] = useState({});
            const [historyExpanded, setHistoryExpanded] = useState(false);
            const [optionHistoryExpanded, setOptionHistoryExpanded] = useState(false);
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('qqq_theme') === 'dark');
            const [customSyncId, setCustomSyncId] = useState(() => localStorage.getItem('qqq_sync_id') || '');
            const [tempSyncId, setTempSyncId] = useState(customSyncId);
            
            const [openSettings, setSettings] = useState({ account: true, system: false });
            const [isAlertsView, setIsAlertsView] = useState(false);
            const [isMottoLocked, setIsMottoLocked] = useState(true);
            const [isStrategyEditing, setIsStrategyEditing] = useState(false);
            const [isCalcOpen, setIsCalcOpen] = useState(false); 
            const [dashboardSections, setSections] = useState({ simulator: true, rebalance: true, holdings: true, pie: true, rsiHelper: true }); 
            const [simulatedTotal, setSimulatedTotal] = useState('');
            const [stressSimPct, setStressSimPct] = useState(0); 
            const [simLeverage, setSimLeverage] = useState(3); 

            const [openModalType, setOpenModalType] = useState(null);
            const [targetOptionId, setTargetOptionId] = useState(null);
            const [editingTrade, setEditingTrade] = useState(null);
            const [editingInventoryItem, setEditingInventoryItem] = useState(null);
            const [editingId, setEditingId] = useState(null); 
            const [editForm, setEditForm] = useState(null); 

            const [inputs, setInputs] = useState({
                current_rsi: '', qqq_ath: 0, option_history: [], qqq_sma200: 0, qqq_sma20: 0, ibit_sma20: 0,
                exchange_rate: 32.5, rebalance_core_target: 50, rebalance_core_tolerance: 15,
                tol_up_ibit: 20, tol_down_ibit: 10, target_sat_ibit: 10,
                ticker_core_1: 'QQQ', qty_qqq: 0, qty_tqqq: 0, qty_ibit: 0, qty_sgov: 0,
                cash_balance: 0, record_date: new Date().toISOString().split('T')[0],
                loan_amount: 0, loan_rate: 2.0, loan_years: 7, loan_repay_target: 20, loan_entry_valuation: 0,
                satellites: [], 
                options_matrix: [ { min: 0, max: 40, cover: 0, delta: '< 0.05 (禁止)' }, { min: 40, max: 60, cover: 30, delta: '0.10 - 0.12' }, { min: 60, max: 75, cover: 50, delta: '0.12 - 0.15' }, { min: 75, max: 100, cover: 70, delta: '0.20 - 0.25' } ],
                options_inventory: [] 
            });

            const effectiveUserId = customSyncId || (user ? user.uid : null);
            useEffect(() => { const init = async () => { await auth.signInAnonymously(); }; init().catch(console.error); return auth.onAuthStateChanged(setUser); }, []);
            
            useEffect(() => { 
                if (!user) return;
                const uid = customSyncId || user.uid;
                const uRecs = db.collection('artifacts').doc(APP_ID).collection('users').doc(uid).collection('trading_records').onSnapshot(s => setRecords(s.docs.map(d => ({id:d.id,...d.data()})))); 
                const uConf = db.collection('artifacts').doc(APP_ID).collection('users').doc(uid).collection('config').doc('current').onSnapshot(s => { 
                    if (s.exists) { 
                        const d = s.data(); 
                        d.record_date = new Date().toISOString().split('T')[0]; 
                        if(!d.option_history) d.option_history=[]; 
                        if (!d.satellites) d.satellites = [];
                        setInputs(p => ({...p, ...d})); 
                    }
                }); 
                fetchPrices(); 
                return () => { uRecs(); uConf(); };
            }, [user, customSyncId]);

            useEffect(() => { document.documentElement.className = darkMode ? 'dark' : 'light'; }, [darkMode]);

            const metrics = useMemo(() => calculatePortfolioMetrics(prices, inputs, records, simulatedTotal, filterMode, stressSimPct, simLeverage), [prices, inputs, records, filterMode, simulatedTotal, stressSimPct, simLeverage]);
            const historyGroups = useMemo(() => processHistoryData(records, inputs.option_history || []), [records, inputs.option_history]);
            const alerts = useMemo(() => generateSystemAlerts(metrics.rebalanceStatus, metrics.bearDefense, metrics.totalCapital, prices, inputs), [metrics, prices, inputs]);
            const totalRealizedPremium = useMemo(() => (inputs.option_history || []).reduce((acc, curr) => acc + (parseFloat(curr.pnl) || 0), 0), [inputs.option_history]);
            const ltv = inputs.loan_amount > 0 && metrics.totalCapital > 0 ? (inputs.loan_amount / metrics.totalCapital) * 100 : 0;

            const showToast = (txt) => { setMessage(txt); setTimeout(() => setMessage(null), 3000); };
            const handleInputChange = (f, v) => setInputs(p => ({ ...p, [f]: v }));
            const handleMatrixChange = (idx, field, val) => { const newM = [...inputs.options_matrix]; newM[idx][field] = val; setInputs(p => ({...p, options_matrix: newM})); syncToCloud('options_matrix', newM); };
            const syncToCloud = async (f, v) => { if (user) { const safeV = sanitizeForFirestore(v); await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set({ [f]: safeV }, { merge: true }); } };
            
            const addSatellite = () => { const newSat = { id: Date.now().toString(), ticker: '', trackingTicker: '', qty: 0, targetPrice: '', target_pct: 5, tol_up: 20, tol_down: 10, sma_track: '' }; const newSats = [...(inputs.satellites || []), newSat]; setInputs(p => ({ ...p, satellites: newSats })); syncToCloud('satellites', newSats); };
            const updateSatellite = (id, field, value) => { 
                const safeValue = value === undefined ? '' : value; 
                const newSats = inputs.satellites.map(s => s.id === id ? { ...s, [field]: safeValue } : s); 
                setInputs(p => ({ ...p, satellites: newSats }));
                if (field === 'current_rsi') syncToCloud('satellites', newSats); 
            };
            const saveSatellites = () => syncToCloud('satellites', inputs.satellites);
            const deleteSatellite = (id) => { const newSats = inputs.satellites.filter(s => s.id !== id); setInputs(p => ({ ...p, satellites: newSats })); syncToCloud('satellites', newSats); };

            const toggleYear = (y) => setExpandedYears(prev => ({...prev, [y]: !prev[y]}));
            
            const removeOption = (id) => {
                const newInv = inputs.options_inventory.filter(o => o.id !== id);
                setInputs(p => ({...p, options_inventory: newInv}));
                syncToCloud('options_inventory', newInv);
            };

            const toggleCashSign = () => {
                setInputs(prev => {
                    const currentVal = prev.cash_balance;
                    const numVal = parseFloat(currentVal);
                    if (!isNaN(numVal)) {
                        const newVal = numVal * -1;
                        syncToCloud('cash_balance', newVal);
                        return { ...prev, cash_balance: newVal };
                    }
                    return prev;
                });
            };

            const fetchPrices = useCallback(async (force = false) => { 
                if (loadingPrices) return; 
                const CACHE_KEY = 'qqq_price_cache_v12'; 
                const satTickers = (inputs.satellites || []).flatMap(s => [s.ticker, s.trackingTicker]).filter(Boolean);
                const syms = [...new Set(['QQQ', 'QQQM', 'TQQQ', 'IBIT', 'SGOV', (inputs.ticker_core_1||"QQQ"), ...satTickers].filter(Boolean).map(s=>s.trim().toUpperCase()))]; 
                if (!force) { const c = localStorage.getItem(CACHE_KEY); if (c) { const { timestamp, data } = JSON.parse(c); if (Date.now() - timestamp < 300000 && syms.every(s => data[s] !== undefined)) { setPrices(data); return; } } } 
                setLoadingPrices(true); 
                try { const res = await Promise.allSettled(syms.map(s => fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${FINNHUB_KEY}`).then(r => r.json()).then(d => ({s, p: d.c})))); setPrices(p => { const upd = {...p, ...res.reduce((acc, curr) => (curr.status === 'fulfilled' && curr.value.p > 0 ? {...acc, [curr.value.s]: curr.value.p} : acc), {})}; localStorage.setItem(CACHE_KEY, JSON.stringify({timestamp: Date.now(), data: upd})); return upd; }); } catch(e) { console.error(e); } finally { setLoadingPrices(false); } 
            }, [inputs.ticker_core_1, inputs.satellites, loadingPrices]);

            const handleExecuteTrade = (type, data) => { 
                let newInv = [...(inputs.options_inventory||[])], newHist = [...(inputs.option_history||[])]; 
                const now = new Date().toISOString(); 
                const p = parseFloat(data.newPremium)||0, c = parseFloat(data.contracts)||1, ep = parseFloat(data.exitPrice)||0; 
                if (type === 'OPEN') { 
                    newHist.unshift({ id: Date.now(), date: now, ticker: data.ticker, type: 'OPEN', pnl: p*c*100 }); 
                    newInv.push({ id: Date.now(), type: data.type, ticker: data.ticker, strike: data.newStrike, expiry: data.newExpiry, contracts: c, premium: p, delta: data.newDelta }); 
                    showToast(`建倉成功！收入: +$${(p*c*100).toFixed(0)}`); 
                } else if (type === 'CLOSE') { 
                    const opt = newInv.find(o => o.id === targetOptionId); if(!opt) return; 
                    newHist.unshift({ id: Date.now(), date: now, ticker: opt.ticker, type: 'CLOSE', pnl: -(ep*opt.contracts*100) }); 
                    newInv = newInv.filter(o => o.id !== targetOptionId); 
                    showToast(`平倉成功！支出: $${(ep*opt.contracts*100).toFixed(0)}`); 
                } else if (type === 'ROLL') { 
                    const opt = newInv.find(o => o.id === targetOptionId); if(!opt) return; 
                    newHist.unshift({ id: Date.now()+1, date: now, ticker: opt.ticker, type: 'ROLL_OPEN', pnl: p*opt.contracts*100 }); 
                    newHist.unshift({ id: Date.now(), date: now, ticker: opt.ticker, type: 'ROLL_CLOSE', pnl: -(ep*opt.contracts*100) }); 
                    newInv = newInv.map(o => o.id === targetOptionId ? { ...o, strike: data.newStrike, expiry: data.newExpiry, premium: p, delta: data.newDelta } : o); 
                    showToast(`轉倉成功！`); 
                } 
                setInputs(prev => ({...prev, options_inventory: newInv, option_history: newHist})); 
                if (user) {
                    const safeInv = sanitizeForFirestore(newInv);
                    const safeHist = sanitizeForFirestore(newHist);
                    db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set({ options_inventory: safeInv, option_history: safeHist }, { merge: true }); 
                }
                setOpenModalType(null); 
            };
            const confirmDelete = async (id) => { await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').doc(id).delete(); showToast("已刪除"); };
            const handleTradeSave = (updatedTrade) => { let newHistory = inputs.option_history.map(t => t.id === updatedTrade.id ? updatedTrade : t); setInputs(p => ({...p, option_history: newHistory})); syncToCloud('option_history', newHistory); setEditingTrade(null); showToast("交易紀錄已更新"); };
            const handleTradeDelete = (id) => { const newHistory = inputs.option_history.filter(t => t.id !== id); setInputs(p => ({...p, option_history: newHistory})); syncToCloud('option_history', newHistory); setEditingTrade(null); showToast("交易紀錄已刪除"); };

            const save = async () => { 
                if (!user || isSaving) return; 
                setIsSaving(true); 
                try {
                    const cleanInputs = sanitizeForFirestore(inputs);
                    const cleanPrices = sanitizeForFirestore(prices);
                    if (!cleanInputs.record_date) cleanInputs.record_date = new Date().toISOString().split('T')[0];
                    const payload = { date: new Date(cleanInputs.record_date).toISOString(), total_equity: metrics.totalCapital || 0, total_realized_premium: totalRealizedPremium, prices: cleanPrices, inputs: cleanInputs, memo: cleanInputs.record_memo || '' };
                    await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').add(payload); 
                    await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set(cleanInputs, { merge: true });
                    showToast("同步成功"); setInputs(p=>({...p, record_memo: ''})); 
                } catch(e) { console.error("Save Error:", e); showToast(`失敗: ${e.message}`); } 
                setIsSaving(false); 
            };

            return (
                <div className="pb-40 min-h-screen transition-colors duration-300 font-black text-left select-none overflow-x-hidden">
                    {message && <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[60] animate-in fade-in slide-in-from-top-4"><div className="bg-indigo-600 text-white px-6 py-3 rounded-full shadow-2xl text-sm flex items-center gap-2"><Icon name="CheckCircle" size={16} /> {message}</div></div>}
                    
                    <EditRecordModal editingId={editingId} editForm={editForm} setEditingId={setEditingId} setEditForm={setEditForm} saveEdit={async () => { await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').doc(editingId).update({ inputs: editForm.inputs, memo: editForm.memo }); setEditingId(null); showToast("更新成功"); }} />
                    {editingInventoryItem && <EditInventoryModal item={editingInventoryItem} onClose={()=>setEditingInventoryItem(null)} onSave={(i)=>{const nInv = inputs.options_inventory.some(o=>o.id===i.id)?inputs.options_inventory.map(o=>o.id===i.id?i:o):[...inputs.options_inventory,i]; setInputs(p=>({...p,options_inventory:nInv})); syncToCloud('options_inventory',nInv); setEditingInventoryItem(null);}} onDelete={(id)=>{const nInv=inputs.options_inventory.filter(o=>o.id!==id); setInputs(p=>({...p,options_inventory:nInv})); syncToCloud('options_inventory',nInv); setEditingInventoryItem(null);}} />}
                    {editingTrade && <EditOptionHistoryModal trade={editingTrade} onClose={()=>setEditingTrade(null)} onSave={handleTradeSave} onDelete={handleTradeDelete} />}
                    {openModalType && <TradeActionModal type={openModalType} targetId={targetOptionId} inputs={inputs} prices={prices} onClose={()=>{setOpenModalType(null);}} onExecute={handleExecuteTrade} />}

                    <header className="fixed top-0 inset-x-0 bg-indigo-900 dark:bg-slate-950 z-50 px-5 py-4 pt-6 flex justify-between items-center shadow-lg text-white">
                        <div className="flex items-center gap-2 font-black"><div className="bg-white p-2 rounded-2xl shadow-sm"><Icon name="TrendingUp" className="text-indigo-900" size={18} /></div><h1 className="text-lg">Alpha Horizon</h1></div>
                        <div className="flex gap-2"><button onClick={() => setView('sync_settings')} className="p-2.5 rounded-xl bg-white text-slate-700 shadow-sm"><Icon name="Settings" size={20} /></button><div className="flex items-center gap-1.5 ml-1"><button onClick={() => fetchPrices(true)} className="p-2 text-white/80"><Icon name="RefreshCcw" size={22} className={loadingPrices ? 'animate-spin' : ''} /></button><div className={`w-3.5 h-3.5 rounded-full border-2 ${loadingPrices ? 'bg-red-500 sync-loading' : 'bg-emerald-500'}`}></div></div></div>
                    </header>

                    <main className="max-w-md mx-auto p-4 pt-28 space-y-6">
                        {view === 'dashboard' && (
                            <div className="space-y-6 animate-in fade-in">
                                <Card className="p-4 bg-gradient-to-r from-slate-800 to-indigo-900 text-white border-none">
                                    <div className="flex justify-between items-start mb-2">
                                        <div className="flex gap-2 opacity-80">
                                            <Icon name={isAlertsView ? "ShieldAlert" : "Quote"} size={16} />
                                            <span className="text-[10px] tracking-widest font-bold">{isAlertsView ? "策略警示" : "投資座右銘"}</span>
                                        </div>
                                        <div className="flex gap-2">
                                             {!isAlertsView && <button onClick={() => setIsMottoLocked(!isMottoLocked)} className="p-1 bg-white/20 rounded-full"><Icon name={isMottoLocked?"Lock":"Unlock"} size={10}/></button>}
                                             <button onClick={() => setIsAlertsView(!isAlertsView)} className={`p-1 bg-white/20 rounded-full ${alerts.length>0?'bg-red-500/80':''}`}><Icon name="AlertCircle" size={12}/></button>
                                        </div>
                                    </div>
                                    {isAlertsView ? (
                                        alerts.length ? alerts.map((a,i)=><div key={i} className={`p-3 rounded-xl mb-2 text-xs font-bold border-l-4 shadow-sm ${a.type==='danger'?'bg-red-50 text-red-800 border-red-500 dark:bg-red-900/30 dark:text-red-200':a.type==='opportunity'?'bg-emerald-50 text-emerald-800 border-emerald-500 dark:bg-emerald-900/30 dark:text-emerald-200':'bg-amber-50 text-amber-800 border-amber-500 dark:bg-amber-900/30 dark:text-amber-200'}`}>{a.type==='danger'?'🔴':(a.type==='opportunity'?'🟢':'🟡')} {a.title}<div className="font-medium opacity-80 mt-1 ml-5 leading-relaxed">{a.msg}</div></div>) : <div className="text-center opacity-70 text-xs py-4">目前無策略警示</div>
                                    ) : (
                                        <textarea value={inputs.motto} readOnly={isMottoLocked} onChange={e=>handleInputChange('motto',e.target.value)} onBlur={e=>syncToCloud('motto',e.target.value)} className={`w-full bg-transparent text-lg font-black text-center outline-none resize-none ${isMottoLocked?'':'bg-white/10 rounded-xl'}`} rows="6" placeholder="輸入心法..." />
                                    )}
                                </Card>

                                {/* --- RSI Helper Card --- */}
                                <Card className="mt-4 border-2 border-indigo-100 dark:border-slate-800">
                                  <div className="flex justify-between items-center mb-2 cursor-pointer" onClick={()=>setSections(p=>({...p,rsiHelper:!p.rsiHelper}))}>
                                    <div className="flex items-center gap-2">
                                        <Icon name="Zap" className="text-amber-500" />
                                        <span className="text-xs font-black text-slate-500 uppercase tracking-widest">RSI 收益增強助手</span>
                                    </div>
                                    <Icon name={dashboardSections.rsiHelper?"ChevronUp":"ChevronDown"} size={16} className="text-slate-400" />
                                  </div>
                                  
                                  {dashboardSections.rsiHelper && (
                                    <>
                                        {/* Core (TQQQ) */}
                                        <div className="flex items-center gap-4 mb-3 border-b border-slate-100 dark:border-slate-800 pb-3">
                                            <div className="relative w-20">
                                                <input 
                                                    type="number" 
                                                    value={inputs.current_rsi} 
                                                    onChange={e=>handleInputChange('current_rsi', e.target.value)} 
                                                    onBlur={e=>syncToCloud('current_rsi', e.target.value)}
                                                    className="w-full bg-indigo-50 dark:bg-slate-800 p-2 rounded-lg text-center font-black text-lg outline-none focus:ring-2 focus:ring-indigo-500 text-indigo-600 dark:text-indigo-400"
                                                    placeholder="RSI"
                                                />
                                                <label className="absolute -top-2 left-1 text-[8px] bg-white dark:bg-slate-900 px-1 text-slate-400 font-bold">QQQ</label>
                                            </div>
                                            
                                            <div className="flex-1 flex justify-between items-center">
                                                <div className="flex flex-col"><span className="text-[10px] text-slate-400 font-bold">TQQQ</span><span className="text-sm font-black text-slate-700 dark:text-slate-200">{metrics.rsiSuggestion.contracts} 張</span></div>
                                                <div className="flex flex-col text-right"><span className="text-[9px] text-slate-400">Delta / Cover</span><span className="text-[10px] font-bold text-slate-500">{metrics.rsiSuggestion.delta} / {metrics.rsiSuggestion.cover}%</span></div>
                                            </div>
                                        </div>

                                        {/* Satellites List */}
                                        <div className="space-y-2">
                                            {(metrics.rebalanceStatus.satellites || []).map(s => (
                                                <div key={s.id} className="flex items-center gap-4">
                                                    <div className="relative w-20">
                                                        <input 
                                                            type="number" 
                                                            value={s.current_rsi || ''} 
                                                            onChange={e=>updateSatellite(s.id, 'current_rsi', e.target.value)} 
                                                            onBlur={()=>syncToCloud('satellites', inputs.satellites)}
                                                            className="w-full bg-slate-50 dark:bg-slate-800 p-2 rounded-lg text-center font-black text-sm outline-none focus:ring-2 focus:ring-emerald-500 text-slate-600 dark:text-slate-300 placeholder-slate-300"
                                                            placeholder="-"

                        {view === 'history' && (
                            <div className="space-y-6 animate-in fade-in">
                                <div className="flex bg-slate-200 dark:bg-slate-800 rounded-3xl p-1"><button onClick={()=>setHistoryTab('nav')} className={`flex-1 py-3 rounded-2xl text-xs font-black uppercase ${historyTab==='nav'?'bg-white shadow text-indigo-600':'text-slate-500'}`}>資產走勢</button><button onClick={()=>setHistoryTab('options')} className={`flex-1 py-3 rounded-2xl text-xs font-black uppercase ${historyTab==='options'?'bg-white shadow text-amber-500':'text-slate-500'}`}>選擇權收益</button></div>
                                {historyTab === 'nav' ? (
                                    <>
                                        <Card className="h-72 p-2 shadow-xl border-none"><ResponsiveContainer>{chartMode==='NAV_DD' ? <ComposedChart data={metrics.graphData} margin={{top:10,right:0,left:0,bottom:0}}><defs><linearGradient id="colorEq" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#6366f1" stopOpacity={0.3}/><stop offset="95%" stopColor="#6366f1" stopOpacity={0}/></linearGradient></defs><XAxis dataKey="date" tickFormatter={v=>new Date(v).toLocaleDateString(undefined,{month:'numeric',day:'numeric'})} tick={{fontSize:10}}/><YAxis yAxisId="left" tickFormatter={v=>`${(v/1000).toFixed(0)}k`} tick={{fontSize:10}}/><YAxis yAxisId="right" orientation="right" tickFormatter={v=>`${v.toFixed(0)}%`} tick={{fontSize:10,fill:'#ef4444'}}/><Tooltip contentStyle={{borderRadius:'12px'}}/><Area yAxisId="left" type="monotone" dataKey="equity" stroke="#6366f1" fill="url(#colorEq)"/><Area yAxisId="right" type="step" dataKey="dd" stroke="#ef4444" fill="#ef4444" fillOpacity={0.1}/></ComposedChart> : <ComposedChart data={metrics.graphData} margin={{top:10,right:0,left:0,bottom:0}}><XAxis dataKey="date" tickFormatter={v=>new Date(v).toLocaleDateString(undefined,{month:'numeric',day:'numeric'})} tick={{fontSize:10}}/><YAxis tickFormatter={v=>`${v.toFixed(0)}%`} tick={{fontSize:10}}/><Tooltip contentStyle={{borderRadius:'12px'}}/><Line type="monotone" dataKey="ret" stroke="#6366f1" strokeWidth={2} dot={false}/><Line type="monotone" dataKey="qRet" stroke="#10b981" strokeWidth={2} dot={false}/></ComposedChart>}</ResponsiveContainer></Card>
                                        <div className="space-y-3">
                                            {historyGroups.map(g => (
                                                <div key={g.year} className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm">
                                                    <div onClick={() => toggleYear(g.year)} className="p-4 flex justify-between items-center cursor-pointer bg-slate-50 dark:bg-slate-800/50 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                                                        <div className="flex flex-col"><div className="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2"><span className="bg-indigo-100 dark:bg-slate-700 text-indigo-600 dark:text-slate-300 px-2 py-0.5 rounded text-xs">{g.year}</span></div></div>
                                                        <div className={`font-mono font-black flex items-center gap-2 ${g.return >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{g.return > 0 ? '+' : ''}{g.return.toFixed(2)}% <Icon name={expandedYears[g.year] ? "ChevronUp" : "ChevronDown"} size={16} className="text-slate-400"/></div>
                                                    </div>
                                                    {expandedYears[g.year] && <div className="border-t border-slate-100 dark:border-slate-700/50">{g.months.map(m => <div key={m.month} className="flex justify-between p-3 px-5 text-xs font-bold border-b border-slate-50 dark:border-slate-800/50 last:border-0 hover:bg-slate-50 dark:hover:bg-slate-800/30"><div className="flex flex-col"><span className="text-slate-500">{m.month} 月</span><span className="text-[9px] text-slate-400 font-normal">權利金: ${Math.round(m.optPnl).toLocaleString()}</span></div><div className="text-right"><div className={`font-mono ${m.return >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{m.return > 0 ? '+' : ''}{m.return.toFixed(2)}%</div><div className="text-[9px] text-slate-400 font-normal">${Math.round(m.pnl).toLocaleString()}</div></div></div>)}</div>}
                                                </div>
                                            ))}
                                        </div>
                                        <div className="space-y-4 pt-4 border-t border-slate-200 dark:border-slate-800"><div className="flex items-center gap-2 text-xs font-black text-slate-500 px-1 uppercase tracking-widest"><Icon name="History" size={14}/> 詳細紀錄</div>{(historyExpanded ? metrics.graphData.slice().reverse() : metrics.graphData.slice().reverse().slice(0, 5)).map(r => { const rec = records.find(x=>x.date===r.date); return (<Card key={r.date} className="border-none shadow-md p-5 flex justify-between items-center cursor-pointer hover:scale-[1.01]" onClick={()=>{setEditingId(rec.id);setEditForm(JSON.parse(JSON.stringify(rec)));}}><div><div className="text-[10px] text-slate-400 font-bold">{new Date(r.date).toLocaleDateString()}</div><div className="text-xl font-mono">${r.equity.toLocaleString()}</div></div><div className="flex gap-2"><button className="p-2 bg-blue-50 dark:bg-slate-800 text-blue-500 rounded-lg"><Icon name="Edit2" size={14}/></button><button onClick={(e)=>{e.stopPropagation();confirmDelete(rec.id)}} className="p-2 bg-red-50 dark:bg-slate-800 text-red-500 rounded-lg"><Icon name="Trash2" size={14}/></button></div></Card>);})}<button onClick={() => setHistoryExpanded(!historyExpanded)} className="w-full py-3 text-xs font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors">{historyExpanded ? "收起" : `顯示全部`}</button></div>
                                    </>
                                ) : (
                                    <div className="space-y-4">
                                        <Card className="bg-gradient-to-br from-amber-50 to-orange-50 dark:from-slate-800 dark:to-slate-900 border-2 border-amber-200 dark:border-slate-700"><div className="text-xs font-black text-amber-600 dark:text-amber-500 uppercase tracking-widest mb-1">歷史已實現總權利金</div><div className="text-3xl font-black font-mono text-slate-800 dark:text-slate-100">${totalRealizedPremium.toLocaleString()}</div></Card>
                                        <div className="flex justify-between items-center px-1 mb-2"><div className="flex items-center gap-2 text-xs font-black text-slate-500 uppercase tracking-widest"><Icon name="List" size={14}/> 交易明細</div></div>
                                        {/* OPTION HISTORY LOGIC */}
                                        {inputs.option_history && inputs.option_history.length > 0 ? (
                                            <>
                                                {(optionHistoryExpanded ? inputs.option_history : inputs.option_history.slice(0, 5)).map(t => (
                                                    <Card key={t.id} className="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50" onClick={()=>setEditingTrade(t)}>
                                                        <div>
                                                            <div className="text-[10px] text-slate-400 font-bold">{new Date(t.date).toLocaleDateString()}</div>
                                                            <div className="font-bold flex items-center gap-2">
                                                                <span className="text-indigo-600 dark:text-indigo-400">{t.ticker}</span>
                                                                <span className="text-[10px] bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded">{t.type}</span>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-4">
                                                            <div className={`text-lg font-mono font-black ${t.pnl >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                                                                {t.pnl > 0 ? '+' : ''}{t.pnl.toLocaleString(undefined,{maximumFractionDigits:0})}
                                                            </div>
                                                            <div className="flex gap-1">
                                                                <button onClick={(e)=>{e.stopPropagation();setEditingTrade(t)}} className="p-1.5 text-blue-400 hover:bg-blue-50 rounded"><Icon name="Edit2" size={14}/></button>
                                                                <button onClick={(e)=>{e.stopPropagation();handleTradeDelete(t.id)}} className="p-1.5 text-red-400 hover:bg-red-50 rounded"><Icon name="Trash2" size={14}/></button>
                                                            </div>
                                                        </div>
                                                    </Card>
                                                ))}
                                                {inputs.option_history.length > 5 && (
                                                    <button onClick={() => setOptionHistoryExpanded(!optionHistoryExpanded)} className="w-full py-3 text-xs font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors">
                                                        {optionHistoryExpanded ? "收起 (只看 5 筆)" : `顯示全部 (共 ${inputs.option_history.length} 筆)`}
                                                    </button>
                                                )}
                                            </>
                                        ) : (
                                            <div className="text-center text-slate-400 text-sm py-10">尚無紀錄</div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'loan' && (
                            <div className="space-y-6 animate-in fade-in">
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] p-6 border border-slate-200 dark:border-slate-700 shadow-lg">
                                    <div className="flex justify-between items-center mb-4"><div className="text-xs font-black uppercase text-slate-500 flex items-center gap-2"><Icon name="Activity" size={16} /> LTV 貸款價值比</div><div className={`text-2xl font-black font-mono ${ltv > 50 ? 'text-red-500' : (ltv > 30 ? 'text-amber-500' : 'text-emerald-500')}`}>{ltv.toFixed(1)}%</div></div>
                                    <div className="h-6 w-full bg-slate-100 dark:bg-slate-800 rounded-full relative overflow-hidden mb-2"><div className="absolute top-0 bottom-0 left-0 bg-emerald-400/30" style={{width: '30%'}}></div><div className="absolute top-0 bottom-0 left-[30%] bg-amber-400/30" style={{width: '20%'}}></div><div className="absolute top-0 bottom-0 left-[50%] bg-red-400/30" style={{width: '50%'}}></div><div className="absolute top-0 bottom-0 w-1 bg-slate-800 dark:bg-white transition-all duration-500 z-10" style={{left: `${Math.min(ltv, 100)}%`}}></div></div>
                                </div>
                                <Card className="border-2 border-amber-100 dark:border-amber-900/30"><div className="grid gap-4">{[{l:"貸款總額",k:"loan_amount"},{l:"還款目標%",k:"loan_repay_target"},{l:"基準市值(可選)",k:"loan_entry_valuation"}].map(f => (<div key={f.k} className="space-y-1"><label className="text-[10px] uppercase text-amber-600">{f.l}</label><input type="number" value={inputs[f.k]} onChange={e=>handleInputChange(f.k,e.target.value)} onBlur={e=>syncToCloud(f.k,e.target.value)} className="bg-amber-50 dark:bg-slate-800 rounded-xl p-3 text-center text-lg w-full font-bold" /></div>))}</div></Card>
                            </div>
                        )}

                        {view === 'sync_settings' && (
                            <div className="space-y-6 animate-in fade-in">
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-200 dark:border-slate-800 overflow-hidden"><button onClick={()=>setSettings(p=>({...p,account:!p.account}))} className="w-full p-4 flex justify-between bg-slate-50 dark:bg-slate-800/50"><div className="flex items-center gap-3 font-black"><Icon name="Fingerprint" className="text-indigo-500"/> 帳號同步</div><Icon name={openSettings.account?"ChevronUp":"ChevronDown"} size={14}/></button>{openSettings.account && <div className="p-6 pt-2 space-y-4"><div className="text-center font-mono text-lg">{effectiveUserId}</div><div className="flex gap-2"><input value={tempSyncId} onChange={e=>setTempSyncId(e.target.value)} className="flex-1 bg-slate-100 p-3 rounded-xl" placeholder="ID" /><button onClick={()=>{setCustomSyncId(tempSyncId);localStorage.setItem('qqq_sync_id',tempSyncId);showToast("已切換")}} className="bg-indigo-600 text-white px-4 rounded-xl">OK</button></div></div>}</div>
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-200 dark:border-slate-800 overflow-hidden">
                                    <button onClick={()=>setSettings(p=>({...p,system:!p.system}))} className="w-full p-4 flex justify-between bg-slate-50 dark:bg-slate-800/50"><div className="flex items-center gap-3 font-black"><Icon name="Settings" className="text-emerald-500"/> 系統與工具</div><Icon name={openSettings.system?"ChevronUp":"ChevronDown"} size={14}/></button>
                                    {openSettings.system && <div className="p-6 pt-2 space-y-4"><div className="flex gap-3"><button onClick={()=>setDarkMode(!darkMode)} className="flex-1 p-3 bg-slate-100 rounded-xl flex justify-center gap-2"><Icon name={darkMode?"Sun":"Moon"}/> {darkMode?"亮色":"深色"}</button></div></div>}
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 inset-x-0 bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 z-50 py-4 pb-10 flex justify-around shadow-2xl">
                        {[{id:'dashboard',icon:'LayoutDashboard',l:'儀表板'},{id:'parameters',icon:'Sliders',l:'參數'},{id:'history',icon:'TrendingUp',l:'績效'},{id:'loan',icon:'Landmark',l:'貸款'}].map(t => <button key={t.id} onClick={()=>{setView(t.id);}} className={`flex flex-col items-center gap-1 flex-1 transition-all active:scale-90 ${view===t.id?'text-indigo-600 border-t-2 border-indigo-600 -mt-4 pt-2':'text-slate-400'}`}><Icon name={t.icon} size={24}/><span className="text-[10px] uppercase font-black">{t.l}</span></button>)}
                    </nav>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
