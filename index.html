        // --- CONFIG & UTILS ---

        if (!firebase.apps.length) firebase.initializeApp({ apiKey: "AIzaSyBpax3wlTwHTe6G3niZajtTxpoUWbgvX80", authDomain: "qldmax.firebaseapp.com", projectId: "qldmax", storageBucket: "qldmax.firebasestorage.app", messagingSenderId: "752199866954", appId: "1:752199866954:web:50d17ae522095c363d64b3" });

        const HOLDINGS_CONFIG = [
            { id: 'core', type: 'dynamic', tickerKey: 'ticker_core_1', qtyKey: 'qty_qqq', targetKey: 'target_qqq', defaultTicker: 'QQQ', color: 'text-indigo-600', hex: '#4f46e5' },

            { id: 'ibit', type: 'fixed', ticker: 'IBIT', qtyKey: 'qty_ibit', targetKey: 'target_ibit', color: 'text-orange-500', hex: '#f59e0b' },
            { id: 'sgov', type: 'fixed', ticker: 'SGOV', qtyKey: 'qty_sgov', targetKey: 'target_sgov', color: 'text-slate-500', hex: '#64748b' },

line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></>, BookOpen: <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>, PieChartIcon: <><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></>, MessageSquare: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>, Fingerprint: <><path d="M2 12C2 6.48 6.48 2 12 2s10 4.48 10 10"/><path d="M12 12v3"/><path d="M16 17.5c-2.5 1.5-5.5 1.5-8 0"/></>, Calculator: <g><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></g>, AlertCircle: <g><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></g>, Sun: <circle cx="12" cy="12" r="5" />, Moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>, Scale: <g><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></g>, ArrowLeftRight: <path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/>, Calendar: <><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></>, Lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>, Unlock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 9.9-1" /></g>, Repeat: <path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/>, ChevronDown: <path d="m6 9 6 6 6-6"/>, ChevronUp: <path d="m18 15-6-6-6 6"/>, Shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>, Download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>, Upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></>, Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/> };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || <circle cx="12" cy="12" r="10" />}</svg>;
        };

        const Card = ({ children, className = "" }) => <div className={`rounded-[2rem] shadow-xl border p-5 transition-all bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 ${className}`}>{children}</div>;
        const SectionTitle = ({ title, iconName }) => <h2 className="text-[11px] font-black mb-3 flex items-center gap-2 uppercase tracking-widest text-slate-500 dark:text-slate-400"><Icon name={iconName} size={14} /> {title}</h2>;

        // Custom Tooltip
        const CustomTooltip = ({ active, payload }) => {
            if (active && payload && payload.length) {
                const d = payload[0].payload;
                return (
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl shadow-xl text-xs font-black">
                        <p className="mb-1 text-slate-500">{d.name}</p>
                        <p className="text-lg mb-2 text-slate-800 dark:text-slate-100 font-mono">${d.value.toLocaleString()}</p>
                        <p className="text-slate-400">{d.percentage}%</p>
                    </div>
                );
            }
            return null;
        };

        const HoldingRow = ({ conf, inputs, prices, onChange, onBlur }) => {
            const ticker = conf.type === 'fixed' ? conf.ticker : (inputs[conf.tickerKey] || conf.defaultTicker).toUpperCase();
            const price = prices[ticker] || 0;
            const diff = getDiff(price, inputs[conf.targetKey]);
            return (
                <div className="holding-input-group grid grid-cols-12 gap-1 items-center p-1">
                    <div className="col-span-3 flex flex-col justify-center px-2 border-r border-slate-200 dark:border-slate-700">
                        {conf.type === 'fixed' ? <span className={`text-xs font-black font-mono tracking-tight text-slate-700 dark:text-slate-200`}>{ticker}</span> : 
                            <input type="text" value={inputs[conf.tickerKey]} onChange={e => onChange(conf.tickerKey, e.target.value.toUpperCase())} onBlur={e => onBlur(conf.tickerKey, e.target.value)} className={`w-full text-xs font-black bg-transparent p-0 outline-none text-left font-mono tracking-tight uppercase ${conf.color}`} placeholder={conf.defaultTicker} />}
                        <span className={`text-[9px] font-mono ${conf.color}`}>${price.toFixed(1)}</span>
                    </div>
                    <input type="number" placeholder="0" value={inputs[conf.qtyKey]} onChange={e => onChange(conf.qtyKey, e.target.value)} onBlur={e => onBlur(conf.qtyKey, e.target.value)} className="col-span-3 bg-transparent font-black text-sm h-10 font-mono focus:bg-white dark:focus:bg-slate-800" />
                    <input type="number" placeholder="-" value={inputs[conf.targetKey]} onChange={e => onChange(conf.targetKey, e.target.value)} onBlur={e => onBlur(conf.targetKey, e.target.value)} className={`col-span-3 bg-transparent font-bold text-xs h-10 font-mono ${conf.color} focus:bg-white dark:focus:bg-slate-800`} />
                    <div className={`col-span-3 text-center text-xs font-black font-mono ${diff && diff > 0 ? 'text-emerald-500' : 'text-red-400'}`}>{diff ? `${diff > 0 ? '+' : ''}${diff.toFixed(1)}%` : '-'}</div>
                </div>
            );
        };

        const EditModal = ({ editingId, editForm, setEditingId, setEditForm, saveEdit }) => {
            if (!editingId || !editForm) return null;
            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center">
                    <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl animate-in slide-in-from-bottom-full max-h-[85vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-6 border-b pb-4 dark:border-slate-800">

                            <button onClick={saveEdit} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black flex justify-center gap-2"><Icon name="Save" size={20} /> 更新</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            // State
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [records, setRecords] = useState([]);
            const [prices, setPrices] = useState({});
            const [loadingPrices, setLoadingPrices] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [message, setMessage] = useState(null);
            const [editingId, setEditingId] = useState(null);
            const [editForm, setEditForm] = useState(null);
            const [dashboardSections, setSections] = useState({ pie: true, simulator: true, rebalance: true, holdings: true, indicators: true, memo: true });
            const [openSettings, setSettings] = useState({ account: true, system: false, strategy: false });
            const [isStrategyEditing, setIsStrategyEditing] = useState(false);
            const [simulatedTotal, setSimulatedTotal] = useState('');
            const [isCalcOpen, setIsCalcOpen] = useState(false);
            const [isAlertsView, setIsAlertsView] = useState(false);
            const [perfView, setPerfView] = useState('MTD');
            const [isMottoLocked, setIsMottoLocked] = useState(true);
            const [chartMode, setChartMode] = useState('NAV_DD');
            const [filterMode, setFilterMode] = useState('all');
            const [visibleCount, setVisibleCount] = useState(20);
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('qqq_theme') === 'dark');
            const [customSyncId, setCustomSyncId] = useState(() => localStorage.getItem('qqq_sync_id') || '');
            const [tempSyncId, setTempSyncId] = useState(customSyncId);
            const fileInputRef = useRef(null);

            const [inputs, setInputs] = useState({
                qqq_sma200: 0, qqq_sma20: 0, custom_1_sma40: 0, custom_2_sma20: 0, ibit_sma20: 0,
                exchange_rate: 32.5, rebalance_sat_cap: 15, rebalance_core_target: 50, rebalance_core_tolerance: 15,
                
                // Detailed Sat Tolerance Settings
                tol_up_sat_1: 20, tol_down_sat_1: 10,
                tol_up_sat_2: 20, tol_down_sat_2: 10,
                tol_up_ibit: 20, tol_down_ibit: 10,

                target_sat_1: 10, target_sat_2: 10, target_sat_ibit: 10,
                calc_alloc_qqq: 40, calc_alloc_tqqq: 40, calc_alloc_c1: 10, calc_alloc_c2: 10, calc_alloc_cash: 0,
                ticker_core_1: 'QQQ', qty_qqq: 0, qty_tqqq: 0, qty_ibit: 0, qty_sgov: 0, custom_ticker_1: 'TSLA', qty_custom_1: 0, custom_ticker_2: 'IBIT', qty_custom_2: 0,
                cash_balance: 0, record_date: new Date().toISOString().split('T')[0],
                loan_amount: 0, loan_rate: 2.0, loan_years: 7, loan_repay_target: 20, loan_entry_valuation: 0, loan_monthly_repay: 0, motto: '', record_memo: '',
                target_qqq: '', target_tqqq: '', target_ibit: '', target_sgov: '', target_custom_1: '', target_custom_2: '',
                title_core: "核心策略 (80%) - QQQ/TQQQ (NRA V7)", strat_core: "【核心部位執行規則】\n1. 趨勢濾網：QQQ 日線 200 SMA (緩衝區 +5% / -3%)。\n2. 進攻模式 (Risk-On)：QQQ > 200 SMA x 1.05 ➔ 持有 50% TQQQ + 50% QQQ。\n3. 防禦模式 (Risk-Off)：QQQ < 200 SMA x 0.97 ➔ 全數轉入 SGOV。\n4. 熊市 DCA：防禦期啟動 12 個月定投 QQQ (非槓桿)，進攻信號出現即停止。\n\n【再平衡】\nTQQQ 佔核心 > 65% 或 < 35% 強制校正回 50/50。", 
                title_custom: "自選衛星 1 (10%) - TSLA (週線 40)", strat_custom: "【TSLA 執行規則】\n1. 監測指標：週線 40 SMA (緩衝區 +5% / -3%)。\n2. 止損/歸隊：價格跌破 -3% 離場，突破 +5% 買回。\n\n【母子連動 (防禦期)】\n若 QQQ < 200 SMA (日)：\n- 強制減碼至 30% 試探部位。\n- 若 QQQ < 20 SMA (日)，試探部位強制清倉。", 
                title_ibit: "自選衛星 2 (10%) - IBIT (週線 20)", strat_ibit: "【IBIT 執行規則】\n1. 監測指標：週線 20 SMA (緩衝區 +5% / -3%)。\n2. 特例：若 IBIT/BTC 觸及 200 週 SMA，視為極限價值區，不執行止損。\n\n【母子連動 (防禦期)】\n若 QQQ < 200 SMA (日)：\n- 強制減碼至 30% 試探部位。\n- 若 QQQ < 20 SMA (日)，試探部位強制清倉."
            });

            // Handlers
            const showToast = (txt) => { setMessage(txt); setTimeout(() => setMessage(null), 3000); };
            const effectiveUserId = customSyncId || (user ? user.uid : null);
            const handleInputChange = (f, v) => setInputs(p => ({ ...p, [f]: v === '' ? '' : (isNaN(v) ? v : parseFloat(v)) }));
            const syncToCloud = async (f, v) => { if (effectiveUserId) await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set({ [f]: v }, { merge: true }); };

            const fetchPrices = useCallback(async (force = false) => {
                if (loadingPrices) return;
                const CACHE_KEY = 'qqq_price_cache_v7';
                const syms = [...new Set(['QQQ', 'QQQM', 'TQQQ', 'IBIT', 'SGOV', (inputs.ticker_core_1||"QQQ"), (inputs.custom_ticker_1||""), (inputs.custom_ticker_2||"")].filter(Boolean).map(s=>s.trim().toUpperCase()))];
                if (!force) {
                    const cached = localStorage.getItem(CACHE_KEY);
                    if (cached) {
                        const { timestamp, data } = JSON.parse(cached);
                        if (Date.now() - timestamp < 300000 && syms.every(s => data[s] !== undefined)) { setPrices(data); return; }
                    }
                }
                setLoadingPrices(true);
                try {
                    const res = await Promise.allSettled(syms.map(s => fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${FINNHUB_KEY}`).then(r => r.json()).then(d => ({s, p: d.c}))));
                    const newPrices = res.reduce((acc, curr) => (curr.status === 'fulfilled' && curr.value.p > 0 ? {...acc, [curr.value.s]: curr.value.p} : acc), {});
                    setPrices(p => { const upd = {...p, ...newPrices}; localStorage.setItem(CACHE_KEY, JSON.stringify({timestamp: Date.now(), data: upd})); return upd; });
                } catch(e) { console.error(e); } finally { setLoadingPrices(false); }
            }, [inputs.ticker_core_1, inputs.custom_ticker_1, inputs.custom_ticker_2, loadingPrices]);

            // Complex Calculations (Refactored)
            const { totalCapital, performanceStats, rebalanceStatus, scenarioData, bearDefense, qqqDistance, currentLeverage, pieData } = useMemo(() => {
                const getP = (t) => prices[(t || "").toUpperCase()] || 0;
                const getV = (k) => getNum(inputs[k]);
                
                // Total Capital
                let total = getV('cash_balance');
                HOLDINGS_CONFIG.forEach(c => total += (c.type === 'fixed' ? getP(c.ticker) : getP(inputs[c.tickerKey])) * getV(c.qtyKey));

                // Stats
                let ytd = 0, mtd = 0, tot = 0;
                if (records.length) {
                    const sorted = [...records].sort((a,b) => new Date(a.date) - new Date(b.date));
                    const now = new Date();
                    const getRet = (rec) => rec.total_equity > 0 ? ((total - rec.total_equity) / rec.total_equity) * 100 : 0;
                    tot = getRet(sorted[0]);
                    const startY = sorted.find(r => new Date(r.date).getFullYear() === now.getFullYear()) || sorted[0];
                    ytd = getRet(startY);
                    const startM = sorted.find(r => new Date(r.date).getMonth() === now.getMonth() && new Date(r.date).getFullYear() === now.getFullYear()) || sorted[0];
                    mtd = getRet(startM);
                }

                // Rebalance Calculations
                const tCore = (inputs.ticker_core_1 || "QQQ").toUpperCase();
                const valQQQ = getP(tCore) * getV('qty_qqq');
                const valTQQQ = getP('TQQQ') * getV('qty_tqqq');
                const valCore = valQQQ + valTQQQ;
                const tqqqRatio = valCore > 0 ? (valTQQQ / valCore) * 100 : 0;
                const qqqRatio = valCore > 0 ? (valQQQ / valCore) * 100 : 0;
                
                const valSat1 = getP(inputs.custom_ticker_1) * getV('qty_custom_1');
                const valSat2 = getP(inputs.custom_ticker_2) * getV('qty_custom_2');
                const valIbit = getP('IBIT') * getV('qty_ibit');

                const c1W = (valSat1 / (total||1)) * 100;
                const c2W = (valSat2 / (total||1)) * 100;
                const ibitW = (valIbit / (total||1)) * 100;
                
                const coreTarget = getV('rebalance_core_target');
                const coreTol = getV('rebalance_core_tolerance');
                
                // Check Bounds
                const checkSat = (w, target, up, down) => {
                    const u = getNum(up) || 20; const d = getNum(down) || 10;
                    if (w > target * (1 + u/100)) return 'high';
                    if (w < target * (1 - d/100)) return 'low';
                    return 'ok';
                };

                const stat1 = checkSat(c1W, getV('target_sat_1'), inputs.tol_up_sat_1, inputs.tol_down_sat_1);
                const stat2 = checkSat(c2W, getV('target_sat_2'), inputs.tol_up_sat_2, inputs.tol_down_sat_2);
                const statIbit = checkSat(ibitW, getV('target_sat_ibit'), inputs.tol_up_ibit, inputs.tol_down_ibit);

                // Bear Defense & Distance - STRICTLY QQQ BENCHMARK
                const sma200 = getV('qqq_sma200');
                const benchmarkPrice = getP('QQQ'); // Benchmark is ALWAYS QQQ
                const riskOff = sma200 * 0.97;
                const isBear = sma200 > 0 && benchmarkPrice > 0 && benchmarkPrice < riskOff;
                const bearData = { isActive: isBear, totalDefensive: getV('cash_balance') + (getP('SGOV') * getV('qty_sgov')), monthlyBuy: (getV('cash_balance') + (getP('SGOV') * getV('qty_sgov'))) / 12 };

                // Simulator - STRICTLY QQQ BENCHMARK
                // Scenario: QQQ Drops to 200 SMA (which is riskOff approx trigger or just sma200)
                // Let's use SMA200 flat as the "bad scenario" baseline or riskOff. 
                // User asked "Drops to 200 SMA".
                const bearDrop = (benchmarkPrice > 0) ? (sma200 - benchmarkPrice) / benchmarkPrice : 0;
                
                // Estimate Holdings Value if QQQ drops by bearDrop %
                const estBearCore = isBear ? 0 : (valQQQ*(1+bearDrop)) + (valTQQQ*(1+(bearDrop*3)));
                const satVal = valSat1 + valSat2 + valIbit; // Satellites assume 1x beta for simplicity or just drop same as QQQ
                const estBearSat = satVal * (1+bearDrop);
                const estTotalBear = estBearCore + estBearSat + getV('cash_balance') + (getP('SGOV') * getV('qty_sgov'));

                const exposure = (valTQQQ*3) + valQQQ + satVal;
                
                // Pie Data
                const pie = HOLDINGS_CONFIG.map(c => ({ 
                    name: c.type==='fixed'?c.ticker:inputs[c.tickerKey]||c.defaultTicker, 
                    value: (c.type==='fixed'?getP(c.ticker):getP(inputs[c.tickerKey])) * getV(c.qtyKey), 
                    color: c.hex 
                })).concat({name:'現金', value: getV('cash_balance'), color:'#94a3b8'}).filter(x=>x.value>0);
                const pieSum = pie.reduce((a,b)=>a+b.value, 0);

                return {
                    totalCapital: total,
                    performanceStats: { ytd, mtd, total: tot },
                    rebalanceStatus: { 
                        tqqqRatio, qqqRatio, valCore, valQQQ, valTQQQ, valSat1, valSat2, valIbit,
                        isCoreImbalanced: Math.abs(tqqqRatio - coreTarget) > coreTol, 
                        coreTarget, c1W: c1W.toFixed(1), c2W: c2W.toFixed(1), ibitW: ibitW.toFixed(1), 
                        tSat1: getV('target_sat_1'), tSat2: getV('target_sat_2'), tSatIbit: getV('target_sat_ibit'), 
                        t1: inputs.custom_ticker_1, t2: inputs.custom_ticker_2,
                        stat1, stat2, statIbit
                    },
                    bearDefense: bearData,
                    scenarioData: { bear: { triggerPrice: sma200, dropPct: bearDrop*100, estTotal: estTotalBear, maxLoss: estTotalBear - total } },
                    qqqDistance: (sma200>0 && benchmarkPrice>0) ? ((benchmarkPrice - sma200)/sma200)*100 : null,
                    currentLeverage: (total>0 ? exposure/total : 0).toFixed(2),
                    pieData: pie.map(p => ({...p, percentage: ((p.value/pieSum)*100).toFixed(1)}))
                };
            }, [prices, inputs, records]);

            const alerts = useMemo(() => {
                const a = [];
                const { valCore, valSat1, valSat2, valIbit, tqqqRatio, c1W, c2W, ibitW, coreTarget, isCoreImbalanced, tSat1, tSat2, tSatIbit, stat1, stat2, statIbit, t1, t2 } = rebalanceStatus;
                const getP = (t) => prices[(t || "").toUpperCase()] || 0;
                
                // Helper to prevent Infinity
                const getQty = (val, price) => (price > 0 ? Math.abs(val / price) : 0);

                // Core Rebalance Action
                if (isCoreImbalanced) {
                    // Logic: Calculate how much TQQQ to buy/sell to reach target % within current core value
                    const targetTQQQVal = valCore * (coreTarget / 100);
                    const diffVal = targetTQQQVal - rebalanceStatus.valTQQQ;
                    const action = diffVal > 0 ? '買入' : '賣出';
                    const qty = getQty(diffVal, getP('TQQQ'));
                    a.push({ type: 'warning', title: '核心再平衡', msg: `TQQQ ${tqqqRatio.toFixed(1)}% 偏離目標 (建議${action} ${qty.toFixed(0)} 股 / $${Math.abs(diffVal).toFixed(0)})`});
                }

                // Satellite Actions
                const checkSatAction = (stat, name, currentW, targetW, currentVal, ticker) => {
                    if (stat !== 'ok') {
                        // Logic: Calculate how much to buy/sell to return to EXACT target %
                        // Target Value = Total Capital * (Target % / 100)
                        const targetVal = totalCapital * (targetW / 100);
                        const diffVal = targetVal - currentVal;
                        const action = diffVal > 0 ? '買入' : '賣出';
                        const qty = getQty(diffVal, getP(ticker));
                        const reason = stat === 'high' ? '高於上限' : '低於下限';
                        a.push({ type: stat==='high'?'opportunity':'warning', title: `${name} ${reason}`, msg: `目前 ${currentW.toFixed(1)}% (建議${action} ${qty.toFixed(0)} 股 / $${Math.abs(diffVal).toFixed(0)})`});
                    }
                };

                checkSatAction(stat1, t1||'自選1', parseFloat(c1W), tSat1, valSat1, t1);
                checkSatAction(stat2, t2||'自選2', parseFloat(c2W), tSat2, valSat2, t2);
                checkSatAction(statIbit, 'IBIT', parseFloat(ibitW), tSatIbit, valIbit, 'IBIT');

                if (bearDefense.isActive) a.push({ type: 'danger', title: '熊市防禦', msg: 'QQQ < 200 SMA (-3%)，請轉入防禦資產'});
                return a;
            }, [rebalanceStatus, bearDefense, totalCapital, prices]);

            // Effects
            useEffect(() => { auth.signInAnonymously().catch(console.error); return auth.onAuthStateChanged(setUser); }, []);
            useEffect(() => { if (!effectiveUserId) return; db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').onSnapshot(s => setRecords(s.docs.map(d => ({id:d.id,...d.data()})))); db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').onSnapshot(s => s.exists && setInputs(p => ({...p, ...s.data()}))); fetchPrices(); }, [effectiveUserId]);
            useEffect(() => { document.documentElement.className = darkMode ? 'dark' : 'light'; }, [darkMode]);

            // Actions
            const save = async () => { if (!effectiveUserId || isSaving) return; setIsSaving(true); try { await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').add({ date: new Date(inputs.record_date).toISOString(), total_equity: totalCapital, prices, inputs, memo: inputs.record_memo }); await syncToCloud('last_save', Date.now()); showToast("同步成功"); setInputs(p=>({...p, record_memo: ''})); } catch(e) { showToast("失敗"); } setIsSaving(false); };
            const confirmDelete = async (id) => { await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').doc(id).delete(); showToast("已刪除"); };
            const exportData = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({records, inputs})], {type: "application/json"})); a.download = `Backup_${new Date().toISOString().split('T')[0]}.json`; a.click(); };
            const importData = (e) => { const r = new FileReader(); r.onload = (ev) => { const d = JSON.parse(ev.target.result); if(d.inputs) setInputs(p=>({...p,...d.inputs})); if(d.records) setRecords(d.records); alert("匯入成功 (暫存)"); }; if(e.target.files[0]) r.readAsText(e.target.files[0]); };

            // Render Helpers
            const getPerfDisplay = () => { if(perfView==='MTD') return {l:'本月',v:performanceStats.mtd}; if(perfView==='ALL') return {l:'總計',v:performanceStats.total}; return {l:'今年',v:performanceStats.ytd}; };
            const perfD = getPerfDisplay();
            const graphData = useMemo(() => {
                if(!records.length) return [];

                if(!sorted.length) return [];
                const baseEq = sorted[0].total_equity || 1;
                // STRICTLY USE QQQ FOR BENCHMARK

                return sorted.map(r => {

                    return { date: r.date, equity: r.total_equity, dd: maxEq>0 ? ((r.total_equity-maxEq)/maxEq)*100 : 0, ret: ((r.total_equity-baseEq)/baseEq)*100, qRet: (((r.prices?.QQQ||0)-baseQ)/baseQ)*100 };
                });
            }, [records, filterMode]);

            // Indicator Labels Config
            const INDICATOR_FIELDS = [
                {k:'qqq_sma200', l:'QQQ 200 SMA'},
                {k:'qqq_sma20', l:'QQQ 20 SMA'},
                {k:'custom_1_sma40', l:`${inputs.custom_ticker_1||'自選1'} 週線 40 SMA`},
                {k:'custom_2_sma20', l:`${inputs.custom_ticker_2||'自選2'} 週線 20 SMA`},

                    <EditModal editingId={editingId} editForm={editForm} setEditingId={setEditingId} setEditForm={setEditForm} saveEdit={async () => { await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').doc(editingId).update({ inputs: editForm.inputs, memo: editForm.memo }); setEditingId(null); showToast("更新成功"); }} />

                    <header className="fixed top-0 inset-x-0 bg-indigo-900 dark:bg-slate-950 z-50 px-5 py-4 pt-6 flex justify-between items-center shadow-lg text-white">
                        <div className="flex items-center gap-2 font-black"><div className="bg-white p-2 rounded-2xl shadow-sm"><Icon name="TrendingUp" className="text-indigo-900" size={18} /></div><h1 className="text-lg">Alpha Horizon</h1></div>
                        <div className="flex gap-2"><button onClick={() => setView('sync_settings')} className="p-2.5 rounded-xl bg-white text-slate-700 shadow-sm"><Icon name="Settings" size={20} /></button><div className="flex items-center gap-1.5 ml-1"><button onClick={() => fetchPrices(true)} className="p-2 text-white/80"><Icon name="RefreshCcw" size={22} className={loadingPrices ? 'animate-spin' : ''} /></button><div className={`w-3.5 h-3.5 rounded-full border-2 ${loadingPrices ? 'bg-red-500 sync-loading' : 'bg-emerald-500'}`}></div></div></div>
                    </header>

                        {view === 'dashboard' && (

                                        <div className="flex gap-2">{!isAlertsView && <button onClick={() => setIsMottoLocked(!isMottoLocked)} className="p-1.5 bg-white/20 rounded-full"><Icon name={isMottoLocked?"Lock":"Unlock"} size={14}/></button>}<button onClick={() => setIsAlertsView(!isAlertsView)} className={`p-1.5 bg-white/20 rounded-full ${alerts.length>0?'bg-red-500/80':''}`}><Icon name="AlertCircle" size={18}/></button></div>
                                    </div>
                                    {isAlertsView ? (alerts.length ? alerts.map((a,i)=><div key={i} className="bg-white/10 p-2 rounded-lg mb-2 text-xs">{a.type==='danger'?'🔴':'🔵'} {a.msg}</div>) : <div className="text-center opacity-70 text-xs py-4">無警示</div>) : <textarea value={inputs.motto} readOnly={isMottoLocked} onChange={e=>handleInputChange('motto',e.target.value)} onBlur={e=>syncToCloud('motto',e.target.value)} className={`w-full bg-transparent text-lg font-black text-center outline-none resize-none ${isMottoLocked?'':'bg-white/10 rounded-xl'}`} rows="5" placeholder="輸入心法..." />}
                                </Card>
                                {bearDefense.isActive && <div className="bg-red-500 text-white rounded-[2rem] p-5 shadow-xl border-4 border-red-400 text-center relative overflow-hidden"><div className="absolute top-0 right-0 p-4 opacity-20"><Icon name="Shield" size={80} /></div><div className="inline-flex items-center gap-2 mb-2 bg-red-700/50 px-4 py-1 rounded-full text-xs font-black">進入熊市防禦</div><div className="text-3xl font-black">${bearDefense.monthlyBuy.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div className="text-xs opacity-90 mb-4">本月定投額 (1/12)</div></div>}

                                <div className="bg-white dark:bg-slate-900 rounded-3xl p-4 border-2 border-slate-200 dark:border-slate-700 shadow-lg">

                                    {dashboardSections.rebalance && <div className="space-y-4">

                                        {['c1W','c2W','ibitW'].map((k,i) => {

                                            const status = k==='ibitW' ? rebalanceStatus.statIbit : rebalanceStatus[k==='c1W'?'stat1':'stat2'];
                                            const colorClass = status === 'high' ? 'bg-red-500' : (status === 'low' ? 'bg-indigo-400' : 'bg-emerald-500');

                            {id:'history',icon:'History',l:'績效'},
                            {id:'loan',icon:'Landmark',l:'貸款'}
                        ].map(t => <button key={t.id} onClick={()=>{setView(t.id);setVisibleCount(20)}} className={`flex flex-col items-center gap-1 flex-1 transition-all active:scale-90 ${view===t.id?'text-indigo-600 border-t-2 border-indigo-600 -mt-4 pt-2':'text-slate-400'}`}><Icon name={t.icon} size={24}/><span className="text-[10px] uppercase font-black">{t.l}</span></button>)}
                    </nav>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
