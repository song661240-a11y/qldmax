<body class="light text-left font-black text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;
        const { ComposedChart, AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, Legend, Line } = Recharts;

        const APP_ID = "qqq-strategic-production-v1";
        const FINNHUB_KEY = "d4q36b9r01qha6q0jclgd4q36b9r01qha6q0jcm0";
        if (!firebase.apps.length) firebase.initializeApp({ apiKey: "AIzaSyBpax3wlTwHTe6G3niZajtTxpoUWbgvX80", authDomain: "qldmax.firebaseapp.com", projectId: "qldmax", storageBucket: "qldmax.firebasestorage.app", messagingSenderId: "752199866954", appId: "1:752199866954:web:50d17ae522095c363d64b3" });
        const db = firebase.firestore(); const auth = firebase.auth();

        const HOLDINGS_CONFIG = [
            { id: 'core', type: 'dynamic', tickerKey: 'ticker_core_1', qtyKey: 'qty_qqq', targetKey: 'target_qqq', defaultTicker: 'QQQ', color: 'text-indigo-600', hex: '#4f46e5' },
            { id: 'tqqq', type: 'fixed', ticker: 'TQQQ', qtyKey: 'qty_tqqq', targetKey: 'target_tqqq', color: 'text-purple-600', hex: '#c084fc' },
            { id: 'ibit', type: 'fixed', ticker: 'IBIT', qtyKey: 'qty_ibit', targetKey: 'target_ibit', color: 'text-orange-500', hex: '#f59e0b' },
            { id: 'sgov', type: 'fixed', ticker: 'SGOV', qtyKey: 'qty_sgov', targetKey: 'target_sgov', color: 'text-slate-500', hex: '#64748b' },
            { id: 'c1', type: 'dynamic', tickerKey: 'custom_ticker_1', qtyKey: 'qty_custom_1', targetKey: 'target_custom_1', defaultTicker: '自選1', color: 'text-emerald-500', hex: '#10b981' },
            { id: 'c2', type: 'dynamic', tickerKey: 'custom_ticker_2', qtyKey: 'qty_custom_2', targetKey: 'target_custom_2', defaultTicker: '自選2', color: 'text-amber-500', hex: '#06b6d4' }
        ];

        const getNum = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
        const getDiff = (curr, target) => { const c = parseFloat(curr), t = parseFloat(target); return (!c || !t) ? null : ((t - c) / c) * 100; };
        
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = { 
                TrendingUp: <path d="m22 7-8.5 8.5-5-5L2 17M22 7h-6M22 7v6"/>, 
                Settings: <path d="M12.22 2h-.44a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 1 2-2a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2a2 2 0 0 1 2-2a2 2 0 0 1 2-2a2 2 0 0 0-2-2zM9 12a3 3 0 1 1 6 0a3 3 0 0 1-6 0z"/>, 
                RefreshCcw: <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0 4a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16m-18-8h5V3m13 18h-5v5"/>, 
                LayoutDashboard: <g><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></g>, 
                History: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0 0V3m0 5h5M12 7v5l4 2"/>, 
                Landmark: <g><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 11 4 11 12 2"/></g>, 
                Save: <g><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></g>, 
                Quote: <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1 0 2.5 0 2-2 4-.5.5-.5 1 0 1.5zM16 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2h-2c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1 0 2.5 0 2-2 4-.5.5-.5 1 0 1.5z"/>, 
                ShieldAlert: <g><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></g>, 
                CheckCircle: <g><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></g>, 
                Edit2: <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>, 
                Trash2: <g><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></g>, 
                X: <g><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></g>, 
                BookOpen: <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>, 
                PieChartIcon: <g><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></g>, 
                MessageSquare: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>, 
                Fingerprint: <g><path d="M2 12C2 6.48 6.48 2 12 2s10 4.48 10 10"/><path d="M12 12v3"/><path d="M16 17.5c-2.5 1.5-5.5 1.5-8 0"/></g>, 
                Calculator: <g><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></g>, 
                AlertCircle: <g><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></g>, 
                Sun: <circle cx="12" cy="12" r="5" />, 
                Moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>, 
                Scale: <g><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></g>, 
                ArrowLeftRight: <path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/>, 
                Calendar: <g><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></g>, 
                Lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>, 
                Unlock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 9.9-1" /></g>, 
                Repeat: <path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/>, 
                ChevronDown: <path d="m6 9 6 6 6-6"/>, 
                ChevronUp: <path d="m18 15-6-6-6 6"/>, 
                Shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>, 
                Download: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></g>, 
                Upload: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></g>, 
                Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>, 
                Plus: <path d="M12 5v14M5 12h14"/>, 
                Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>, 
                Coins: <g><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></g>,
                List: <g><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></g>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || <circle cx="12" cy="12" r="10" />}</svg>;
        };

        const Card = ({ children, className = "" }) => <div className={`rounded-[2rem] shadow-xl border p-5 transition-all bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 ${className}`}>{children}</div>;
        const SectionTitle = ({ title, iconName }) => <h2 className="text-[11px] font-black mb-3 flex items-center gap-2 uppercase tracking-widest text-slate-500 dark:text-slate-400"><Icon name={iconName} size={14} /> {title}</h2>;

        // Custom Tooltip
        const CustomTooltip = ({ active, payload }) => {
            if (active && payload && payload.length) {
                const d = payload[0].payload;
                return (
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl shadow-xl text-xs font-black">
                        <p className="mb-1 text-slate-500">{d.name}</p>
                        <p className="text-lg mb-2 text-slate-800 dark:text-slate-100 font-mono">${d.value.toLocaleString()}</p>
                        <p className="text-slate-400">{d.percentage}%</p>
                    </div>
                );
            }
            return null;
        };

        const HoldingRow = ({ conf, inputs, prices, onChange, onBlur }) => {
            const ticker = conf.type === 'fixed' ? conf.ticker : (inputs[conf.tickerKey] || conf.defaultTicker).toUpperCase();
            const price = prices[ticker] || 0;
            const diff = getDiff(price, inputs[conf.targetKey]);
            return (
                <div className="holding-input-group grid grid-cols-12 gap-1 items-center p-1">
                    <div className="col-span-3 flex flex-col justify-center px-2 border-r border-slate-200 dark:border-slate-700">
                        {conf.type === 'fixed' ? <span className={`text-xs font-black font-mono tracking-tight text-slate-700 dark:text-slate-200`}>{ticker}</span> : 
                            <input type="text" value={inputs[conf.tickerKey]} onChange={e => onChange(conf.tickerKey, e.target.value.toUpperCase())} onBlur={e => onBlur(conf.tickerKey, e.target.value)} className={`w-full text-xs font-black bg-transparent p-0 outline-none text-left font-mono tracking-tight uppercase ${conf.color}`} placeholder={conf.defaultTicker} />}
                        <span className={`text-[9px] font-mono ${conf.color}`}>${price.toFixed(1)}</span>
                    </div>
                    <input type="number" placeholder="0" value={inputs[conf.qtyKey]} onChange={e => onChange(conf.qtyKey, e.target.value)} onBlur={e => onBlur(conf.qtyKey, e.target.value)} className="col-span-3 bg-transparent font-black text-sm h-10 font-mono focus:bg-white dark:focus:bg-slate-800" />
                    <input type="number" placeholder="-" value={inputs[conf.targetKey]} onChange={e => onChange(conf.targetKey, e.target.value)} onBlur={e => onBlur(conf.targetKey, e.target.value)} className={`col-span-3 bg-transparent font-bold text-xs h-10 font-mono ${conf.color} focus:bg-white dark:focus:bg-slate-800`} />
                    <div className={`col-span-3 text-center text-xs font-black font-mono ${diff && diff > 0 ? 'text-emerald-500' : 'text-red-400'}`}>{diff ? `${diff > 0 ? '+' : ''}${diff.toFixed(1)}%` : '-'}</div>
                </div>
            );
        };

        const EditInventoryModal = ({ item, onClose, onSave, onDelete }) => {
            const [localItem, setLocalItem] = useState({...item});
            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-2xl animate-in fade-in">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-black flex gap-2"><Icon name="Edit2"/> 編輯持倉合約</h3>
                            <button onClick={onClose}><Icon name="X"/></button>
                        </div>
                        <div className="space-y-3">
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="text-xs text-slate-500 block">標的</label><input value={localItem.ticker} onChange={e=>setLocalItem({...localItem, ticker: e.target.value.toUpperCase()})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold"/></div>
                                <div><label className="text-xs text-slate-500 block">類型</label><select value={localItem.type} onChange={e=>setLocalItem({...localItem, type: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold"><option value="SC">Sell Call</option><option value="SP">Sell Put</option></select></div>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="text-xs text-slate-500 block">Strike</label><input type="number" value={localItem.strike} onChange={e=>setLocalItem({...localItem, strike: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold"/></div>
                                <div><label className="text-xs text-slate-500 block">Expiry</label><input type="date" value={localItem.expiry} onChange={e=>setLocalItem({...localItem, expiry: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold"/></div>
                            </div>
                            <div className="grid grid-cols-3 gap-2">
                                <div><label className="text-xs text-slate-500 block">張數</label><input type="number" value={localItem.contracts} onChange={e=>setLocalItem({...localItem, contracts: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold text-center"/></div>
                                <div><label className="text-xs text-slate-500 block">權利金</label><input type="number" value={localItem.premium} onChange={e=>setLocalItem({...localItem, premium: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold text-center text-emerald-500"/></div>
                                <div><label className="text-xs text-slate-500 block">Delta</label><input type="number" value={localItem.delta} onChange={e=>setLocalItem({...localItem, delta: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold text-center"/></div>
                            </div>
                            <div className="flex gap-2 mt-4">
                                <button onClick={()=>onDelete(localItem.id)} className="p-3 bg-red-100 text-red-500 rounded-xl"><Icon name="Trash2"/></button>
                                <button onClick={()=>onSave(localItem)} className="flex-1 bg-indigo-600 text-white rounded-xl font-bold">儲存</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const EditModal = ({ editingId, editForm, setEditingId, setEditForm, saveEdit }) => {
            if (!editingId || !editForm) return null;
            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center">
                    <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl animate-in slide-in-from-bottom-full max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-6 border-b pb-4 dark:border-slate-800">
                            <h3 className="text-xl font-black flex items-center gap-2"><Icon name="Edit2" size={20} className="text-indigo-500" /> 編輯紀錄</h3>
                            <button onClick={() => setEditingId(null)} className="p-2 bg-slate-100 dark:bg-slate-800 rounded-full"><Icon name="X" size={20} /></button>
                        </div>
                        <div className="space-y-4">
                            <div className="space-y-2">
                                <div className="text-xs font-black text-slate-400 uppercase tracking-widest">現貨部位</div>
                                {HOLDINGS_CONFIG.map(c => {
                                    const t = c.type === 'fixed' ? c.ticker : (editForm.inputs[c.tickerKey] || c.defaultTicker);
                                    return (
                                        <div key={c.id} className="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-2 px-3 rounded-xl border border-slate-100 dark:border-slate-700">

                                })}
                                <div className="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-2 px-3 rounded-xl"><span className="font-bold text-xs text-slate-500">現金 (USD)</span><input type="number" value={editForm.inputs.cash_balance} onChange={e => setEditForm(p => ({...p, inputs: {...p.inputs, cash_balance: e.target.value}}))} className="w-28 bg-white dark:bg-slate-900 border rounded-lg px-2 py-1 text-right font-mono font-bold" /></div>
                            </div>
                            
                            <div className="space-y-2 pt-2 border-t border-slate-100 dark:border-slate-700">
                                <div className="text-xs font-black text-amber-500 uppercase tracking-widest flex justify-between items-center">
                                    <span>權利金與選擇權</span>
                                </div>
                                <div className="flex justify-between items-center bg-amber-50 dark:bg-slate-800/50 p-2 px-3 rounded-xl border border-amber-100 dark:border-amber-900/30">
                                    <span className="font-bold text-xs text-amber-600">已實現權利金</span>
                                    {/* Fix for negative input */}
                                    <input type="number" step="any" value={editForm.inputs.total_realized_premium || ''} onChange={e => setEditForm(p => ({...p, inputs: {...p.inputs, total_realized_premium: e.target.value}}))} className="w-28 bg-white dark:bg-slate-900 border rounded-lg px-2 py-1 text-right font-mono font-bold text-amber-500" />
                                </div>

                            <textarea value={editForm.memo || ''} onChange={e => setEditForm(p => ({...p, memo: e.target.value}))} className="w-full bg-slate-50 dark:bg-slate-800 border-2 rounded-2xl p-4 text-sm h-20" placeholder="備註..." />
                            <button onClick={()=>saveEdit({...editForm, inputs: {...editForm.inputs, total_realized_premium: parseFloat(editForm.inputs.total_realized_premium) || 0}})} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black flex justify-center gap-2"><Icon name="Save" size={20} /> 保存修正</button>
                        </div>
                    </div>
                </div>
            );
        };

        const EditOptionHistoryModal = ({ trade, onClose, onSave, onDelete }) => {
            const [localTrade, setLocalTrade] = useState({...trade});
            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-2xl animate-in fade-in">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-black flex gap-2"><Icon name="Edit2"/> 編輯交易</h3>
                            <button onClick={onClose}><Icon name="X"/></button>
                        </div>
                        <div className="space-y-3">
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="text-xs text-slate-500 block">日期</label><input type="date" value={localTrade.date?.split('T')[0]} onChange={e=>setLocalTrade({...localTrade, date: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold"/></div>
                                <div><label className="text-xs text-slate-500 block">標的</label><input value={localTrade.ticker} onChange={e=>setLocalTrade({...localTrade, ticker: e.target.value.toUpperCase()})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold"/></div>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="text-xs text-slate-500 block">動作</label><select value={localTrade.type} onChange={e=>setLocalTrade({...localTrade, type: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold">
                                    <option value="OPEN">建倉</option>
                                    <option value="CLOSE">平倉</option>
                                    <option value="ROLL_CLOSE">轉倉(平)</option>
                                    <option value="ROLL_OPEN">轉倉(開)</option>
                                    <option value="MANUAL">補登</option>
                                </select></div>
                                {/* Fix for negative input */}
                                <div><label className="text-xs text-slate-500 block">金額 ($)</label><input type="number" step="any" value={localTrade.pnl} onChange={e=>setLocalTrade({...localTrade, pnl: e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-lg text-xs font-bold text-center" /></div>
                            </div>
                            <div className="text-[10px] text-center text-slate-400 mt-1">正數 (+) = 收入, 負數 (-) = 支出</div>
                            <div className="flex gap-2 mt-4">
                                <button onClick={()=>onDelete(localTrade.id)} className="p-3 bg-red-100 text-red-500 rounded-xl"><Icon name="Trash2"/></button>
                                <button onClick={()=>onSave({...localTrade, pnl: parseFloat(localTrade.pnl) || 0})} className="flex-1 bg-indigo-600 text-white rounded-xl font-bold">儲存</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [historyTab, setHistoryTab] = useState('nav'); 
            const [records, setRecords] = useState([]);
            const [prices, setPrices] = useState({});
            const [loadingPrices, setLoadingPrices] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [message, setMessage] = useState(null);
            const [editingId, setEditingId] = useState(null);
            const [editForm, setEditForm] = useState(null);
            const [dashboardSections, setSections] = useState({ pie: true, simulator: true, rebalance: true, holdings: true, indicators: true, memo: true, options: true });
            const [openSettings, setSettings] = useState({ account: true, system: false, strategy: false, rsi_matrix: false });
            const [isStrategyEditing, setIsStrategyEditing] = useState(false);
            const [simulatedTotal, setSimulatedTotal] = useState('');
            const [isCalcOpen, setIsCalcOpen] = useState(false);
            const [isAlertsView, setIsAlertsView] = useState(false);
            const [perfView, setPerfView] = useState('MTD');
            const [isMottoLocked, setIsMottoLocked] = useState(true);
            const [chartMode, setChartMode] = useState('NAV_DD');
            const [filterMode, setFilterMode] = useState('all');
            const [visibleCount, setVisibleCount] = useState(20);
            const [expandedYears, setExpandedYears] = useState({});
            const [historyExpanded, setHistoryExpanded] = useState(false); 
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('qqq_theme') === 'dark');
            const [customSyncId, setCustomSyncId] = useState(() => localStorage.getItem('qqq_sync_id') || '');
            const [tempSyncId, setTempSyncId] = useState(customSyncId);
            const [stressSimPct, setStressSimPct] = useState(0); 
            const [simLeverage, setSimLeverage] = useState(3); 

            const [openModalType, setOpenModalType] = useState(null); 
            const [targetOptionId, setTargetOptionId] = useState(null); 
            const [opInputs, setOpInputs] = useState({}); 

            const [editingTrade, setEditingTrade] = useState(null); 
            const [editingInventoryItem, setEditingInventoryItem] = useState(null); 
            const fileInputRef = useRef(null);

            const [inputs, setInputs] = useState({
                current_rsi: '',
                qqq_ath: 0,
                // Removed total_realized_premium from here to avoid stale state conflict
                option_history: [], 
                qqq_sma200: 0, qqq_sma20: 0, custom_1_sma40: 0, custom_2_sma20: 0, ibit_sma20: 0,
                exchange_rate: 32.5, rebalance_sat_cap: 15, rebalance_core_target: 50, rebalance_core_tolerance: 15,
                tol_up_sat_1: 20, tol_down_sat_1: 10, tol_up_sat_2: 20, tol_down_sat_2: 10, tol_up_ibit: 20, tol_down_ibit: 10,
                target_sat_1: 10, target_sat_2: 10, target_sat_ibit: 10,
                calc_alloc_qqq: 40, calc_alloc_tqqq: 40, calc_alloc_c1: 10, calc_alloc_c2: 10, calc_alloc_cash: 0,
                ticker_core_1: 'QQQ', qty_qqq: 0, qty_tqqq: 0, qty_ibit: 0, qty_sgov: 0, custom_ticker_1: 'TSLA', qty_custom_1: 0, custom_ticker_2: 'IBIT', qty_custom_2: 0,
                cash_balance: 0, record_date: new Date().toISOString().split('T')[0], // Always INIT Today
                loan_amount: 0, loan_rate: 2.0, loan_years: 7, loan_repay_target: 20, loan_entry_valuation: 0, loan_monthly_repay: 0, motto: '', record_memo: '',
                target_qqq: '', target_tqqq: '', target_ibit: '', target_sgov: '', target_custom_1: '', target_custom_2: '',
                title_core: "核心策略 (80%) - QQQ/TQQQ (NRA V8.2)", strat_core: "...", 
                title_custom: "自選衛星 1 (10%) - TSLA (週線 40)", strat_custom: "...", 
                title_ibit: "自選衛星 2 (10%) - IBIT (週線 20)", strat_ibit: "...",
                options_matrix: [
                    { min: 55, max: 70, cover: 0, delta: 'N/A' },
                    { min: 70, max: 75, cover: 30, delta: '0.15' },
                    { min: 75, max: 80, cover: 50, delta: '0.20' },
                    { min: 80, max: 100, cover: 70, delta: '0.25' }
                ],
                options_inventory: [] 
            });

            // Calculate total realized premium from history array (SOURCE OF TRUTH)
            const totalRealizedPremium = useMemo(() => {
                return (inputs.option_history || []).reduce((acc, curr) => acc + (parseFloat(curr.pnl) || 0), 0);
            }, [inputs.option_history]);

            const showToast = (txt) => { setMessage(txt); setTimeout(() => setMessage(null), 3000); };
            const effectiveUserId = customSyncId || (user ? user.uid : null);
            const handleInputChange = (f, v) => setInputs(p => ({ ...p, [f]: v === '' ? '' : (isNaN(v) ? v : parseFloat(v)) }));
            const syncToCloud = async (f, v) => { if (effectiveUserId) await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set({ [f]: v }, { merge: true }); };
            const toggleYear = (y) => setExpandedYears(prev => ({...prev, [y]: !prev[y]}));

            const handleMatrixChange = (idx, field, val) => {
                const newM = [...inputs.options_matrix];
                newM[idx][field] = val;
                setInputs(p => ({...p, options_matrix: newM}));
                syncToCloud('options_matrix', newM);
            };

            const addOption = () => {
                const newOpt = { id: Date.now(), type: 'SC', ticker: '', strike: '', expiry: '', contracts: 1, premium: 0, delta: '' };
                setEditingInventoryItem(newOpt);
            };

            // NEW: Handle Saving from Inventory Edit Modal
            const handleInventorySave = (updatedItem) => {
                let newInv;
                if (inputs.options_inventory.find(o => o.id === updatedItem.id)) {
                    // Update existing
                    newInv = inputs.options_inventory.map(o => o.id === updatedItem.id ? updatedItem : o);
                } else {
                    // Add new
                    newInv = [...(inputs.options_inventory || []), updatedItem];
                }
                setInputs(p => ({...p, options_inventory: newInv}));
                syncToCloud('options_inventory', newInv);
                setEditingInventoryItem(null);
                showToast("合約已儲存");
            };

            const handleInventoryDelete = (id) => {
                const newInv = inputs.options_inventory.filter(o => o.id !== id);
                setInputs(p => ({...p, options_inventory: newInv}));
                syncToCloud('options_inventory', newInv);
                setEditingInventoryItem(null);
                showToast("合約已刪除");
            };
            
            // Helper for removing option from dashboard
            const removeOption = (id) => handleInventoryDelete(id); 
            // Helper for editing from dashboard
            const updateOption = (id, field, val) => { /* Not used in readonly mode */ };


            const handleExecute = () => {
                try {
                    // If OPEN, we just add to inventory and history
                    if (openModalType === 'OPEN') {
                        const premium = parseFloat(opInputs.newPremium) || 0;
                        const contracts = parseFloat(opInputs.contracts) || 1;
                        const totalCredit = premium * contracts * 100;
                        
                        const newTrade = {
                            id: Date.now(),
                            date: new Date().toISOString(),
                            ticker: (opInputs.ticker || 'TQQQ').toUpperCase(),
                            type: 'OPEN',
                            pnl: totalCredit
                        };
                        const newHistory = [newTrade, ...(inputs.option_history || [])];

                        const newOpt = {
                            id: Date.now(),
                            type: opInputs.type || 'SC',
                            ticker: (opInputs.ticker || 'TQQQ').toUpperCase(),
                            strike: opInputs.newStrike || '',
                            expiry: opInputs.newExpiry || '',
                            contracts: contracts,
                            premium: premium,
                            delta: opInputs.newDelta || ''
                        };
                        const newInv = [...(inputs.options_inventory || []), newOpt];

                        setInputs(p => ({...p, options_inventory: newInv, option_history: newHistory}));
                        if (effectiveUserId) {
                            db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set({ 
                                options_inventory: newInv, 
                                option_history: newHistory 
                            }, { merge: true });
                        }
                        
                        showToast(`建倉成功！權利金收入: +$${totalCredit.toFixed(0)}`);
                        setOpenModalType(null);
                        setOpInputs({});
                        return;
                    }

                    // For CLOSE and ROLL, we need the target option
                    const opt = inputs.options_inventory.find(o => o.id === targetOptionId);
                    if (!opt) return;

                    const exitPrice = parseFloat(opInputs.exitPrice) || 0;
                    const contracts = parseFloat(opt.contracts);
                    const totalDebit = -(exitPrice * contracts * 100);

                    if (openModalType === 'CLOSE') {
                        const newTrade = {
                            id: Date.now(),
                            date: new Date().toISOString(),
                            ticker: opt.ticker,
                            type: 'CLOSE',
                            pnl: totalDebit
                        };
                        
                        const newHistory = [newTrade, ...(inputs.option_history || [])];
                        const newInv = inputs.options_inventory.filter(o => o.id !== targetOptionId);

                        setInputs(p => ({...p, options_inventory: newInv, option_history: newHistory}));
                        if (effectiveUserId) {
                            db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set({ 
                                options_inventory: newInv, 
                                option_history: newHistory
                            }, { merge: true });
                        }

                        showToast(`平倉成功！支出: $${Math.abs(totalDebit).toFixed(0)}`);

                    } else if (openModalType === 'ROLL') {
                        const newPremium = parseFloat(opInputs.newPremium) || 0;
                        const openCredit = newPremium * contracts * 100;
                        const netCashflow = totalDebit + openCredit;

                        const closeTrade = {
                            id: Date.now(),
                            date: new Date().toISOString(),
                            ticker: opt.ticker,
                            type: 'ROLL_CLOSE',
                            pnl: totalDebit
                        };
                        const openTrade = {
                            id: Date.now() + 1,
                            date: new Date().toISOString(),
                            ticker: opt.ticker,
                            type: 'ROLL_OPEN',
                            pnl: openCredit
                        };
                        const newHistory = [openTrade, closeTrade, ...(inputs.option_history || [])];

                        const newInv = inputs.options_inventory.map(o => o.id === targetOptionId ? {
                            ...o,
                            strike: opInputs.newStrike || '',
                            expiry: opInputs.newExpiry || '',
                            premium: newPremium,
                            delta: opInputs.newDelta || ''
                        } : o);

                        setInputs(p => ({...p, options_inventory: newInv, option_history: newHistory}));
                        if (effectiveUserId) {
                            db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').set({ 
                                options_inventory: newInv, 
                                option_history: newHistory
                            }, { merge: true });
                        }

                        showToast(`轉倉成功！淨現金流: $${netCashflow.toFixed(0)}`);
                    }
                    
                    setOpenModalType(null);
                    setOpInputs({});
                } catch (e) {
                    console.error("Execution Error:", e);
                    showToast("執行發生錯誤，請稍後再試");
                }
            };

            const handleTradeSave = (updatedTrade) => {
                let newHistory;
                if (inputs.option_history.find(t => t.id === updatedTrade.id)) {
                    newHistory = inputs.option_history.map(t => t.id === updatedTrade.id ? updatedTrade : t);
                } else {
                    newHistory = [updatedTrade, ...inputs.option_history];
                }
                
                setInputs(p => ({...p, option_history: newHistory}));
                syncToCloud('option_history', newHistory);
                setEditingTrade(null);
                showToast("交易紀錄已更新");
            };

            const handleTradeDelete = (id) => {
                const newHistory = inputs.option_history.filter(t => t.id !== id);
                setInputs(p => ({...p, option_history: newHistory}));
                syncToCloud('option_history', newHistory);
                setEditingTrade(null);
                showToast("交易紀錄已刪除");
            };
            
            const addNewHistoryTrade = () => {
                setEditingTrade({
                    id: Date.now(),
                    date: new Date().toISOString(),
                    ticker: 'TQQQ',
                    type: 'MANUAL',
                    pnl: 0
                });
            };
            
            const saveEdit = async (dataToSave) => { 
                if (!editingId) return;
                await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').doc(editingId).update({ 
                    inputs: dataToSave.inputs, 
                    memo: dataToSave.memo 
                }); 
                setEditingId(null); 
                showToast("更新成功"); 
            };

            const fetchPrices = useCallback(async (force = false) => {
                if (loadingPrices) return;
                const CACHE_KEY = 'qqq_price_cache_v7';
                const syms = [...new Set(['QQQ', 'QQQM', 'TQQQ', 'IBIT', 'SGOV', (inputs.ticker_core_1||"QQQ"), (inputs.custom_ticker_1||""), (inputs.custom_ticker_2||"")].filter(Boolean).map(s=>s.trim().toUpperCase()))];
                if (!force) {
                    const cached = localStorage.getItem(CACHE_KEY);
                    if (cached) {
                        const { timestamp, data } = JSON.parse(cached);
                        if (Date.now() - timestamp < 300000 && syms.every(s => data[s] !== undefined)) { setPrices(data); return; }
                    }
                }
                setLoadingPrices(true);
                try {
                    const res = await Promise.allSettled(syms.map(s => fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${FINNHUB_KEY}`).then(r => r.json()).then(d => ({s, p: d.c}))));
                    const newPrices = res.reduce((acc, curr) => (curr.status === 'fulfilled' && curr.value.p > 0 ? {...acc, [curr.value.s]: curr.value.p} : acc), {});
                    setPrices(p => { const upd = {...p, ...newPrices}; localStorage.setItem(CACHE_KEY, JSON.stringify({timestamp: Date.now(), data: upd})); return upd; });
                } catch(e) { console.error(e); } finally { setLoadingPrices(false); }
            }, [inputs.ticker_core_1, inputs.custom_ticker_1, inputs.custom_ticker_2, loadingPrices]);

            // Calculations
            const { totalCapital, performanceStats, rebalanceStatus, scenarioData, bearDefense, qqqDistance, currentLeverage, pieData, calcResults, rsiSuggestion, qqqAthMetrics, graphData, simulatedMetrics } = useMemo(() => {
                const getP = (t) => prices[(t || "").toUpperCase()] || 0;
                const getV = (k) => getNum(inputs[k]);
                
                let total = getV('cash_balance');
                HOLDINGS_CONFIG.forEach(c => total += (c.type === 'fixed' ? getP(c.ticker) : getP(inputs[c.tickerKey])) * getV(c.qtyKey));

                // RSI & Options Logic (Moved to Top)
                const rsi = getNum(inputs.current_rsi);
                let sug = { cover: 0, delta: 'N/A' };
                if (rsi > 0 && inputs.options_matrix) {
                    const rule = inputs.options_matrix.find(r => rsi >= r.min && rsi < r.max);
                    if (rule) sug = { cover: rule.cover, delta: rule.delta };
                }
                const suggestContracts = Math.floor((getV('qty_tqqq') / 100) * (sug.cover / 100));

                let ytd = 0, mtd = 0, tot = 0;
                let gData = [];

                if (records.length) {
                    const sorted = [...records].sort((a,b) => new Date(a.date) - new Date(b.date));
                    const now = new Date();
                    const getRet = (rec) => rec.total_equity > 0 ? ((total - rec.total_equity) / rec.total_equity) * 100 : 0;
                    tot = getRet(sorted[0]);
                    const startY = sorted.find(r => new Date(r.date).getFullYear() === now.getFullYear()) || sorted[0];
                    ytd = getRet(startY);
                    const startM = sorted.find(r => new Date(r.date).getMonth() === now.getMonth() && new Date(r.date).getFullYear() === now.getFullYear()) || sorted[0];
                    mtd = getRet(startM);

                    // Graph Data Logic
                    const baseEq = sorted[0].total_equity || 1;
                    const baseQ = sorted[0].prices?.QQQ || 1;
                    let maxEq = 0;
                    
                    const filteredRecords = sorted.filter(r => { 
                        const d=new Date(r.date), n=new Date(); 
                        return filterMode==='all' || (filterMode==='year' && d.getFullYear()===n.getFullYear()) || (filterMode==='month' && d.getMonth()===n.getMonth()); 
                    });

                    gData = filteredRecords.map(r => {
                        if(r.total_equity > maxEq) maxEq = r.total_equity;
                        return { date: r.date, equity: r.total_equity, dd: maxEq>0 ? ((r.total_equity-maxEq)/maxEq)*100 : 0, ret: ((r.total_equity-baseEq)/baseEq)*100, qRet: (((r.prices?.QQQ||0)-baseQ)/baseQ)*100 };
                    });
                }

                const tCore = (inputs.ticker_core_1 || "QQQ").toUpperCase();
                const valQQQ = getP(tCore) * getV('qty_qqq');
                const valTQQQ = getP('TQQQ') * getV('qty_tqqq');
                const valCore = valQQQ + valTQQQ;
                const tqqqRatio = valCore > 0 ? (valTQQQ / valCore) * 100 : 0;
                const qqqRatio = valCore > 0 ? (valQQQ / valCore) * 100 : 0;
                
                const valSat1 = getP(inputs.custom_ticker_1) * getV('qty_custom_1');
                const valSat2 = getP(inputs.custom_ticker_2) * getV('qty_custom_2');
                const valIbit = getP('IBIT') * getV('qty_ibit');

                const satVal = valSat1 + valSat2 + valIbit;

                const c1W = (valSat1 / (total||1)) * 100;
                const c2W = (valSat2 / (total||1)) * 100;
                const ibitW = (valIbit / (total||1)) * 100;
                
                const coreTarget = getV('rebalance_core_target');
                const coreTol = getV('rebalance_core_tolerance');
                
                const checkSat = (w, target, up, down) => {
                    const u = getNum(up) || 20; const d = getNum(down) || 10;
                    if (w > target * (1 + u/100)) return 'high';
                    if (w < target * (1 - d/100)) return 'low';
                    return 'ok';
                };

                const stat1 = checkSat(c1W, getV('target_sat_1'), inputs.tol_up_sat_1, inputs.tol_down_sat_1);
                const stat2 = checkSat(c2W, getV('target_sat_2'), inputs.tol_up_sat_2, inputs.tol_down_sat_2);
                const statIbit = checkSat(ibitW, getV('target_sat_ibit'), inputs.tol_up_ibit, inputs.tol_down_ibit);

                const sma200 = getV('qqq_sma200');
                const benchmarkPrice = getP('QQQ'); 
                const riskOff = sma200 * 0.97;
                const isBear = sma200 > 0 && benchmarkPrice > 0 && benchmarkPrice < riskOff;
                const bearData = { isActive: isBear, totalDefensive: getV('cash_balance') + (getP('SGOV') * getV('qty_sgov')), monthlyBuy: (getV('cash_balance') + (getP('SGOV') * getV('qty_sgov'))) / 12 };

                const bearDrop = (benchmarkPrice > 0) ? (sma200 - benchmarkPrice) / benchmarkPrice : 0;
                
                // Static Bear Defense Est
                const bearCoreVal = isBear ? 0 : (valQQQ * (1 + bearDrop)) + (valTQQQ * (1 + (bearDrop * 3))); 
                const bearSatVal = satVal * (1 + bearDrop);
                const bearCash = getV('cash_balance') + (getP('SGOV') * getV('qty_sgov'));
                const estTotalBear = bearCoreVal + bearSatVal + bearCash;

                // STRESS TEST SIMULATOR LOGIC
                // Check if benchmarkPrice is valid
                const safeBenchmarkPrice = benchmarkPrice > 0 ? benchmarkPrice : 0;
                
                const simDrop = stressSimPct / 100;
                const simPrice = safeBenchmarkPrice * (1 + simDrop);
                
                // Estimate Portfolio using safe values
                // Use fallback of 0 if values are NaN
                const safeValQQQ = isNaN(valQQQ) ? 0 : valQQQ;
                const safeValTQQQ = isNaN(valTQQQ) ? 0 : valTQQQ;
                const safeSatVal = isNaN(satVal) ? 0 : satVal;
                const safeCash = isNaN(getV('cash_balance')) ? 0 : getV('cash_balance');
                const safeSGOV = isNaN(getP('SGOV') * getV('qty_sgov')) ? 0 : (getP('SGOV') * getV('qty_sgov'));
                
                // Use simLeverage for the TQQQ portion
                const safeEstCore = isBear ? 0 : (safeValQQQ * (1 + simDrop)) + (safeValTQQQ * (1 + (simDrop * simLeverage)));
                const safeEstSat = safeSatVal * (1 + simDrop);
                
                const safeEstTotalSim = safeEstCore + safeEstSat + safeCash + safeSGOV;
                const safeSimPnL = safeEstTotalSim - total;

                const exposure = (valTQQQ*3) + valQQQ + satVal;
                
                const pie = HOLDINGS_CONFIG.map(c => ({ 
                    name: c.type==='fixed'?c.ticker:inputs[c.tickerKey]||c.defaultTicker, 
                    value: (c.type==='fixed'?getP(c.ticker):getP(inputs[c.tickerKey])) * getV(c.qtyKey), 
                    color: c.hex 
                })).concat({name:'現金', value: getV('cash_balance'), color:'#94a3b8'}).filter(x=>x.value>0);
                const pieSum = pie.reduce((a,b)=>a+b.value, 0);

                let calcRes = [];
                if (simulatedTotal) {
                    const injection = parseFloat(simulatedTotal);
                    if (!isNaN(injection)) {
                        const newTotal = total + injection;
                        const tSat1 = getV('target_sat_1')/100;
                        const tSat2 = getV('target_sat_2')/100;
                        const tIbit = getV('target_sat_ibit')/100;
                        const targetSat1Val = newTotal * tSat1;
                        const targetSat2Val = newTotal * tSat2;
                        const targetIbitVal = newTotal * tIbit;
                        const remForCore = newTotal - targetSat1Val - targetSat2Val - targetIbitVal;
                        const targetTQQQVal = remForCore * (coreTarget/100);
                        const targetQQQVal = remForCore * (1 - coreTarget/100);
                        const calcDiff = (target, current, ticker) => {
                            const diff = target - current;
                            const price = getP(ticker);
                            return { ticker, diff, qty: price > 0 ? diff / price : 0 };
                        };
                        calcRes = [
                            calcDiff(targetTQQQVal, valTQQQ, 'TQQQ'),
                            calcDiff(targetQQQVal, valQQQ, tCore),
                            calcDiff(targetSat1Val, valSat1, inputs.custom_ticker_1),
                            calcDiff(targetSat2Val, valSat2, inputs.custom_ticker_2),
                            calcDiff(targetIbitVal, valIbit, 'IBIT')
                        ];
                    }
                }

                // QQQ ATH Metrics
                const ath = getV('qqq_ath');
                const ma200Extension = (sma200 > 0 && benchmarkPrice > 0) ? ((benchmarkPrice - sma200) / sma200) * 100 : null;
                const distanceToAth = (ath > 0 && benchmarkPrice > 0) ? ((ath - benchmarkPrice) / benchmarkPrice) * 100 : null;

                return {
                    totalCapital: total,
                    performanceStats: { ytd, mtd, total: tot },
                    rebalanceStatus: { 
                        tqqqRatio, qqqRatio, valCore, valQQQ, valTQQQ, valSat1, valSat2, valIbit,
                        isCoreImbalanced: Math.abs(tqqqRatio - coreTarget) > coreTol, 
                        coreTarget, c1W: c1W.toFixed(1), c2W: c2W.toFixed(1), ibitW: ibitW.toFixed(1), 
                        tSat1: getV('target_sat_1'), tSat2: getV('target_sat_2'), tSatIbit: getV('target_sat_ibit'), 
                        t1: inputs.custom_ticker_1, t2: inputs.custom_ticker_2,
                        stat1, stat2, statIbit,
                        valSat1, valSat2, valIbit
                    },
                    bearDefense: bearData,
                    scenarioData: { bear: { triggerPrice: sma200, dropPct: bearDrop*100, estTotal: estTotalBear, maxLoss: estTotalBear - total } },
                    qqqDistance: (sma200>0 && benchmarkPrice>0) ? ((benchmarkPrice - sma200)/sma200)*100 : null,
                    currentLeverage: (total>0 ? exposure/total : 0).toFixed(2),
                    pieData: pie.map(p => ({...p, percentage: ((p.value/pieSum)*100).toFixed(1)})),
                    calcResults: calcRes,
                    rsiSuggestion: { ...sug, contracts: suggestContracts },
                    qqqAthMetrics: { ma200Extension, distanceToAth, ath, currentPrice: benchmarkPrice },
                    graphData: gData,
                    simulatedMetrics: { 
                        simPrice: simPrice || 0, 
                        estTotalSim: safeEstTotalSim || 0, 
                        simPnL: safeSimPnL || 0 
                    }
                };
            }, [prices, inputs, records, simulatedTotal, filterMode, stressSimPct, simLeverage]); // Added simLeverage dependency

            const handleSimSlider = (e) => {
                const val = parseFloat(e.target.value);
                setStressSimPct(val);
            };

            const handleSimPriceInput = (e) => {
                const val = parseFloat(e.target.value);
                if (val > 0 && qqqAthMetrics.currentPrice > 0) {
                    const pct = ((val - qqqAthMetrics.currentPrice) / qqqAthMetrics.currentPrice) * 100;
                    setStressSimPct(pct);
                }
            };

            const historyGroups = useMemo(() => {
                if (!records || records.length === 0) return [];
                const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
                const groups = {};
                sorted.forEach(rec => {
                    const d = new Date(rec.date);
                    const y = d.getFullYear();
                    const m = d.getMonth() + 1;
                    if (!groups[y]) groups[y] = { records: [], months: {} };
                    groups[y].records.push(rec);
                    if (!groups[y].months[m]) groups[y].months[m] = [];
                    groups[y].months[m].push(rec);
                });
                return Object.keys(groups).sort((a,b) => b-a).map(year => { 
                    const yData = groups[year];
                    const yStart = yData.records[0].total_equity;
                    const yEnd = yData.records[yData.records.length - 1].total_equity;
                    const yRet = yStart > 0 ? ((yEnd - yStart) / yStart) * 100 : 0;
                    const months = Object.keys(yData.months).sort((a,b) => b-a).map(month => {
                        const mRecs = yData.months[month];
                        const mStart = mRecs[0].total_equity;
                        const mEnd = mRecs[mRecs.length - 1].total_equity;
                        const mRet = mStart > 0 ? ((mEnd - mStart) / mStart) * 100 : 0;
                        return { month, return: mRet };
                    });
                    return { year, return: yRet, months };
                });
            }, [records]);

            // History Filtering
            const allHistory = graphData.slice().reverse();
            const displayedHistory = historyExpanded ? allHistory : allHistory.slice(0, 5);

            const alerts = useMemo(() => {
                const a = [];
                const { tqqqRatio, c1W, c2W, ibitW, coreTarget, isCoreImbalanced, tSat1, tSat2, tSatIbit, stat1, stat2, statIbit, t1, t2 } = rebalanceStatus;
                const getP = (t) => prices[(t || "").toUpperCase()] || 0;
                const getQty = (val, price) => (price > 0 ? Math.abs(val / price) : 0);

                if (isCoreImbalanced) {
                    const targetTQQQVal = rebalanceStatus.valCore * (coreTarget / 100);
                    const diffVal = targetTQQQVal - rebalanceStatus.valTQQQ;
                    const action = diffVal > 0 ? '買入' : '賣出';
                    const qty = getQty(diffVal, getP('TQQQ'));
                    a.push({ type: 'warning', title: '【TQQQ】 核心再平衡', msg: `目前 ${tqqqRatio.toFixed(1)}% (建議${action} ${qty.toFixed(0)} 股 / $${Math.abs(diffVal).toFixed(0)})`});
                }

                const checkSatAction = (stat, name, currentW, targetW, currentVal, ticker) => {
                    if (stat !== 'ok') {
                        const targetVal = totalCapital * (targetW / 100);
                        const diffVal = targetVal - currentVal;
                        const action = diffVal > 0 ? '買入' : '賣出';
                        const qty = getQty(diffVal, getP(ticker));
                        const reason = stat === 'high' ? '高於上限' : '低於下限';
                        a.push({ type: stat==='high'?'opportunity':'warning', title: `【${name}】 ${reason}`, msg: `目前 ${currentW.toFixed(1)}% (建議${action} ${qty.toFixed(0)} 股 / $${Math.abs(diffVal).toFixed(0)})`});
                    }
                };

                checkSatAction(stat1, t1||'自選1', parseFloat(c1W), tSat1, rebalanceStatus.valSat1, t1);
                checkSatAction(stat2, t2||'自選2', parseFloat(c2W), tSat2, rebalanceStatus.valSat2, t2);
                checkSatAction(statIbit, 'IBIT', parseFloat(ibitW), tSatIbit, rebalanceStatus.valIbit, 'IBIT');

                if (bearDefense.isActive) a.push({ type: 'danger', title: '【QQQ】 熊市防禦', msg: 'QQQ < 200 SMA (-3%)，請轉入防禦資產'});
                
                if (inputs.options_inventory) {
                    inputs.options_inventory.forEach(o => {
                        if (parseFloat(o.delta) >= 0.4) a.push({ type: 'danger', title: `【${o.ticker}】 選擇權警戒`, msg: `Delta ${o.delta} 觸及 0.40！請執行黃金轉倉。` });
                    });
                }
                return a;
            }, [rebalanceStatus, bearDefense, totalCapital, prices, inputs.options_inventory]);

            // Effects
            useEffect(() => { auth.signInAnonymously().catch(console.error); return auth.onAuthStateChanged(setUser); }, []);
            useEffect(() => { if (!effectiveUserId) return; db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').onSnapshot(s => setRecords(s.docs.map(d => ({id:d.id,...d.data()})))); 
                db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('config').doc('current').onSnapshot(s => {
                    if (s.exists) {
                        const data = s.data();
                        // FORCE DATE TO TODAY ON LOAD
                        data.record_date = new Date().toISOString().split('T')[0];
                        // Ensure option_history is an array
                        if (!data.option_history) data.option_history = [];
                        setInputs(p => ({...p, ...data}));
                    }
                }); 
                fetchPrices(); 
            }, [effectiveUserId]);
            useEffect(() => { document.documentElement.className = darkMode ? 'dark' : 'light'; }, [darkMode]);

            // Actions
            const save = async () => { if (!effectiveUserId || isSaving) return; setIsSaving(true); try { await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').add({ date: new Date(inputs.record_date).toISOString(), total_equity: totalCapital, total_realized_premium: totalRealizedPremium, prices, inputs, memo: inputs.record_memo }); await syncToCloud('last_save', Date.now()); showToast("同步成功"); setInputs(p=>({...p, record_memo: ''})); } catch(e) { showToast("失敗"); } setIsSaving(false); };
            const confirmDelete = async (id) => { await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').doc(id).delete(); showToast("已刪除"); };
            const exportData = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({records, inputs})], {type: "application/json"})); a.download = `Backup_${new Date().toISOString().split('T')[0]}.json`; a.click(); };
            const importData = (e) => { const r = new FileReader(); r.onload = (ev) => { const d = JSON.parse(ev.target.result); if(d.inputs) setInputs(p=>({...p,...d.inputs})); if(d.records) setRecords(d.records); alert("匯入成功 (暫存)"); }; if(e.target.files[0]) r.readAsText(e.target.files[0]); };

            // Render Helpers
            const getPerfDisplay = () => { if(perfView==='MTD') return {l:'本月',v:performanceStats.mtd}; if(perfView==='ALL') return {l:'總計',v:performanceStats.total}; return {l:'今年',v:performanceStats.ytd}; };
            const perfD = getPerfDisplay();

            const INDICATOR_FIELDS = [
                {k:'qqq_sma200', l:'QQQ 200 SMA'},
                {k:'qqq_sma20', l:'QQQ 20 SMA'},
                {k:'qqq_ath', l:'QQQ 歷史新高 (ATH)'}, 
                {k:'custom_1_sma40', l:`${inputs.custom_ticker_1||'自選1'} 週線 40 SMA`},
                {k:'custom_2_sma20', l:`${inputs.custom_ticker_2||'自選2'} 週線 20 SMA`},
                {k:'ibit_sma20', l:'IBIT 週線 20 SMA'}
            ];

            return (
                <div className="pb-40 min-h-screen transition-colors duration-300 font-black text-left select-none overflow-x-hidden">
                    {message && <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[60] animate-in fade-in slide-in-from-top-4"><div className="bg-indigo-600 text-white px-6 py-3 rounded-full shadow-2xl text-sm flex items-center gap-2"><Icon name="CheckCircle" size={16} /> {message}</div></div>}
                    <EditModal editingId={editingId} editForm={editForm} setEditingId={setEditingId} setEditForm={setEditForm} saveEdit={async () => { await db.collection('artifacts').doc(APP_ID).collection('users').doc(effectiveUserId).collection('trading_records').doc(editingId).update({ inputs: editForm.inputs, memo: editForm.memo }); setEditingId(null); showToast("更新成功"); }} />
                    {editingInventoryItem && <EditInventoryModal item={editingInventoryItem} onClose={()=>setEditingInventoryItem(null)} onSave={handleInventorySave} onDelete={handleInventoryDelete} />}
                    {editingTrade && <EditOptionHistoryModal trade={editingTrade} onClose={()=>setEditingTrade(null)} onSave={handleTradeSave} onDelete={handleTradeDelete} />}

                    {/* OPTION ACTION MODAL */}
                    {openModalType && (
                        <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center">
                            <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl animate-in slide-in-from-bottom-full">
                                <h3 className="text-xl font-black mb-4 flex items-center gap-2">
                                    <Icon name={openModalType==='OPEN'?'Plus':openModalType==='ROLL'?'RefreshCcw':'CheckCircle'} className="text-indigo-500"/>
                                    {openModalType === 'OPEN' ? '新建倉位 (Sell Open)' : openModalType === 'ROLL' ? '選擇權轉倉 (Roll)' : '選擇權平倉 (Close)'}
                                </h3>
                                
                                {openModalType === 'OPEN' && (
                                    <div className="space-y-3">
                                        <div className="grid grid-cols-2 gap-2">
                                            <div><label className="text-xs font-bold text-slate-500">標的</label><input value={opInputs.ticker||''} onChange={e=>setOpInputs({...opInputs, ticker:e.target.value.toUpperCase()})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-black" placeholder="TQQQ"/></div>
                                            <div><label className="text-xs font-bold text-slate-500">類型</label><select value={opInputs.type||'SC'} onChange={e=>setOpInputs({...opInputs, type:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"><option value="SC">Sell Call</option><option value="SP">Sell Put</option></select></div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div><label className="text-xs font-bold text-slate-500">履約價</label><input type="number" value={opInputs.newStrike||''} onChange={e=>setOpInputs({...opInputs, newStrike:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"/></div>
                                            <div><label className="text-xs font-bold text-slate-500">到期日</label><input type="date" value={opInputs.newExpiry||''} onChange={e=>setOpInputs({...opInputs, newExpiry:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold text-xs"/></div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div><label className="text-xs font-bold text-slate-500">張數</label><input type="number" value={opInputs.contracts||''} onChange={e=>setOpInputs({...opInputs, contracts:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"/></div>
                                            <div><label className="text-xs font-bold text-slate-500">權利金 (單口)</label><input type="number" value={opInputs.newPremium||''} onChange={e=>setOpInputs({...opInputs, newPremium:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"/></div>
                                        </div>
                                        <div><label className="text-xs font-bold text-slate-500">Delta</label><input type="number" value={opInputs.newDelta||''} onChange={e=>setOpInputs({...opInputs, newDelta:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-center font-bold"/></div>
                                        <div className="bg-emerald-50 dark:bg-emerald-900/20 p-2 rounded-lg text-center text-xs font-bold text-emerald-600 dark:text-emerald-400">
                                            預估收入: +${((parseFloat(opInputs.newPremium)||0) * (parseFloat(opInputs.contracts)||0) * 100).toFixed(0)}
                                        </div>
                                    </div>
                                )}

                                {openModalType === 'CLOSE' && (
                                    <div className="space-y-3">
                                        <div><label className="text-xs font-bold text-slate-500">平倉買回價格 (Buy to Close)</label><input type="number" autoFocus value={opInputs.exitPrice||''} onChange={e=>setOpInputs({...opInputs, exitPrice:e.target.value})} className="w-full bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-center font-black text-xl" /></div>
                                        {inputs.options_inventory.find(o => o.id === targetOptionId) && (
                                            <div className="bg-red-50 dark:bg-red-900/20 p-2 rounded-lg text-center text-xs font-bold text-red-500">
                                                預估支出: -${((parseFloat(opInputs.exitPrice)||0) * inputs.options_inventory.find(o => o.id === targetOptionId).contracts * 100).toFixed(0)}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {openModalType === 'ROLL' && (
                                    <div className="space-y-3">
                                        <div className="bg-slate-50 dark:bg-slate-800/50 p-2 rounded-lg mb-2">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Step 1: 平倉舊合約</label>
                                            <div className="flex justify-between items-center mt-1">
                                                <span className="text-xs font-bold">買回價格</span>
                                                <input type="number" autoFocus value={opInputs.exitPrice||''} onChange={e=>setOpInputs({...opInputs, exitPrice:e.target.value})} className="w-24 bg-white dark:bg-slate-700 p-1 rounded text-center font-bold" />
                                            </div>
                                        </div>
                                        <div className="bg-slate-50 dark:bg-slate-800/50 p-2 rounded-lg">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Step 2: 建立新合約</label>
                                            <div className="grid grid-cols-2 gap-2 mt-1">
                                                <input type="number" placeholder="新權利金" value={opInputs.newPremium||''} onChange={e=>setOpInputs({...opInputs, newPremium:e.target.value})} className="bg-white dark:bg-slate-700 p-1 rounded text-center text-xs font-bold"/>
                                                <input type="number" placeholder="新 Strike" value={opInputs.newStrike||''} onChange={e=>setOpInputs({...opInputs, newStrike:e.target.value})} className="bg-white dark:bg-slate-700 p-1 rounded text-center text-xs font-bold"/>
                                                <input type="date" value={opInputs.newExpiry||''} onChange={e=>setOpInputs({...opInputs, newExpiry:e.target.value})} className="bg-white dark:bg-slate-700 p-1 rounded text-center text-xs font-bold"/>
                                                <input type="number" placeholder="新 Delta" value={opInputs.newDelta||''} onChange={e=>setOpInputs({...opInputs, newDelta:e.target.value})} className="bg-white dark:bg-slate-700 p-1 rounded text-center text-xs font-bold"/>
                                            </div>
                                        </div>
                                        {inputs.options_inventory.find(o => o.id === targetOptionId) && (
                                            <div className="grid grid-cols-2 gap-2 text-center text-[10px] font-bold">
                                                <div className="bg-red-50 dark:bg-red-900/20 p-1 rounded text-red-500">
                                                    平倉: -${((parseFloat(opInputs.exitPrice)||0) * inputs.options_inventory.find(o => o.id === targetOptionId).contracts * 100).toFixed(0)}
                                                </div>
                                                <div className="bg-emerald-50 dark:bg-emerald-900/20 p-1 rounded text-emerald-500">
                                                    新倉: +${((parseFloat(opInputs.newPremium)||0) * inputs.options_inventory.find(o => o.id === targetOptionId).contracts * 100).toFixed(0)}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                <div className="flex gap-2 mt-4">
                                    <button onClick={()=>{setOpenModalType(null);setOpInputs({})}} className="flex-1 bg-slate-200 dark:bg-slate-800 text-slate-500 py-3 rounded-xl font-bold">取消</button>
                                    <button onClick={handleExecute} className="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold">確認執行</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="fixed top-0 inset-x-0 bg-indigo-900 dark:bg-slate-950 z-50 px-5 py-4 pt-6 flex justify-between items-center shadow-lg text-white">
                        <div className="flex items-center gap-2 font-black"><div className="bg-white p-2 rounded-2xl shadow-sm"><Icon name="TrendingUp" className="text-indigo-900" size={18} /></div><h1 className="text-lg">Alpha Horizon</h1></div>
                        <div className="flex gap-2"><button onClick={() => setView('sync_settings')} className="p-2.5 rounded-xl bg-white text-slate-700 shadow-sm"><Icon name="Settings" size={20} /></button><div className="flex items-center gap-1.5 ml-1"><button onClick={() => fetchPrices(true)} className="p-2 text-white/80"><Icon name="RefreshCcw" size={22} className={loadingPrices ? 'animate-spin' : ''} /></button><div className={`w-3.5 h-3.5 rounded-full border-2 ${loadingPrices ? 'bg-red-500 sync-loading' : 'bg-emerald-500'}`}></div></div></div>
                    </header>

                    <main className="max-w-md mx-auto p-4 pt-28 space-y-6">
                        {view === 'dashboard' && (
                            <div className="space-y-6 animate-in fade-in">

                                                                        {m.return > 0 ? '+' : ''}{m.return.toFixed(2)}%
                                                                    </span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}

                                            <div className="flex items-center gap-2 text-xs font-black text-slate-500 px-1 uppercase tracking-widest"><Icon name="History" size={14}/> 詳細紀錄列表</div>
                                            {displayedHistory.map(r => { const rec = records.find(x=>x.date===r.date); return (

                                                <div><div className="text-[10px] text-slate-400 font-bold">{new Date(r.date).toLocaleDateString()}</div><div className="text-xl font-mono">${r.equity.toLocaleString()}</div>
                                                </div>
                                                <div className="flex gap-2"><button onClick={(e)=>{e.stopPropagation();setEditingId(rec.id);setEditForm(JSON.parse(JSON.stringify(rec)));}} className="p-2 bg-blue-50 dark:bg-slate-800 text-blue-500 rounded-lg"><Icon name="Edit2" size={14}/></button><button onClick={(e)=>{e.stopPropagation();confirmDelete(rec.id)}} className="p-2 bg-red-50 dark:bg-slate-800 text-red-500 rounded-lg"><Icon name="Trash2" size={14}/></button></div>
                                            </Card>
                                            );})}
                                            {allHistory.length > 5 && (
                                                <button onClick={() => setHistoryExpanded(!historyExpanded)} className="w-full py-3 text-xs font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors">
                                                    {historyExpanded ? "收起 (只看 5 筆)" : `顯示全部 (共 ${allHistory.length} 筆)`}

                                            <div className="text-xs font-black text-amber-600 dark:text-amber-500 uppercase tracking-widest mb-1">歷史已實現總權利金 <span className="text-[9px] text-slate-400 ml-1">(即時同步)</span></div>

                                        <div className="flex justify-between items-center px-1 mb-2">

                                        </div>
                                        {inputs.option_history && inputs.option_history.length > 0 ? (
                                            inputs.option_history.map(t => (
                                                <Card key={t.id} className="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50" onClick={()=>setEditingTrade(t)}>
                                                    <div>
                                                        <div className="text-[10px] text-slate-400 font-bold">{new Date(t.date).toLocaleDateString()}</div>
                                                        <div className="font-bold flex items-center gap-2">
                                                            <span className="text-indigo-600 dark:text-indigo-400">{t.ticker}</span>

                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-4">
                                                        <div className={`text-lg font-mono font-black ${t.pnl >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>

                                                            <button onClick={(e)=>{e.stopPropagation();setEditingTrade(t)}} className="p-1.5 text-blue-400 hover:bg-blue-50 rounded"><Icon name="Edit2" size={14}/></button>

                                                        </div>
                                                    </div>
                                                </Card>
                                            ))

                                            <div className="text-center text-slate-400 text-sm py-10">尚無選擇權交易紀錄</div>

                                    </div>
                                )}
                            </div>

                        {view === 'loan' && (
                            <div className="space-y-6 animate-in fade-in">
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] p-5 border border-slate-200 dark:border-slate-700">
                                    <div className="flex justify-between mb-4"><div className="text-xs font-black uppercase text-slate-500"><Icon name="Activity" size={16} /> LTV Monitor</div><div className="text-xs font-black bg-slate-100 px-2 py-1 rounded">{(inputs.loan_amount>0&&totalCapital>0?(inputs.loan_amount/totalCapital*100):0).toFixed(1)}%</div></div>
                                    <div className="h-4 bg-slate-100 rounded-full overflow-hidden relative"><div className={`absolute h-full ${((inputs.loan_amount/totalCapital)*100)<30?'bg-emerald-500':'bg-red-500'}`} style={{width:`${Math.min((inputs.loan_amount/totalCapital)*100,100)}%`}}></div></div>
                                    <div className="mt-3 text-[10px] text-slate-400 leading-relaxed border-t border-slate-100 dark:border-slate-800 pt-2"><span className="font-bold">LTV (Loan-to-Value) 貸款價值比：</span>即「貸款金額 ÷ 總資產市值」。數值越低代表安全邊際越高；若 LTV 過高 (如 >60%)，在市場下跌時容易被迫補繳保證金或遭到斷頭清算。建議保持在 30% 以下較為安全。</div>
                                </div>
                                <Card className="border-2 border-amber-100 dark:border-amber-900/30">
                                    <div className="grid gap-4">{[{l:"貸款額",k:"loan_amount"},{l:"基準市值",k:"loan_entry_valuation"},{l:"還款目標%",k:"loan_repay_target"}].map(f => <div key={f.k} className="space-y-1"><label className="text-[10px] uppercase text-amber-600">{f.l}</label><input type="number" value={inputs[f.k]} onChange={e=>handleInputChange(f.k,e.target.value)} onBlur={e=>syncToCloud(f.k,e.target.value)} className="bg-amber-50 dark:bg-slate-800 rounded-xl p-3 text-center text-lg" /></div>)}</div>

                                        <div className="text-xs opacity-60 uppercase">賣出還款門檻</div><div className="text-xl font-mono">${(inputs.loan_entry_valuation*(1+inputs.loan_repay_target/100)).toLocaleString(undefined,{maximumFractionDigits:0})}</div>

                                    {openSettings.account && <div className="p-6 pt-2 space-y-4">
                                        <div className="text-center font-mono text-lg">{effectiveUserId}</div>

                                        <div className="flex gap-2"><button onClick={exportData} className="flex-1 bg-slate-200 p-3 rounded-xl flex justify-center gap-2"><Icon name="Download"/> 備份</button><label className="flex-1 bg-slate-200 p-3 rounded-xl flex justify-center gap-2"><Icon name="Upload"/> 匯入<input type="file" className="hidden" onChange={importData} ref={fileInputRef}/></label></div>
                                    </div>}
                                </div>

                                    {openSettings.system && <div className="p-6 pt-2 space-y-4">
                                        
                                        <div className="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl">
