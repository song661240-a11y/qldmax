    const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
    const getNum = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
    const money = (v, digits=0) => (Number(v)||0).toLocaleString("en-US", { maximumFractionDigits:digits, minimumFractionDigits:digits });
    const pct = (v, digits=2) => Number.isFinite(v) ? `${(v*100).toFixed(digits)}%` : "-";
    const pctNum = (v, digits=1) => `${(Number(v)||0).toFixed(digits)}%`;
    const round2 = v => Math.round((Number(v)||0)*100)/100;

    const signedPctText = (v, digits=1) => `${v >= 0 ? "+" : ""}${(Number(v)||0).toFixed(digits)}%`;

    const DEFAULT = {
      spy:"", spySma:"", qqq:"", qqqSma:"", tqqq:"", sgov:"", marketDate:"",

      sharesTqqq:0, sharesQqq:0, sharesSpy:0, sharesSgov:0, cashUsd:0, otherUsd:0, usdtwd:32, currency:"USD", assetHighUsd:0, lastExecutedAt:"", lastExecutionSummary:"",

    };
    const STRATEGY_TEXT = `SPY 200SMA +4/-3 改良版\n\n1. Risk-On：SPY 收盤價 > SPY 200SMA × 1.04，允許 100% TQQQ。\n2. Risk-Off：SPY 收盤價 < SPY 200SMA × 0.97，賣出 TQQQ，接著分 6 個月 DCA 進 QQQ。\n3. 中間區：SPY 位於 +4% 到 -3% 之間，不做新動作，維持原部位。\n4. QQQ 過熱一階：QQQ > QQQ 200SMA +30%，降為 50% TQQQ / 50% QQQ。\n5. QQQ 過熱二階：QQQ > QQQ 200SMA +40%，降為 100% QQQ。\n6. 過熱解除：QQQ 回落到 200SMA +25% 以下，且 SPY 仍 Risk-On，才恢復 TQQQ。\n7. 紀律：訊號以收盤資料判斷，不因新聞、情緒或帳面損益改變規則。`;

    const Card = ({children, className=""}) => <div className={`bg-white rounded-3xl border border-slate-200 shadow-soft ${className}`}>{children}</div>;
    const Pill = ({children, tone="slate"}) => {
      const cls = {slate:"bg-slate-100 text-slate-700 border-slate-200", blue:"bg-brand-50 text-brand-700 border-brand-100", green:"bg-emerald-50 text-emerald-700 border-emerald-100", red:"bg-red-50 text-red-700 border-red-100", amber:"bg-amber-50 text-amber-700 border-amber-100", purple:"bg-purple-700 text-white border-purple-700", dark:"bg-slate-900 text-white border-slate-800"}[tone];
      return <span className={`inline-flex items-center px-2.5 py-1 rounded-full border text-[11px] font-black ${cls}`}>{children}</span>;
    };
    const NumInput = ({label, value, onChange, suffix="", hint=""}) => (
      <label className="block bg-slate-50 border border-slate-200 rounded-2xl p-3 focus-within:ring-2 focus-within:ring-brand-100 focus-within:border-brand-400">
        <div className="text-[10px] font-black text-slate-500 mb-1">{label}</div>
        <div className="flex items-center gap-2">
          <input type="number" inputMode="decimal" value={value ?? ""} onChange={e=>onChange(e.target.value)} className="w-full bg-transparent text-center font-mono font-black text-lg text-slate-900 min-h-[44px]" style={{fontSize:"16px"}} />
          {suffix && <span className="text-xs font-black text-slate-400">{suffix}</span>}
        </div>
        {hint && <div className="text-[10px] text-slate-400 mt-1 leading-relaxed">{hint}</div>}
      </label>
    );
    const SectionTitle = ({title, desc, right}) => <div className="flex items-end justify-between gap-3 mb-3"><div><h2 className="font-black text-slate-900">{title}</h2>{desc && <p className="text-xs text-slate-500 mt-1 leading-relaxed">{desc}</p>}</div>{right}</div>;

    async function fetchJson(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); }
    async function fetchCsv(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.text(); }
    function parseDailyCsv(csv){ return csv.trim().split(/
?
/).slice(1).map(l=>{ const [Date,Open,High,Low,Close] = l.split(','); return {Date, Close:parseFloat(Close)}; }).filter(x=>x.Date && Number.isFinite(x.Close)); }
    function sma(rows,n){ if(rows.length<n) return NaN; return rows.slice(-n).reduce((sum,x)=>sum+x.Close,0)/n; }
    const dateFromUnix = ts => { const d = new Date(ts * 1000); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
    async function fetchFinnhubQuote(symbol){
      const d = await fetchJson(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(symbol)}&token=${FINNHUB_KEY}`);
      const close = getNum(d.c);
      if(close <= 0) throw new Error(symbol + " Finnhub 報價無資料");
      return { symbol, close, date: todayStr() };
    }
    async function fetchFinnhubSma(symbol){
      const to = Math.floor(Date.now()/1000);
      const from = to - 370*24*60*60;
      const d = await fetchJson(`https://finnhub.io/api/v1/stock/candle?symbol=${encodeURIComponent(symbol)}&resolution=D&from=${from}&to=${to}&token=${FINNHUB_KEY}`);
      if(d?.s !== "ok" || !Array.isArray(d.c) || d.c.length < 200) throw new Error(symbol + " Finnhub 200SMA 無資料");
      const rows = d.c.map((c,i)=>({Date:dateFromUnix(d.t[i]), Close:Number(c)})).filter(x=>Number.isFinite(x.Close));
      return { symbol, date:rows.at(-1).Date, close:rows.at(-1).Close, sma200:sma(rows,200) };
    }
    async function fetchStooqSymbol(symbol){
      const csv = await fetchCsv(`https://stooq.com/q/d/l/?s=${symbol.toLowerCase()}.us&i=d`);
      const rows = parseDailyCsv(csv);
      if(!rows.length) throw new Error(symbol+" Stooq 無資料");
      return {symbol, date:rows.at(-1).Date, close:rows.at(-1).Close, sma200:sma(rows,200)};
    }
    async function fetchSymbol(symbol){
      const [quoteRes, smaRes, stooqRes] = await Promise.allSettled([
        fetchFinnhubQuote(symbol),
        (symbol === "SPY" || symbol === "QQQ") ? fetchFinnhubSma(symbol) : Promise.resolve(null),
        (symbol === "SPY" || symbol === "QQQ") ? fetchStooqSymbol(symbol) : Promise.resolve(null)
      ]);
      const quote = quoteRes.status === "fulfilled" ? quoteRes.value : null;
      const smaSource = smaRes.status === "fulfilled" && smaRes.value ? smaRes.value : (stooqRes.status === "fulfilled" ? stooqRes.value : null);
      const close = quote?.close || smaSource?.close || 0;
      if(close <= 0) throw new Error(symbol + " 報價抓取失敗");
      return { symbol, date:smaSource?.date || quote?.date || todayStr(), close, sma200:smaSource?.sma200 || NaN };
    }

    const App = () => {
      const [data, setData] = useState(() => { try { return {...DEFAULT, ...(JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"))}; } catch(e){ return DEFAULT; } });
      const [user, setUser] = useState(null);
      const [page, setPage] = useState("home");
      const [toast, setToast] = useState("");
      const [syncText, setSyncText] = useState("準備中");
      const [loadingPrice, setLoadingPrice] = useState(false);
      const saveTimer = useRef(null);
      const ignoreCloud = useRef(false);
      const showToast = useCallback(txt => { setToast(txt); setTimeout(()=>setToast(""),2600); }, []);
      const patch = useCallback((key, value) => setData(prev => ({...prev, [key]:value})), []);
      const merge = useCallback(obj => setData(prev => ({...prev, ...obj})), []);
      const docRef = useCallback(() => db.collection(DOC_PATH[0]).doc(DOC_PATH[1]), []);

      useEffect(() => {
        const unsub = auth.onAuthStateChanged(async usr => {
          if (usr) setUser(usr);
          else { try { await auth.signInAnonymously(); } catch(e){ setSyncText("匿名登入失敗"); } }
        });
        return () => unsub();
      }, []);

      useEffect(() => {
        if(!user) return;
        const unsub = docRef().onSnapshot(snap => {
          if(ignoreCloud.current) return;
          if(snap.exists){ const cloud = snap.data(); setData(prev => ({...DEFAULT, ...prev, ...cloud, history:Array.isArray(cloud.history)?cloud.history:[]})); setSyncText("已讀取雲端資料"); }
          else setSyncText("雲端尚無資料");
        }, err => setSyncText("雲端讀取失敗：" + err.message));
        return () => unsub();
      }, [user]);

      useEffect(() => {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
        if(!user) return;
        clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(async()=>{
          try { ignoreCloud.current = true; await docRef().set(sanitize({...data, updatedAtText:new Date().toLocaleString("zh-TW"), updatedAt:firebase.firestore.FieldValue.serverTimestamp()}), {merge:true}); setSyncText("已同步 " + new Date().toLocaleTimeString("zh-TW", {hour:"2-digit", minute:"2-digit"})); setTimeout(()=>ignoreCloud.current=false,500); }
          catch(e){ ignoreCloud.current=false; setSyncText("同步失敗：" + e.message); }
        }, 1000);
        return () => clearTimeout(saveTimer.current);
      }, [data, user]);

      const manualSave = async () => { try { await docRef().set(sanitize({...data, updatedAtText:new Date().toLocaleString("zh-TW"), updatedAt:firebase.firestore.FieldValue.serverTimestamp()}), {merge:true}); showToast("已手動同步"); } catch(e){ showToast("同步失敗"); } };
      const loginGoogle = async () => { try { const provider = new firebase.auth.GoogleAuthProvider(); if(auth.currentUser?.isAnonymous){ try { await auth.currentUser.linkWithPopup(provider); } catch(e){ if(e.code === "auth/credential-already-in-use") await auth.signInWithPopup(provider); else throw e; } } else await auth.signInWithPopup(provider); showToast("Google 同步已啟用"); } catch(e){ showToast(e.message || "登入失敗"); } };
      const logout = async () => { await auth.signOut(); await auth.signInAnonymously(); showToast("已切回匿名同步"); };

      const metrics = useMemo(() => {
        const spy=getNum(data.spy), spySma=getNum(data.spySma), qqq=getNum(data.qqq), qqqSma=getNum(data.qqqSma), tqqq=getNum(data.tqqq), sgov=getNum(data.sgov);
        const entry=getNum(data.entryBuffer)/100, exit=getNum(data.exitBuffer)/100, hot1=getNum(data.hot1)/100, hot2=getNum(data.hot2)/100, cooldown=getNum(data.cooldown)/100;
        const valid = spy>0 && spySma>0 && qqq>0 && qqqSma>0;
        const spyDev = valid ? spy/spySma - 1 : NaN;
        const qqqDev = valid ? qqq/qqqSma - 1 : NaN;
        const entryPx = spySma*(1+entry), exitPx = spySma*(1-exit), qHot1=qqqSma*(1+hot1), qHot2=qqqSma*(1+hot2), qCool=qqqSma*(1+cooldown);
        let signal="DATA", tone="slate", title="資料不足", instruction="請先自動抓股價或手動輸入 SPY / QQQ 與 200SMA。", alloc={TQQQ:null, QQQ:null, SGOV:null, label:"尚未判斷"};
        if(valid){
          signal="NEUTRAL"; tone="amber"; title="中間區：維持原狀"; instruction="SPY 位於 +4% 到 -3% 緩衝區，不做新動作，維持原本部位。"; alloc={label:"維持原狀"};
          if(spy < exitPx){ signal="OFF"; tone="red"; title="Risk-Off：離開 TQQQ"; instruction=`SPY 已低於 200SMA -${data.exitBuffer}%。賣出 TQQQ；接著依 6 個月 DCA 計畫分批買 QQQ。`; alloc={TQQQ:0, QQQ:null, SGOV:null, label:"6 個月 DCA QQQ"}; }
          else if(spy > entryPx){
            const prevState = String(data.currentState || "").toUpperCase();
            const keepHot2 = prevState === "HOT2" && qqq > qCool;
            const keepHot1 = prevState === "HOT1" && qqq > qCool;
            signal="ON"; tone="green"; title="Risk-On：100% TQQQ"; instruction=`SPY 已高於 200SMA +${data.entryBuffer}%，且 QQQ 未在過熱保護區。目標可持有 TQQQ。`; alloc={TQQQ:100, QQQ:0, SGOV:0, label:"100% TQQQ"};
            if(qqq > qHot2 || keepHot2){ signal="HOT2"; tone="purple"; title="過熱二階：100% QQQ"; instruction=`QQQ 高於 200SMA +${data.hot2}% 後，未回落到 +${data.cooldown}% 以下前，TQQQ 全數切成 QQQ，避免泡沫末端滿槓桿。`; alloc={TQQQ:0, QQQ:100, SGOV:0, label:"100% QQQ"}; }
            else if(qqq > qHot1 || keepHot1){ signal="HOT1"; tone="purple"; title="過熱一階：降半槓桿"; instruction=`QQQ 高於 200SMA +${data.hot1}% 後，未回落到 +${data.cooldown}% 以下前，TQQQ 降為一半，目標 50% TQQQ / 50% QQQ。`; alloc={TQQQ:50, QQQ:50, SGOV:0, label:"50% TQQQ / 50% QQQ"}; }
          }
        }
        const rows = [
          {name:"TQQQ", shares:getNum(data.sharesTqqq), price:tqqq},
          {name:"QQQ", shares:getNum(data.sharesQqq), price:qqq},
          {name:"SPY", shares:getNum(data.sharesSpy), price:spy},
          {name:"SGOV", shares:getNum(data.sharesSgov), price:sgov},
          {name:"現金", shares:1, price:getNum(data.cashUsd)},
          {name:"其他資產", shares:1, price:getNum(data.otherUsd)}
        ].map(r => ({...r, value:(getNum(r.shares)*getNum(r.price))}));
        const totalUsd = rows.reduce((s,r)=>s+r.value,0);
        rows.forEach(r => r.weight = totalUsd>0 ? r.value/totalUsd : 0);
        const rate = getNum(data.usdtwd) || 1;
        const totalDisplay = data.currency === "TWD" ? "NT$" + money(totalUsd*rate,0) : "$" + money(totalUsd,2);
        const highFromHistory = Math.max(0, ...(Array.isArray(data.history)?data.history:[]).map(h=>getNum(h.totalUsd)));
        const assetHighUsd = Math.max(getNum(data.assetHighUsd), highFromHistory, totalUsd);
        const drawdown = assetHighUsd > 0 ? (totalUsd / assetHighUsd - 1) : 0;
        const completedDca = Math.min(6, Math.max(0, parseInt(data.dcaMonth||0)));
        const nextDcaMonth = Math.min(6, completedDca + 1);
        const remainingDcaMonths = Math.max(1, 6 - completedDca);
        const tqqqValue = rows.find(r=>r.name==='TQQQ')?.value || 0;
        const qqqValue = rows.find(r=>r.name==='QQQ')?.value || 0;
        const cashValue = getNum(data.cashUsd);
        const initialDcaPool = getNum(data.dcaPoolUsd);
        const dcaPool = signal === 'OFF' ? (initialDcaPool > 0 ? initialDcaPool : Math.max(0, cashValue + tqqqValue)) : 0;
        const dcaBuyUsd = signal === 'OFF' && completedDca < 6 ? dcaPool / 6 : 0;
        const dcaBuyShares = qqq > 0 ? dcaBuyUsd / qqq : 0;
        const targetRows = ["TQQQ","QQQ","SGOV"].map(sym => {
          const targetPct = alloc[sym];
          const row = rows.find(r=>r.name===sym) || {value:0, shares:0, price:0};
          let target = targetPct == null ? null : totalUsd * targetPct/100;
          if(signal === 'OFF' && sym === 'TQQQ') target = 0;
          if(signal === 'OFF' && sym === 'QQQ') target = qqqValue + dcaBuyUsd;
          const targetShares = target == null || row.price <= 0 ? null : target / row.price;
          const shareDiff = targetShares == null ? 0 : targetShares - row.shares;
          return {sym, current:row.value, currentShares:row.shares, price:row.price, target, diff:target==null?0:target-row.value, targetPct, targetShares, shareDiff};
        });
        const actionLines = [];
        if(!valid) actionLines.push('資料不足，先更新或手動輸入市場資料。');
        else if(signal === 'NEUTRAL') actionLines.push('中間區不做新動作，只檢查持倉是否與你上次狀態一致。');
        else if(signal === 'OFF'){
          if(tqqqValue > 10) actionLines.push(`賣出 TQQQ 約 ${money(getNum(data.sharesTqqq),4)} 股，金額約 $${money(tqqqValue,0)}。`);
          if(dcaBuyUsd > 10) actionLines.push(`本期 DCA 買入 QQQ 約 ${money(dcaBuyShares,4)} 股，金額約 $${money(dcaBuyUsd,0)}（第 ${nextDcaMonth}/6 期）。`);
          if(completedDca >= 6) actionLines.push('6 個月 DCA 已完成；維持 QQQ，等 SPY 重新站上 +4%。');
        } else {
          targetRows.forEach(r => { if(r.target != null && Math.abs(r.diff) >= 10) actionLines.push(`${r.diff>0?'買入':'賣出'} ${r.sym} 約 ${money(Math.abs(r.shareDiff),4)} 股，金額約 $${money(Math.abs(r.diff),0)}。`); });
          if(!actionLines.length) actionLines.push('目前部位與目標接近，不需要交易。');
        }
        const distanceItems = valid ? [
          {key:'riskOn', label:'距離 Risk-On', value:((entryPx/spy)-1)*100, price:entryPx, hint:`SPY 需高於 $${money(entryPx,2)}`},
          {key:'riskOff', label:'距離 Risk-Off', value:((exitPx/spy)-1)*100, price:exitPx, hint:`SPY 低於 $${money(exitPx,2)} 觸發`},
          {key:'hot30', label:`距離 QQQ +${data.hot1}%`, value:((qHot1/qqq)-1)*100, price:qHot1, hint:`QQQ 高於 $${money(qHot1,2)} 降半槓桿`},
          {key:'hot40', label:`距離 QQQ +${data.hot2}%`, value:((qHot2/qqq)-1)*100, price:qHot2, hint:`QQQ 高於 $${money(qHot2,2)} 全切 QQQ`},
          {key:'cooldown', label:`距離過熱解除 +${data.cooldown}%`, value:((qCool/qqq)-1)*100, price:qCool, hint:`QQQ 回到 $${money(qCool,2)} 以下才解除`}
        ] : [];
        const scenarioMove = (getNum(data.scenarioSign) || -1) * Math.abs(getNum(data.scenarioAbsPct));
        const scenarioFactor = 1 + scenarioMove / 100;
        const scenarioQqq = qqq > 0 ? qqq * scenarioFactor : 0;
        const scenarioTqqq = tqqq > 0 ? Math.max(0, tqqq * (1 + scenarioMove * 3 / 100)) : 0;
        const scenarioRows = [
          {name:'TQQQ', value:getNum(data.sharesTqqq) * scenarioTqqq},
          {name:'QQQ', value:getNum(data.sharesQqq) * scenarioQqq},
          {name:'SPY', value:getNum(data.sharesSpy) * spy},
          {name:'SGOV', value:getNum(data.sharesSgov) * sgov},
          {name:'現金', value:getNum(data.cashUsd)},
          {name:'其他資產', value:getNum(data.otherUsd)}
        ];
        const scenarioTotalUsd = scenarioRows.reduce((sum, r) => sum + getNum(r.value), 0);
        const scenarioPnlUsd = scenarioTotalUsd - totalUsd;
        const scenarioPnlPct = totalUsd > 0 ? scenarioPnlUsd / totalUsd : 0;
        const scenarioQqqDev = qqqSma > 0 && scenarioQqq > 0 ? scenarioQqq / qqqSma - 1 : NaN;
        const scenarioFlags = [];
        if(valid){
          if(spy < exitPx) scenarioFlags.push('Risk-Off 已觸發');
          if(scenarioQqq > qHot2) scenarioFlags.push(`QQQ +${data.hot2}% 過熱二階`);
          else if(scenarioQqq > qHot1) scenarioFlags.push(`QQQ +${data.hot1}% 過熱一階`);

      const fetchPrices = async () => {

          const failed = [];
          results.forEach((res, idx) => {
            const sym = ["SPY","QQQ","TQQQ","SGOV"][idx];

            const x = res.value;
            if(sym === "SPY") { ok.spy = round2(x.close); if(Number.isFinite(x.sma200) && x.sma200 > 0) ok.spySma = round2(x.sma200); if(x.date) ok.marketDate = x.date; }
            if(sym === "QQQ") { ok.qqq = round2(x.close); if(Number.isFinite(x.sma200) && x.sma200 > 0) ok.qqqSma = round2(x.sma200); if(!ok.marketDate && x.date) ok.marketDate = x.date; }
            if(sym === "TQQQ") ok.tqqq = round2(x.close);
            if(sym === "SGOV") ok.sgov = round2(x.close);

          if(Object.keys(ok).length) {
            merge(ok);

      const buildLogItem = (kind='snapshot') => ({

總資產：$${money(metrics.totalUsd,2)} / NT$${money(metrics.totalUsd*(getNum(data.usdtwd)||1),0)}
SPY：${money(getNum(data.spy),2)}｜SPY 200SMA：${money(getNum(data.spySma),2)}
QQQ：${money(getNum(data.qqq),2)}｜QQQ 200SMA：${money(getNum(data.qqqSma),2)}

今日動作：
${metrics.actionLines.map(x=>'・'+x).join('\n')}

備註：${data.notes || '-'}`;
        try { await navigator.clipboard.writeText(text); showToast('已複製今日指令'); }

      const nextCheckText = () => {
        const d = new Date();

div className={`font-mono text-lg font-black ${metrics.scenario.pnlUsd<0?'text-red-300':'text-emerald-300'}`}>{metrics.scenario.pnlUsd>=0?'+':'-'}${money(Math.abs(metrics.scenario.pnlUsd),0)}</div><div className="text-[10px] text-slate-400">{signedPctText(metrics.scenario.pnlPct*100)}</div></div></div><div className="mt-3 space-y-1">{metrics.scenario.flags.map((f,i)=><div key={i} className="text-xs font-bold text-slate-200">☑ {f}</div>)}</div></div></div>

            <NumInput label="過熱一階" value={data.hot1} onChange={v=>patch('hot1',v)} suffix="%" />
            <NumInput label="過熱二階" value={data.hot2} onChange={v=>patch('hot2',v)} suffix="%" />
            <NumInput label="過熱解除" value={data.cooldown} onChange={v=>patch('cooldown',v)} suffix="%" />
          </div>
        </Card>
        <Card className="p-4 mt-4"><SectionTitle title="策略文字" desc="方便你自己檢查規則是否走樣。" /><pre className="whitespace-pre-wrap text-xs leading-relaxed bg-slate-50 border border-slate-100 rounded-2xl p-4 text-slate-600 font-bold">{STRATEGY_TEXT}</pre></Card>
      </main>;

      const Logs = () => <main className="max-w-5xl mx-auto px-4 pt-4 content-bottom-space">
        <Card className="p-4"><SectionTitle title="歷史紀錄" desc="每次按首頁的記錄，就會保存當下訊號、總資產與備註。" right={<div className="flex gap-2"><button onClick={addSnapshot} className="px-3 py-2 rounded-xl bg-brand-600 text-white text-xs font-black">新增</button><button onClick={()=>{ if(confirm('確定清空歷史紀錄？')) patch('history', []); }} className="px-3 py-2 rounded-xl bg-red-50 text-red-700 text-xs font-black">清空</button></div>} />
          <textarea value={data.notes||""} onChange={e=>patch('notes', e.target.value)} placeholder="備註：例如今天為何執行、券商下單狀況、心理狀態..." className="w-full min-h-[86px] rounded-2xl border border-slate-200 bg-slate-50 p-3 text-sm font-bold mb-4" />
          <div className="space-y-3">{(Array.isArray(data.history)?data.history:[]).length===0 && <div className="text-sm text-slate-400 font-bold text-center py-8">尚無紀錄</div>}{(data.history||[]).map((h,i)=><div key={h.time||i} className="border border-slate-100 rounded-2xl p-3 bg-slate-50"><div className="flex justify-between gap-2"><div><div className="font-black text-slate-900">{h.signal}</div><div className="text-[11px] text-slate-400 font-bold">{h.timeText}｜行情日 {h.marketDate || '-'}</div></div><div className="font-mono font-black text-slate-900">{h.totalDisplay}</div></div><div className="mt-2 flex flex-wrap gap-2"><Pill tone="blue">{h.allocation}</Pill><Pill>SPY ${money(h.spy,2)}</Pill><Pill>QQQ ${money(h.qqq,2)}</Pill></div>{h.notes && <div className="mt-2 text-xs text-slate-500 font-bold leading-relaxed">{h.notes}</div>}</div>)}</div>
        </Card>
      </main>;

      const Sync = () => <main className="max-w-5xl mx-auto px-4 pt-4 content-bottom-space">
        <Card className="p-4"><SectionTitle title="同步設定" desc="Firebase 使用你提供的 qldmax 專案，資料路徑沿用目前這套策略儀表板。" />
          <div className="bg-slate-950 text-white rounded-3xl p-4 mb-4"><div className="text-[10px] font-black text-slate-300">Firebase 狀態</div><div className="font-black mt-1">{syncText}</div><div className="text-xs text-slate-400 mt-2 break-all">projectId: qldmax｜doc: strategyDashboards / tqqq-spy200-auto-main</div></div>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            <button onClick={manualSave} className="py-3 rounded-2xl bg-brand-600 text-white font-black active:scale-95">手動同步</button>
            <button onClick={loginGoogle} className="py-3 rounded-2xl bg-slate-900 text-white font-black active:scale-95">Google 登入</button>
            <button onClick={logout} className="py-3 rounded-2xl bg-slate-100 text-slate-700 font-black active:scale-95">切回匿名</button>
          </div>
        </Card>
      </main>;

      const BottomNav = () => <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 safe-bottom"><div className="max-w-5xl mx-auto grid grid-cols-4 gap-1 px-3 pt-2">{[['home','首頁'],['inputs','輸入'],['logs','紀錄'],['sync','同步']].map(([id,label])=><button key={id} onClick={()=>setPage(id)} className={`py-3 rounded-2xl text-xs font-black active:scale-95 ${page===id?'bg-slate-900 text-white':'text-slate-500'}`}>{label}</button>)}</div></nav>;

      return <div><Header />{page==='home' && <Home />}{page==='inputs' && <Inputs />}{page==='logs' && <Logs />}{page==='sync' && <Sync />}<BottomNav />{toast && <div className="fixed left-1/2 -translate-x-1/2 bottom-28 z-50 bg-slate-900 text-white rounded-2xl px-4 py-3 text-sm font-black shadow-2xl">{toast}</div>}</div>;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
