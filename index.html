                                                <div className="grid grid-cols-12 gap-2 items-end">
                                                    <div className="col-span-12 text-[10px] text-indigo-500 font-bold mb-1">核心部位 (TQQQ)</div>
                                                    <div className="col-span-6"><label className="text-[9px] block text-center mb-1">目標 %</label><input type="number" value={inputs.rebalance_core_target} onChange={e=>handleInputChange('rebalance_core_target',e.target.value)} onBlur={e=>syncToCloud('rebalance_core_target',e.target.value)} className="bg-white dark:bg-slate-700 p-2 rounded-lg text-center font-bold w-full"/></div>
                                                    <div className="col-span-6"><label className="text-[9px] block text-center mb-1">寬容度 (±%)</label><input type="number" value={inputs.rebalance_core_tolerance} onChange={e=>handleInputChange('rebalance_core_tolerance',e.target.value)} onBlur={e=>syncToCloud('rebalance_core_tolerance',e.target.value)} className="bg-white dark:bg-slate-700 p-2 rounded-lg text-center font-bold w-full"/></div>
                                                </div>
                                                <div className="border-t border-slate-200 dark:border-slate-700 my-2"></div>
                                                <div className="grid grid-cols-12 gap-2 text-center">
                                                    <div className="col-span-3"></div><div className="col-span-3 text-[9px]">目標%</div><div className="col-span-3 text-[9px] text-red-500">上限(+%)</div><div className="col-span-3 text-[9px] text-blue-500">下限(-%)</div>
                                                    
                                                    <div className="col-span-3 text-[10px] font-bold text-left self-center truncate">{inputs.custom_ticker_1||'自選1'}</div>
                                                    <div className="col-span-3"><input type="number" value={inputs.target_sat_1} onChange={e=>handleInputChange('target_sat_1',e.target.value)} onBlur={e=>syncToCloud('target_sat_1',e.target.value)} className="bg-white dark:bg-slate-700 p-1.5 rounded-lg text-center w-full"/></div>
                                                    <div className="col-span-3"><input type="number" value={inputs.tol_up_sat_1} onChange={e=>handleInputChange('tol_up_sat_1',e.target.value)} onBlur={e=>syncToCloud('tol_up_sat_1',e.target.value)} className="bg-white dark:bg-slate-700 p-1.5 rounded-lg text-center w-full text-red-500"/></div>
                                                    <div className="col-span-3"><input type="number" value={inputs.tol_down_sat_1} onChange={e=>handleInputChange('tol_down_sat_1',e.target.value)} onBlur={e=>syncToCloud('tol_down_sat_1',e.target.value)} className="bg-white dark:bg-slate-700 p-1.5 rounded-lg text-center w-full text-blue-500"/></div>

                                                    <div className="col-span-3"><input type="number" value={inputs.tol_up_sat_2} onChange={e=>handleInputChange('tol_up_sat_2',e.target.value)} onBlur={e=>syncToCloud('tol_up_sat_2',e.target.value)} className="bg-white dark:bg-slate-700 p-1.5 rounded-lg text-center w-full text-red-500"/></div>
                                                    <div className="col-span-3"><input type="number" value={inputs.tol_down_sat_2} onChange={e=>handleInputChange('tol_down_sat_2',e.target.value)} onBlur={e=>syncToCloud('tol_down_sat_2',e.target.value)} className="bg-white dark:bg-slate-700 p-1.5 rounded-lg text-center w-full text-blue-500"/></div>

                                                    <div className="col-span-3 text-[10px] font-bold text-left self-center">IBIT</div>
                                                    <div className="col-span-3"><input type="number" value={inputs.target_sat_ibit} onChange={e=>handleInputChange('target_sat_ibit',e.target.value)} onBlur={e=>syncToCloud('target_sat_ibit',e.target.value)} className="bg-white dark:bg-slate-700 p-1.5 rounded-lg text-center w-full"/></div>
                                                    <div className="col-span-3"><input type="number" value={inputs.tol_up_ibit} onChange={e=>handleInputChange('tol_up_ibit',e.target.value)} onBlur={e=>syncToCloud('tol_up_ibit',e.target.value)} className="bg-white dark:bg-slate-700 p-1.5 rounded-lg text-center w-full text-red-500"/></div>
                                                    <div className="col-span-3"><input type="number" value={inputs.tol_down_ibit} onChange={e=>handleInputChange('tol_down_ibit',e.target.value)} onBlur={e=>syncToCloud('tol_down_ibit',e.target.value)} className="bg-white dark:bg-slate-700 p-1.5 rounded-lg text-center w-full text-blue-500"/></div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl mt-4">
                                            <div className="flex justify-between items-center mb-3">
                                                <div className="text-xs font-black text-slate-500 uppercase tracking-widest flex items-center gap-2"><Icon name="Activity" size={14}/> RSI 收益矩陣設定</div>
                                                <button onClick={()=>setSettings(p=>({...p,rsi_matrix:!p.rsi_matrix}))}><Icon name={openSettings.rsi_matrix?"ChevronUp":"ChevronDown"} size={16} className="text-slate-400"/></button>
                                            </div>
                                            {openSettings.rsi_matrix && (
                                                <div className="space-y-2">
                                                    <div className="grid grid-cols-12 gap-1 text-[9px] text-center text-slate-400 mb-1">
                                                        <div className="col-span-3">RSI Min</div><div className="col-span-3">RSI Max</div><div className="col-span-3">覆蓋%</div><div className="col-span-3">Delta</div>
                                                    </div>
                                                    {inputs.options_matrix && inputs.options_matrix.map((row, i) => (
                                                        <div key={i} className="grid grid-cols-12 gap-1 mb-1">
                                                            <div className="col-span-3"><input type="number" value={row.min} onChange={e=>handleMatrixChange(i,'min',e.target.value)} className="bg-white dark:bg-slate-700 w-full p-1 rounded text-center text-xs"/></div>
                                                            <div className="col-span-3"><input type="number" value={row.max} onChange={e=>handleMatrixChange(i,'max',e.target.value)} className="bg-white dark:bg-slate-700 w-full p-1 rounded text-center text-xs"/></div>
                                                            <div className="col-span-3"><input type="number" value={row.cover} onChange={e=>handleMatrixChange(i,'cover',e.target.value)} className="bg-white dark:bg-slate-700 w-full p-1 rounded text-center text-xs"/></div>
                                                            <div className="col-span-3"><input type="text" value={row.delta} onChange={e=>handleMatrixChange(i,'delta',e.target.value)} className="bg-white dark:bg-slate-700 w-full p-1 rounded text-center text-xs"/></div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex gap-3"><button onClick={()=>setDarkMode(!darkMode)} className="flex-1 p-3 bg-slate-100 rounded-xl flex justify-center gap-2"><Icon name={darkMode?"Sun":"Moon"}/> {darkMode?"亮色":"深色"}</button><button onClick={()=>setIsCalcOpen(!isCalcOpen)} className="flex-1 p-3 bg-slate-100 rounded-xl flex justify-center gap-2"><Icon name="Calculator"/> 計算機</button></div>

                                        <div className="space-y-1"><label className="text-[10px]">匯率</label><input value={inputs.exchange_rate} onChange={e=>handleInputChange('exchange_rate',e.target.value)} className="bg-slate-100 p-2 rounded-xl" /></div>
                                    </div>}
                                </div>
                                <div className="bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-200 dark:border-slate-800 overflow-hidden">
                                    <button onClick={()=>setSettings(p=>({...p,strategy:!p.strategy}))} className="w-full p-5 flex justify-between bg-slate-50 dark:bg-slate-800/50"><div className="flex items-center gap-3 font-black"><Icon name="BookOpen" className="text-amber-500"/> 策略手冊</div><Icon name={openSettings.strategy?"ChevronUp":"ChevronDown"}/></button>
                                    {openSettings.strategy && <div className="p-5 pt-0"><button onClick={()=>setIsStrategyEditing(!isStrategyEditing)} className="mb-2 text-xs bg-slate-100 px-2 py-1 rounded ml-auto block">{isStrategyEditing?"鎖定":"編輯"}</button>{['core','custom','ibit'].map(k=><div key={k} className="mb-2"><input value={inputs[`title_${k}`]} readOnly={!isStrategyEditing} onChange={e=>handleInputChange(`title_${k}`,e.target.value)} className="text-indigo-600 font-bold mb-1 w-full text-left" /><textarea value={inputs[`strat_${k}`]} readOnly={!isStrategyEditing} onChange={e=>handleInputChange(`strat_${k}`,e.target.value)} className="strategy-textarea w-full text-xs p-2" /></div>)}</div>}
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 inset-x-0 bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 z-50 py-4 pb-10 flex justify-around shadow-2xl">
                        {[
                            {id:'dashboard',icon:'LayoutDashboard',l:'儀表板'},
                            {id:'history',icon:'History',l:'績效'},
                            {id:'loan',icon:'Landmark',l:'貸款'}
                        ].map(t => <button key={t.id} onClick={()=>{setView(t.id);setVisibleCount(20)}} className={`flex flex-col items-center gap-1 flex-1 transition-all active:scale-90 ${view===t.id?'text-indigo-600 border-t-2 border-indigo-600 -mt-4 pt-2':'text-slate-400'}`}><Icon name={t.icon} size={24}/><span className="text-[10px] uppercase font-black">{t.l}</span></button>)}
                    </nav>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
